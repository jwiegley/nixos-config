groups:
  - name: systemd_journal_errors
    interval: 5m
    rules:
      # NOTE 2026-08-02: both rules below previously excluded
      # unit="user@948.service" -- the LiteLLM rootless user's systemd manager,
      # suppressed because that proxy was a heavy error source. uid 948 no longer
      # exists (LiteLLM removed 2026-08-01), so the filters matched nothing and
      # only obscured what these rules actually cover. Removed. If a future
      # rootless service needs suppressing, exclude it by NAME with a reason --
      # not by a bare uid that outlives the service.
      # Alert on high error rate in systemd journal
      # Triggers if more than 10 errors in 10 minutes (excluding known transient issues)
      - alert: SystemdJournalHighErrorRate
        expr: |
          sum(rate({job="systemd-journal"} |~ "level=error|ERROR|failed"
            != "connection refused"
            != "max retries"
            != "Temporary failure in name resolution"
            != "No Sieve errors"
            # WARNING: the two CHIP filters below strip 100% of matter-server's error
            # volume (17,283 lines over 7d, ZERO residual, measured 2026-07-29), so a
            # GREEN SystemdJournalHighErrorRate must NEVER be read as Matter is healthy.
            # Matter has exactly one alert -- MatterServerDown in alerts/container-health.yaml
            # -- and it only covers liveness; nothing watches CHIP subscription churn.
            # Baseline for whoever writes that churn rule (Loki, 21d in 6h buckets):
            # CHIP_ERROR min 99 / median 184 / max 485; broad error pattern min 198 /
            # median 344 / max 926. A 120-per-6h threshold fires permanently; to stay
            # quiet at baseline a rule must clear ~500 (CHIP_ERROR) or ~930 (broad).
            != "CHIP_ERROR"
            != "Subscription failed with CHIP"
            != "SearxEngineAccessDeniedException"
            != "Timeout fetching miele data"
            != "Direct fetch of page URL timed out"
            != "\"context\":\"crawlStatus\""
            != "DNSSEC validation failed"
            != "cannotDownloadFile"
            != "forbidden to download"
            [10m])) * 600 > 10
        for: 5m
        labels:
          severity: warning
          category: logs
        annotations:
          summary: "High error rate detected in systemd journal"
          description: "More than 10 errors detected in the last 10 minutes across systemd services. This indicates potential system instability that requires investigation."

      # Alert on critical errors in systemd journal
      # Triggers on any CRITICAL level errors
      - alert: SystemdJournalCriticalError
        expr: |
          count_over_time({job="systemd-journal"} |~ "CRITICAL|level=critical|panic|fatal" [5m]) > 0
        for: 1m
        labels:
          severity: critical
          category: logs
        annotations:
          summary: "Critical error detected in systemd journal"
          description: "A critical-level error has been detected in the systemd journal. This requires immediate attention."

      # Alert on specific service errors with high frequency
      # Excludes expected transient errors
      - alert: SystemdServicePersistentErrors
        expr: |
          sum by (unit) (count_over_time({job="systemd-journal"}
            |~ "level=error|ERROR"
            != "connection refused"
            != "database system is shutting down"
            # WARNING: same CHIP strip as the first rule (8,815 matter-server lines over
            # 7d, ZERO residual) -- matter-server can NEVER appear in this per-unit alert.
            != "CHIP_ERROR"
            != "Subscription failed with CHIP"
            != "Direct fetch of page URL timed out"
            != "\"context\":\"crawlStatus\""
            != "DNSSEC validation failed"
            != "cannotDownloadFile"
            != "forbidden to download"
            | json
            | unit != ""
            [10m])) > 10
        for: 5m
        labels:
          severity: warning
          category: logs
        annotations:
          summary: "Service {{ $labels.unit }} generating persistent errors"
          description: "Service {{ $labels.unit }} has generated more than 10 errors in the last 10 minutes. This may indicate a configuration problem or service malfunction."

      # Alert on OOM (Out of Memory) kills
      - alert: SystemdOOMKill
        expr: |
          count_over_time({job="systemd-journal"} |~ "Out of memory|OOM|oom-kill|killed process" [10m]) > 0
        for: 1m
        labels:
          severity: critical
          category: logs
        annotations:
          summary: "Out of Memory event detected"
          description: "A process was killed due to OOM condition. System may be under memory pressure."

      # Alert on segmentation faults
      - alert: SystemdSegmentationFault
        expr: |
          count_over_time({job="systemd-journal"} |~ "segfault|segmentation fault|SIGSEGV" [10m]) > 0
        for: 1m
        labels:
          severity: warning
          category: logs
        annotations:
          summary: "Segmentation fault detected"
          description: "A process has crashed with a segmentation fault. This may indicate a software bug or memory corruption."
