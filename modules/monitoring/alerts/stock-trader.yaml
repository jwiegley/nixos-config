groups:
  - name: stock_trader
    interval: 60s
    rules:
      - alert: StockTraderEndpointDown
        expr: |
          probe_success{instance="https://trader.vulcan.lan"} == 0
        for: 5m
        labels:
          severity: critical
          component: stock-trader
        annotations:
          summary: "stock-trader endpoint is down"
          description: |
            The HTTPS probe for trader.vulcan.lan has been failing for 5 minutes.

            Check: systemctl status stock-trader
            Logs:  journalctl -u stock-trader -n 100
            nginx: systemctl status nginx

      - alert: StockTraderCertificateExpiringSoon
        expr: |
          probe_ssl_earliest_cert_expiry{instance=~".*trader.vulcan.lan.*"} - time() < 86400 * 14
        for: 1h
        labels:
          severity: warning
          component: stock-trader
        annotations:
          summary: "stock-trader SSL certificate expires in less than 14 days"
          description: |
            The SSL certificate for trader.vulcan.lan expires in {{ $value | humanizeDuration }}.
            Run: sudo /etc/nixos/certs/renew-certificate.sh "trader.vulcan.lan" \
              -o "/var/lib/nginx-certs" -d 365 --owner "nginx:nginx"

      # Fires when the WebSocket chat handler emits errors at a
      # non-trivial rate. Most relevant trigger today: the LiteLLM
      # Anthropic→Responses adapter misorder bug regressing (or the
      # SYSTEM_PROMPT no-preamble/single-tool constraints drifting)
      # would push `kind="upstream"` past the threshold quickly. See
      # /etc/nixos/docs/LITELLM_TOOL_USE_BUG_REPORT.md for the full
      # write-up and stock-trader's CLAUDE.md "Known hazards" for the
      # workaround context.
      - alert: StockTraderChatErrorRate
        expr: |
          sum(rate(stock_trader_chat_errors_total[5m])) by (kind) > 0.05
        for: 10m
        labels:
          severity: warning
          component: stock-trader
        annotations:
          summary: "stock-trader chat errors elevated (kind={{ $labels.kind }})"
          description: |
            The chat WebSocket handler is emitting {{ $labels.kind }} errors at
            {{ $value | humanize }} per second over the last 5 minutes. If
            kind=upstream, the LiteLLM proxy/Anthropic round-trip is failing —
            likely the misorder bug in
            litellm/llms/anthropic/experimental_pass_through/responses_adapters/
            transformation.py regressing (file at
            /etc/nixos/docs/LITELLM_TOOL_USE_BUG_REPORT.md). Run:
              tail -200 /tmp/stock-trader-chat-debug.log
              journalctl -u stock-trader --since "10 min ago" | grep -i error
              STOCK_TRADER_LIVE_CHAT_TESTS=1 \
                pytest tests/test_chat_live.py -v --noconftest \
                in /tmp/stock-trader-work to reproduce.

      # ----------------------------------------------------------------------
      # Schwab OAuth refresh-token lifetime (docs/MONITORING_COVERAGE_PLAN.md
      # P0 #15; memory: project_stock_trader). The refresh token dies ~every 7
      # days and renewal is a manual hera re-bootstrap that today is always
      # REACTIVE (the trader breaks first). The schwab-token-exporter textfile
      # collector emits schwab_refresh_token_expiry_timestamp_seconds so we can
      # warn ~2 days out — while the runbook is still comfortable — and escalate
      # to critical in the final hours.
      #
      # Renewal runbook (when these fire):
      #   1. Re-bootstrap Schwab OAuth on hera (browser flow) → new token JSON.
      #   2. Push the token to vulcan (vulcan cannot ssh hera; push from hera).
      #   3. Install at /var/lib/stock-trader/schwab_token.json mode 0600.
      #   4. systemctl restart stock-trader; verify /api/quote is live.
      # ----------------------------------------------------------------------
      - alert: SchwabTokenExpiringSoon
        expr: |
          schwab_refresh_token_expiry_timestamp_seconds - time() < 2 * 86400
        for: 30m
        labels:
          severity: warning
          component: stock-trader
        annotations:
          summary: "Schwab refresh token expires in less than 2 days"
          description: |
            The Schwab OAuth refresh token expires in {{ $value | humanizeDuration }}.
            It dies ~every 7 days and renewal is MANUAL — start the re-bootstrap on
            hera now, while there is still slack:
              1. Re-bootstrap Schwab OAuth on hera (browser flow) → new token JSON.
              2. Push the token to vulcan (vulcan can't ssh hera; push from hera).
              3. Install /var/lib/stock-trader/schwab_token.json mode 0600.
              4. systemctl restart stock-trader; confirm /api/quote is live.
            Runbook: memory project_stock_trader.

      - alert: SchwabTokenExpiryCritical
        expr: |
          schwab_refresh_token_expiry_timestamp_seconds - time() < 6 * 3600
        for: 10m
        labels:
          severity: critical
          component: stock-trader
        annotations:
          summary: "Schwab refresh token expires in less than 6 hours"
          description: |
            The Schwab OAuth refresh token expires in {{ $value | humanizeDuration }}.
            Once it dies the trader's Schwab calls fail until re-bootstrapped. Renew
            immediately on hera:
              1. Re-bootstrap Schwab OAuth on hera (browser flow) → new token JSON.
              2. Push the token to vulcan (vulcan can't ssh hera; push from hera).
              3. Install /var/lib/stock-trader/schwab_token.json mode 0600.
              4. systemctl restart stock-trader; confirm /api/quote is live.
            Runbook: memory project_stock_trader.

      - alert: SchwabTokenFileMissing
        expr: |
          schwab_token_file_exists == 0
        for: 30m
        labels:
          severity: warning
          component: stock-trader
        annotations:
          summary: "Schwab OAuth token file is missing"
          description: |
            /var/lib/stock-trader/schwab_token.json is absent — the Schwab OAuth
            token has not been provisioned (or was removed). The trader cannot
            authenticate to Schwab without it. Re-bootstrap on hera and install
            the token (mode 0600), then restart stock-trader.
            Runbook: memory project_stock_trader.

  - name: stock_trader_freshness
    interval: 60s
    rules:
      - alert: StockTraderSchwabDataSourceDown
        expr: |
          stock_trader_data_source_up{source="schwab"} == 0
        for: 30m
        labels:
          severity: warning
          component: stock-trader
        annotations:
          summary: "stock-trader: Schwab data source is down"
          description: |
            The live Schwab probe has reported available=0 for 30m (window > the
            25m pinger gauge-masking interval + 45s probe cache). Quotes are
            served by the EOD fallback or failing. Likely a revoked/expired
            Schwab OAuth refresh token -- run the re-auth runbook and copy the
            new token to %S/stock-trader/schwab_token.json, then restart.
      - alert: StockTraderQuotesUnavailable
        expr: |
          increase(stock_trader_quote_unavailable_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          component: stock-trader
        annotations:
          summary: "stock-trader: quotes returning no live source (503)"
          description: |
            get_quote raised DataUnavailableError (all sources stale/failed) in
            the last 15m and is still doing so. In enforce mode the service is
            correctly 503-ing rather than serving stale data. Usually a Schwab
            auth problem -- see StockTraderSchwabDataSourceDown.
      - alert: StockTraderStaleQuotesRejected
        expr: |
          increase(stock_trader_quote_stale_rejected_total[15m]) > 0
        for: 15m
        labels:
          severity: info
          component: stock-trader
        annotations:
          summary: "stock-trader: freshness gate rejecting stale quotes"
          description: |
            The freshness gate rejected stale quotes from {{ $labels.source }}
            for 15m. In warn mode stale data is served labeled (stale=true); in
            enforce mode the source is falling through. Brief during an outage;
            sustained means the degraded path is the steady state -- re-auth.
