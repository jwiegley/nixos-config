groups:
  - name: dns_alerts
    interval: 30s
    rules:
      # DNS Service Availability
      - alert: TechnitiumDNSExporterDown
        expr: up{job="technitium_dns"} == 0
        for: 1m
        labels:
          severity: critical
          category: dns
          component: dns
        annotations:
          summary: "Technitium DNS exporter is down on {{ $labels.instance }}"
          description: "The Technitium DNS Prometheus exporter has been down for more than 1 minute. DNS metrics are not being collected."

      - alert: TechnitiumDNSServiceDown
        expr: up{job="technitium_dns"} == 0 or absent(sum(technitium_dns_request_result_count))
        for: 2m
        labels:
          severity: critical
          category: dns
          component: dns
        annotations:
          summary: "Technitium DNS service appears to be down"
          description: "Technitium DNS exporter is down or no DNS query metrics are being reported."

      # Frozen-counter detection (the gap the census flagged as "technitium status").
      #
      # NOTE on technitium_dns_status: the census recommended alerting on
      # `technitium_dns_status == 0 for 5m`. Live evidence (2026-06-10) shows that
      # is UNWORKABLE on this exporter image: technitium_dns_status sits at 0 for
      # ~99.93% of the time (avg_over_time[24h] ≈ 0.0007) WHILE the DNS server is
      # fully healthy and the query counters are advancing (sum(rate(
      # technitium_dns_request_result_count[10m])) ≈ 2.5/s with status==0). The
      # gauge is effectively stuck at 0, so `== 0 for 5m` would fire on deploy and
      # never clear — a permanent false positive. The REAL failure the census
      # wanted to catch ("exporter present, up==1, but query metrics silently
      # frozen/stale") is detected directly and correctly on the counters: zero
      # query throughput for 15m while clients are present and the exporter is up.
      # Baseline check: min query rate over 24h is 1.45/s (traffic never legitimately
      # reaches 0, even overnight, with 15 active clients), so this will not false-fire.
      - alert: TechnitiumDNSMetricsFrozen
        expr: |
          up{job="technitium_dns"} == 1
          and sum(rate(technitium_dns_request_result_count[15m])) == 0
          and technitium_dns_client_count > 0
        for: 5m
        labels:
          severity: warning
          category: dns
          component: dns
        annotations:
          summary: "Technitium DNS query metrics are frozen"
          description: "The Technitium exporter is up (up==1) but has reported ZERO DNS queries for the last 15 minutes despite {{ with query \"technitium_dns_client_count\" }}{{ . | first | value }}{{ end }} active clients. The exporter has likely lost its connection to the Technitium API, so all query-outcome counters are stale/frozen — TechnitiumDNSExporterDown stays green because the scrape still succeeds. Check the exporter→Technitium API (:5380) connection and API token."

      # DNS Query Latency (Speed) Alerts
      # Note: Latency metrics not available in current Technitium exporter
      # These alerts are disabled until latency metrics are added
      # - alert: HighDNSQueryLatency
      #   expr: rate(technitium_dns_stats_total_query_time_seconds[5m]) / rate(technitium_dns_stats_total_queries[5m]) > 0.1
      #   for: 5m
      #   labels:
      #     severity: warning
      #     category: dns
      #     component: dns
      #   annotations:
      #     summary: "High DNS query latency detected"
      #     description: "Average DNS query response time is over 100ms for the last 5 minutes. Current: {{ $value | humanizeDuration }}."

      # - alert: CriticalDNSQueryLatency
      #   expr: rate(technitium_dns_stats_total_query_time_seconds[5m]) / rate(technitium_dns_stats_total_queries[5m]) > 0.5
      #   for: 2m
      #   labels:
      #     severity: critical
      #     category: dns
      #     component: dns
      #   annotations:
      #     summary: "Critical DNS query latency detected"
      #     description: "Average DNS query response time is over 500ms for the last 2 minutes. Current: {{ $value | humanizeDuration }}. This indicates serious DNS performance issues."

      # DNS Query Rate Monitoring
      - alert: DNSQueryRateSpike
        expr: sum(rate(technitium_dns_request_result_count[5m])) > 10 * avg_over_time(sum(rate(technitium_dns_request_result_count[5m]))[1h:5m])
        for: 10m
        labels:
          severity: warning
          category: dns
          component: dns
        annotations:
          summary: "Unusual spike in DNS query rate"
          description: "DNS query rate is more than 10x the average over the last hour. This could indicate a DDoS attack or misconfiguration. Current rate: {{ $value | humanize }} queries/sec."

      - alert: DNSQueryRateDrop
        expr: sum(rate(technitium_dns_request_result_count[5m])) < 0.1 * avg_over_time(sum(rate(technitium_dns_request_result_count[5m]))[1h:5m]) and avg_over_time(sum(rate(technitium_dns_request_result_count[5m]))[1h:5m]) > 1
        for: 10m
        labels:
          severity: warning
          category: dns
          component: dns
        annotations:
          summary: "Unusual drop in DNS query rate"
          description: "DNS query rate has dropped to less than 10% of the average over the last hour. This could indicate network issues or client problems. Current rate: {{ $value | humanize }} queries/sec."

      # DNS Failure Rate (Consistency) Alerts
      #
      # ALL SEVEN RATIO RULES IN THIS SECTION WERE REPAIRED AND RETUNED 2026-07-28.
      # Every one returned 0 series and could never fire. Two independent defects:
      #
      #  1. VECTOR MATCHING. The old form divided a labelled vector by a bare `sum(...)`,
      #     which strips all labels, so one-to-one matching found nothing on either side
      #     and the result was empty. Verified: stripping the threshold from the old shape
      #     STILL returned 0 series, which is how you distinguish a broken match from a
      #     merely-false condition. The working form is
      #     `sum by(instance,job)(X{result=...}) / on(instance,job) group_left sum by(instance,job)(X)`.
      #  2. GAUGE SEMANTICS. `rate()` is illegal on these metrics. Technitium publishes
      #     ROLLING-HOUR WINDOW gauges that move DOWN as well as up; rate() assumes a
      #     monotonic counter. The raw ratio already IS the last-hour ratio, so rate() is
      #     both wrong and unnecessary.
      #
      # THRESHOLDS are set from the measured 30-day distribution (n=4288 samples at 10m
      # step), NOT from the old aspirational values and NOT from raw maxima. Method and
      # why it matters:
      #   - A 7-day window at 5m step understates every extreme on this host. The original
      #     retune proposal used exactly that and would have shipped FOUR rules that fire
      #     in normal operation (nx_domain >0.50 against a 0.5353 real spike, refused >0.10
      #     against 0.1285, cached <0.40 against a p1 of 0.3896, server_failure >0.05
      #     against 9 routine samples above it).
      #   - Brief 1-minute spikes exist but CANNOT satisfy these 5-15m dwells, so the
      #     sustained (10m-step) distribution is the correct basis, with thresholds placed
      #     above the 1m absolute max wherever that is still practical.
      #   - One outlier is excluded deliberately: a single sample on 2026-07-03 11:33
      #     (SERVFAIL ratio 0.34-0.39, recursion ratio 7.38 -- a ratio above 1.0 is
      #     impossible, proving numerator and denominator came from non-commensurable
      #     window states). 07-03 is a known-anomalous day and the exporter was serving
      #     byte-identical frozen samples around then. Thresholds are set to still catch
      #     that magnitude of event while ignoring routine noise.
      #
      # server_failure: 9 of 4288 samples exceed 0.05 (0.2%) and only 1 exceeds 0.15, so
      # the old 0.01 and the proposed 0.05 both sit inside normal variation. 0.10 warning
      # clears all routine noise; 0.20 critical is ~4x the p99.
      - alert: HighDNSServerFailureRate
        expr: sum by(instance,job)(technitium_dns_request_result_count{result="server_failure"}) / on(instance,job) group_left sum by(instance,job)(technitium_dns_request_result_count) > 0.10
        for: 5m
        labels:
          severity: warning
          category: dns
          component: dns
        annotations:
          summary: "High DNS SERVFAIL rate detected"
          description: "More than 10% of DNS queries are returning SERVFAIL (30d p99 is well under this). Indicates problems with upstream resolvers or DNS configuration. Current rate: {{ $value | humanizePercentage }}."

      - alert: CriticalDNSServerFailureRate
        expr: sum by(instance,job)(technitium_dns_request_result_count{result="server_failure"}) / on(instance,job) group_left sum by(instance,job)(technitium_dns_request_result_count) > 0.20
        for: 2m
        labels:
          severity: critical
          category: dns
          component: dns
        annotations:
          summary: "Critical DNS SERVFAIL rate detected"
          description: "More than 20% of DNS queries are returning SERVFAIL -- roughly 4x the 30-day p99. Immediate investigation required. Current rate: {{ $value | humanizePercentage }}."

      - alert: HighDNSRefusedRate
        # refused: 30d p99.9 = 0.0501, sustained max 0.0526, briefest 1m spike 0.1285.
        # 0.15 sits above even that spike, so only a sustained regime change fires.
        expr: sum by(instance,job)(technitium_dns_request_result_count{result="refused"}) / on(instance,job) group_left sum by(instance,job)(technitium_dns_request_result_count) > 0.15
        for: 5m
        labels:
          severity: warning
          category: dns
          component: dns
        annotations:
          summary: "High DNS REFUSED response rate"
          description: "More than 15% of DNS queries are being refused (30d p99.9 is 5%). Could indicate ACL issues or security policy triggering. Current rate: {{ $value | humanizePercentage }}."

      - alert: HighDNSNameErrorRate
        # nx_domain: NXDOMAIN is genuinely noisy on a home LAN (typos, Bonjour/mDNS
        # lookups, ad-block domains). 30d p50 = 0.1175, p99.9 = 0.4618, sustained max
        # 0.4733, briefest 1m spike 0.5353 -- so the proposed 0.50 WOULD have fired.
        expr: sum by(instance,job)(technitium_dns_request_result_count{result="nx_domain"}) / on(instance,job) group_left sum by(instance,job)(technitium_dns_request_result_count) > 0.60
        for: 10m
        labels:
          severity: warning
          category: dns
          component: dns
        annotations:
          summary: "Unusually high NXDOMAIN rate detected"
          description: "More than 60% of DNS queries are returning NXDOMAIN (30d median is 12%, p99.9 is 46%). Could indicate misconfigurations, a broken search domain, or reconnaissance. Current rate: {{ $value | humanizePercentage }}."

      # DNS Cache Performance (Consistency)
      - alert: LowDNSCacheHitRate
        # cached: a FLOOR rule, so the relevant statistic is the low tail. 30d p1 =
        # 0.3896 and sustained min 0.3597, so the old 0.70 and the proposed 0.40 both sit
        # ABOVE normal operation and would fire routinely. 0.25 is below the sustained
        # minimum with margin; the briefest 1m dip reached 0.1963 but cannot hold 15m.
        expr: sum by(instance,job)(technitium_dns_resolve_mode_count{result="cached"}) / on(instance,job) group_left sum by(instance,job)(technitium_dns_resolve_mode_count) < 0.25
        for: 15m
        labels:
          severity: warning
          category: dns
          component: dns
        annotations:
          summary: "Low DNS cache hit rate"
          description: "DNS cache hit rate is below 25% for 15 minutes (30d median is 63%, p1 is 39%). Reduces performance and increases upstream load. Current rate: {{ $value | humanizePercentage }}."

      # DNS Blocking Statistics (if using blocking)
      - alert: HighDNSBlockRate
        # blocked: threshold UNCHANGED at 0.50 -- it is the one rule in this section whose
        # value was already sane. 30d p99.9 = 0.2767, max 0.2925, so 0.50 keeps ~1.7x
        # margin. Expression-only repair.
        expr: sum by(instance,job)(technitium_dns_resolve_mode_count{result="blocked"}) / on(instance,job) group_left sum by(instance,job)(technitium_dns_resolve_mode_count) > 0.50
        for: 10m
        labels:
          severity: info
          category: dns
          component: dns
        annotations:
          summary: "High DNS block rate detected"
          description: "More than 50% of DNS queries are being blocked. This is informational but may indicate aggressive blocking or malware activity. Current rate: {{ $value | humanizePercentage }}."

      # Upstream Resolver Issues
      - alert: HighDNSRecursionFailureRate
        # recursion failures: operand order is deliberately RATIO FIRST, guard second, so
        # that {{ $value }} interpolates the ratio rather than the guard. The `> 0` guard is
        # retained despite recursive never being observed at 0 in 4288 samples, because a
        # zero denominator yields +Inf which would fire unconditionally.
        # 30d p99 = 0.1163, p99.9 = 0.3103, so the proposed 0.30 would fire ~5x/month.
        # 0.50 leaves only the single 07-03 artifact (which reached 7.38 -- a ratio above
        # 1.0 is impossible and proves the two gauges use non-commensurable windows).
        expr: (sum by(instance,job)(technitium_dns_request_result_count{result="server_failure"}) / on(instance,job) group_left sum by(instance,job)(technitium_dns_resolve_mode_count{result="recursive"})) > 0.50 and on(instance,job) sum by(instance,job)(technitium_dns_resolve_mode_count{result="recursive"}) > 0
        for: 5m
        labels:
          severity: warning
          category: dns
          component: dns
        annotations:
          summary: "High failure rate for recursive DNS queries"
          description: "More than 50% of recursive queries (to upstream resolvers) are failing (30d p99 is 12%). Check upstream resolver connectivity and performance. Current failure rate: {{ $value | humanizePercentage }}."

  # DNS Query Log Exporter Health Monitoring
  - name: dns_query_exporter_health
    interval: 30s
    rules:
      # Authentication failure monitoring
      - alert: DnsQueryExporterAuthenticationFailures
        expr: rate(authentication_failures_total{job="dns_query_logs"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
          category: dns
          service: dns-query-log-exporter
        annotations:
          summary: "DNS Query Log Exporter experiencing authentication failures"
          description: "Authentication failures detected with Technitium DNS API. This usually indicates an invalid, expired, or inaccessible API token. Check secret file permissions and content."

      # API error rate monitoring
      - alert: DnsQueryExporterHighAPIErrorRate
        expr: rate(api_errors_total{job="dns_query_logs"}[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
          category: dns
          service: dns-query-log-exporter
        annotations:
          summary: "DNS Query Log Exporter has high API error rate"
          description: "Elevated API error rate detected ({{ $value | humanize }} errors/sec). Error types: {{ $labels.error_type }}. Check Technitium DNS API health and network connectivity."

      # Stale data monitoring - no successful queries in last 5 minutes
      - alert: DnsQueryExporterStaleData
        expr: (time() - last_successful_query_timestamp{job="dns_query_logs"}) > 300
        for: 2m
        labels:
          severity: warning
          category: dns
          service: dns-query-log-exporter
        annotations:
          summary: "DNS Query Log Exporter has not successfully fetched data recently"
          description: "No successful API queries in the last 5 minutes. Last successful fetch was {{ $value | humanizeDuration }} ago. Check service logs and API connectivity."

      # Complete service failure - no metrics at all
      - alert: DnsQueryExporterDown
        expr: up{job="dns_query_logs"} == 0
        for: 1m
        labels:
          severity: critical
          category: dns
          service: dns-query-log-exporter
        annotations:
          summary: "DNS Query Log Exporter is down"
          description: "The DNS Query Log Exporter service is not responding on the metrics endpoint. Check service status with 'systemctl status dns-query-log-exporter'."

      # Consecutive failure tracking - will fail-fast at 3
      - alert: DnsQueryExporterConsecutiveFailures
        expr: consecutive_failures{job="dns_query_logs"} >= 2
        for: 1m
        labels:
          severity: warning
          category: dns
          service: dns-query-log-exporter
        annotations:
          summary: "DNS Query Log Exporter approaching fail-fast threshold"
          description: "{{ $value }} consecutive failures detected. Service will exit after 3 consecutive failures. Investigate immediately to prevent service termination."

      # Network-specific errors
      - alert: DnsQueryExporterNetworkErrors
        expr: rate(api_errors_total{job="dns_query_logs",error_type="network"}[5m]) > 0.05
        for: 3m
        labels:
          severity: warning
          category: dns
          service: dns-query-log-exporter
        annotations:
          summary: "DNS Query Log Exporter experiencing network errors"
          description: "Network errors connecting to Technitium DNS API ({{ $value | humanize }} errors/sec). Check network connectivity and Technitium DNS service health."

      # Timeout-specific errors
      - alert: DnsQueryExporterTimeouts
        expr: rate(api_errors_total{job="dns_query_logs",error_type="timeout"}[5m]) > 0.05
        for: 3m
        labels:
          severity: warning
          category: dns
          service: dns-query-log-exporter
        annotations:
          summary: "DNS Query Log Exporter experiencing API timeouts"
          description: "API request timeouts detected ({{ $value | humanize }} timeouts/sec). Technitium DNS API may be overloaded or experiencing performance issues."

  # Internal-zone DNS resolution correctness (blackbox dns_internal probe)
  - name: dns_internal_resolution
    interval: 30s
    rules:
      # The blackbox dns_internal module queries the local Technitium resolver
      # for vulcan.lan and validates the answer carries A 192.168.1.2.
      # probe_success == 0 covers ALL of: NXDOMAIN, SERVFAIL, a wrong/poisoned
      # A record, and the local resolver being down for the internal zone —
      # none of which the external dns_query (google.com) probe can detect.
      - alert: InternalDNSResolutionBroken
        expr: probe_success{job="blackbox_dns_internal"} == 0
        for: 3m
        labels:
          severity: critical
          category: dns
          component: dns
        annotations:
          summary: "Internal DNS resolution for *.vulcan.lan is broken"
          description: "The local resolver (127.0.0.1) failed to return the expected A record (192.168.1.2) for vulcan.lan for more than 3 minutes. This indicates NXDOMAIN, SERVFAIL, a wrong/poisoned answer, or the internal zone being unavailable — internal name resolution for *.vulcan.lan is likely failing host-wide."

  # DNS correctness — resolver SEMANTICS, not just reachability.
  #
  # These three alerts read the dns-correctness-exporter textfile gauges
  # (modules/monitoring/services/technitium-dns-monitoring.nix), which probe the
  # local resolver every 5min. Availability is already covered (TechnitiumDNS*,
  # blackbox_dns_internal); these catch the resolver being UP but WRONG.
  #
  # Live baseline (2026-06-10): DNSSEC validation is ACTIVE (dnssec-failed.org
  # -> SERVFAIL) and the PTR for 192.168.1.2 resolves to `vulcan.`, so both
  # gauges read 1 and NEITHER alert fires on deploy. The collector run-timestamp
  # gauge (dns_correctness_run_timestamp_seconds) lets us tell a stuck collector
  # from a real regression; we gate each alert on a fresh run (< 15m old) so a
  # dead collector trips the dedicated freshness alert rather than silently
  # asserting a stale 0/1.
  - name: dns_correctness
    interval: 30s
    rules:
      # DNSSEC validation OFF: the resolver accepted the deliberately-broken
      # dnssec-failed.org zone (NOERROR) instead of SERVFAILing it. A validating
      # resolver MUST reject it; a 0 means forged/expired signatures would be
      # served to clients. Severity warning per spec (it is a security-posture
      # regression, not an outage). probe_errors==0 ensures we are asserting a
      # real NOERROR answer, not a resolver timeout (which separately trips
      # InternalDNSResolutionBroken / DnsCorrectnessExporterStale).
      - alert: DNSSECValidationInactive
        expr: |
          dns_dnssec_validation_active == 0
          and dns_correctness_probe_errors == 0
          and (time() - dns_correctness_run_timestamp_seconds) < 900
        for: 30m
        labels:
          severity: warning
          category: dns
          component: dns
        annotations:
          summary: "DNSSEC validation is INACTIVE on the local resolver"
          description: "The local resolver (127.0.0.1) returned NOERROR for dnssec-failed.org, which a validating resolver MUST SERVFAIL. DNSSEC validation has been OFF for more than 30 minutes — the resolver will accept forged or expired DNSSEC signatures, undermining the integrity guarantees of every signed zone it answers. Re-enable DNSSEC validation in Technitium (Settings → Proxy & Forwarders / Recursion), or confirm this is a deliberate change."

      # PTR (reverse) resolution broken: the host's own reverse record no longer
      # resolves to `vulcan.`. Catches a dropped/renamed reverse zone or a
      # changed PTR record — invisible to the forward-only blackbox_dns_internal
      # probe. probe_errors==0 distinguishes a wrong record from an unreachable
      # resolver.
      - alert: DNSPTRBroken
        expr: |
          dns_ptr_correct == 0
          and dns_correctness_probe_errors == 0
          and (time() - dns_correctness_run_timestamp_seconds) < 900
        for: 30m
        labels:
          severity: warning
          category: dns
          component: dns
        annotations:
          summary: "Reverse (PTR) resolution for 192.168.1.2 is broken"
          description: "The local resolver returned an unexpected (or empty) PTR for 192.168.1.2 — expected `vulcan.` — for more than 30 minutes. Reverse lookups for the host are failing, which breaks PTR-dependent consumers (mail HELO checks, logs that resolve IPs, ACLs). Check the Technitium reverse zone for 1.168.192.in-addr.arpa."

      # Collector liveness: if the dns-correctness-exporter stops running, its
      # gauges go stale and the two correctness alerts above silently disable
      # themselves (the freshness gate fails). This catches that.
      - alert: DnsCorrectnessExporterStale
        expr: (time() - dns_correctness_run_timestamp_seconds) > 1800
        for: 5m
        labels:
          severity: warning
          category: dns
          component: dns
        annotations:
          summary: "DNS-correctness exporter has stopped updating"
          description: "dns_correctness_run_timestamp_seconds has not advanced in over 30 minutes (timer interval is 5min). The DNSSEC/PTR correctness checks are no longer running, so DNSSECValidationInactive and DNSPTRBroken are effectively disabled. Check 'systemctl status dns-correctness-exporter.service' and its timer."

  # Technitium software-update availability (P2, info). The exporter publishes
  # technitium_dns_update_available: -1 = unknown/not-checked, 0 = up to date,
  # 1 = an update is available. We alert ONLY on ==1 (live value today is -1, so
  # this does not fire on deploy). Long `for:` (6h) because a new release is not
  # urgent and the value flaps as the daily update-check runs.
  - name: dns_software_update
    interval: 1m
    rules:
      - alert: TechnitiumUpdateAvailable
        expr: technitium_dns_update_available == 1
        for: 6h
        labels:
          severity: info
          category: dns
          component: dns
        annotations:
          summary: "A Technitium DNS update is available"
          description: "technitium_dns_update_available has reported an available update for more than 6 hours. Review the Technitium release notes and update the pinned version when convenient (this is informational, not urgent)."

  # DNS probe latency (P2, performance). probe_duration_seconds for the blackbox
  # DNS jobs (blackbox_dns external resolvers + blackbox_dns_internal local
  # resolver). Baseline (7d): the local/internal resolvers peak at ~92ms /
  # ~7ms; external public resolvers occasionally hit the 5s probe TIMEOUT but
  # only as isolated single-scrape blips (4 scrapes each over 7d for 1.1.1.1 /
  # 208.67.222.222) — NO target sustained >1s across any contiguous 15m window
  # in 7d. So `> 1 for 15m` clears the transient external timeouts and fires
  # only on genuine sustained DNS latency degradation. Per-target so a single
  # bad upstream is identifiable.
  - name: dns_latency
    interval: 30s
    rules:
      - alert: DNSProbeLatencyHigh
        expr: probe_duration_seconds{job=~"blackbox_dns.*"} > 1
        for: 15m
        labels:
          severity: warning
          category: dns
          component: dns
        annotations:
          summary: "DNS probe latency is high for {{ $labels.instance }}"
          description: "The blackbox DNS probe to {{ $labels.instance }} ({{ $labels.job }}) has taken more than 1 second for over 15 minutes (current: {{ $value | humanizeDuration }}). For the local/internal resolver this indicates real DNS performance degradation; for an external resolver it indicates a sustained upstream/connectivity problem. Baseline for local resolvers is <100ms."

  # CloudFlare Tunnel (data.newartisans.com et al.) edge-connection health.
  #
  # The public tunnel now exposes Prometheus metrics on 127.0.0.1:9301 (set via
  # TUNNEL_METRICS in modules/services/cloudflare-tunnels.nix; scraped by the
  # job_name="cloudflared" config in modules/monitoring/services/self-scrape.nix).
  # cloudflared maintains multiple HA (high-availability) connections to the
  # Cloudflare edge — normally 4. A tunnel can be "running" per systemd while
  # having silently lost some or all of those edge connections, which the
  # systemd-unit-active check and the host-wide TargetDown (up==0) catch-all
  # both miss: the process is alive, /metrics still scrapes (up==1), but no
  # public traffic flows. cloudflared_tunnel_ha_connections is the gauge that
  # surfaces this.
  #
  # POST-DEPLOY VERIFICATION: DONE (2026-07-27). These rules reference
  # cloudflared_tunnel_ha_connections, which does not exist in the TSDB until
  # the tunnel restarts with TUNNEL_METRICS set and Prometheus scrapes the new
  # job. The metric name is the documented cloudflared standard
  # (https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/monitor-tunnels/metrics/),
  # and the name/label shape was confirmed live on this cloudflared build
  # (2025.11.1): `cloudflared_tunnel_ha_connections` == 4 on instance
  # 127.0.0.1:9301 with up{job="cloudflared"} == 1, so the exprs below now
  # match real series. If a cloudflared upgrade ever renames the metric these
  # alerts go silently dormant (no series → no fire) — re-run those two queries
  # after any upgrade. The case of a totally-dead tunnel is meanwhile covered
  # by the host-wide TargetDown (up{job="cloudflared"}==0).
  - name: cloudflared_tunnel
    interval: 30s
    rules:
      - alert: CloudflaredTunnelDegraded
        expr: cloudflared_tunnel_ha_connections < 2
        for: 5m
        labels:
          severity: warning
          category: dns
          component: cloudflared
        annotations:
          summary: "CloudFlare tunnel has degraded edge connectivity"
          description: "cloudflared reports fewer than 2 healthy HA connections to the Cloudflare edge ({{ $value }}) for more than 5 minutes (normal is ~4). The public tunnel (data/gitea/s/calendar.newartisans.com) is running with reduced redundancy and may drop traffic. Check 'systemctl status cloudflared-tunnel-data' and its logs."

      - alert: CloudflaredTunnelDisconnected
        expr: cloudflared_tunnel_ha_connections == 0
        for: 2m
        labels:
          severity: critical
          category: dns
          component: cloudflared
        annotations:
          summary: "CloudFlare tunnel has lost all edge connections"
          description: "cloudflared reports ZERO HA connections to the Cloudflare edge for more than 2 minutes while the process is still running (up==1). The public tunnel is effectively offline — data/gitea/s/calendar.newartisans.com are unreachable from the internet even though the systemd unit looks healthy. Restart with 'systemctl restart cloudflared-tunnel-data'."
