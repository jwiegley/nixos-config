groups:
  - name: email_service_alerts
    interval: 60s
    rules:
      # Dovecot IMAP Server Alerts
      - alert: DovecotDown
        expr: up{job="dovecot"} == 0
        for: 2m
        labels:
          severity: critical
          category: email
          service: dovecot
        annotations:
          summary: "Dovecot IMAP server is down"
          description: "Dovecot IMAP server has been unreachable for more than 2 minutes. Email access is unavailable."

      # The entire Dovecot alert family (DovecotDown, DovecotAuthenticationFailures,
      # DovecotNoRecentActivity, dovecot_user_*) rides a SINGLE exporter that reads
      # the old_stats unix socket. If that exporter or the old_stats fifo wedges,
      # dovecot_up disappears (the target stops being scraped) and every dovecot_*
      # series goes silently absent rather than flipping to 0 — so the family quietly
      # goes blind with no signal. This is the single-point-of-failure backstop:
      # absent(dovecot_up) fires when the exporter target produces no dovecot_up
      # sample at all. Baseline 2026-06-10: dovecot_up present (=1), absent() empty,
      # so this does not fire on deploy. up{job="dovecot"} is the scrape-liveness of
      # the same target; this catches the case where the target is up but the metric
      # vanishes. NOTE: liveness of the IMAPS:993 listener itself, independent of this
      # exporter, would need a separate blackbox tcp probe (not added here).
      - alert: DovecotExporterStale
        expr: absent(dovecot_up) == 1
        for: 15m
        labels:
          severity: warning
          category: email
          service: dovecot
        annotations:
          summary: "Dovecot stats exporter is not reporting"
          description: "dovecot_up has been absent for more than 15 minutes. The entire Dovecot alert family rides this one old_stats-socket exporter, so its absence means all dovecot_* signals are blind (not 0 — gone). Check the dovecot exporter and the old_stats socket: systemctl status prometheus-dovecot-exporter; the alerts that depend on this are currently silent."

      - alert: DovecotAuthenticationFailures
        expr: sum(rate(dovecot_user_auth_failures[5m])) > 5
        for: 5m
        labels:
          severity: warning
          category: email
          service: dovecot
        annotations:
          summary: "High Dovecot authentication failure rate"
          description: "Dovecot is experiencing {{ $value | humanize }} authentication failures per second over the last 5 minutes. Possible brute force attack."

      # Postfix Mail Server Alerts
      - alert: PostfixDown
        expr: up{job="postfix"} == 0
        for: 2m
        labels:
          severity: critical
          category: email
          service: postfix
        annotations:
          summary: "Postfix mail server is down"
          description: "Postfix mail server exporter has been unreachable for more than 2 minutes. Mail delivery may be affected."

      - alert: PostfixMailQueueHigh
        expr: sum(postfix_showq_queue_depth) > 100
        for: 10m
        labels:
          severity: warning
          category: email
          service: postfix
        annotations:
          summary: "Postfix mail queue is growing"
          description: "Postfix has {{ $value }} messages in queue (threshold: 100). Mail delivery may be delayed."

      - alert: PostfixMailQueueCritical
        expr: sum(postfix_showq_queue_depth) > 500
        for: 5m
        labels:
          severity: critical
          category: email
          service: postfix
        annotations:
          summary: "Postfix mail queue is critically high"
          description: "Postfix has {{ $value }} messages in queue (threshold: 500). Immediate attention required."

      - alert: PostfixBouncesHigh
        expr: rate(postfix_bounce_non_delivery_notification_total[15m]) > 0.1
        for: 10m
        labels:
          severity: warning
          category: email
          service: postfix
        annotations:
          summary: "High email bounce rate detected"
          description: "Postfix is experiencing {{ $value | humanizePercentage }} bounce rate over the last 15 minutes."

      - alert: PostfixDeferralsHigh
        expr: rate(postfix_smtp_deferred_messages_total[15m]) > 0.2
        for: 10m
        labels:
          severity: warning
          category: email
          service: postfix
        annotations:
          summary: "High email deferral rate detected"
          description: "Postfix is deferring {{ $value | humanizePercentage }} of outbound messages. Check connectivity to remote servers."

      # Slow-burn complement to PostfixDeferralsHigh (which is a fast rate spike,
      # >0.2/s). A steady trickle of deferrals (e.g. 1/min = 0.017/s) never trips
      # the rate rule but accumulates toward 60/hr. This catches the
      # Schwab-token-style "works until it doesn't" failure where the upstream
      # relay (Fastmail/Gmail :587) starts rejecting or throttling our outbound
      # mail (auth expiry, reputation hit). Baseline on this host is 0 over 7d, so
      # >50/hr is a wide margin.
      - alert: PostfixDeferralsSustained
        expr: increase(postfix_smtp_deferred_messages_total[1h]) > 50
        for: 15m
        labels:
          severity: warning
          category: email
          service: postfix
        annotations:
          summary: "Sustained outbound mail deferrals"
          description: "Postfix has deferred {{ $value }} outbound messages in the last hour (threshold 50). The upstream relay (Fastmail/Gmail :587) may be rejecting, throttling, or refusing auth — outbound mail is silently piling up."

      - alert: PostfixRejectsHigh
        expr: rate(postfix_cleanup_messages_rejected_total[15m]) > 1
        for: 10m
        labels:
          severity: warning
          category: email
          service: postfix
        annotations:
          summary: "High email rejection rate"
          description: "Postfix is rejecting {{ $value }} messages per second. Possible spam attack or misconfiguration."

      # SMTP submission (587/465/2525) brute-force / credential-stuffing.
      # postfix_smtpd_sasl_authentication_failures_total counts failed SASL auth
      # on the smtpd side. Only owner devices ever authenticate here, so the
      # baseline is exactly 0 (zero increase over 7d). A burst of >20 failures in
      # 15m is a clear credential-stuffing signal. The submission ports are
      # firewall-open to the LAN, so this is the entry point an attacker would hit.
      - alert: PostfixSASLAuthFailureBurst
        expr: increase(postfix_smtpd_sasl_authentication_failures_total[15m]) > 20
        for: 0m
        labels:
          severity: warning
          category: email
          service: postfix
        annotations:
          summary: "Burst of SMTP SASL authentication failures"
          description: "Postfix saw {{ $value }} failed SMTP SASL authentications in the last 15 minutes (baseline ~0). Possible credential-stuffing / brute force against the submission ports (587/465/2525)."

      # Rspamd Spam Filter Alerts
      # NOTE: the "rspamd down" signal lives in rspamd-alerts.nix as
      # RspamdServiceDown (up{job="rspamd"}==0, the canonical probe-based
      # signal). A duplicate-named systemd-active rule was removed here on
      # 2026-06-10 to avoid an alert-name collision; this file keeps only the
      # complementary failed-state rule below.
      - alert: RspamdServiceFailed
        expr: |
          node_systemd_unit_state{
            name="rspamd.service",
            state="failed"
          } == 1
        for: 1m
        labels:
          severity: critical
          category: email
          service: rspamd
        annotations:
          summary: "Rspamd service has failed"
          description: "Rspamd service is in failed state. Check logs for errors."

      # Dovecot Message/Byte Delivery Metrics
      - alert: DovecotNoRecentActivity
        expr: |
          (time() - dovecot_user_last_update{user!="root"}) > 86400
        for: 30m
        labels:
          severity: info
          category: email
          service: dovecot
        annotations:
          summary: "Dovecot user {{ $labels.user }} has no recent activity"
          description: "User {{ $labels.user }} has had no IMAP activity for more than 24 hours. Last activity: {{ $value | humanizeDuration }} ago."

      - alert: DovecotServiceFailed
        expr: |
          node_systemd_unit_state{
            name="dovecot.service",
            state="failed"
          } == 1
        for: 1m
        labels:
          severity: critical
          category: email
          service: dovecot
        annotations:
          summary: "Dovecot IMAP service has failed"
          description: "Dovecot service is in failed state. Check logs: journalctl -u dovecot2 -n 50"

      - alert: DovecotServiceInactive
        expr: |
          node_systemd_unit_state{
            name="dovecot.service",
            state="active"
          } == 0
        for: 2m
        labels:
          severity: critical
          category: email
          service: dovecot
        annotations:
          summary: "Dovecot IMAP service is not active"
          description: "Dovecot service is not running. Email retrieval is unavailable."

      # Postfix Message/Byte Delivery Metrics
      - alert: PostfixNoMessagesProcessed
        expr: |
          rate(postfix_cleanup_messages_processed_total[30m]) == 0
          and
          (time() - (postfix_cleanup_messages_processed_total > 0)) < 86400
        for: 1h
        labels:
          severity: warning
          category: email
          service: postfix
        annotations:
          summary: "Postfix has not processed any messages recently"
          description: "Postfix has not processed any messages in the last 30 minutes. This may indicate a service issue or lack of outbound mail."

      - alert: PostfixHighMessageVolume
        expr: |
          rate(postfix_cleanup_messages_processed_total[5m]) > 10
        for: 15m
        labels:
          severity: info
          category: email
          service: postfix
        annotations:
          summary: "Postfix is processing high message volume"
          description: "Postfix is processing {{ $value | humanize }} messages per second. This may be normal bulk sending or potential spam."

      - alert: PostfixMessageProcessingStalled
        expr: |
          rate(postfix_qmgr_messages_removed_total[15m]) == 0
          and
          postfix_showq_message_age_seconds_count > 0
        for: 30m
        labels:
          severity: critical
          category: email
          service: postfix
        annotations:
          summary: "Postfix message processing has stalled"
          description: "Postfix has {{ $value }} messages in queue but is not delivering them. Check service health and network connectivity."

      - alert: PostfixServiceFailed
        expr: |
          node_systemd_unit_state{
            name="postfix.service",
            state="failed"
          } == 1
        for: 1m
        labels:
          severity: critical
          category: email
          service: postfix
        annotations:
          summary: "Postfix mail service has failed"
          description: "Postfix service is in failed state. Check logs: journalctl -u postfix -n 50"

      - alert: PostfixServiceInactive
        expr: |
          node_systemd_unit_state{
            name="postfix.service",
            state="active"
          } == 0
        for: 2m
        labels:
          severity: critical
          category: email
          service: postfix
        annotations:
          summary: "Postfix mail service is not active"
          description: "Postfix service is not running. Mail delivery is unavailable."

      # Combined Email System Health
      - alert: EmailSystemDegraded
        expr: |
          (up{job="dovecot"} == 0 or up{job="postfix"} == 0)
        for: 5m
        labels:
          severity: critical
          category: email
          service: email-system
        annotations:
          summary: "Email system is degraded"
          description: "One or more core email services (Dovecot, Postfix) are down. Email functionality is impaired."

      - alert: EmailDeliveryLatencyHigh
        expr: |
          histogram_quantile(0.95, rate(postfix_qmgr_messages_inserted_size_bytes_bucket[5m])) > 1000000
        for: 10m
        labels:
          severity: warning
          category: email
          service: postfix
        annotations:
          summary: "Email delivery latency is high"
          description: "95th percentile message size is {{ $value | humanize1024 }} bytes, indicating potential large message backlog or slow processing."
