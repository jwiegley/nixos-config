groups:
  - name: smart_alerts
    interval: 60s
    rules:
      # SMART overall-health self-assessment failed. smartctl_device_smart_status
      # is 1 when the device reports PASSED, 0 on FAILED — i.e. the disk's own
      # firmware predicts imminent failure. On the tank disks this is the disk
      # itself failing (vs the enclosure); on the NVMe root it is the boot device.
      - alert: SmartDeviceUnhealthy
        expr: smartctl_device_smart_status == 0
        for: 5m
        labels:
          severity: critical
          category: storage
          service: smartctl
        annotations:
          summary: "SMART health FAILED on {{ $labels.device }}"
          description: "Device {{ $labels.device }} reports SMART overall-health = FAILED. The drive firmware predicts imminent failure — back up and replace the disk."

      # THE leading indicator that the OWC/UAS bridge is degrading. CRC errors
      # accumulate on the link between host and disk (cable/bridge/controller),
      # not on the platters — they climb before the enclosure abort-storm drops
      # the pool (see project_tank_uas_enclosure_failure). Any increase over 6h
      # is worth surfacing; the raw attribute is monotonic so increase() catches
      # new errors without false-firing on the standing count.
      - alert: SmartUDMACRCErrorsRising
        expr: increase(smartctl_device_attribute{attribute_name="UDMA_CRC_Error_Count",attribute_value_type="raw"}[6h]) > 0
        for: 5m
        labels:
          severity: warning
          category: storage
          service: smartctl
        annotations:
          summary: "UDMA CRC errors rising on {{ $labels.device }}"
          description: "{{ $labels.device }} gained {{ $value }} UDMA_CRC_Error_Count error(s) in 6h. This is the leading indicator the UAS/USB bridge (OWC enclosure) is degrading — pre-empt the abort-storm that drops the tank pool (see project_tank_uas_enclosure_failure)."

      # Reallocated sectors: the disk has remapped bad sectors to spares. Any
      # nonzero raw value is a genuine media defect worth watching.
      - alert: SmartReallocatedSectors
        expr: smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"} > 0
        for: 5m
        labels:
          severity: warning
          category: storage
          service: smartctl
        annotations:
          summary: "Reallocated sectors on {{ $labels.device }}"
          description: "{{ $labels.device }} has {{ $value }} reallocated sector(s). The disk is remapping bad media to spares — track for growth and plan replacement if rising."

      # Pending sectors: sectors that failed a read and are queued for
      # reallocation. A rising pending count is an early bad-media signal,
      # often preceding reallocations.
      - alert: SmartPendingSectors
        expr: smartctl_device_attribute{attribute_name="Current_Pending_Sector",attribute_value_type="raw"} > 0
        for: 5m
        labels:
          severity: warning
          category: storage
          service: smartctl
        annotations:
          summary: "Pending sectors on {{ $labels.device }}"
          description: "{{ $labels.device }} has {{ $value }} current pending sector(s) awaiting reallocation — an early bad-media indicator. Investigate / schedule a scrub."

      # Drive temperature. 55C is the warning band for these Exos X18 / NVMe
      # devices; sustained heat shortens life. 15m avoids transient spikes
      # during heavy backup I/O.
      - alert: SmartDiskTemperatureHigh
        expr: smartctl_device_temperature{temperature_type="current"} > 55
        for: 15m
        labels:
          severity: warning
          category: storage
          service: smartctl
        annotations:
          summary: "Disk temperature high on {{ $labels.device }}"
          description: "{{ $labels.device }} has been above 55C for 15m (current: {{ $value }}C). Check enclosure airflow/fans — sustained heat shortens drive life."

      # SmartNVMeMediaErrors REMOVED 2026-07-31 -- unfirable, and already superseded.
      #
      # It selected `smartctl_device_media_errors`, a name the Prometheus __name__ index has
      # NEVER seen. The cause is recorded in the comment this replaces: /dev/nvme0n1 was
      # dropped from smartctl_exporter's device list on 2026-07-03, because that exporter
      # hardcodes `--log=error`, which hits unsupported log page 0x109 on this Apple ANS NVMe
      # -- smartctl exits 4 and the exporter DISCARDS the device entirely. Re-adding it there
      # would reintroduce a known-broken state, so this rule cannot be repaired in place.
      #
      # It does not need repairing: the replacement shipped 2026-07-29.
      # modules/monitoring/services/nvme-smart-exporter.nix reads the same device with
      # `smartctl -j -H -A` (avoiding the failing log page) and publishes nvme_smart_*, and
      # NVMeMediaErrors in modules/monitoring/alerts/nvme-smart.yaml already alerts on
      # `increase(nvme_smart_media_errors[24h]) > 0` against a LIVE series.
      #
      # So this rule was pure residue: two alerts for one condition, of which only the other
      # one works. Keeping it would have meant either permanent silence here or, if
      # "repaired" by pointing it at nvme_smart_media_errors, duplicate pages for one event.
      # Its own comment had said "this rule cannot fire" since 2026-07-27; the dead-rule
      # detector (scripts/prometheus-rule-audit.py) is what finally forced the disposition.
      #
      # Verified before deletion: the surviving hardware really is all SATA -- `smartctl
      # --scan` reports /dev/sd{a,b,c,d} as `-d sat` plus /dev/nvme0 as `-d nvme`, and every
      # smartctl_device series carries interface="sat".

      # A disk vanishing from the SMART scan = the enclosure dropping a device.
      # smartctl_devices is a label-less gauge of how many devices the exporter
      # successfully scanned. Four are configured (sda-sdd; nvme0n1 was removed
      # 2026-07-03 — Apple ANS NVMe rejects the exporter's --log=error page and
      # was silently discarded, making <5 fire constantly); fewer than 4 means
      # one fell off the bus — the classic UAS-enclosure failure mode that
      # precedes / accompanies the pool dropping. for:10m rides out a transient
      # re-enumeration without missing a real drop.
      - alert: SmartDeviceMissing
        expr: smartctl_devices < 4
        for: 10m
        labels:
          severity: critical
          category: storage
          service: smartctl
        annotations:
          summary: "A SMART device has disappeared from the scan"
          description: "smartctl_exporter now sees {{ $value }} of 4 configured devices. A disk has dropped off the bus — almost certainly the OWC/UAS enclosure dropping a tank member (see project_tank_uas_enclosure_failure). Check `lsblk` / `zpool status` and the enclosure."
