groups:
  - name: vm_agent_egress
    rules:
      # Egress byte-rate spike on the guest->host TAP device (vm-openclaw,
      # vm-hermes). node_exporter already scrapes these for free; no collector
      # needed. Baseline tx is tiny and steady: verified 2026-06-10 the 6h max
      # rate was ~507 B/s (vm-openclaw) / ~314 B/s (vm-hermes). A sustained
      # 1 MB/s is ~2000-3000x baseline and would indicate bulk exfiltration,
      # a runaway fetch loop, or a legitimately large transfer. for:15m rides
      # out a single large model response / git clone. This tier is on the
      # Prometheus data path, independent of Loki, so it is the backstop if the
      # bypass-scrape (below) ever goes quiet.
      - alert: VMAgentEgressVolumeHigh
        expr: |
          rate(node_network_transmit_bytes_total{device=~"vm-openclaw|vm-hermes"}[10m]) > 1.0e6
        for: 15m
        labels:
          severity: warning
          category: security
          service: agent-vm-egress
        annotations:
          summary: "{{ $labels.device }} sustained egress > 1 MB/s for 15m"
          description: |
            Agent microVM {{ $labels.device }} (vm-openclaw=openclaw,
            vm-hermes=hermes) transmitted >1 MB/s out the bridge for 15m
            (baseline <= ~0.5 kB/s). Possible bulk exfiltration, a runaway
            fetch loop, or a legitimately large transfer. Check the DNS log for
            the destination ({job="dns_query_logs"}) and the netfilter egress
            log ({job="vm-egress"}), plus `iptables -L FORWARD -v -n` counters.
            If the agents do legitimate bulk work, raise the floor to >5 MB/s.

      # The two LOG-stream tripwires (VMAgentEgressConnectionStorm,
      # HermesEgressRejected) are LogQL over the promtail job="vm-egress"
      # stream and therefore live in
      # modules/monitoring/loki-rules/vm-egress-tripwires.yaml (Loki ruler,
      # L+ symlink in loki.nix) — NOT here. They were originally written into
      # this Prometheus-ruler file, where they parsed as valid PromQL but
      # matched zero series and could never fire (caught by the 2026-06-10
      # session review). Do not move them back.
