[project]
name = "flume-autofill"
version = "0.1.0"
description = "Water attribution: cross-check + backfill for HA water sensors"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "psycopg2>=2.9",
    "websocket-client>=1.8",
    "python-dateutil>=2.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "responses>=0.25",
    "freezegun>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
