groups:
  - name: memory_vault
    interval: 30s
    rules:
      # REST API / dashboard unreachable (blackbox probe of /api/health).
      - alert: MemoryVaultDown
        expr: probe_success{job="blackbox_memory_vault"} == 0
        for: 3m
        labels:
          severity: critical
          component: memory-vault
          service: memory-vault
        annotations:
          summary: "Memory Vault REST API is down"
          description: |
            The Memory Vault health probe (https://memory.vulcan.lan/api/health)
            has failed for 3 minutes.

            Check container: sudo -u memory-vault podman ps | grep memory-vault
            Local endpoint:  curl -k https://memory.vulcan.lan/api/health
            View logs: journalctl --user-unit podman-memory-vault -M memory-vault@ --tail 50
            Check PostgreSQL: pg_isready -h 127.0.0.1 -p 5432 -d memory_vault -U memory_vault

      # App container not running.
      - alert: MemoryVaultContainerDown
        expr: container_running{name="memory-vault"} == 0
        for: 3m
        labels:
          severity: critical
          component: memory-vault
          service: memory-vault
        annotations:
          summary: "Memory Vault app container is not running"
          description: |
            The memory-vault container is not running.

            Check service: systemctl --user -M memory-vault@ status podman-memory-vault.service
            Check container: sudo -u memory-vault podman ps -a | grep memory-vault

      # MCP (Streamable HTTP) container not running — VMs + LAN MCP clients lose
      # access to the memory tools. Warning, not critical (the app/DB are fine).
      - alert: MemoryVaultMcpContainerDown
        expr: container_running{name="memory-vault-mcp"} == 0
        for: 5m
        labels:
          severity: warning
          component: memory-vault
          service: memory-vault
        annotations:
          summary: "Memory Vault MCP container is not running"
          description: |
            The memory-vault-mcp (Streamable HTTP) container is down — OpenClaw,
            Hermes, and LAN MCP clients cannot reach the recall/remember tools.

            Check service: systemctl --user -M memory-vault@ status podman-memory-vault-mcp.service
            Check container: sudo -u memory-vault podman ps -a | grep memory-vault-mcp

      # Crash-looping (either container).
      - alert: MemoryVaultContainerRestarts
        expr: increase(container_restart_count{name=~"memory-vault.*"}[15m]) > 3
        for: 5m
        labels:
          severity: warning
          component: memory-vault
          service: memory-vault
        annotations:
          summary: "Memory Vault container is restarting frequently"
          description: |
            {{ $labels.name }} restarted {{ $value }} times in 15 minutes —
            likely PostgreSQL connectivity or image issues.

            View logs: sudo -u memory-vault podman logs {{ $labels.name }} --tail 100
            Check PostgreSQL: pg_isready -h 127.0.0.1 -p 5432 -d memory_vault -U memory_vault
