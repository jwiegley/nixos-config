groups:
  - name: openclaw_availability
    interval: 60s
    rules:
      # The 2026-04-22 regression symptom: the discord channel plugin isn't
      # in the most-recent [gateway] ready line.
      - alert: OpenClawDiscordPluginMissing
        expr: openclaw_channel_plugin_loaded{channel="discord"} == 0
        for: 10m
        labels:
          severity: critical
          category: availability
          service: openclaw
        annotations:
          summary: "OpenClaw discord plugin missing for 10 minutes"
          description: |
            The most recent [gateway] ready line did not include
            `discord` in its plugin list. This is the 2026-04-22
            regression pattern: DMs to the Claw bot will not get
            answered. Check
            /var/lib/openclaw/.openclaw/logs/gateway-vm.err.log.

      # Any of the other expected channel plugins missing.
      - alert: OpenClawChannelPluginMissing
        expr: openclaw_channel_plugin_loaded{channel!="discord"} == 0
        for: 15m
        labels:
          severity: warning
          category: availability
          service: openclaw
        annotations:
          summary: "OpenClaw {{ $labels.channel }} plugin missing for 15 minutes"
          description: |
            The most recent [gateway] ready line did not include
            `{{ $labels.channel }}` in its plugin list.

      # Plugin init failures since the last successful ready line.
      - alert: OpenClawPluginInitFailuresPresent
        expr: openclaw_plugin_init_failures_recent_total > 0
        for: 5m
        labels:
          severity: critical
          category: availability
          service: openclaw
        annotations:
          summary: "OpenClaw plugin init failures after last ready"
          description: |
            {{ $value }} plugin init failure lines in gateway-vm.err.log
            after the most recent [gateway] ready timestamp.

      # The canary itself is broken or not firing.
      - alert: OpenClawCanaryStale
        expr: (time() - openclaw_canary_last_run_timestamp_seconds) > 600
        for: 5m
        labels:
          severity: warning
          category: monitoring
          service: openclaw
        annotations:
          summary: "OpenClaw canary has not run in >10 minutes"
          description: |
            openclaw-canary.timer is not firing or the script is
            failing. `systemctl status openclaw-canary.service`.

      # The VM is alive and has been up long enough to reach ready, but
      # the most-recent `[gateway] ready` log line was emitted *before*
      # the current VM boot — typically crash-loop or wedged startup.
      # Gates on VM uptime > 1800 s so that a fresh VM still in its boot
      # window does not fire this alert.  The `[gateway] ready` line is
      # only emitted once per gateway start, so raw ready_age would
      # false-positive after any stable VM uptime > 30 min.
      - alert: OpenClawGatewayReadyStale
        expr: |
          openclaw_microvm_active_enter_timestamp_seconds > 0
          and (time() - openclaw_microvm_active_enter_timestamp_seconds) > 1800
          and openclaw_gateway_ready_timestamp_seconds
              < openclaw_microvm_active_enter_timestamp_seconds
          and on()
          (node_systemd_unit_state{name="microvm@openclaw.service", state="active"} == 1)
        for: 10m
        labels:
          severity: critical
          category: availability
          service: openclaw
        annotations:
          summary: "OpenClaw microVM active but gateway has not reached ready since last boot"
          description: |
            The microVM systemd unit has been running for >30 minutes
            but no `[gateway] ready` line has been logged since the
            current VM boot.  OpenClaw is either restarting in a loop
            or wedged during startup.

      # The microVM systemd unit entered failed state.
      - alert: OpenClawMicroVMDown
        expr: |
          node_systemd_unit_state{
            name="microvm@openclaw.service",
            state="failed"
          } == 1
        for: 2m
        labels:
          severity: critical
          category: availability
          service: openclaw
        annotations:
          summary: "OpenClaw microVM systemd unit is failed"
          description: "`systemctl status microvm@openclaw.service` for details."

      # Generic absence alarm — if the textfile stops appearing entirely,
      # none of the above fire.  This catches a deleted textfile dir, a
      # node_exporter restart issue, or the canary being disabled.
      - alert: OpenClawCanaryMetricAbsent
        expr: absent(openclaw_canary_parse_ok)
        for: 15m
        labels:
          severity: warning
          category: monitoring
          service: openclaw
        annotations:
          summary: "OpenClaw canary metric series is missing from Prometheus"
          description: |
            No `openclaw_canary_parse_ok` sample in Prometheus for
            15 minutes.  Check node_exporter --collector.textfile
            and the canary systemd timer.

      # B-floor signal — Discord WebSocket disconnected.
      #
      # DEBOUNCE (census item discord-ws-parity, 2026-06-10): this rule drives
      # `restart_microvm` in the self-heal daemon, so a single noisy sample must
      # never trip it.  `openclaw_discord_ws_connected` is a log-derived edge
      # signal (positive vs negative WS events) and is intentionally NOT the
      # Hermes per-ACK heartbeat — OpenClaw's gateway is upstream Node/TS with no
      # discord.py to patch and emits no periodic positive heartbeat line.  Over
      # 7d the raw signal flips 64x (avg up 99.68%); every blip resolves in well
      # under 5m.  `max_over_time(...[5m]) == 0` means "no healthy sample in the
      # last 5m" (canary ticks every 60s ⇒ ≥5 consecutive 0 samples), and with
      # `for: 5m` that is ~10m of *sustained* disconnect before a restart.
      # Baseline check (7d, 1m resolution): the raw `==0` predicate was true for
      # 32 minutes / 64 transitions, while the smoothed predicate was true for
      # 0 minutes / 0 transitions — i.e. the WS was never down for a full 5m
      # window, so this expr would have fired zero false restarts in 7d while
      # still catching a genuine ≥10m outage.  Reliability parity with Hermes is
      # achieved by this debounce, not a shared signal.
      - alert: OpenClawDiscordWsDown
        # VM-uptime warmup gate (see OpenClawHttpHealthDown). Here both series
        # come from the same canary textfile, so the join is
        # `ignoring(__name__)`.
        expr: |
          max_over_time(openclaw_discord_ws_connected[5m]) == 0
          and ignoring(__name__) (time() - openclaw_microvm_active_enter_timestamp_seconds) > 600
        for: 5m
        labels:
          severity: critical
          category: availability
          service: openclaw
        annotations:
          summary: "OpenClaw Discord WebSocket disconnected for ~10 minutes (sustained)"
          description: |
            `openclaw_discord_ws_connected` (the most recent positive
            Discord ready event — client initialized / logged in /
            WebSocket connection opened — is older than the most recent
            negative event: websocket closed / gateway error / reconnect
            scheduled (close|zombie) / was-not-ready / channel exited /
            health-monitor restart) has been 0 for an entire 5-minute
            window AND has held that way for a further 5 minutes
            (~10 minutes sustained), past the canary's own 60s reconnect
            grace.  A transient reconnect blip will NOT fire this — only a
            real, persistent disconnect.  Bot will not receive or send
            Discord messages until the connection is restored.

      # ACTIVE round-trip detector (discord-canary, Hermes probes @Claw).
      # Stronger than OpenClawDiscordWsDown above: that reads a log-derived
      # WS connected/closed edge signal, which a zombie that keeps the socket
      # "connected" while dropping MESSAGE_CREATE can fool (the 2026-07-15
      # Hermes-side failure mode). This proves a real message->reply through
      # Discord. Warmup-gated (>600s VM uptime).
      #
      # DELIBERATELY NOT AUTO-HEALED. Do not "close the loop" by mapping this in
      # openclaw-self-heal's ACTION_MAP -- an earlier version of this comment
      # suggested exactly that, and 2026-07-30 showed why it is wrong: the restart
      # re-stamps openclaw_microvm_active_enter_timestamp_seconds, which the >600
      # warmup gate below reads, so the alert RESOLVES and re-fires ~25min later
      # (600s warmup + for: 15m) with a new startsAt. A new startsAt is a new
      # incident at attempt 1, so per-incident escalation never accumulates and
      # the circuit breaker only paces the loop. Three reboots of a healthy VM
      # resulted. The daemon records the full reasoning under ACTION_MAP.
      #
      # PROVEN-GREEN GATE (last_success > 0), added 2026-07-30. The canary was
      # enabled before setup step 2 of docs/DISCORD_CANARY_SETUP.md, so @Claw's
      # allowlist did not contain Hermes and it could never reply: ok=0 from the
      # very first run, and this rule fired on a probe that had never worked.
      #
      # SCOPE OF THE GATE, precisely: last_success is carried forward across
      # failing runs, so this suppresses only a canary that has NEVER succeeded.
      # It does NOT bound the restart loop described above -- once the canary goes
      # green even once the gate is satisfied permanently. Its only job is to stop
      # an unproven probe from being treated as a regression.
      #
      # Two consequences worth knowing:
      #  - A never-green canary is not silent: OpenClawDiscordCanaryNeverSucceeded
      #    below reports it as the setup fault it is.
      #  - last_success is re-read from the .prom file this probe is about to
      #    overwrite (scripts/discord_canary.py:_read_last_success), and returns
      #    0.0 if that file is unreadable. So losing the textfile silently
      #    re-suppresses this critical alert until the canary next goes green.
      #    NeverSucceeded is the backstop for that path too, at warning severity.
      # KEYED ON TIME-SINCE-LAST-SUCCESS, NOT ON A FAILURE STREAK (2026-07-30).
      #
      # The original `ok == 0 for: 15m` form assumed a failing probe stays failing.
      # It does not: the target is an LLM agent that answers roughly half of its
      # mentions, so measured runs alternate
      #   ok=1(7.4s) ok=1(85.3s) ok=1(87.8s) ok=0 ...
      # and on a 900s cadence any two consecutive misses satisfy for: 15m. That
      # pages critical, then resolves on the next success, then pages again --
      # precisely the churn this rule was rewritten to stop, now arriving from the
      # probe's own variance rather than from a remediation loop.
      #
      # last_success is a monotonic timestamp carried forward across failures, so
      # its age cannot oscillate: it rises steadily while the round-trip is broken
      # and resets exactly once when it works. 7200s = 8 missed runs at the 900s
      # cadence; at the observed ~50% per-run success rate the chance of 8
      # consecutive misses by luck alone is well under 1%.
      #
      # ACCEPTED COST: up to 2h to notice a genuinely dead round-trip. That is the
      # right trade for this signal specifically -- it is the slow, deep,
      # end-to-end check, and the fast shallow ones (OpenClawDiscordWsDown,
      # OpenClawHttpHealthDown, OpenClawGatewayReadyStale) still page in minutes.
      # Partial degradation is not swallowed either: OpenClawDiscordCanaryDegraded
      # below reports a sagging success RATE at warning severity.
      - alert: OpenClawDiscordCanaryDown
        expr: |
          (time() - openclaw_discord_canary_last_success_timestamp_seconds) > 7200
          and ignoring(__name__) openclaw_discord_canary_last_success_timestamp_seconds > 0
          and ignoring(__name__) (time() - openclaw_microvm_active_enter_timestamp_seconds) > 600
        for: 10m
        labels:
          severity: critical
          category: availability
          service: openclaw
        annotations:
          summary: "OpenClaw Discord round-trip failing — @Claw not answering"
          description: |
            The discord-canary posted an @Claw mention (as Hermes) to the
            shared canary channel and OpenClaw did NOT reply within the
            timeout, sustained for 15m. This is the inbound MESSAGE_CREATE ->
            dispatch -> reply pipeline; the WS can be "connected" and still
            not deliver. Restart microvm@openclaw to re-establish a clean WS.

      # The partial-failure signal. Down (above) only fires when the round-trip has
      # been dead for 2h, so a target that answers SOME mentions and drops the rest
      # would otherwise be invisible -- and "answers about half of them" is exactly
      # the condition measured on 2026-07-30. That is a weaker form of the
      # 2026-07-15 silent outage (answered nobody), so it needs its own signal
      # rather than being absorbed into the Down threshold.
      #
      # A RATE over 6h, not a streak: with a 900s cadence that is ~24 samples, so
      # one unlucky miss moves the average by ~4% and cannot trip this alone.
      # Threshold 0.7 sits below a healthy probe (which should be ~1.0) and above
      # the noise floor of a single slow reply. Gated on the canary having been
      # green at least once, so an unproven probe reports as NeverSucceeded instead.
      - alert: OpenClawDiscordCanaryDegraded
        expr: |
          avg_over_time(openclaw_discord_canary_ok[6h]) < 0.7
          and ignoring(__name__) openclaw_discord_canary_last_success_timestamp_seconds > 0
        for: 30m
        labels:
          severity: warning
          category: availability
          service: openclaw-canary
        annotations:
          summary: "OpenClaw answers only {{ $value | humanizePercentage }} of canary mentions"
          description: |
            The Discord round-trip works but is unreliable: @Claw replied to only
            {{ $value | humanizePercentage }} of probe mentions over the last 6h.
            The inbound path is alive, so this is not the OpenClawDiscordWsDown
            case; it is partial dispatch loss, which is the quiet form of the
            2026-07-15 outage. Check whether replies are merely slow rather than
            missing -- `journalctl -u discord-canary-openclaw.service | grep ok=`
            shows the round-trip times, and a run whose reply lands after
            timeoutSeconds (180s) scores as a miss. Sustained values near 0.5 with
            fast successes point at the agent dropping messages while busy.

      # The signal that the proven-green gate above would otherwise swallow: a
      # canary that is running and reporting, but has never once succeeded. That
      # is a setup/permission fault rather than an outage, so it is a warning for
      # a human and carries service=openclaw-canary so it does NOT reach the
      # self-heal webhook (same technique as OpenClawSelfHealDown below) -- there
      # is no automated remediation for "an allowlist is missing an entry".
      # `== 0` needs the series to exist, so a disabled canary cannot fire this.
      # 2h tolerates the first few runs of a legitimately warming probe.
      - alert: OpenClawDiscordCanaryNeverSucceeded
        expr: openclaw_discord_canary_last_success_timestamp_seconds == 0
        for: 2h
        labels:
          severity: warning
          category: monitoring
          service: openclaw-canary
        annotations:
          summary: "OpenClaw Discord canary has never succeeded — setup incomplete"
          description: |
            The canary has been posting for over 2 hours and @Claw has never
            replied once, so the round-trip has never been proven and
            OpenClawDiscordCanaryDown is deliberately gated off (it cannot
            distinguish "broken" from "never worked", and firing on the latter
            made self-heal reboot the VM in a 26-minute loop on 2026-07-30).
            This is setup step 2 of docs/DISCORD_CANARY_SETUP.md: @Claw must
            allow-list Hermes (1503619790261194793) in channels.discord.allowFrom
            (modules/services/openclaw-config.nix). That entry alone was sufficient
            when this was last established, on 2026-07-30.
            Check the probe's own verdict with
            `journalctl -u discord-canary-openclaw.service | tail -1`, and read
            `post_http=200` + `no reply within timeout` CAREFULLY: it means the post
            succeeded and no reply was seen *inside timeoutSeconds*, which is not the
            same as the target rejecting the sender. Replies here range ~3s to ~90s,
            and reading that message as "rejected" once produced a confidently wrong
            diagnosis. Rule out the cheap causes first: a still-warming VM (compare
            the run time against microvm@openclaw's ActiveEnterTimestamp) and a
            timeout that is merely too short.

      # The OpenClaw-direction canary/probe stopped producing fresh metrics.
      - alert: OpenClawDiscordCanaryStale
        expr: time() - openclaw_discord_canary_last_run_timestamp_seconds > 2400
        # RETUNED 300s -> 900s interval, 2026-07-29. The old 1200s threshold was sized for a
        # 300s canary interval. The interval is now 900s (to cut Discord traffic from 1,152 to
        # 384 messages/day), which leaves 1200s only 5 minutes of grace -- a single delayed run
        # would have false-fired. 2400s tolerates one missed run with slack and still catches a
        # genuinely stopped canary.
        for: 10m
        labels:
          severity: warning
          category: monitoring
          service: openclaw
        annotations:
          summary: "OpenClaw Discord canary has not run in >20 minutes"
          description: |
            discord-canary-openclaw.timer has not produced fresh metrics in
            20 minutes, so the round-trip detector is blind. Check
            `systemctl status discord-canary-openclaw.timer` and the last
            invocation's journal.

      # B-floor signal — gateway HTTP /health probe failing.
      # The operator created #interconnect for this canary on the explicit condition that it
      # stays clean. Deleting the probe's OWN message needs no permission, but deleting the
      # TARGET bot's reply needs MANAGE_MESSAGES -- and cleanup used to fail SILENTLY, which
      # would have accumulated ~192 undeleted replies/day per direction with no signal. This
      # makes that condition enforceable rather than a promise.
      - alert: OpenClawDiscordCanaryNotCleaningUp
        expr: openclaw_discord_canary_cleanup_failed > 0
        for: 30m
        labels:
          severity: warning
          category: monitoring
          service: openclaw
        annotations:
          summary: "OpenClaw Discord canary cannot delete its probe messages"
          description: |
            The canary posted to #interconnect but could not delete {{ $value }} message(s),
            so the channel is accumulating. Almost certainly the bot lacks MANAGE_MESSAGES in
            that channel; without it the target's replies cannot be removed.
            Action: grant MANAGE_MESSAGES to both bots in #interconnect, or set
            services.discordCanary.probes.<n>.enable = false to stop the traffic.

      - alert: OpenClawHttpHealthDown
        # VM-uptime warmup gate: suppress for the first 600s after a (re)boot
        # so a still-initializing gateway HTTP listener does not trip a
        # self-heal restart of a healthy-but-warming VM. probe_success and the
        # canary metric share no labels, so the join is `on()`. Genuine boot
        # failures are still covered by OpenClawGatewayReadyStale (1800s gate)
        # and OpenClawMicroVMDown (systemd-failed, 2m).
        expr: |
          probe_success{probe="openclaw-health"} == 0
          and on() (time() - openclaw_microvm_active_enter_timestamp_seconds) > 600
        for: 1m
        labels:
          severity: critical
          category: availability
          service: openclaw
        annotations:
          summary: "OpenClaw HTTP /health probe failing for 1 minute"
          description: |
            blackbox_exporter cannot reach
            `https://openclaw.vulcan.lan/health`.  The microVM may be
            running but the gateway HTTP listener is wedged.

      # Watchdog for the self-heal daemon itself — if this dies, the
      # whole self-heal layer is offline.  Routes to a different
      # service label so it is NOT looped back to its own webhook.
      - alert: OpenClawSelfHealDown
        expr: |
          (time() - openclaw_self_heal_last_heartbeat_seconds) > 600
          or absent(openclaw_self_heal_last_heartbeat_seconds)
        for: 2m
        labels:
          severity: critical
          category: monitoring
          service: openclaw-self-heal
        annotations:
          summary: "openclaw-self-heal daemon hasn't heartbeat in >10 minutes"
          description: |
            The self-heal daemon is the watchdog; if it dies, nothing
            else will.  Investigate openclaw-self-heal.service on
            vulcan.

      # ─────────────────────────────────────────────────────────────────
      # mcporter / Home Assistant integration
      # ─────────────────────────────────────────────────────────────────
      # The HA MCP integration is the most fragile mcporter entry because
      # HA's /mcp_server/sse endpoint advertises OAuth metadata that
      # mcporter then tries to satisfy via RFC 7591 dynamic client
      # registration — which HA does not support.  We pin transport=http
      # against /api/mcp with a static long-lived access token; this
      # alert fires if anything in that chain breaks.
      - alert: OpenClawMcporterHaDown
        expr: openclaw_mcporter_ha_auth_ok == 0
        for: 5m
        labels:
          severity: critical
          category: integration
          service: openclaw
        annotations:
          summary: "OpenClaw HA MCP auth has been failing for 5 minutes"
          description: |
            HA's `/api/mcp` endpoint is rejecting the staged Bearer
            token, or the home-assistant entry in mcporter.json is
            structurally invalid.  Common causes: token revoked or
            rotated in HA UI without updating SOPS; preStart didn't
            re-inject the entry (mcporter.json reverted to SSE
            transport); HA mcp_server integration disabled.
            Check `openclaw_mcporter_server_ok{name="home-assistant"}`,
            `openclaw_mcporter_ha_token_present`,
            `openclaw_mcporter_ha_endpoint_reachable`.

      - alert: OpenClawMcporterServerStale
        expr: openclaw_mcporter_server_ok{name!="home-assistant"} == 0
        for: 15m
        labels:
          severity: warning
          category: integration
          service: openclaw
        annotations:
          summary: "OpenClaw mcporter entry {{ $labels.name }} structurally invalid for 15m"
          description: |
            The mcporter.json entry for `{{ $labels.name }}` is missing
            or malformed.  This usually means the openclaw service's
            preStart did not run (or did not finish) since the last
            microvm restart.  Manual fix:
            `sudo systemctl restart microvm@openclaw.service`.

      - alert: OpenClawMcporterCheckStale
        expr: |
          (time() - openclaw_mcporter_check_last_run_timestamp_seconds) > 1200
          or absent(openclaw_mcporter_check_last_run_timestamp_seconds)
        for: 10m
        labels:
          severity: warning
          category: monitoring
          service: openclaw
        annotations:
          summary: "openclaw-mcporter-check has not run in >20 minutes"
          description: |
            The mcporter health metric exporter (timer
            openclaw-mcporter-check.timer) is not firing or its script
            is failing.  Without it, `openclaw_mcporter_*` metrics go
            stale and the HaDown / ServerStale alerts cannot fire.
            Check `systemctl status openclaw-mcporter-check.service`.

      - alert: OpenClawConfigDrift
        expr: openclaw_config_drift_probe_up == 1 and (openclaw_config_drift_keys_added > 0 or openclaw_config_drift_keys_removed > 0)
        for: 24h
        labels:
          severity: warning
          category: monitoring
          service: openclaw
        annotations:
          summary: "OpenClaw config schema-drift detected for 24 hours"
          description: |
            The live openclaw.json key set (read from the guest VM) differs
            from the Nix-rendered template.  This usually means upstream
            openclaw bumped and added a new config key the template does
            not yet model — fields silently fall back to whatever Hermes-mcp
            and the guest preStart inject by default.
            Investigate: SSH into 10.99.0.2, jq the live config, diff against
            the in-store openclaw-config-template, decide whether to extend the
            template (modules/services/openclaw-config.nix) or update the
            committed snapshot (tests/openclaw/expected-keys.txt).
