groups:
  - name: hermes_availability
    interval: 60s
    rules:

      # The api_server platform inside Hermes Agent. If this is red,
      # Hermes itself is unreachable; restarting hermes-mcp will not
      # help. Self-heal at this layer means restarting microvm@hermes.
      #
      # The `hermes_vm_uptime_seconds > 600` gate excludes the ~8-min
      # post-restart warmup. hermes_api_server_ok probes /v1/capabilities
      # authenticated with a TIGHT 5s budget; that endpoint enumerates models
      # against the gateway/MLX backend, so it stays non-200 for ~8 min after
      # every microvm restart while the backend warms up (the api_server itself
      # BINDS in ~8s — binding was never the problem, and the 2026-05-31 4-vCPU
      # bump didn't change the warmup; reverted). Sampled every 5 min that
      # warmup was a ~10-min 0-plateau that a bare `for: 5m` read as down and
      # self-healed by restarting the VM — restarting the warmup: a self-
      # perpetuating loop (2026-05-24 cluster; reproduced on the 4-vCPU deploy).
      # Gating on VM uptime > 10 min ignores the warmup while a genuine outage
      # on an already-up VM still pages fast at `for: 5m`. `ignoring(__name__)`
      # is required: the two series differ only by __name__ (identical node
      # textfile labels otherwise). The gate fails OPEN (probe error puts the
      # start time a day in the past) so a uptime-probe failure never masks an
      # outage. The e2e probes (HermesAskFailing / HermesE2eChatFailing, 60s
      # budgets) tolerate warmup and stay green — independent fast detectors.
      #
      # Gate on `time() - hermes_vm_start_time_seconds`, NOT on the
      # hermes_vm_uptime_seconds gauge it replaced (2026-08-02). That gauge is a
      # SNAPSHOT written by a check that runs every 900s, so between runs it is
      # frozen at whatever it read — observed reporting 4.1s while the VM had
      # genuinely been up 13 minutes. Gating on a frozen value is a false-
      # NEGATIVE generator: a VM crash-looping faster than the 600s warmup would
      # be sampled inside its warmup window on every single run, so `> 600` would
      # never be true and this critical alert would be permanently blind in
      # exactly the scenario it exists to catch. The start timestamp is constant
      # between restarts, so the subtraction happens at QUERY time and is always
      # the true uptime. HermesVmRestartLooping below covers the crash-loop case
      # that this gate correctly (and necessarily) still suppresses.
      - alert: HermesApiServerDown
        expr: hermes_api_server_ok == 0 and ignoring(__name__) (time() - hermes_vm_start_time_seconds) > 600
        for: 5m
        labels:
          severity: critical
          category: availability
          service: hermes-agent
          self_heal_eligible: "true"
        annotations:
          summary: "Hermes api_server /v1/capabilities down for 5 minutes"
          description: |
            Hermes' OpenAI-compatible api_server platform is not
            answering on http://10.99.1.2:8080/v1/capabilities.
            Possible causes: microvm@hermes crashed; firewall rule
            regressed; API_SERVER_KEY missing or wrong;
            hermes-agent.service restarted but failed to bind the
            platform (see /var/lib/hermes/.hermes/logs/errors.log
            for "Refusing to start: binding to 0.0.0.0 requires
            API_SERVER_KEY").

      # The complement to HermesApiServerDown's warmup gate. That gate suppresses
      # while the VM is young, which is correct for a single restart but means a
      # VM that never STAYS up is never covered by it. Nothing else watched for
      # that, so a crash loop was a monitoring blind spot (found 2026-08-02).
      #
      # changes() over the start timestamp, not a restart counter: the health
      # check only samples every 900s, so a counter would undercount anyway, and
      # a changing start time is exactly the definition of "it rebooted". This
      # can only resolve ~4 restarts/hour — enough to distinguish a loop from a
      # deploy, which is all that is being asked of it.
      #
      # Threshold >3 over 2h (not >1) because deploys legitimately restart the
      # VM, sometimes two or three times in a working session — /etc/nixos/build
      # runs during a model-registry change did exactly that. Anything above
      # that is not a deploy pattern. The fail-open sentinel is a CONSTANT 0.0
      # precisely so a broken uptime probe cannot masquerade as churn here.
      - alert: HermesVmRestartLooping
        expr: changes(hermes_vm_start_time_seconds[2h]) > 3
        for: 10m
        labels:
          severity: warning
          category: availability
          service: hermes-agent
        annotations:
          summary: "microvm@hermes has restarted repeatedly in the last 2 hours"
          description: |
            The Hermes VM's boot timestamp changed more than 3 times in 2
            hours, which is a restart loop rather than a deploy. While the VM
            keeps restarting, HermesApiServerDown stays suppressed by its
            warmup gate, so this is the alert that will fire instead — treat it
            as the agent being effectively unavailable.
            Check: systemctl status microvm@hermes, journalctl -u
            microvm@hermes, and the guest's own logs under
            /var/lib/hermes/.hermes/logs/.

      # ---- Qdrant-backed persistent memory (2026-08-03) ----
      # Every rule below is gated on the VM being up long enough to have had a
      # chance, using `time() - hermes_vm_start_time_seconds` rather than the
      # snapshot gauge -- same reasoning as HermesApiServerDown above.
      #
      # The staleness of these metrics is already covered by
      # HermesHealthCheckStale (they ride the same textfile), so there is no
      # per-metric staleness rule here; adding one would double-notify.

      # Qdrant itself down, unreachable over the guest DNAT, or rejecting the
      # staged key. Critical: the agent silently loses persistent memory, and
      # the provider's own failure detail is DEBUG-only.
      - alert: HermesMemoryQdrantUnreachable
        expr: hermes_memory_qdrant_reachable == 0 and ignoring(__name__) (time() - hermes_vm_start_time_seconds) > 300
        for: 10m
        labels:
          severity: critical
          category: availability
          service: hermes-agent
        annotations:
          summary: "Hermes memory backend (Qdrant) is unreachable"
          description: |
            The Hermes health check could not read the Hermes memory collection
            from Qdrant on 127.0.0.1:6333. This covers three distinct faults
            that are one outage from the agent's side: qdrant.service down, the
            6333 guest DNAT broken, or the staged API key missing/rejected.
            Check: systemctl status qdrant, then
            /var/lib/microvms/hermes/secrets/qdrant-api-key (0400 hermes:hermes,
            staged by hermes-prepare-secrets).

      # Reachable Qdrant, absent collection. Distinct from the above on purpose:
      # this is "the provider never initialised" (or someone deleted the
      # collection), not "the store is gone".
      - alert: HermesMemoryCollectionMissing
        expr: hermes_memory_collection_present == 0 and hermes_memory_qdrant_reachable == 1 and ignoring(__name__) (time() - hermes_vm_start_time_seconds) > 900
        for: 15m
        labels:
          severity: warning
          category: availability
          service: hermes-agent
        annotations:
          summary: "Hermes memory collection is missing from Qdrant"
          description: |
            Qdrant is reachable but the Hermes memory collection does not exist.
            The provider creates it lazily on first use, so this is expected
            only until the agent's first session after a fresh deploy. If it
            persists, the provider is loading but failing before its first
            write -- check the agent log for
            "loaded but no provider instance found".

      # The upstream loader reports WHY a memory plugin failed to load only at
      # DEBUG; the single INFO line names no cause. This turns that near-silent
      # failure into a page. Fires on a RECENT failure rather than any historical
      # one so a fixed problem stops alerting on its own.
      # The second clause is load-bearing, not belt-and-braces: a failure age
      # alone says only "a failure happened recently", which stays true after
      # the problem is FIXED until the hour rolls past. Caught exactly that on
      # 2026-08-03 -- failure_age was 1551s from a load bug fixed minutes
      # earlier, while activation_age was 2.3s. Requiring the failure to be
      # NEWER than the last success makes the rule mean "the most recent
      # outcome was a failure", which is what it should have said, and lets a
      # fix clear the alert immediately instead of an hour later.
      - alert: HermesMemoryProviderLoadFailing
        expr: |
          hermes_memory_last_failure_timestamp_seconds > 0
          and (time() - hermes_memory_last_failure_timestamp_seconds) < 3600
          and ignoring(__name__) hermes_memory_last_failure_timestamp_seconds > hermes_memory_last_activation_timestamp_seconds
        for: 5m
        labels:
          severity: critical
          category: availability
          service: hermes-agent
        annotations:
          summary: "Hermes memory provider failed to load"
          description: |
            The agent logged a memory-provider load failure within the last
            hour, so Hermes is running WITHOUT persistent memory. The upstream
            loader logs the actual cause at DEBUG only -- known causes are a
            memory.provider value that does not match the plugin's directory
            name under ~/.hermes/plugins, and relative-import failure inside the
            plugin. See pkgs/hermes-qdrant-memory/__init__.py for the second one.

      # Guards against the failure this whole design is most exposed to: the
      # provider quietly not being used at all. If sessions are happening (the
      # e2e probe alone drives one every 15 min) but none of them activated a
      # memory provider for 6h, memory is effectively off.
      - alert: HermesMemoryProviderNotActivating
        expr: |
          (time() - hermes_memory_last_activation_timestamp_seconds) > 21600
          and ignoring(__name__) (time() - hermes_vm_start_time_seconds) > 21600
        for: 30m
        labels:
          severity: warning
          category: availability
          service: hermes-agent
        annotations:
          summary: "Hermes has not activated its memory provider in 6 hours"
          description: |
            No "Memory provider ... activated" line in the agent log for 6
            hours, on a VM that has been up at least that long. Sessions do
            occur at least every 15 minutes (the e2e chat probe), so this means
            the provider is no longer being selected -- most likely
            settings.memory.provider no longer matches the installed plugin
            directory. NOTE a 0 timestamp means "never seen in the retained
            log tail", which also trips this.

      # A large drop in stored points means memories were deleted -- a wiped
      # collection, an errant forget, or a restore over the top. `< -5` rather
      # than `< 0` because transparent-forget legitimately removes a few.
      # Guarded on points >= 0 so the -1 "could not determine" sentinel can
      # never be read as a catastrophic loss.
      - alert: HermesMemoryPointsDropped
        expr: hermes_memory_points >= 0 and delta(hermes_memory_points[1h]) < -5
        for: 5m
        labels:
          severity: warning
          category: data-integrity
          service: hermes-agent
        annotations:
          summary: "Hermes memory lost points in the last hour"
          description: |
            The Hermes memory collection shrank by more than 5 points in an
            hour. Expected after an intentional bulk forget or a collection
            recreate; otherwise investigate before the next Qdrant snapshot
            rotates, since ZFS snapshots of /var/lib/qdrant are the only way
            back.

      # ---- Local web extraction (2026-08-03) ----
      # Staleness of these rides HermesHealthCheckStale like the memory metrics,
      # so there is no per-metric staleness rule here.

      # The worker could not be invoked at all: store path collected, python env
      # broken, trafilatura import failing, or the JSON protocol changed. This is
      # a total loss of the agent's ability to read any web page, and unlike the
      # provider's own errors it is detectable without waiting for traffic.
      #
      # NOT gated on VM uptime, unlike the memory rules: the worker is a HOST
      # binary and its health has nothing to do with whether the guest is up.
      - alert: HermesExtractWorkerBroken
        expr: hermes_extract_worker_ok == 0
        for: 15m
        labels:
          severity: critical
          category: availability
          service: hermes-agent
        annotations:
          summary: "Hermes local extraction worker is not runnable"
          description: |
            The health check could not get a valid empty-batch response from the
            local extraction worker, so web_extract cannot work at all. The
            probe performs no network fetch, so this is the worker itself:
            check that the store path referenced by
            /var/lib/hermes/.hermes/plugins/nix-managed-hermes-local-extract-plugin/provider.py
            still exists (nix-collect-garbage after a generation was removed is
            the likely cause) and that it is executable.

      # Real traffic is failing even though the worker runs. Distinguishes
      # "extraction is broken" from "the worker is broken": this fires on network
      # egress loss, DNS failure, or every fetched page being JS-only.
      #
      # Requires the failure to be NEWER than the last success, for the same
      # reason as HermesMemoryProviderLoadFailing -- a recency-only test stays
      # true after the fault clears until the window rolls past.
      - alert: HermesExtractFailing
        expr: |
          hermes_extract_last_failure_timestamp_seconds > 0
          and (time() - hermes_extract_last_failure_timestamp_seconds) < 3600
          and ignoring(__name__) hermes_extract_last_failure_timestamp_seconds > hermes_extract_last_success_timestamp_seconds
        for: 10m
        labels:
          severity: warning
          category: availability
          service: hermes-agent
        annotations:
          summary: "Hermes web extraction is failing on real requests"
          description: |
            The agent's most recent extraction outcome was a batch in which ZERO
            urls succeeded, or a worker-level error, within the last hour --
            while the worker itself is runnable. Partial failures are ignored on
            purpose, so this is not one dead link. Likely causes: the guest lost
            outbound network, DNS is failing, or the pages being requested are
            JavaScript-only (which this extractor cannot render by design --
            see pkgs/hermes-local-extract/src/extract_worker.py).

      # The host-side bridge that OpenClaw talks to. If this fails
      # the openclaw-side mcporter cannot reach hermes regardless of
      # whether the upstream Hermes Agent is healthy.
      - alert: HermesMcpBridgeDown
        expr: hermes_mcp_sse_open_ok == 0
        for: 5m
        labels:
          severity: critical
          category: availability
          service: hermes-mcp
          self_heal_eligible: "true"
        annotations:
          summary: "hermes-mcp /sse not accepting connections for 5 minutes"
          description: |
            The host's hermes-mcp.service is not accepting new SSE
            connections on 127.0.0.1:9081. The systemd unit may be
            up but stuck; restarting hermes-mcp.service typically
            resolves this within a few seconds.

      # Discord WebSocket zombie detector — heartbeat-ACK based.
      # hermes_discord_last_event_age_seconds is the age of the most
      # recent proof of gateway liveness: primarily the discord.py
      # HEARTBEAT_ACK stamp (the in-VM sitecustomize shim writes it on
      # every ack, ~every 41s while the WS is healthy), falling back to
      # the gateway.log connect/message scrape. Heartbeats flow even
      # with zero message traffic, so this is independent of how idle
      # the server is — a stale value means acks have genuinely stopped
      # = the WS has zombied (TCP/REST may still look alive and Discord
      # still shows the bot online, but nothing propagates).
      #
      # Threshold history: started at 2h (gateway.log idleness), which
      # restarted the VM every ~2h16m on a quiet bot; raised to 24h
      # (2026-05-24), which merely paced the same idleness false-positive
      # to ~daily. Switched to the heartbeat-ACK signal (2026-05-28) and
      # dropped to 600s: a healthy WS keeps the metric < ~60s regardless
      # of traffic, and discord.py self-reconnects a missed-ack zombie
      # within its own ~60s heartbeat_timeout, so 600s sustained for 10m
      # means discord.py could NOT self-heal and a microvm restart is
      # warranted.
      - alert: HermesDiscordZombieSuspected
        expr: hermes_discord_last_event_age_seconds > 600
        for: 10m
        labels:
          severity: warning
          category: availability
          service: hermes-agent
          self_heal_eligible: "true"
        annotations:
          summary: "Hermes Discord gateway: no heartbeat-ACK for >10 min"
          description: |
            No Discord gateway HEARTBEAT_ACK (nor any gateway.log
            connect/message event) has been observed for 10+ minutes,
            sustained over the 10m window. A healthy WS acks ~every 41s
            and discord.py reconnects a missed-ack zombie within ~60s,
            so a sustained 10m+ gap means the gateway has zombied and
            discord.py did not self-recover. Restarting microvm@hermes
            re-establishes a clean WS session. (Heartbeat-based since
            2026-05-28 — no longer fires on an idle-but-healthy bot.)

      # Faster sibling of HermesDiscordZombieSuspected — fires after just
      # 5 min (vs 10m) when the self-heal daemon just restarted the microvm
      # but the fresh connection produced no heartbeat-ACK. A healthy WS
      # acks within ~41s of connecting, so a 600s+ liveness gap within 1h
      # of a self-heal restart is definitively a zombie that survived the
      # restart — escalate as critical. (Doesn't fire for manual user
      # restarts — those have no recent restart_microvm attempt.)
      - alert: HermesDiscordPostSelfHealRestart
        expr: |
          hermes_discord_last_event_age_seconds > 600
          and
          changes(hermes_self_heal_attempts_total{action="restart_microvm"}[1h]) > 0
        for: 5m
        labels:
          severity: critical
          category: availability
          service: hermes-agent
          self_heal_eligible: "true"
        annotations:
          summary: "Hermes Discord silent after self-heal restart — zombie WS"
          description: |
            The self-heal daemon restarted microvm@hermes within the last
            hour, but the Discord gateway has produced no HEARTBEAT-ACK
            (nor connect/message event) in 10+ minutes. A fresh WS
            connection acks within ~41s, so this is a zombie on top of
            the restart — another restart is needed.

      # NOTE: a block of commentary here described HermesDiscordCanaryDown -- its
      # warmup gate, its decorative self_heal_eligible label, the proven-green gate and
      # the time-since-last-success rewrite. That rule and its five siblings were REMOVED
      # 2026-07-31 with OpenClaw: the canary was inherently cross-agent (the two agents
      # probed each other) and cannot outlive the removal of one of them. The commentary
      # is dropped with it rather than left describing rules that no longer exist.
      #
      # Hermes' inbound Discord path is still watched, by HermesDiscordZombieSuspected
      # and HermesDiscordPostSelfHealRestart above, which key on heartbeat-ACK age rather
      # than on a round-trip. What is genuinely lost is proof that inbound
      # MESSAGE_CREATE -> reply DELIVERS end to end; the heartbeat proves only that the
      # gateway socket is alive. Accepted deliberately -- the canary never reached a clean
      # steady state, since @Claw's bot holds neither MANAGE_MESSAGES nor MANAGE_THREADS
      # in #interconnect and every successful round-trip left an undeletable reply behind.

      - alert: HermesHealthCheckStale
        expr: time() - hermes_health_check_last_run_timestamp_seconds > 900
        for: 5m
        labels:
          severity: warning
          category: monitoring
          service: hermes-mcp
        annotations:
          summary: "Hermes health check has not run in >15 minutes"
          description: |
            The hermes-health-check.timer has not produced fresh
            metrics in 15 minutes. Check `systemctl status
            hermes-health-check.timer` and the most recent
            invocation's journal.

      # API key plumbing regression.
      - alert: HermesApiKeyMissing
        expr: hermes_api_key_present == 0
        for: 5m
        labels:
          severity: critical
          category: configuration
          service: hermes-mcp
        annotations:
          summary: "API_SERVER_KEY not present in /run/secrets/hermes/env"
          description: |
            The SOPS-decrypted hermes env file is missing the
            API_SERVER_KEY field — every authenticated probe will
            fail. Check `sops-install-secrets.service` status and
            the `hermes:` block in secrets.yaml.

      # Direct liveness of the hera-side oMLX model backend — the terminal
      # upstream every gateway model request lands on, and thus the terminal
      # dependency of all Hermes chat. blackbox_hera_qwen GETs
      # https://hera.lan:8443/v1/models unauthenticated via the
      # https_2xx_or_auth module, so a healthy hera's 401 counts as success and
      # no key is needed. When this is 0 the model backend itself is down — this
      # is the CAUSE rule that isolates an oMLX outage from the generic
      # downstream HermesAskFailing / HermesE2eChatFailing symptoms (which
      # surface 2-3 hops later and cannot name the layer). It is a LIVENESS
      # signal only: "backend up but a model won't load" is caught by
      # HermesE2eChatFailing's content check, not here — a green MLXBackendDown
      # does NOT prove chat works.
      #
      # `and on() up{job="darwin-hera"} == 1` gates on hera being reachable at
      # all (probe_success and up share no labels, so on() does the intended
      # scalar conjunction — both are single series):
      #   - probe down + hera up   -> THIS fires: hera alive but llama-swap dead
      #                               (actionable — restart oMLX on hera).
      #   - probe down + hera down -> THIS stays silent; DNSServerDown /
      #                               LocalNetworkIssue / the darwin-hera host
      #                               rules own "hera unreachable".
      # hera is effectively 24/7 (avg_up_7d=0.9989), so NO sleep-window
      # suppression is needed. for: 8m: the longest contiguous darwin-hera gap in
      # 7d was a single ~11-min hera-DOWN block (2026-06-08 boot-work) — but the
      # gate suppresses MLXBackendDown for the entire hera-down window, so 8m only
      # has to outlast the brief recovery edge where node-exporter (:9100) returns
      # before oMLX (:8443) finishes warming. 8m clears that comfortably while
      # still surfacing a genuine oMLX outage well before Discord users do.
      # severity: warning (not critical) — the e2e/ask probes already page
      # critical for the user-visible symptom and self-heal cannot restart hera;
      # this rule is cause-isolation, not a new page path.
      # SELECTOR HISTORY. Widened 2026-08-01 to job=~"blackbox_hera_(mlx|qwen)" after this
      # rule sat green through a total outage of the chat backend: it watched only :8080
      # while the model Hermes uses lives behind :8443, so probe_success stayed 1 while
      # the (since-removed) e2e chat probe was red. NARROWED again 2026-08-03 to blackbox_hera_qwen alone,
      # because hera stopped running the :8080 llama-swap endpoint entirely -- that job then
      # probed a port nothing listens on and reported probe_success=0 forever, firing this
      # warning against a perfectly healthy backend. The :8080 job is deleted; :8443 is the
      # only endpoint the gateway proxies to (modules/services/hera-llm-proxy.nix).
      - alert: MLXBackendDown
        expr: probe_success{job="blackbox_hera_qwen"} == 0 and on() up{job="darwin-hera"} == 1
        for: 8m
        labels:
          severity: warning
          category: availability
          service: mlx-backend
        annotations:
          summary: "hera oMLX model backend down (Hermes chat terminal dependency)"
          description: |
            The oMLX model backend on hera (https://hera.lan:8443/v1/models)
            has not answered for 8 minutes WHILE hera itself is reachable
            (up{job="darwin-hera"}==1). This is the terminal upstream of every
            gateway model request, so Hermes Discord chat will fail until it
            recovers — expect HermesE2eChatFailing / HermesAskFailing /
            HermesFallbackChainTriggered to be firing alongside this as
            DOWNSTREAM symptoms; THIS rule names the root cause.

            The probe is UNAUTHENTICATED and uses the https_2xx_or_auth module,
            so a healthy hera answers 401 and that counts as success; a broken
            backend answers 502 before auth is evaluated. No API key is needed.

            This is a LIVENESS probe only — a clear MLXBackendDown does not
            guarantee a specific model can load (that is HermesE2eChatFailing's
            job). Note a COLD model can take ~60s to first token while the
            backend is perfectly healthy.

            Runbook (hera-side, manual — vulcan cannot ssh hera):
              1. On hera: confirm oMLX is alive and listening on :8443
                 (`curl -sk https://localhost:8443/v1/models` — 401 is healthy).
              2. Restart oMLX on hera; once it answers, this clears within one
                 scrape interval (the 8m for-window only delays the initial
                 fire, not the resolve).
              3. If hera itself is wedged (also see DNSServerDown /
                 LocalNetworkIssue for hera.lan), recover hera first — this rule
                 self-suppresses while hera is unreachable.

      # Fallback chain triggered — Hermes' agent loop hit a non-retryable
      # error (typically 401/403/404 from upstream) and tried a fallback
      # model. Counts unique occurrences in the errors.log; any positive
      # increase over 10 min means a user-visible chat error happened.
      - alert: HermesFallbackChainTriggered
        expr: increase(hermes_fallback_chain_triggered_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
          category: availability
          service: hermes-agent
        annotations:
          summary: "Hermes fallback chain triggered — primary chat path errored"
          description: |
            Hermes' conversation loop logged "Non-retryable client
            error" at least once in the last 10 min. The user saw
            the "⚠️ Non-retryable error (HTTP N) — trying fallback…"
            banner. Check `/var/lib/hermes/.hermes/logs/errors.log`
            for the failing base_url and HTTP code.

      # Freshness guard for the collector the rule above depends on.
      #
      # Added 2026-07-31 while retiring Nagios, which was the only watcher of this
      # collector's liveness. HermesFallbackChainTriggered uses increase(...[10m]) > 0, so a
      # DEAD collector reads exactly like a healthy system: the counter stops advancing,
      # increase() returns 0, and the alert can never fire again. That is silent blindness
      # rather than a visible failure, which is the whole reason this guard exists.
      #
      # service: hermes-collector (NOT hermes-*) so a dead collector is not routed to the
      # self-heal daemon, which cannot fix a stopped timer by restarting the agent.
      - alert: HermesFallbackCollectorStale
        expr: time() - hermes_fallback_counter_last_run_timestamp_seconds > 600
        for: 10m
        labels:
          severity: warning
          category: monitoring
          service: hermes-collector
        annotations:
          summary: "Hermes fallback counter collector is stale — HermesFallbackChainTriggered is blind"
          description: |
            hermes_fallback_counter_last_run_timestamp_seconds has not
            advanced in over 10 minutes. While this is firing,
            HermesFallbackChainTriggered CANNOT fire regardless of how
            many fallbacks occur, because increase() over a frozen
            counter is 0. Treat fallback-chain silence as unverified
            until this clears. Check the hermes fallback-counter
            oneshot/timer.

      # The self-heal daemon's own heartbeat. If the daemon dies, no
      # auto-remediation is happening — operator must intervene.
      # NOTE: service: hermes-self-heal (NOT hermes-*) so this alert
      # is not routed back to the daemon itself (which may be dead).
      - alert: HermesSelfHealDown
        expr: time() - hermes_self_heal_last_heartbeat_seconds > 600
        for: 5m
        labels:
          severity: warning
          category: monitoring
          service: hermes-self-heal
        annotations:
          summary: "hermes-self-heal daemon heartbeat stale (>10 min)"
          description: |
            The hermes-self-heal daemon stopped writing
            hermes_self_heal_last_heartbeat_seconds. Either the
            service crashed (check `systemctl status hermes-self-heal`)
            or the textfile collector cannot read its output.

      # SPLIT INTO TWO RULES, 2026-08-05. These were one alertname covering two
      # different conditions, with two producers: this rule (keyed on
      # in_progress) and a synthetic alert the daemon pushed straight to
      # Alertmanager when it marked an incident stuck. Different fingerprints, so
      # one stuck incident could notify twice, and the pushed copy could not
      # self-resolve -- it only aged out after a 4h TTL.
      #
      # The daemon's pushes are gone; Prometheus is the only producer now. That
      # required emitting a NEW gauge, because the in_progress gauge below never
      # covered the stuck case at all: an incident marked "stuck" is no longer
      # in_progress, so the push was genuinely the only signal for it. Removing
      # the push without adding hermes_self_heal_stuck_incidents would have
      # silently deleted the alert rather than deduplicated it.

      # The daemon has GIVEN UP: three attempts exhausted, the AI tier said
      # escalate, or the circuit breaker refused to act. Human action required.
      # Self-resolves when the incident resolves or ages out of the active map.
      - alert: HermesSelfHealStuck
        expr: hermes_self_heal_stuck_incidents > 0
        for: 5m
        labels:
          severity: critical
          category: availability
          service: hermes-self-heal
        annotations:
          summary: "Hermes self-heal has given up on an incident"
          description: |
            The daemon marked one or more incidents stuck — it will take no
            further automatic action on them. Inspect
            /var/lib/hermes-self-heal/incidents.json for `stuck_reason`
            (escalate / circuit_breaker) and recent journal output, then decide
            on a manual action.

      # Remediation is still RUNNING but has not succeeded in 30 minutes. Distinct
      # from the above: the daemon has not given up here, it is still trying.
      - alert: HermesSelfHealIncidentUnresolved
        expr: hermes_self_heal_active_incidents > 0
        for: 30m
        labels:
          severity: warning
          category: availability
          service: hermes-self-heal
        annotations:
          summary: "Hermes self-heal incident open for >30 minutes"
          description: |
            An incident has been in_progress for over half an hour without
            resolving or being marked stuck. Inspect
            /var/lib/hermes-self-heal/incidents.json and recent journal output.
            If it has stopped making attempts, HermesSelfHealStuck is the alert
            to expect instead.

      # Track how often the AI tier was unreachable. >3/hour suggests
      # the LLM gateway is down and the daemon is degraded to deterministic-only.
      - alert: HermesSelfHealGatewayUnreachable
        expr: increase(hermes_self_heal_gateway_unreachable_total[1h]) > 3
        for: 5m
        labels:
          severity: warning
          category: monitoring
          service: hermes-self-heal
        annotations:
          summary: ">3 LLM gateway unreachable events in last hour for hermes self-heal"
          description: |
            The daemon attempted to escalate to the AI tier multiple
            times and could not reach the LLM gateway. Verify
            `systemctl status nginx` and that the gateway answers
            `curl -s http://127.0.0.1:4000/v1/models`.
