groups:
  - name: zimit
    interval: 60s
    rules:
      # New Zimit crawl/archive job failed.
      #
      # zimit_jobs_failed is a cumulative gauge (NOT a Prometheus _total
      # counter): it sits at a plateau and is mostly monotonic, but it CAN
      # decrease when old jobs are purged (observed 5 -> 4 on 2026-05-26).
      # Therefore a bare `> 0` would fire chronically (baseline has been 4-5
      # for 30+ days) and `increase()` would misread the purge as a counter
      # reset. delta() over the window correctly detects a NET RISE (a new
      # failure) and is negative/zero otherwise. Baseline delta = 0.
      - alert: ZimitJobsFailed
        expr: |
          delta(zimit_jobs_failed{job="zimit"}[6h]) > 0
        for: 5m
        labels:
          severity: warning
          service: zimit
        annotations:
          summary: "Zimit archive job(s) failed"
          description: |
            {{ $value }} Zimit archive job(s) failed in the last 6 hours on {{ $labels.instance }}.

            Check the Zimit dashboard / logs for the failing crawl.
            Inspect service: systemctl status zimit
            View logs: journalctl -u zimit --since "6 hours ago"

      # Pending Zimit jobs not draining — stuck queue.
      #
      # zimit_jobs_pending has been flat at 0 for the whole observed window, so
      # `> 0 for 24h` only fires if a queued job has genuinely failed to start
      # / complete for a full day (a worker stall or stuck crawl), not for a
      # normal in-flight job.
      - alert: ZimitJobsStuck
        expr: |
          zimit_jobs_pending{job="zimit"} > 0
        for: 24h
        labels:
          severity: warning
          service: zimit
        annotations:
          summary: "Zimit has jobs stuck pending"
          description: |
            Zimit has {{ $value }} job(s) pending for over 24 hours on {{ $labels.instance }}.
            The crawl worker may be stalled or a job may be wedged.

            Inspect service: systemctl status zimit
            Check running jobs: zimit_jobs_running gauge
            View logs: journalctl -u zimit --since "24 hours ago"

      # A crawl that HANGS WHILE RUNNING — the gap ZimitJobsStuck cannot see.
      #
      # ZimitJobsStuck watches zimit_jobs_pending, i.e. a queue that will not drain;
      # a hung RUNNING job has pending=0 and running=1, so it is invisible there.
      # ServiceStuckActivating cannot cover it either: zimit-job-runner is a oneshot
      # that sits in `activating` for the whole crawl, so it fired on every normal
      # run and was excluded (alerts/systemd.yaml).
      #
      # DURATION IS NOT A USABLE SIGNAL and was deliberately not used: across 22
      # completed jobs legitimate crawls ran from 26 MINUTES to 43 DAYS, and
      # TimeoutStartSec is already 4w2d. No duration threshold separates healthy
      # from hung. PROGRESS does. The runner tees crawl output to
      # $WORK_DIR/<job_id>/zimit.log, whose mtime advances while pages are being
      # fetched and stops dead when the crawl wedges; the web UI exports that as
      # zimit_running_job_log_age_seconds, emitted ONLY for running jobs, so this
      # rule cannot fire against an idle host.
      #
      # THRESHOLD SIZED BY REPLAY over three real crawl logs, not guessed — and the
      # first sample alone would have been badly wrong:
      #   a03d993b (live, 14,483 lines)   median 0.17s   max   7.8s
      #   9c70095e (109,127 lines)        median 0.11s   max  89.9s
      #   1d03bff6 (549,120 lines)        median 0.02s   max 180.0s
      # The 89.9s and 180.0s maxima recur as EXACT repeated values, which is the
      # fingerprint of browsertrix page timeouts rather than random stalls — so a
      # healthy crawl genuinely goes three minutes without writing. 1800s is 10x the
      # worst observed gap across ~673,000 log lines, which leaves room for a longer
      # timeout on some future site while still catching a hang within the half hour
      # rather than never.
      - alert: ZimitCrawlStalled
        expr: zimit_running_job_log_age_seconds > 1800
        for: 5m
        labels:
          severity: warning
          category: logs
          service: zimit
        annotations:
          summary: "Zimit crawl {{ $labels.name }} has stopped making progress"
          description: |
            The running Zimit job `{{ $labels.name }}` ({{ $labels.job_id }}) has not
            written to its crawl log for {{ $value | humanizeDuration }}. Healthy
            crawls write continuously — the longest gap observed across three real
            crawl logs was 180s, and that was a page timeout.

            The job will NOT fail on its own: TimeoutStartSec is 4w2d, so a wedged
            crawl can occupy the runner for a month and block every queued job behind
            it.

            Look at what it was doing last:
              sudo tail -20 /tank/Archives/work/{{ $labels.job_id }}/zimit.log
              sudo podman ps --filter ancestor=localhost/zimit:arm64

            If it is genuinely wedged, stopping zimit-job-runner releases the queue;
            zimit-progress-monitor will then mark the job failed as "Orphaned".
