groups:
  - name: application_service_alerts
    interval: 60s
    rules:
      # Node-RED Automation Alerts
      - alert: NodeRedDown
        expr: up{job="node-red"} == 0
        for: 3m
        labels:
          severity: warning
          category: automation
          service: node-red
        annotations:
          summary: "Node-RED automation service is unreachable"
          description: "Node-RED metrics endpoint has been unreachable for more than 3 minutes. Automation flows may not be running."

      # NodeRedServiceFailed deleted 2026-07-29: strict subset of SystemdServiceFailed
      # (systemd.yaml, for=60s, no exclusion list); NodeRedDown above carries the impact.

      # ---------------------------------------------------------------------
      # vdirsyncer contact/calendar sync.
      #
      # CONSOLIDATED HERE 2026-07-29. These rules previously existed in TWO places: this
      # file and modules/services/vdirsyncer-alerts.nix, which built its own rule file
      # with pkgs.writeText and registered it via services.prometheus.ruleFiles. That was
      # a second, parallel mechanism for something this repo otherwise does one way --
      # 469 of 524 rules are plain YAML under modules/monitoring/alerts/, auto-discovered.
      # The .nix file needed no Nix at all (its only interpolation was the writeText
      # wrapper itself), so it was deleted rather than kept in sync.
      #
      # The split had produced three duplicate pairs, each defining the SAME condition
      # twice at DIFFERENT severities, so one failure notified twice and reached both the
      # iPhone and the email path:
      #   VdirsyncerSyncUnhealthy      identical expr, warning here vs critical there
      #   VdirsyncerSyncStale          identical expr AND dwell as its
      #                                VdirsyncerNotSyncingCritical twin
      #   VdirsyncerStatusServiceDown  overlapped VdirsyncerStatusDashboardDown
      # Also dropped: VdirsyncerNotSyncing (> 1800s), a same-severity second threshold on
      # the same metric as VdirsyncerSyncStale. A warning ladder whose rungs share a
      # severity is just a duplicate notification.
      # ---------------------------------------------------------------------
      - alert: VdirsyncerSyncStale
        expr: (time() - vdirsyncer_last_sync_timestamp) > 3600
        for: 5m
        labels:
          severity: warning
          category: sync
          service: vdirsyncer
        annotations:
          summary: "vdirsyncer {{ $labels.pair }} hasn't synced in over 1 hour"
          description: "Sync pair {{ $labels.pair }} last synced {{ $value | humanizeDuration }} ago (expected: every 15 minutes). Contacts/calendars may be out of sync."

      # Severity is WARNING by operator decision 2026-07-29. The duplicate that lived in
      # vdirsyncer-alerts.nix graded this critical; a sync falling behind is not a
      # wake-someone event, and the critical twin also paged the iPhone.
      - alert: VdirsyncerSyncUnhealthy
        expr: vdirsyncer_sync_healthy == 0
        for: 10m
        labels:
          severity: warning
          category: sync
          service: vdirsyncer
        annotations:
          summary: "vdirsyncer {{ $labels.pair }} sync is unhealthy"
          description: "Sync pair {{ $labels.pair }} has reported unhealthy for over 10 minutes. Check the dashboard at https://vdirsyncer.vulcan.lan or `journalctl -u vdirsyncer.service -f`."

      # Stays CRITICAL, unlike the two above, because it is a different failure: not
      # "sync is behind" but "nothing is configured to sync at all", which does not
      # self-heal and usually means discovery or authentication broke.
      - alert: VdirsyncerNoCollections
        expr: vdirsyncer_collections_total == 0
        for: 15m
        labels:
          severity: critical
          category: sync
          service: vdirsyncer
        annotations:
          summary: "vdirsyncer has no collections configured"
          description: "No collections are being synced. Likely a discovery or authentication problem. Troubleshoot with `sudo -u vdirsyncer vdirsyncer --config /etc/vdirsyncer/config discover`."

      # Kept in preference to the former VdirsyncerStatusDashboardDown, which watched
      # node_systemd_unit_state for vdirsyncer-status.service. `up` on the exporter that
      # unit serves (localhost:8089) is the stronger signal: it also catches a process
      # that is active but hung, which a unit-state check cannot see.
      - alert: VdirsyncerStatusServiceDown
        expr: up{job="vdirsyncer"} == 0
        for: 5m
        labels:
          severity: warning
          category: sync
          service: vdirsyncer
        annotations:
          summary: "vdirsyncer status service is down"
          description: "The vdirsyncer status dashboard and metrics exporter is not responding. Check with `systemctl status vdirsyncer-status.service`."

      - alert: MosquittoServiceDown
        expr: |
          node_systemd_unit_state{
            name="mosquitto.service",
            state="active"
          } == 0
        for: 2m
        labels:
          severity: critical
          category: iot
          service: mosquitto
        annotations:
          summary: "Mosquitto MQTT broker is down"
          description: "Mosquitto service is not active. IoT device communication is unavailable."

      # MosquittoServiceFailed deleted 2026-07-29: strict subset of SystemdServiceFailed
      # (systemd.yaml, for=60s, no exclusion list); MosquittoServiceDown above carries the impact.

      # Samba File Sharing Alerts
      - alert: SambaSMBDDown
        expr: |
          node_systemd_unit_state{
            name="samba-smbd.service",
            state="active"
          } == 0
        for: 2m
        labels:
          severity: critical
          category: fileserver
          service: samba
        annotations:
          summary: "Samba SMB daemon is down"
          description: "Samba SMB daemon is not active. File sharing is unavailable."

      - alert: SambaNMBDDown
        expr: |
          node_systemd_unit_state{
            name="samba-nmbd.service",
            state="active"
          } == 0
        for: 2m
        labels:
          severity: warning
          category: fileserver
          service: samba
        annotations:
          summary: "Samba NetBIOS daemon is down"
          description: "Samba NetBIOS name server is not active. Network browsing may be affected."

      - alert: SambaWinbindDown
        expr: |
          node_systemd_unit_state{
            name="samba-winbindd.service",
            state="active"
          } == 0
        for: 2m
        labels:
          severity: warning
          category: fileserver
          service: samba
        annotations:
          summary: "Samba Winbind daemon is down"
          description: "Samba Winbind daemon is not active. Domain integration may be affected."

      # Radicale CalDAV/CardDAV Alerts
      - alert: RadicaleServiceDown
        expr: |
          node_systemd_unit_state{
            name="radicale.service",
            state="active"
          } == 0
        for: 2m
        labels:
          severity: critical
          category: groupware
          service: radicale
        annotations:
          summary: "Radicale CalDAV/CardDAV server is down"
          description: "Radicale service is not active. Calendar and contact sync is unavailable."

      # RadicaleServiceFailed deleted 2026-07-29: strict subset of SystemdServiceFailed
      # (systemd.yaml, for=60s, no exclusion list); RadicaleServiceDown above carries the impact.

      # Glance Dashboard Alerts
      - alert: GlanceServiceDown
        expr: |
          node_systemd_unit_state{
            name="glance.service",
            state="active"
          } == 0
        for: 5m
        labels:
          severity: warning
          category: monitoring
          service: glance
        annotations:
          summary: "Glance dashboard service is down"
          description: "Glance dashboard service is not active. Main dashboard is unavailable."

      - alert: GlanceGitHubExtensionDown
        expr: |
          node_systemd_unit_state{
            name="glance-github-extension.service",
            state="active"
          } == 0
        for: 5m
        labels:
          severity: warning
          category: monitoring
          service: glance
        annotations:
          summary: "Glance GitHub extension is down"
          description: "Glance GitHub extension service is not active. GitHub notifications widget unavailable."

      # Glances System Monitoring Alerts
      - alert: GlancesServiceDown
        expr: |
          node_systemd_unit_state{
            name="glances.service",
            state="active"
          } == 0
        for: 5m
        labels:
          severity: warning
          category: monitoring
          service: glances
        annotations:
          summary: "Glances system monitor is down"
          description: "Glances service is not active. Real-time system monitoring unavailable."

      # Cockpit Web Console Alerts
