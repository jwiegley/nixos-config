groups:
  - name: container_health
    interval: 30s
    rules:
      # Only fires on health=1 (unhealthy). health=3 (no healthcheck configured,
      # the common case) and health=2 (starting) are intentionally excluded.
      # As of 2026-06-10 only budget-board-{client,server} expose a real healthcheck.
      - alert: ContainerUnhealthy
        expr: container_health_status{name!=""} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is unhealthy"
          description: "Container {{ $labels.name }} has been failing its health check for 5 minutes"

      # Generic catch-all: any tracked container (rootless or root) stopped for 5m.
      # No exclusions needed — every container the exporter tracks is a long-running
      # quadlet service; transient/on-demand containers (e.g. zimit archive jobs)
      # carry no PODMAN_SYSTEMD_UNIT label and are not tracked. Per-service rules
      # (OpenWebUIContainerDown, ShlinkContainerDown) add service-specific context
      # on top of this backstop.
      - alert: ContainerDown
        expr: container_running{name!=""} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} is not running"
          description: "Container {{ $labels.name }} has been stopped for 5 minutes"

      - alert: ContainerRestarting
        expr: rate(container_restart_count[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is restarting frequently"
          description: "Container {{ $labels.name }} has restarted {{ $value }} times in the last 5 minutes"

      - alert: ContainerHealthCheckFailing
        expr: container_health_status{name!=""} == 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} health check stuck in starting state"
          description: "Container {{ $labels.name }} has been in 'starting' health state for 5 minutes"

      # Per-user podman store disk usage (container_store_size_bytes, daily textfile).
      # Reference incident: one rootless service accumulated 48G of dangling <none> images from
      # moving-tag pulls; the weekly per-user `podman image prune -af` keeps stores
      # small (largest is ~7G as of 2026-06-10). A store >60G means prune is not
      # keeping up (or a runaway pull) and warrants a manual `podman image prune -af`.
      - alert: ContainerStoreSizeHigh
        expr: container_store_size_bytes > 60 * 1024 * 1024 * 1024
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Container store for {{ $labels.user }} is {{ $value | humanize1024 }}B"
          description: "Podman store /var/lib/containers/{{ $labels.user }} exceeds 60GB — likely dangling-image bloat; run `podman image prune -af` for that user"

      # Per-container CPU saturation (container_cpu_percent from podman stats CPUPerc,
      # 100 == one full core). Baseline (2026-06-10) is 0–1% across all containers, so
      # >90% sustained for 30m is a genuinely stuck/runaway container, not noise. A
      # multi-vCPU container can exceed 100 legitimately; 90 is a per-core floor that
      # only an actually-pegged single core reaches, so this is conservative.
      - alert: ContainerCPUSaturated
        expr: container_cpu_percent{name!=""} > 90
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} CPU at {{ $value | printf \"%.0f\" }}%"
          description: "Container {{ $labels.name }} (user {{ $labels.user }}) has held CPU above 90% for 30 minutes — likely a stuck/runaway workload"

      # Rootless weekly image-prune freshness. The timer runs weekly
      # (rootless-podman-image-prune.nix); >9d since last trigger means a missed
      # window (cadence + slack). container_image_prune_last_trigger_seconds is only
      # emitted for users whose timer exists AND has fired at least once, so a
      # never-fired timer shows up as absent — caught by ContainerPruneMissing below.
      - alert: ContainerPruneStale
        expr: time() - container_image_prune_last_trigger_seconds > 9 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Rootless image-prune for {{ $labels.user }} is stale"
          description: "podman-image-prune.timer for user {{ $labels.user }} last fired {{ $value | humanizeDuration }} ago (weekly cadence) — dangling images may be accumulating"

      # The absent arm the comment above promised. Until 2026-08-20 it did not
      # exist: grepping this file for "absent" matched exactly ONE line -- the
      # comment claiming the rule was here. ContainerPruneStale is a
      # time()-since-last-fire test and by construction cannot fire on a series that
      # never appeared, so a rootless user added without the prune module was
      # completely unmonitored.
      #
      # Why not literal absent(): absent() returns 1 only when a selector matches
      # NOTHING at all, so it cannot find one missing user among ten. The set
      # difference is the right operator.
      #
      # SCOPED ON container_running, NOT container_store_size_bytes, and that is
      # load-bearing. Keying on the store metric was tried first and produced two
      # false positives: `root`, whose images are pruned by
      # virtualisation.podman.autoPrune rather than a per-user timer; and
      # `technitium-dns-exporter`, which has a /var/lib/containers home but runs its
      # container as a SYSTEM container -- its module header says so, because it uses
      # a locally-built image that cannot be shared into a rootless store, and its
      # directory is 376K of home rather than a populated overlay. Keying on
      # container_running{user!="root"} asks the question that actually matters: who
      # runs rootless containers, and does each have a pruner.
      #
      # Verified 2026-08-20: scans 10 rootless users, returns 0 gaps. Preventive by
      # design -- it exists to catch the documented CONTAINER_USERS/ROOTLESS_USERS
      # drift where a user is added to one list and not the other.
      - alert: ContainerPruneMissing
        expr: |
          count by (user) (container_running{user!="root"})
          unless on(user) container_image_prune_last_trigger_seconds
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Rootless user {{ $labels.user }} has containers but no image-prune timer"
          description: |
            User `{{ $labels.user }}` is running rootless containers but reports no
            container_image_prune_last_trigger_seconds, so its overlay store is never
            pruned and grows without bound. ContainerPruneStale cannot see this — it
            measures the age of a timestamp that does not exist.

            Usual cause: the user was added to the container/quadlet list but not to
            home-manager.users, so it never received
            modules/users/home-manager/rootless-podman-image-prune.nix. That timer is
            a `systemd --user` unit inside the user's own manager.

            Check:
              sudo -u {{ $labels.user }} XDG_RUNTIME_DIR=/run/user/$(id -u {{ $labels.user }}) \
                systemctl --user list-timers podman-image-prune.timer

            Fix this BEFORE the account is ever removed. Deleting a rootless user
            deletes its pruner with it, and the orphaned store then cannot be
            reclaimed by any scheduled job — which is exactly how the removed litellm
            user left 2.73 GiB behind under an unresolvable uid.

      # The prune unit's last run reported a non-success Result (failed/timeout/
      # exit-code). 0 == success; only ==1 fires.
      - alert: ContainerPruneFailed
        expr: container_image_prune_failed == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rootless image-prune failed for {{ $labels.user }}"
          description: "podman-image-prune.service for user {{ $labels.user }} last run did not succeed — check `systemctl --user -M {{ $labels.user }}@ status podman-image-prune.service`"

      # MatterServerDown — stronger than the generic ContainerDown (warning→critical,
      # 5m→3m). The matter-server container is the Matter fabric controller; when it
      # dies every Home Assistant Matter device (plugs, purifier, etc.) goes
      # unavailable, silently breaking presence/HVAC flows. matter-server runs as a
      # root podman container, so user="root".
      - alert: MatterServerDown
        expr: container_running{name="matter-server"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Matter server container is down"
          description: "matter-server container has been stopped for 3 minutes — all Home Assistant Matter devices are unavailable until it recovers"

      # Moving-tag image drift (container-image-staleness-exporter.nix, daily
      # textfile). container_image_outdated_since_days is computed in the
      # collector from a persisted first-seen-outdated timestamp, so it spans
      # days without a restart-fragile Prometheus `for:`. The nightly
      # update-containers pull normally re-aligns a drifted image within ~24h, so
      # >30 days outdated means that pull has demonstrably failed to advance this
      # image for a month — a periodic-refresh nudge, deliberately NOT a critical.
      # 30d (not 7d) keeps this from nagging on briefly-stale images that the
      # next nightly pull fixes. There is intentionally NO alert on
      # container_image_local_age_days (a project pausing upstream releases is not
      # actionable here) — that gauge is for Grafana/manual review only.
      - alert: ContainerImageOutdated
        expr: container_image_outdated_since_days > 30
        for: 1h
        labels:
          severity: warning
          category: containers
        annotations:
          summary: "{{ $labels.name }} image behind upstream {{ $labels.image }} for >30d"
          description: "Running arch digest of {{ $labels.name }} ({{ $labels.image }}) has differed from its moving tag for {{ $value | printf \"%.0f\" }} days — the nightly update-containers pull is likely failing for this image; check `journalctl -u update-containers` and `podman pull {{ $labels.image }}`"

      # Collector dead-man. Daily timer + 30m jitter + slack -> >36h means the
      # staleness sweep has not completed (timer wedged or the oneshot is
      # failing). Drift detection is blind until it recovers.
      - alert: ContainerImageStalenessCheckStale
        expr: time() - image_staleness_scan_last_success_timestamp_seconds > 36 * 3600
        for: 1h
        labels:
          severity: warning
          category: containers
        annotations:
          summary: "Container image-staleness collector has not run in >36h"
          description: "image_staleness_scan_last_success_timestamp_seconds is >36h stale — check `systemctl status container-image-staleness-exporter`; drift detection is blind until it recovers"

      # Persistent inability to reach a registry to check one image. A single
      # daily failure is noise (anonymous rate-limit / transient DNS); 3d of
      # consecutive failures is a real pattern (registry outage, image renamed
      # upstream, or a moving tag that 404s). image_staleness_scan_failed is
      # re-emitted every run, so `for: 3d` requires it to stay 1 across runs.
      - alert: ContainerImageCheckFailing
        expr: image_staleness_scan_failed == 1
        for: 3d
        labels:
          severity: warning
          category: containers
        annotations:
          summary: "Cannot reach registry to check {{ $labels.image }} for 3d"
          description: "skopeo could not fetch the upstream manifest for {{ $labels.name }} ({{ $labels.image }}) for 3 days — registry outage, anonymous rate-limit, or the moving tag no longer exists upstream"
