groups:
  - name: email_service_alerts
    interval: 60s
    rules:
      # Dovecot IMAP Server Alerts
      - alert: DovecotDown
        expr: up{job="dovecot"} == 0
        for: 2m
        labels:
          severity: critical
          category: email
          service: dovecot
        annotations:
          summary: "Dovecot IMAP server is down"
          description: "Dovecot IMAP server has been unreachable for more than 2 minutes. Email access is unavailable."

      # The entire Dovecot alert family (DovecotDown, DovecotAuthenticationFailures,
      # DovecotNoRecentActivity, dovecot_user_*) rides a SINGLE exporter that reads
      # the old_stats unix socket. If that exporter or the old_stats fifo wedges,
      # dovecot_up disappears (the target stops being scraped) and every dovecot_*
      # series goes silently absent rather than flipping to 0 — so the family quietly
      # goes blind with no signal. This is the single-point-of-failure backstop:
      # absent(dovecot_up) fires when the exporter target produces no dovecot_up
      # sample at all. Baseline 2026-06-10: dovecot_up present (=1), absent() empty,
      # so this does not fire on deploy. up{job="dovecot"} is the scrape-liveness of
      # the same target; this catches the case where the target is up but the metric
      # vanishes. NOTE: liveness of the IMAPS:993 listener itself, independent of this
      # exporter, would need a separate blackbox tcp probe (not added here).
      - alert: DovecotExporterStale
        expr: absent(dovecot_up) == 1
        for: 15m
        labels:
          severity: warning
          category: email
          service: dovecot
        annotations:
          summary: "Dovecot stats exporter is not reporting"
          description: "dovecot_up has been absent for more than 15 minutes. The entire Dovecot alert family rides this one old_stats-socket exporter, so its absence means all dovecot_* signals are blind (not 0 — gone). Check the dovecot exporter and the old_stats socket: systemctl status prometheus-dovecot-exporter; the alerts that depend on this are currently silent."

      - alert: DovecotAuthenticationFailures
        expr: sum(rate(dovecot_user_auth_failures[5m])) > 5
        for: 5m
        labels:
          severity: warning
          category: email
          service: dovecot
        annotations:
          summary: "High Dovecot authentication failure rate"
          description: "Dovecot is experiencing {{ $value | humanize }} authentication failures per second over the last 5 minutes. Possible brute force attack."

      # ── RETIRED: DovecotHighConnectionCount (consciously closed, do not re-add) ──
      # Intent: alert when concurrent IMAP connections spike. CLOSED PERMANENTLY
      # 2026-06-10, NOT deferred. The dovecot Prometheus exporter (:9166,
      # job="dovecot") exposes only dovecot_user_* auth/IO/cache counters — there
      # is NO concurrent-connection gauge to alert against (the rule was deleted in
      # the 2026-06-09 dead-metric sweep for exactly this reason). vulcan is a
      # single-user mail server with mail_max_userip_connections = 100 for the LAN
      # (dovecot.nix:319), so a connection-count alert would guard a load profile
      # that cannot occur. Reviving it would require a bespoke exporter scraping
      # `doveadm who`/proc for a metric of zero operational value here. Liveness is
      # already covered by up{job="dovecot"}, DovecotExporterStale (absent(dovecot_up)),
      # and the IMAPS blackbox probe. See docs/MONITORING_COVERAGE_PLAN.md and
      # docs/MONITORING_DEFERRED_SPECS.md (#email-fts-staleness).
      #
      # FTS (full-text search) index-staleness coverage — the genuine correctness
      # gap in this stack — is monitored separately: a daily textfile collector
      # emits fts_index_lag_seconds{user} and the FtsIndexStale / FtsIndexSeverelyStale
      # / FtsStalenessCheckStale rules live INLINE in
      # modules/services/dovecot-fts-monitor.nix (not this file), so they are NOT
      # duplicated here.

      # Postfix Mail Server Alerts
      - alert: PostfixDown
        expr: up{job="postfix"} == 0
        for: 2m
        labels:
          severity: critical
          category: email
          service: postfix
        annotations:
          summary: "Postfix mail server is down"
          description: "Postfix mail server exporter has been unreachable for more than 2 minutes. Mail delivery may be affected."

      - alert: PostfixMailQueueHigh
        expr: sum(postfix_showq_queue_depth) > 100
        for: 10m
        labels:
          severity: warning
          category: email
          service: postfix
        annotations:
          summary: "Postfix mail queue is growing"
          description: "Postfix has {{ $value }} messages in queue (threshold: 100). Mail delivery may be delayed."

      - alert: PostfixMailQueueCritical
        expr: sum(postfix_showq_queue_depth) > 500
        for: 5m
        labels:
          severity: critical
          category: email
          service: postfix
        annotations:
          summary: "Postfix mail queue is critically high"
          description: "Postfix has {{ $value }} messages in queue (threshold: 500). Immediate attention required."

      - alert: PostfixBouncesHigh
        expr: rate(postfix_bounce_non_delivery_notification_total[15m]) > 0.1
        for: 10m
        labels:
          severity: warning
          category: email
          service: postfix
        annotations:
          summary: "High email bounce rate detected"
          description: "Postfix is experiencing {{ $value | humanizePercentage }} bounce rate over the last 15 minutes."

      - alert: PostfixDeferralsHigh
        expr: rate(postfix_smtp_deferred_messages_total[15m]) > 0.2
        for: 10m
        labels:
          severity: warning
          category: email
          service: postfix
        annotations:
          summary: "High email deferral rate detected"
          description: "Postfix is deferring {{ $value | humanizePercentage }} of outbound messages. Check connectivity to remote servers."

      # Slow-burn complement to PostfixDeferralsHigh (which is a fast rate spike,
      # >0.2/s). A steady trickle of deferrals (e.g. 1/min = 0.017/s) never trips
      # the rate rule but accumulates toward 60/hr. This catches the
      # Schwab-token-style "works until it doesn't" failure where the upstream
      # relay (Fastmail/Gmail :587) starts rejecting or throttling our outbound
      # mail (auth expiry, reputation hit). Baseline on this host is 0 over 7d, so
      # >50/hr is a wide margin.
      - alert: PostfixDeferralsSustained
        expr: increase(postfix_smtp_deferred_messages_total[1h]) > 50
        for: 15m
        labels:
          severity: warning
          category: email
          service: postfix
        annotations:
          summary: "Sustained outbound mail deferrals"
          description: "Postfix has deferred {{ $value }} outbound messages in the last hour (threshold 50). The upstream relay (Fastmail/Gmail :587) may be rejecting, throttling, or refusing auth — outbound mail is silently piling up."

      - alert: PostfixRejectsHigh
        expr: rate(postfix_cleanup_messages_rejected_total[15m]) > 1
        for: 10m
        labels:
          severity: warning
          category: email
          service: postfix
        annotations:
          summary: "High email rejection rate"
          description: "Postfix is rejecting {{ $value }} messages per second. Possible spam attack or misconfiguration."

      # SMTP submission (587/465/2525) brute-force / credential-stuffing.
      # postfix_smtpd_sasl_authentication_failures_total counts failed SASL auth
      # on the smtpd side. Only owner devices ever authenticate here, so the
      # baseline is exactly 0 (zero increase over 7d). A burst of >20 failures in
      # 15m is a clear credential-stuffing signal. The submission ports are
      # firewall-open to the LAN, so this is the entry point an attacker would hit.
      - alert: PostfixSASLAuthFailureBurst
        expr: increase(postfix_smtpd_sasl_authentication_failures_total[15m]) > 20
        for: 0m
        labels:
          severity: warning
          category: email
          service: postfix
        annotations:
          summary: "Burst of SMTP SASL authentication failures"
          description: "Postfix saw {{ $value }} failed SMTP SASL authentications in the last 15 minutes (baseline ~0). Possible credential-stuffing / brute force against the submission ports (587/465/2525)."

      # Rspamd Spam Filter Alerts
      # NOTE: the "rspamd down" signal lives in rspamd-alerts.nix as
      # RspamdServiceDown (up{job="rspamd"}==0, the canonical probe-based
      # signal). A duplicate-named systemd-active rule was removed here on
      # 2026-06-10 to avoid an alert-name collision; this file now keeps NO
      # rspamd rules at all.
      # RspamdServiceFailed deleted 2026-07-29: strict subset of SystemdServiceFailed
      # (systemd.yaml, for=60s, no exclusion list); RspamdServiceDown carries the impact.

      # Dovecot Message/Byte Delivery Metrics
      - alert: DovecotNoRecentActivity
        expr: |
          (time() - dovecot_user_last_update{user!="root"}) > 86400
        for: 30m
        labels:
          severity: info
          category: email
          service: dovecot
        annotations:
          summary: "Dovecot user {{ $labels.user }} has no recent activity"
          description: "User {{ $labels.user }} has had no IMAP activity for more than 24 hours. Last activity: {{ $value | humanizeDuration }} ago."

      # DovecotServiceFailed deleted 2026-07-29: strict subset of SystemdServiceFailed
      # (systemd.yaml, for=60s, no exclusion list); DovecotServiceInactive below carries the
      # impact. Its `journalctl -u dovecot2` hint was NOT carried forward: dovecot2.service is
      # only a systemd alias of dovecot.service, so that command returns 0 lines. Use
      # `journalctl -u dovecot`.

      - alert: DovecotServiceInactive
        expr: |
          node_systemd_unit_state{
            name="dovecot.service",
            state="active"
          } == 0
        for: 2m
        labels:
          severity: critical
          category: email
          service: dovecot
        annotations:
          summary: "Dovecot IMAP service is not active"
          description: "Dovecot service is not running. Email retrieval is unavailable."

      # Postfix Message/Byte Delivery Metrics
      - alert: PostfixNoMessagesProcessed
        expr: |
          rate(postfix_cleanup_messages_processed_total[30m]) == 0
          and
          (time() - (postfix_cleanup_messages_processed_total > 0)) < 86400
        for: 1h
        labels:
          severity: warning
          category: email
          service: postfix
        annotations:
          summary: "Postfix has not processed any messages recently"
          description: "Postfix has not processed any messages in the last 30 minutes. This may indicate a service issue or lack of outbound mail."

      - alert: PostfixHighMessageVolume
        expr: |
          rate(postfix_cleanup_messages_processed_total[5m]) > 10
        for: 15m
        labels:
          severity: info
          category: email
          service: postfix
        annotations:
          summary: "Postfix is processing high message volume"
          description: "Postfix is processing {{ $value | humanize }} messages per second. This may be normal bulk sending or potential spam."

      - alert: PostfixMessageProcessingStalled
        expr: |
          rate(postfix_qmgr_messages_removed_total[15m]) == 0
          and
          postfix_showq_message_age_seconds_count > 0
        for: 30m
        labels:
          severity: critical
          category: email
          service: postfix
        annotations:
          summary: "Postfix message processing has stalled"
          description: "Postfix has {{ $value }} messages in queue but is not delivering them. Check service health and network connectivity."

      # PostfixServiceFailed deleted 2026-07-29: strict subset of SystemdServiceFailed
      # (systemd.yaml, for=60s, no exclusion list); PostfixServiceInactive below carries the impact.

      - alert: PostfixServiceInactive
        expr: |
          node_systemd_unit_state{
            name="postfix.service",
            state="active"
          } == 0
        for: 2m
        labels:
          severity: critical
          category: email
          service: postfix
        annotations:
          summary: "Postfix mail service is not active"
          description: "Postfix service is not running. Mail delivery is unavailable."

      # Combined Email System Health
      - alert: EmailSystemDegraded
        expr: |
          (up{job="dovecot"} == 0 or up{job="postfix"} == 0)
        for: 5m
        labels:
          severity: critical
          category: email
          service: email-system
        annotations:
          summary: "Email system is degraded"
          description: "One or more core email services (Dovecot, Postfix) are down. Email functionality is impaired."

      - alert: EmailDeliveryLatencyHigh
        expr: |
          histogram_quantile(0.95, rate(postfix_qmgr_messages_inserted_size_bytes_bucket[5m])) > 1000000
        for: 10m
        labels:
          severity: warning
          category: email
          service: postfix
        annotations:
          summary: "Email delivery latency is high"
          description: "95th percentile message size is {{ $value | humanize1024 }} bytes, indicating potential large message backlog or slow processing."

      # ---------------------------------------------------------------------
      # Mailbox maintenance (dovecot-archive.service)
      #
      # Added 2026-09-10 after the operator asked whether INBOX/Spam archiving was
      # working at all. It was -- but answering that took manual doveadm counting,
      # because nothing measured the job. Two gaps made it invisible:
      #
      #   * SystemdServiceFailed catches the unit FAILING. It cannot catch the unit
      #     never running: a stopped timer leaves an inactive unit and no failed
      #     state, so no series moves and nothing fires.
      #   * The job is silent by design. `doveadm move` prints nothing on success,
      #     so a healthy journal and a job that quietly stopped look identical.
      #
      # This job moves mail unattended at 03:00 and now also DELETES expired Trash,
      # so "stopped without anyone noticing" is the failure mode that matters most.
      - alert: DovecotArchiveStale
        expr: time() - dovecot_archive_last_success_timestamp_seconds > 93600
        for: 30m
        labels:
          severity: warning
          category: email
        annotations:
          summary: "Dovecot mailbox maintenance has not succeeded in over 26 hours"
          description: >-
            dovecot-archive.service last completed every step successfully more than
            26 hours ago. The timer runs daily at 03:00, so one missed window is
            enough to fire this.

            A single alert covers both failure shapes because the metric is a
            TIMESTAMP, not a boolean: if the job runs and fails, the timestamp stops
            advancing; if the timer stops entirely, nothing rewrites the file and the
            timestamp also stops advancing while time() keeps moving. A boolean would
            have stayed frozen at 1 and read as healthy in the second case.

            Effects while this is firing: old INBOX mail stops moving to Archive, old
            Spam stops moving to SpamArchive, and expired Trash stops being deleted.
            None of that is urgent on a one-day scale, which is why this is a warning.

            Check `journalctl -u dovecot-archive -n 50` for the per-step log lines,
            and `dovecot_archive_step_ok` to see WHICH step failed.

            26h rather than 24h so a delayed timer or a slow run does not page on the
            boundary.

      # Per-step visibility. The alert above says "something is wrong"; this says
      # which mailbox rule broke. Separate because the steps are independent -- one
      # failing no longer cancels the others (the script deliberately does not use
      # `set -e`), so a single step can fail indefinitely while the others work.
      - alert: DovecotArchiveStepFailing
        expr: dovecot_archive_step_ok == 0
        for: 1h
        labels:
          severity: warning
          category: email
        annotations:
          summary: "Dovecot maintenance step {{ $labels.step }} is failing"
          description: >-
            The `{{ $labels.step }}` rule in dovecot-archive.service failed on its
            last run while other steps may have succeeded.

            Steps map to mailboxes: inbox_archive -> INBOX to Archive (sent >365d),
            spam_archive -> Spam to SpamArchive (sent >30d), trash_expire -> permanent
            deletion of Trash held >365d.

            The usual cause is a missing destination mailbox or a Dovecot index
            problem for that folder; `doveadm` writes the reason to the journal.

      # Sanity check on the DESTRUCTIVE step. trash_expire deletes mail permanently
      # and unattended, so a surprising bulk deletion should be visible after the
      # fact even though it is allowed to proceed.
      #
      # Not a hard cap that blocks the deletion: a cap would silently stop Trash
      # being cleaned at all, and the legitimate first real cleanup IS large -- this
      # Trash holds a ~9,700-message bulk saved around 2025-11-14 that will all cross
      # the one-year line together around 2026-11-14. Blocking that would be wrong;
      # noticing it is right.
      #
      # Fires on the deliberately-unusual case: a run deleting more than 2,000
      # messages. Normal steady-state runs delete a handful.
      - alert: DovecotTrashExpiryUnusuallyLarge
        expr: dovecot_archive_messages_processed{step="trash_expire"} > 2000
        for: 5m
        labels:
          severity: info
          category: email
        annotations:
          summary: "Trash expiry deleted {{ $value }} messages in one run"
          description: >-
            The last dovecot-archive run permanently deleted {{ $value }} messages
            from Trash that had been there longer than a year. This is informational,
            not a failure -- the deletion has already happened.

            Expected once, around 2026-11-14, when the bulk of Trash saved in
            November 2025 crosses the one-year threshold together. If it fires at
            another time, or repeatedly, check that save dates are intact:
            `doveadm search -u johnw mailbox Trash SAVEDBEFORE 365d | wc -l` should
            be small in steady state. A rebuilt Dovecot index can reset save dates,
            which would make far more mail look expired than truly is.
