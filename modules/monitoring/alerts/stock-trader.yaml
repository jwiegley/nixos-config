groups:
  - name: stock_trader
    interval: 60s
    rules:
      - alert: StockTraderEndpointDown
        expr: |
          probe_success{instance="https://trader.vulcan.lan"} == 0
        for: 5m
        labels:
          severity: critical
          component: stock-trader
        annotations:
          summary: "stock-trader endpoint is down"
          description: |
            The HTTPS probe for trader.vulcan.lan has been failing for 5 minutes.

            Check: systemctl status stock-trader
            Logs:  journalctl -u stock-trader -n 100
            nginx: systemctl status nginx

      - alert: StockTraderCertificateExpiringSoon
        expr: |
          probe_ssl_earliest_cert_expiry{instance=~".*trader.vulcan.lan.*"} - time() < 86400 * 14
        for: 1h
        labels:
          severity: warning
          component: stock-trader
        annotations:
          summary: "stock-trader SSL certificate expires in less than 14 days"
          description: |
            The SSL certificate for trader.vulcan.lan expires in {{ $value | humanizeDuration }}.
            Run: sudo /etc/nixos/certs/renew-certificate.sh "trader.vulcan.lan" \
              -o "/var/lib/nginx-certs" -d 365 --owner "nginx:nginx"

      # StockTraderChatErrorRate REMOVED 2026-07-31 -- it could never fire.
      #
      # It selected `stock_trader_chat_errors_total`, which NOTHING produces. Not the
      # exporter (modules/services/stock-trader.nix defines only stock_trader_data_source_up),
      # not the application (the only stock_trader_* names the TSDB has EVER seen are
      # data_source_up, quote_unavailable_total/_created and quote_stale_rejected_total/
      # _created), and no other file in the tree -- confirmed by a disproving search across
      # all file types, not just *.nix.
      #
      # The Prometheus __name__ index has never seen the name at all, which is what
      # distinguishes this from the several rules here that are merely DORMANT (known metric,
      # no current series because the condition has not occurred). Dormant rules work when
      # the thing happens; this one could not, ever.
      #
      # So it was not a monitor, it was the appearance of one: a chat-error alert
      # structurally incapable of alerting on a chat error, for its entire existence. Found
      # by scripts/prometheus-rule-audit.py, added the same day to replace the dead-rule
      # detection that the retired Nagios mirror used to provide.
      #
      # Deleted rather than repaired because its premise is gone too: it was written for
      # "the LiteLLM Anthropic->Responses adapter misorder bug", and LiteLLM is being removed
      # from this host entirely. If the application ever exports per-kind chat error counts,
      # write a fresh rule against what it actually emits.

      # ----------------------------------------------------------------------
      # The Schwab OAuth section that used to live here is GONE, along with the source.
      #
      # Plan item D3 retired the Schwab data source entirely on 2026-07-29. Four rules
      # (SchwabTokenExpiringSoon, SchwabTokenExpiryCritical, SchwabTokenFileMissing,
      # StockTraderSchwabDataSourceDown) had already been commented out on 2026-07-27
      # because the refresh token expires every ~7 days by design, so they fired weekly
      # and were noise rather than signal. Roughly 100 lines of disabled rules plus a
      # manual re-auth runbook were left behind.
      #
      # Deleting the source removes the reason for all of it: no token, no expiry to
      # alert on, no weekly browser re-bootstrap chore, and no
      # stock_trader_data_source_up{source="schwab"} gauge reporting 1 while the token
      # had in fact been dead for 35 days. alpha_vantage is the source now.
      # Retirement rationale is recorded at modules/services/stock-trader.nix.
      # ----------------------------------------------------------------------

      - alert: StockTraderQuotesUnavailable
        expr: |
          increase(stock_trader_quote_unavailable_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          component: stock-trader
        annotations:
          summary: "stock-trader: quotes returning no live source (503)"
          description: |
            get_quote raised DataUnavailableError (all sources stale/failed) in
            the last 15m and is still doing so. In enforce mode the service is
            correctly 503-ing rather than serving stale data. The live source is
            alpha_vantage (Schwab was retired 2026-07-29, plan item D3); check
            StockTraderEndpointDown and journalctl -u stock-trader.
      - alert: StockTraderStaleQuotesRejected
        expr: |
          increase(stock_trader_quote_stale_rejected_total[15m]) > 0
        for: 15m
        labels:
          severity: info
          component: stock-trader
        annotations:
          summary: "stock-trader: freshness gate rejecting stale quotes"
          description: |
            The freshness gate rejected stale quotes from {{ $labels.source }}
            for 15m. In warn mode stale data is served labeled (stale=true); in
            enforce mode the source is falling through. Brief during an outage;
            sustained means the degraded path is the steady state -- check the
            alpha_vantage source rather than re-authenticating anything, since the
            Schwab OAuth chore was retired with the source on 2026-07-29.
