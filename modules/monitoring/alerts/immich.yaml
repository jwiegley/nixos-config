groups:
  - name: immich
    interval: 30s
    rules:
      # Immich API service availability
      - alert: ImmichAPIDown
        expr: up{job="immich-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: immich
        annotations:
          summary: "Immich API service is down"
          description: "Immich API has been unavailable for more than 2 minutes on {{ $labels.instance }}"

      # Immich Microservices availability
      - alert: ImmichMicroservicesDown
        expr: up{job="immich-microservices"} == 0
        for: 2m
        labels:
          severity: critical
          service: immich
        annotations:
          summary: "Immich Microservices are down"
          description: "Immich Microservices have been unavailable for more than 2 minutes on {{ $labels.instance }}"

      # NOTE (2026-07-06, immich 3.0.1): ImmichHighHTTPErrorRate and
      # ImmichSlowResponse REMOVED. v3 dropped the OTel HTTP-server
      # instrumentation from the Prometheus exposition — no http_server_*
      # series exist on either telemetry port (verified against live
      # :9283/:9284 with IMMICH_TELEMETRY_INCLUDE=all), so both rules could
      # never fire. HTTP-level coverage for Immich is now the blackbox vhost
      # probe of immich.vulcan.lan (job blackbox_https_local, declared in
      # modules/services/blackbox-monitoring.nix) plus ImmichAPIDown below.

      # High memory usage (API)
      - alert: ImmichAPIHighMemoryUsage
        expr: |
          max without(otel_scope_name, otel_scope_version) (process_memory_usage{job="immich-api"}) > 2147483648
        for: 10m
        labels:
          severity: warning
          service: immich
        annotations:
          summary: "Immich API memory usage is high"
          description: "Immich API is using {{ $value | humanize1024 }}B of memory on {{ $labels.instance }}"

      # High memory usage (Microservices)
      - alert: ImmichMicroservicesHighMemoryUsage
        expr: |
          process_memory_usage{job="immich-microservices"} > 4294967296
        for: 10m
        labels:
          severity: warning
          service: immich
        annotations:
          summary: "Immich Microservices memory usage is high"
          description: "Immich Microservices is using {{ $value | humanize1024 }}B of memory on {{ $labels.instance }}"

      # NOTE (2026-06-10): ImmichJobFailures REMOVED. It matched
      # {__name__=~"immich_jobs_.*_failed_total"}, which is ZERO live series —
      # Immich's OTel exporter publishes NO per-queue failed counter.
      #
      # NOTE (2026-07-06, immich 3.0.1): ImmichJobQueueBacklog and
      # ImmichMLServiceSlow also REMOVED. v3 dropped the per-queue depth
      # gauges (immich_queues_<name>_active) and the ML predict histogram
      # (immich_machine_learning_repository_predict_duration_*); the v3
      # exposition only publishes immich_<repo>_<method>_duration call
      # histograms (verified against live :9283/:9284 — zero matching
      # series for either rule). Queue backlog is visible in the admin Jobs
      # UI; ML liveness is still indirectly covered by ImmichMicroservicesDown
      # and the vmalert HA→VM staleness rules. If upstream reintroduces queue
      # gauges, resurrect ImmichJobQueueBacklog from git history.

      # Storage space warning
      - alert: ImmichStorageSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/tank/Photos"} /
           node_filesystem_size_bytes{mountpoint="/tank/Photos"}) * 100 < 10
        for: 30m
        labels:
          severity: warning
          service: immich
        annotations:
          summary: "Immich storage space is running low"
          description: "Immich storage has less than 10% free space available"
