groups:
  - name: health_check_alerts
    interval: 5m
    rules:
      # Critical service health, from node-exporter's systemd collector.
      #
      # REPLACED critical_service_active/-_failed on 2026-08-05. Those came from a
      # hand-rolled bash-in-socat HTTP server on :9221 that reproduced a strict
      # subset of what node-exporter already scrapes, so every failure of these
      # units produced TWO critical alertnames and two emails. The exporter, its
      # socket, its firewall hole and its scrape config are gone; the service list
      # lives here now because this alert is its only remaining consumer, so there
      # is one copy of it rather than two that can drift.
      #
      # ALSO ABSORBS CriticalServiceInactive, which used to live in systemd.yaml
      # and was a THIRD overlapping mechanism: node-exporter-based like this one
      # but over its own list (sshd, postgresql, nginx, prometheus, tailscaled,
      # step-ca, docker), so four units were covered twice and would have raised
      # two alertnames for one failure. Its `state="inactive" == 1` form was also
      # strictly weaker than the `state="active" == 0` used here -- a FAILED unit
      # reports failed=1 with both active=0 and inactive=0, so the old rule missed
      # exactly the case an operator most wants paged. sshd is carried over;
      # tailscaled and docker were dead clauses (no such units on this host,
      # docker.enable = false).
      #
      # THE COUNT GUARD IS NOT OPTIONAL. The metric this replaces reported an
      # explicit 0 for a unit that no longer existed; node_systemd_unit_state
      # reports NO SERIES at all, and `== 0` over an absent series matches nothing.
      # Without CriticalServiceMissing below, deleting or renaming any of these
      # units would silently drop it from monitoring instead of alerting. The
      # literal 14 must equal the number of names in the regex.
      - alert: CriticalServiceDown
        expr: node_systemd_unit_state{name=~"(sshd|postgresql|nginx|step-ca|dovecot|postfix|radicale|prometheus|alertmanager|grafana|loki|victoriametrics|home-assistant|node-red|technitium-dns-server)\\.service", state="active"} == 0
        for: 2m
        labels:
          severity: critical
          component: service_health
        annotations:
          summary: "Critical service {{ $labels.name }} is not running"
          description: "The critical service {{ $labels.name }} has not been active for more than 2 minutes."

      - alert: CriticalServiceMissing
        expr: count(node_systemd_unit_state{name=~"(sshd|postgresql|nginx|step-ca|dovecot|postfix|radicale|prometheus|alertmanager|grafana|loki|victoriametrics|home-assistant|node-red|technitium-dns-server)\\.service", state="active"}) < 15
        for: 5m
        labels:
          severity: critical
          component: service_health
        annotations:
          summary: "A critical service has disappeared from monitoring entirely"
          description: |
            Fewer than 15 of the critical units are reporting to node-exporter's
            systemd collector, which means one was renamed, removed, or is no
            longer being collected. CriticalServiceDown cannot see this case: an
            absent series does not match `== 0`. Compare the regex in this rule
            against `systemctl list-unit-files` to find which name is gone.

      # Backup Health Alerts
      # This rule KEEPS the name BackupServiceFailed; the systemd-unit-state
      # rule in systemd.yaml that used to share it was renamed to
      # ResticBackupUnitFailed on 2026-07-29 (one alertname for two different
      # rules meant one email could not say which fired and one silence killed
      # both). This is the variant the alertmanager.nix inhibit
      # BackupServiceFailed -> BackupNotRunRecently joins on, because only this
      # one carries the `backup` label -- do not rename it.
      - alert: BackupServiceFailed
        expr: backup_service_failed == 1
        for: 5m
        labels:
          severity: critical
          component: backup
        annotations:
          summary: "Backup service {{ $labels.backup }} has failed"
          description: "The backup service for {{ $labels.backup }} is in failed state and needs attention"

      - alert: BackupNotRunRecently
        expr: (time() - backup_last_run_timestamp_seconds) > 129600
        for: 5m
        labels:
          severity: warning
          component: backup
        annotations:
          summary: "Backup {{ $labels.backup }} hasn't run in over 36 hours"
          description: "The backup {{ $labels.backup }} last ran {{ $value | humanizeDuration }} ago (expected daily)"

      - alert: BackupLastRunFailed
        expr: backup_last_run_success == 0 and backup_last_run_timestamp_seconds > 0
        for: 5m
        labels:
          severity: warning
          component: backup
        annotations:
          summary: "Last backup run for {{ $labels.backup }} failed"
          description: "The most recent backup run for {{ $labels.backup }} was not successful"

      - alert: BackupTimerInactive
        expr: backup_timer_active == 0
        for: 10m
        labels:
          severity: warning
          component: backup
        annotations:
          summary: "Backup timer {{ $labels.backup }} is not active"
          description: "The backup timer for {{ $labels.backup }} is not active, backups won't run automatically"

      # Mbsync Health Alerts
      #
      # CONSOLIDATED 2026-07-28 from three separate MbsyncNotRunRecently rules (johnw,
      # assembly, bia) into this one. Three things made that necessary:
      #
      #  1. promtool reported "1 duplicate rule(s) found" and FAILED the lint on this
      #     file, because it compares only STATICALLY DECLARED labels ({component,
      #     severity}) and cannot see the per-account selector inside each expr. Note
      #     plain `promtool check rules` prints FAILED and still EXITS 0 -- only
      #     `--lint-fatal` (rc=3) catches it, which is why this sat here unnoticed.
      #  2. The naive fix -- deleting two "duplicates" -- would have SILENTLY DROPPED
      #     staleness monitoring for two real mail accounts. The three rules were
      #     semantically distinct: johnw >3600, assembly >129600, bia >3600.
      #  3. `rbcca` had NO staleness coverage at all. The TSDB carries FOUR accounts
      #     (assembly, bia, johnw, rbcca) against three rules; rbcca was covered for
      #     sync FAILURE by MbsyncLastSyncFailed but a silent stall was invisible. The
      #     negated selector below closes that for free.
      #
      # `for: 15m`, not 5m -- a conservative choice, and the reasoning below is corrected
      # from an earlier version of this comment that got it wrong.
      # The TSDB facts: reconstructing 2026-07-03 at 15s resolution, the post-outage
      # >3600s breach spans were bia 300s, rbcca 315s and johnw 285s.
      # What an earlier version wrongly inferred: that `for: 5m` would therefore have
      # SPURIOUSLY FIRED. Two things disprove that. (a) This group declares `interval: 5m`
      # (line 3), which OVERRIDES the global 15s evaluation_interval -- so the rule is
      # evaluated every 300s, 20x less often than that reasoning assumed, and a 300s
      # breach is observed at most once. (b) Empirically, bia ALREADY had a `for: 5m` rule
      # at this exact >3600 threshold and ALERTS{alertname="MbsyncNotRunRecently"} has
      # ZERO samples in ANY state (pending or firing) across 28 days -- while the same
      # group was demonstrably recording (BackupNotRunRecently logged 748 samples on
      # 07-03). rbcca could not have fired either: it had no rule at all.
      # So 15m is retained for margin, not because 5m was proven harmful: 4 consecutive
      # evaluations at this interval, costing 10 extra minutes against a 1h threshold
      # (36h for assembly) -- negligible either way.
      #
      # The two branches are per-account thresholds, keyed off the ONE account whose sync
      # cadence is daily rather than sub-hourly. Adding a new account inherits the 1h
      # branch automatically, which is the safe default.
      - alert: MbsyncNotRunRecently
        expr: ((time() - mbsync_last_sync_timestamp_seconds{account!="assembly"}) > 3600) or ((time() - mbsync_last_sync_timestamp_seconds{account="assembly"}) > 129600)
        for: 15m
        labels:
          severity: warning
          component: mail_sync
        annotations:
          summary: "Mail sync for {{ $labels.account }} is stale"
          description: "The mbsync service for {{ $labels.account }} last ran {{ $value | humanizeDuration }} ago. Expected every 15-30 minutes for most accounts; daily for assembly."

      - alert: MbsyncLastSyncFailed
        expr: mbsync_last_sync_status == 0
        # 25m spans more than one ~15min sync cycle, so a single transient
        # failure that self-heals on the next run won't alert; needs 2+ in a row.
        for: 25m
        labels:
          severity: warning
          component: mail_sync
        annotations:
          summary: "Last mail sync for {{ $labels.account }} failed"
          description: "The most recent mbsync run for {{ $labels.account }} failed with error code {{ $labels.last_error_code }}"

      - alert: MbsyncRepeatedFailures
        expr: mbsync_last_sync_status == 0 and (time() - mbsync_last_sync_timestamp_seconds) < 7200
        for: 1h
        labels:
          severity: critical
          component: mail_sync
        annotations:
          summary: "Mail sync for {{ $labels.account }} has been failing for over 1 hour"
          description: "The mbsync service for {{ $labels.account }} has been in a failed state for an extended period and requires immediate attention"

# The `certificate_alerts` group that used to sit here (7 rules over the
# certificate-exporter metrics) MOVED to modules/monitoring/alerts/certificates.yaml
# on 2026-07-29. It was never at home in this file, and two of its rules
# (CertificateExpiringSoon, CertificateExpired) collided fingerprint-for-
# fingerprint with same-named, same-labelled rules in certificates.yaml -- two
# rules, two intervals (300s here vs 60s there), one Alertmanager alert, so the
# delivered annotation flip-flopped. Successors, all in certificates.yaml group
# `certificates`: CertificateExpiringSoon, CertificateExpiryCritical,
# CertificateExpired, CertificateFileMissing, CertificateKeyMismatch,
# CertificateChainInvalid, CertificateExporterStale. Do not re-add them here.
