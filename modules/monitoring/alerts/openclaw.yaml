groups:
  - name: openclaw_availability
    interval: 60s
    rules:
      # Today's regression symptom: the discord channel plugin isn't in
      # the most-recent [gateway] ready line.
      - alert: OpenClawDiscordPluginMissing
        expr: openclaw_channel_plugin_loaded{channel="discord"} == 0
        for: 10m
        labels:
          severity: critical
          category: availability
          service: openclaw
        annotations:
          summary: "OpenClaw discord plugin missing for 10 minutes"
          description: |
            The most recent [gateway] ready line did not include
            `discord` in its plugin list. This is the 2026-04-22
            regression pattern: DMs to the Claw bot will not get
            answered. Check
            /var/lib/openclaw/.openclaw/logs/gateway-vm.err.log.

      # Any of the other expected channel plugins missing.
      - alert: OpenClawChannelPluginMissing
        expr: openclaw_channel_plugin_loaded{channel!="discord"} == 0
        for: 15m
        labels:
          severity: warning
          category: availability
          service: openclaw
        annotations:
          summary: "OpenClaw {{ $labels.channel }} plugin missing for 15 minutes"
          description: |
            The most recent [gateway] ready line did not include
            `{{ $labels.channel }}` in its plugin list.

      # Plugin init failures since the last successful ready line.
      - alert: OpenClawPluginInitFailuresPresent
        expr: openclaw_plugin_init_failures_recent_total > 0
        for: 5m
        labels:
          severity: critical
          category: availability
          service: openclaw
        annotations:
          summary: "OpenClaw plugin init failures after last ready"
          description: |
            {{ $value }} plugin init failure lines in gateway-vm.err.log
            after the most recent [gateway] ready timestamp.

      # The canary itself is broken or not firing.
      - alert: OpenClawCanaryStale
        expr: (time() - openclaw_canary_last_run_timestamp_seconds) > 600
        for: 5m
        labels:
          severity: warning
          category: monitoring
          service: openclaw
        annotations:
          summary: "OpenClaw canary has not run in >10 minutes"
          description: |
            openclaw-canary.timer is not firing or the script is
            failing. `systemctl status openclaw-canary.service`.

      # The VM is alive and has been up long enough to reach ready, but
      # the most-recent `[gateway] ready` log line was emitted *before*
      # the current VM boot — typically crash-loop or wedged startup.
      # Gates on VM uptime > 1800 s so that a fresh VM still in its boot
      # window does not fire this alert.  The `[gateway] ready` line is
      # only emitted once per gateway start, so raw ready_age would
      # false-positive after any stable VM uptime > 30 min.
      - alert: OpenClawGatewayReadyStale
        expr: |
          openclaw_microvm_active_enter_timestamp_seconds > 0
          and (time() - openclaw_microvm_active_enter_timestamp_seconds) > 1800
          and openclaw_gateway_ready_timestamp_seconds
              < openclaw_microvm_active_enter_timestamp_seconds
          and on()
          (systemd_unit_state{name="microvm@openclaw.service", state="active"} == 1)
        for: 10m
        labels:
          severity: critical
          category: availability
          service: openclaw
        annotations:
          summary: "OpenClaw microVM active but gateway has not reached ready since last boot"
          description: |
            The microVM systemd unit has been running for >30 minutes
            but no `[gateway] ready` line has been logged since the
            current VM boot.  OpenClaw is either restarting in a loop
            or wedged during startup.

      # The microVM systemd unit entered failed state.
      - alert: OpenClawMicroVMDown
        expr: |
          systemd_unit_state{
            name="microvm@openclaw.service",
            state="failed",
            type="service"
          } == 1
        for: 2m
        labels:
          severity: critical
          category: availability
          service: openclaw
        annotations:
          summary: "OpenClaw microVM systemd unit is failed"
          description: "`systemctl status microvm@openclaw.service` for details."

      # Generic absence alarm — if the textfile stops appearing entirely,
      # none of the above fire.  This catches a deleted textfile dir, a
      # node_exporter restart issue, or the canary being disabled.
      - alert: OpenClawCanaryMetricAbsent
        expr: absent(openclaw_canary_parse_ok)
        for: 15m
        labels:
          severity: warning
          category: monitoring
          service: openclaw
        annotations:
          summary: "OpenClaw canary metric series is missing from Prometheus"
          description: |
            No `openclaw_canary_parse_ok` sample in Prometheus for
            15 minutes.  Check node_exporter --collector.textfile
            and the canary systemd timer.

      # B-floor signal — Discord WebSocket disconnected.
      - alert: OpenClawDiscordWsDown
        expr: openclaw_discord_ws_connected == 0
        for: 3m
        labels:
          severity: critical
          category: availability
          service: openclaw
        annotations:
          summary: "OpenClaw Discord WebSocket disconnected for 3 minutes"
          description: |
            The most recent positive Discord ready event (client
            initialized / logged in / WebSocket connection opened) is
            older than the most recent negative event (websocket closed
            / gateway error / reconnect scheduled (close|zombie) /
            was-not-ready / channel exited / health-monitor restart),
            and the 60s reconnect grace window has not produced a fresh
            negative event.  Bot will not receive or send Discord
            messages until the connection is restored.

      # B-floor signal — gateway HTTP /health probe failing.
      - alert: OpenClawHttpHealthDown
        expr: probe_success{probe="openclaw-health"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
          service: openclaw
        annotations:
          summary: "OpenClaw HTTP /health probe failing for 1 minute"
          description: |
            blackbox_exporter cannot reach
            `https://openclaw.vulcan.lan/health`.  The microVM may be
            running but the gateway HTTP listener is wedged.

      # Watchdog for the self-heal daemon itself — if this dies, the
      # whole self-heal layer is offline.  Routes to a different
      # service label so it is NOT looped back to its own webhook.
      - alert: OpenClawSelfHealDown
        expr: |
          (time() - openclaw_self_heal_last_heartbeat_seconds) > 600
          or absent(openclaw_self_heal_last_heartbeat_seconds)
        for: 2m
        labels:
          severity: critical
          category: monitoring
          service: openclaw-self-heal
        annotations:
          summary: "openclaw-self-heal daemon hasn't heartbeat in >10 minutes"
          description: |
            The self-heal daemon is the watchdog; if it dies, nothing
            else will.  Investigate openclaw-self-heal.service on
            vulcan.

      # ─────────────────────────────────────────────────────────────────
      # mcporter / Home Assistant integration
      # ─────────────────────────────────────────────────────────────────
      # The HA MCP integration is the most fragile mcporter entry because
      # HA's /mcp_server/sse endpoint advertises OAuth metadata that
      # mcporter then tries to satisfy via RFC 7591 dynamic client
      # registration — which HA does not support.  We pin transport=http
      # against /api/mcp with a static long-lived access token; this
      # alert fires if anything in that chain breaks.
      - alert: OpenClawMcporterHaDown
        expr: openclaw_mcporter_ha_auth_ok == 0
        for: 5m
        labels:
          severity: critical
          category: integration
          service: openclaw
        annotations:
          summary: "OpenClaw HA MCP auth has been failing for 5 minutes"
          description: |
            HA's `/api/mcp` endpoint is rejecting the staged Bearer
            token, or the home-assistant entry in mcporter.json is
            structurally invalid.  Common causes: token revoked or
            rotated in HA UI without updating SOPS; preStart didn't
            re-inject the entry (mcporter.json reverted to SSE
            transport); HA mcp_server integration disabled.
            Check `openclaw_mcporter_server_ok{name="home-assistant"}`,
            `openclaw_mcporter_ha_token_present`,
            `openclaw_mcporter_ha_endpoint_reachable`.

      - alert: OpenClawMcporterServerStale
        expr: openclaw_mcporter_server_ok{name!="home-assistant"} == 0
        for: 15m
        labels:
          severity: warning
          category: integration
          service: openclaw
        annotations:
          summary: "OpenClaw mcporter entry {{ $labels.name }} structurally invalid for 15m"
          description: |
            The mcporter.json entry for `{{ $labels.name }}` is missing
            or malformed.  This usually means the openclaw service's
            preStart did not run (or did not finish) since the last
            microvm restart.  Manual fix:
            `sudo systemctl restart microvm@openclaw.service`.

      - alert: OpenClawMcporterCheckStale
        expr: |
          (time() - openclaw_mcporter_check_last_run_timestamp_seconds) > 1200
          or absent(openclaw_mcporter_check_last_run_timestamp_seconds)
        for: 10m
        labels:
          severity: warning
          category: monitoring
          service: openclaw
        annotations:
          summary: "openclaw-mcporter-check has not run in >20 minutes"
          description: |
            The mcporter health metric exporter (timer
            openclaw-mcporter-check.timer) is not firing or its script
            is failing.  Without it, `openclaw_mcporter_*` metrics go
            stale and the HaDown / ServerStale alerts cannot fire.
            Check `systemctl status openclaw-mcporter-check.service`.
