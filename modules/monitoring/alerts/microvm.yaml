# microVM resource alerts (Option A — docs/MONITORING_DEFERRED_SPECS.md
# "microVM Guest Visibility"). Auto-discovered by Prometheus (alerts/*.yaml).
#
# Metrics emitted by modules/monitoring/services/microvm-resource-exporter.nix
# (host-side textfile collector, job=node). All gauges are integers — no secret
# surface. Guest-OOM detection is a separate Loki rule
# (modules/monitoring/loki-rules/microvm-oom.yaml).
#
# Baseline (live 2026-06-10): openclaw 1.45 GB / 4096 MiB = 35% of ceiling;
# hermes 631 MB / 3072 MiB = 20% of ceiling. vCPU: openclaw=4, hermes=1.
groups:
  - name: microvm_resources
    interval: 60s
    rules:
      # Guest memory pressure. The guests run a tmpfs root with ZERO swap, so a
      # runaway allocation OOM-kills the VM with no other host warning. 0.90 is
      # well above the 35%/20% live baseline; `for: 15m` rides out transient
      # MCP-child fan-out (financialPython etc. are bursty but short-lived).
      # `> 0` on the ceiling guards against the divide-by-zero / "VM down →
      # gauges 0" case (ratio would read 0 and never fire spuriously, but the
      # explicit guard documents intent and skips down VMs).
      - alert: MicroVMMemoryHigh
        expr: |
          microvm_memory_ceiling_bytes > 0
          and
          (microvm_memory_current_bytes / microvm_memory_ceiling_bytes) > 0.90
        for: 15m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "{{ $labels.vm }} microVM >90% of its memory ceiling for 15m"
          description: |
            The {{ $labels.vm }} microVM's cgroup MemoryCurrent has been above
            90% of its QEMU memory allocation (microvm.mem) for 15 minutes. The
            guest root is tmpfs with NO swap, so sustained pressure here is the
            precursor to a silent guest OOM-kill (the VM dies and only an
            availability alert fires minutes later). NOTE: cgroup MemoryCurrent
            includes reclaimable page cache, so a brief breach can be benign —
            the 15m window tolerates cache. Check the guest's real available
            memory if this persists.

      # CPU saturation: the per-VM CPU-time counter rising at ~vCPU cores/sec
      # means the VM is pinned across all its allocated cores. openclaw has 4
      # vCPU, hermes 1. microvm_vcpu_count carries the per-VM core count, so the
      # ratio is uniform across VMs. 0.90 of full saturation for 30m flags a
      # genuinely CPU-bound VM (not a transient burst); 30m is long because
      # legitimate agent work (model fan-out, indexing) can pin cores for
      # minutes at a time. Liveness/"agent stuck" is owned elsewhere
      # (hang-capture + api_server probes); this is a capacity signal only.
      - alert: MicroVMCpuSaturated
        expr: |
          microvm_vcpu_count > 0
          and
          (rate(microvm_cpu_usage_seconds_total[10m]) / microvm_vcpu_count) > 0.90
        for: 30m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "{{ $labels.vm }} microVM CPU-saturated (>90% of {{ $labels.vm }} vCPUs) for 30m"
          description: |
            The {{ $labels.vm }} microVM has consumed CPU time at >90% of its
            allocated vCPU count, sustained for 30 minutes. This is a capacity
            signal (the VM is CPU-bound), not a liveness signal — agent "stuck"
            detection is owned by the hang-capture and api_server probes.
            Consider whether the workload warrants more vCPUs (openclaw=4,
            hermes=1; a 4-vCPU hermes bump was tried and reverted 2026-05-31 —
            see hermes-vm.nix:353).

      # Exporter staleness — the same last_run_timestamp discipline every house
      # collector uses. The fast cgroup timer runs every 60s; >10m without a run
      # means the collector itself is broken (and the gauges above are stale).
      - alert: MicroVMResourceExporterStale
        expr: time() - microvm_resource_exporter_last_run_timestamp_seconds > 600
        for: 5m
        labels:
          severity: warning
          category: monitoring-meta
        annotations:
          summary: "microVM resource exporter has not run in >10m"
          description: |
            microvm-resource-exporter.service (60s timer) last published its
            cgroup gauges more than 10 minutes ago. The microVM memory/CPU
            gauges are stale — check `systemctl status microvm-resource-exporter`
            and the textfile at
            /var/lib/prometheus-node-exporter-textfiles/microvm_resources.prom.

      # State-share du exporter staleness (hourly timer; >3h means broken).
      - alert: MicroVMStateShareExporterStale
        expr: time() - microvm_state_share_exporter_last_run_timestamp_seconds > 10800
        for: 10m
        labels:
          severity: info
          category: monitoring-meta
        annotations:
          summary: "microVM state-share size exporter has not run in >3h"
          description: |
            microvm-state-share-exporter.service (hourly timer) last published
            microvm_state_share_bytes more than 3 hours ago. State-share size
            attribution is stale; check
            `systemctl status microvm-state-share-exporter`.

# DEFERRED ALERTS (not shipped — recorded here for the next iteration):
#   - MicroVMVolumeFillingUp: SKIPPED. The brief's "guest disk fill" worry does
#     NOT map to a knowable max. Both guests run a tmpfs root (no disk-image
#     volumes); persistence is a virtiofs share on the host's ext4 root, which
#     node-exporter's filesystem collector ALREADY scrapes
#     (node_filesystem_avail_bytes). microvm_state_share_bytes is therefore an
#     attribution gauge (cardinality 2), not a fill gauge — there is no per-VM
#     volume ceiling to ratio against, so a >0.85 fill alert is not meaningful.
#     Host-root fill is covered by the existing filesystem alerts.
#   - MicroVMGuestRootFilling / MicroVMGuestProbeFailing: DEFERRED with the
#     in-guest ssh probe (needs the §8 debug-key decision). Ship dark; add when
#     the probe is enabled.
