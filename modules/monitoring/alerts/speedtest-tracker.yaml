groups:
  - name: speedtest_tracker_service
    interval: 60s
    rules:
      - alert: SpeedtestTrackerDown
        expr: probe_success{job="blackbox_https_local",instance="https://speedtracker.vulcan.lan"} == 0
        for: 5m
        labels:
          severity: critical
          component: speedtest-tracker
        annotations:
          summary: "Speedtest Tracker is down"
          description: |
            Speedtest Tracker at https://speedtracker.vulcan.lan is not responding.

            Check container: sudo -u speedtest-tracker podman ps -a
            Check service: systemctl --user -M speedtest-tracker@ status speedtest-tracker.service
            View logs: sudo -u speedtest-tracker podman logs speedtest-tracker --tail 50
            Check nginx: systemctl status nginx
            Test local endpoint: curl -I http://127.0.0.1:8765

      - alert: SpeedtestTrackerSlowResponse
        expr: probe_duration_seconds{job="blackbox_https_local",instance="https://speedtracker.vulcan.lan"} > 10
        for: 10m
        labels:
          severity: warning
          component: speedtest-tracker
        annotations:
          summary: "Speedtest Tracker is responding slowly"
          description: |
            Speedtest Tracker response time is {{ $value }}s (threshold: 10s).

            Check container resources: sudo -u speedtest-tracker podman stats speedtest-tracker
            View logs: sudo -u speedtest-tracker podman logs speedtest-tracker --tail 50
            Check database: pg_isready -h 127.0.0.1 -p 5432

      - alert: SpeedtestTrackerSSLExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox_https_local",instance="https://speedtracker.vulcan.lan"} - time() < 30 * 24 * 3600
        for: 1h
        labels:
          severity: warning
          component: speedtest-tracker
        annotations:
          summary: "Speedtest Tracker SSL certificate expiring soon"
          description: |
            SSL certificate for speedtracker.vulcan.lan expires in less than 30 days.

            Renew with: sudo /etc/nixos/certs/renew-certificate.sh speedtracker.vulcan.lan -o /var/lib/nginx-certs -d 365 --owner root:nginx
            Then reload: sudo systemctl reload nginx

  - name: speedtest_tracker_results
    interval: 60s
    rules:
      # Result-freshness (correctness, not soundness). speedtest-tracker is
      # scheduled to run hourly and persist a row to the `results` table; the
      # speedtest-results-exporter reads the newest COMPLETED row's created_at
      # into speedtest_last_result_timestamp_seconds. If the schedule silently
      # stops or every run comes back `failed`, this timestamp freezes while the
      # container stays green and the blackbox probe keeps passing. 26h is
      # generous against the hourly cadence (allows ~26 missed runs of slop).
      # A 0 value (empty table / dead collector) makes time()-0 enormous → fires.
      - alert: SpeedtestResultsStale
        expr: time() - speedtest_last_result_timestamp_seconds > 26 * 3600
        for: 30m
        labels:
          severity: warning
          component: speedtest-tracker
        annotations:
          summary: "Speedtest Tracker results are stale"
          description: |
            No completed speedtest result has been recorded in over 26h
            (newest completed row is {{ $value | humanizeDuration }} old). The
            hourly speedtest schedule has likely stalled or every run is failing,
            even though the container/web UI may still be up.

            Check the collector: systemctl status speedtest-results-exporter.service
            Check the schedule:  sudo -u speedtest-tracker podman logs speedtest-tracker --tail 50
            Check failed runs:   psql -d speedtest_tracker -c "SELECT count(*) FROM results WHERE status='failed' AND created_at > now() - interval '1 day'"

      # Throughput regression. Fires only once a 7-day baseline has accrued AND
      # there is a current reading (both guarded > 0 so a stale/empty 0 does not
      # masquerade as a "degraded" 0 — that is the SpeedtestResultsStale case).
      # Sustained download below 20% of the 7d average for 6h indicates a real
      # WAN/ISP degradation rather than a single bad run. Baseline observed
      # ~109 Mbit/s; 20% = ~22 Mbit/s.
      - alert: SpeedtestDownloadDegraded
        expr: |
          speedtest_last_download_bps > 0
          and avg_over_time(speedtest_last_download_bps[7d]) > 0
          and speedtest_last_download_bps
              < 0.2 * avg_over_time(speedtest_last_download_bps[7d])
        for: 6h
        labels:
          severity: warning
          component: speedtest-tracker
        annotations:
          summary: "Speedtest download throughput degraded"
          description: |
            Measured download throughput ({{ $value | humanize }}bps) has been
            below 20% of the 7-day average for over 6 hours — a sustained WAN/ISP
            degradation, not a single bad run.

            Review history at https://speedtracker.vulcan.lan
