groups:
  - name: meta_monitoring
    interval: 30s
    rules:
      # Dead-man's switch (P0 #4).
      #
      # This rule ALWAYS fires — that is the entire point. It is routed by
      # Alertmanager to an EXTERNAL heartbeat endpoint (e.g. healthchecks.io or a
      # cron on hera). As long as the alerting pipeline (Prometheus -> rule eval ->
      # Alertmanager -> notification) is alive, this alert keeps the external
      # endpoint pinged. The instant the pipeline dies for any reason, the pings
      # stop and the external watchdog raises the alarm. It is SUPPOSED to fire
      # forever; do NOT silence it locally and do NOT route it to the normal
      # iPhone/email/Discord receivers.
      #
      # The `severity: watchdog` label is LOAD-BEARING: Alertmanager routes on it
      # to the external heartbeat. Do not change it.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: watchdog
          category: monitoring
        annotations:
          summary: "Alerting pipeline dead-man's switch"
          description: "This is an always-firing alert meant to ensure the entire alerting pipeline is functional. It is routed to an external heartbeat endpoint; if these pings stop arriving, the external watchdog should alarm because Prometheus/Alertmanager/notification delivery has died."

      # Host-wide catch-all for any scrape target that goes down (P0 #12).
      #
      # Backstops every current and future scrape job in one rule. Verified live
      # on 2026-06-09: zero targets are down (`up == 0` -> empty), so this does NOT
      # fire on deploy.
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Scrape target {{ $labels.job }} is down"
          description: "Prometheus has been unable to scrape target {{ $labels.instance }} (job {{ $labels.job }}) for over 5 minutes. Metrics and alerts depending on this target are blind."

      # Notification delivery health on the Prometheus side (P0 #5).
      #
      # prometheus_notifications_errors_total counts errors talking to Alertmanager.
      # Live baseline 2026-06-09: value 0, rate over 10m = 0 firing series.
      - alert: PrometheusNotificationErrors
        expr: |
          rate(prometheus_notifications_errors_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Prometheus is failing to send notifications to Alertmanager"
          description: "Prometheus is erroring while pushing alerts to Alertmanager ({{ $value | printf \"%.4f\" }}/s over 10m). Alerts may not be reaching the notification path."

      # Alerts dropped before reaching Alertmanager (P0 #5).
      #
      # prometheus_notifications_dropped_total counts alerts dropped (queue full /
      # no Alertmanager available). Live baseline 2026-06-09: value 0.
      - alert: PrometheusNotificationsDropped
        expr: |
          increase(prometheus_notifications_dropped_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Prometheus is dropping alert notifications"
          description: "Prometheus dropped {{ $value | printf \"%.0f\" }} alert notification(s) in the last 10 minutes (no Alertmanager reachable or send queue full). Alerts are being lost before delivery."

      # Notification delivery health on the Alertmanager side (P0 #5).
      #
      # alertmanager_notifications_failed_total is broken down per integration
      # (email/discord/webhook/etc). This metric only becomes available once the
      # `alertmanager` scrape job lands (it shipped in the same deploy as this
      # file). That job is live — verified 2026-07-27: up{job="alertmanager"}==1
      # on localhost:9093 and the counter is present per integration.
      - alert: AlertmanagerNotificationsFailed
        expr: |
          rate(alertmanager_notifications_failed_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Alertmanager failing to deliver notifications via {{ $labels.integration }}"
          description: "Alertmanager integration {{ $labels.integration }} is failing to deliver notifications ({{ $value | printf \"%.4f\" }}/s over 10m). The iPhone/email/Discord delivery path may be broken."

      # Prometheus rule evaluation failures (P1, monitoring-self).
      #
      # prometheus_rule_evaluation_failures_total increments when a recording or
      # alerting rule's expr errors out at eval time (bad PromQL, missing function,
      # etc). A failing rule produces NO data — so any alert built on it silently
      # never fires. Live baseline 2026-06-09: counter flat, increase over 15m = 0
      # firing series, so this does NOT fire on deploy.
      - alert: PrometheusRuleEvaluationFailures
        expr: |
          increase(prometheus_rule_evaluation_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Prometheus rule evaluation is failing in group {{ $labels.rule_group }}"
          description: "Prometheus has logged {{ $value | printf \"%.0f\" }} rule evaluation failure(s) in the last 15 minutes (rule group {{ $labels.rule_group }}). A rule whose expr errors produces no data, so any alert built on it is silently blind — fix the expr."

      # Prometheus rule-group evaluation falling behind (P1, monitoring-self).
      #
      # prometheus_rule_group_iterations_missed_total increments when a rule group
      # cannot complete an evaluation before its next scheduled iteration (eval
      # slower than the group interval). Missed iterations mean alerts are
      # evaluated late or skipped. Live baseline 2026-06-09: counter flat,
      # increase over 15m = 0 firing series, so this does NOT fire on deploy.
      - alert: PrometheusRuleGroupMissed
        expr: |
          increase(prometheus_rule_group_iterations_missed_total[15m]) > 0
        for: 10m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Prometheus rule group {{ $labels.rule_group }} is missing evaluations"
          description: "Prometheus rule group {{ $labels.rule_group }} missed {{ $value | printf \"%.0f\" }} evaluation iteration(s) in the last 15 minutes (evaluation is slower than the group interval). Alerts in this group are being evaluated late or skipped."

      # Promtail (log shipper) down (P1, monitoring-self).
      #
      # Promtail tails the systemd journal and ships it to Loki. If promtail is
      # down, NO new log lines reach Loki, so EVERY Loki-based alert goes silently
      # blind: the UAS enclosure abort-storm early warning, SSH brute-force /
      # invalid-user detection, OOM-killer detection, nginx 5xx/auth bursts, and
      # every other LogQL rule stop firing without any error. Live baseline
      # 2026-06-09: up{job="promtail"}=1, so ==0 yields no series and does NOT fire.
      - alert: PromtailDown
        expr: up{job="promtail"} == 0
        for: 5m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Promtail (log shipper to Loki) is down"
          description: "Promtail has been unreachable for over 5 minutes. No new journal lines are reaching Loki, so EVERY Loki-based alert (UAS enclosure abort-storm, SSH brute-force/invalid-user, OOM-killer, nginx 5xx/auth bursts) is silently blind until promtail recovers."

      # Loki (log store + ruler) down (P1, monitoring-self).
      #
      # Loki stores the logs promtail ships and evaluates the LogQL ruler rules. If
      # Loki is down the blast radius is the same as PromtailDown — every Loki-based
      # alert goes silently blind — and additionally any already-shipped logs cannot
      # be queried. Critical because the UAS/SSH/OOM safety rules live here. Live
      # baseline 2026-06-09: up{job="loki"}=1, so ==0 yields no series and does NOT
      # fire.
      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 5m
        labels:
          severity: critical
          category: monitoring
        annotations:
          summary: "Loki (log store and LogQL ruler) is down"
          description: "Loki has been unreachable for over 5 minutes. The LogQL ruler is not evaluating, so EVERY Loki-based alert (UAS enclosure abort-storm, SSH brute-force/invalid-user, OOM-killer, nginx 5xx/auth bursts) is silently blind, and shipped logs cannot be queried until Loki recovers."

      # iPhone critical-push relay listener down (P1, monitoring-self).
      #
      # Alertmanager's `iphone-notifier` receiver POSTs critical alerts to the
      # Node-RED HTTP-In endpoint at http://127.0.0.1:1880/alert (see
      # modules/services/alertmanager.nix). If that listener is down, critical
      # alerts never reach the phone — even though Alertmanager itself reports
      # success at the queue level. The blackbox probe target is added by the
      # web-blackbox workstream (a GET probe of the /alert endpoint, accepting
      # 404/405 since it is a POST-only route — any response proves the listener is
      # up). The instance is matched by host:port regex because the exact target
      # string (path / trailing slash) is owned by the other workstream. That
      # target has since landed — verified 2026-07-27:
      # probe_success{job="blackbox_iphone_relay",
      # instance="http://127.0.0.1:1880/alert"} == 1 — so this rule is live, not
      # dormant. (Were the target ever removed, the selector would match no
      # series and the rule would silently stop firing.)
      - alert: IphoneRelayEndpointDown
        expr: |
          probe_success{instance=~"https?://127\\.0\\.0\\.1:1880(/.*)?"} == 0
        for: 5m
        labels:
          severity: critical
          category: monitoring
        annotations:
          summary: "iPhone critical-push relay listener is down"
          description: "iPhone critical-push relay listener down — critical alerts will not reach the phone. The Node-RED /alert HTTP endpoint that Alertmanager's iphone-notifier receiver POSTs to (http://127.0.0.1:1880/alert) has failed its blackbox probe for over 5 minutes. Critical alerts may be silently undelivered to the phone even while Alertmanager reports queue-level success."

      # vmalert down (P1, monitoring-self).
      #
      # vmalert evaluates alerting/recording rules against VictoriaMetrics (the
      # HA-pushed pool/water/sensor series). The `vmalert` scrape job was added by
      # the vmalert workstream in the same deploy as this rule; that job now
      # exists — verified 2026-07-27: up{job="vmalert"}==1 on 127.0.0.1:8880 — so
      # this rule is live and catches the VM-side rule evaluator going down. (If
      # the job were ever removed, up{job="vmalert"} would have no series and
      # ==0 would yield nothing, i.e. the rule fails silent, not loud.)
      - alert: VMAlertDown
        expr: up{job="vmalert"} == 0
        for: 5m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "vmalert (VictoriaMetrics rule evaluator) is down"
          description: "vmalert has been unreachable for over 5 minutes. Alerting and recording rules evaluated against VictoriaMetrics (HA-pushed pool/water/sensor series) are not running, so VM-backed alerts are silently blind until vmalert recovers."

  # =====================================================================
  # Config-reload health (P2). A failed config reload means Prometheus or
  # Alertmanager is still running on the OLD config — newly-added rules /
  # routes silently never take effect. Both metrics confirmed live
  # 2026-06-10: prometheus_config_last_reload_successful=1,
  # alertmanager_config_last_reload_successful=1. ==0 yields no series, so
  # neither fires on deploy.
  # =====================================================================
  - name: meta_config_reload
    interval: 30s
    rules:
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
          category: monitoring
        annotations:
          summary: "Prometheus configuration reload failed"
          description: "Prometheus failed to reload its configuration (prometheus_config_last_reload_successful=0) for over 5 minutes. Prometheus is running on the LAST-GOOD config — any newly-added scrape jobs or alert rules are silently not in effect until the config is fixed and reloaded."

      - alert: AlertmanagerConfigReloadFailed
        expr: alertmanager_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
          category: monitoring
        annotations:
          summary: "Alertmanager configuration reload failed"
          description: "Alertmanager failed to reload its configuration (alertmanager_config_last_reload_successful=0) for over 5 minutes. Alertmanager is running on the LAST-GOOD config — any newly-added routes/receivers/inhibitions are silently not in effect, so alerts may route or suppress incorrectly until fixed."

  # =====================================================================
  # Loki ruler health (P2). Loki's ruler embeds the Prometheus rule engine, so
  # its metrics are prefixed `loki_prometheus_*`. The UAS-enclosure, SSH/auth,
  # nginx-web and other LogQL safety rules run here; if the ruler fails to
  # evaluate, those alerts go silently blind. Verified live 2026-06-10 (7 ruler
  # groups): evaluation_failures=0, iterations_missed=0, notifications_errors=0,
  # ring_check_errors=0, config_last_reload_successful=1. None fire on deploy.
  # (Loki on this version exposes no ruler "evaluation duration too high" gauge
  # worth alerting on; these four are the solid, verified signals.)
  # =====================================================================
  - name: meta_loki_ruler
    interval: 30s
    rules:
      # A ruler rule's expr errored at eval time -> that rule produced no data,
      # so any Loki alert built on it is silently blind. Per rule_group.
      - alert: LokiRulerEvaluationFailures
        expr: |
          increase(loki_prometheus_rule_evaluation_failures_total[15m]) > 0
        for: 10m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Loki ruler rule evaluation failing in group {{ $labels.rule_group }}"
          description: "Loki's ruler has logged {{ $value | printf \"%.0f\" }} rule evaluation failure(s) in the last 15 minutes (group {{ $labels.rule_group }}). A LogQL rule whose expr errors produces no data, so any alert built on it (UAS abort-storm, SSH/auth, nginx 5xx) is silently blind — fix the expr."

      # Ruler eval falling behind its group interval -> alerts evaluated late
      # or skipped.
      - alert: LokiRulerEvaluationsMissed
        expr: |
          increase(loki_prometheus_rule_group_iterations_missed_total[15m]) > 0
        for: 10m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Loki ruler is missing evaluations in group {{ $labels.rule_group }}"
          description: "Loki's ruler missed {{ $value | printf \"%.0f\" }} evaluation iteration(s) in the last 15 minutes (group {{ $labels.rule_group }}); evaluation is slower than the group interval, so LogQL alerts in this group are evaluated late or skipped."

      # Ruler failing to push its firing alerts to Alertmanager.
      - alert: LokiRulerNotificationErrors
        expr: |
          increase(loki_prometheus_notifications_errors_total[15m]) > 0
        for: 10m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Loki ruler is failing to deliver alerts to Alertmanager"
          description: "Loki's ruler has logged {{ $value | printf \"%.0f\" }} notification error(s) in the last 15 minutes pushing firing LogQL alerts to Alertmanager. Loki-based alerts may not be reaching the notification path."

      # Ruler config failed to load -> the LogQL ruler is not running the rules
      # at all. (config_last_reload_successful is a 0/1 gauge, baseline 1.)
      - alert: LokiRulerConfigReloadFailed
        expr: loki_ruler_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Loki ruler failed to load its rule configuration"
          description: "Loki's ruler failed to load its rule configuration (loki_ruler_config_last_reload_successful=0) for over 5 minutes. The LogQL safety rules (UAS abort-storm, SSH/auth, nginx 5xx) may not be loaded/evaluating at all."

  # =====================================================================
  # Generic textfile-collector staleness (P2). One pair of rules covers EVERY
  # textfile collector. node_textfile_mtime_seconds carries the file path as the
  # `file` label; if a collector's timer dies or its oneshot starts failing, the
  # .prom file stops being rewritten and every metric it produces goes silently
  # FROZEN at its last value (not "absent", not "down" — just stale and wrong).
  #
  # Files are split into TWO cadence groups by an explicit allowlist (verified
  # live 2026-06-10 — every listed file is present and within its cadence):
  #   * fast (sub-hourly timers): >30m stale is anomalous.
  #   * daily (24h timers): >26h stale is anomalous.
  # Files NOT listed (weekly restic, ~24h-but-bursty rclone mirrors, hourly
  # schwab, certificates, etc.) are intentionally excluded from the generic rule
  # because their legitimate cadence is slow/irregular; they have their own
  # last-success triads. Baseline: 0 firing series in either group.
  # =====================================================================
  - name: meta_textfile_staleness
    interval: 1m
    rules:
      # Fast-cadence collectors (1-2 min timers).
      - alert: TextfileCollectorStaleFast
        expr: |
          time() - node_textfile_mtime_seconds{file=~".*/(asymmetric_routing|nodered_safety|container_health|zfs_pool_health|nagios_status)\\.prom"} > 1800
        for: 30m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Fast-cadence textfile collector {{ $labels.file }} is stale"
          description: "{{ $labels.file }} has not been rewritten in over 30 minutes (its timer runs every 1-2 min). Every metric this collector produces is now FROZEN at its last value, so any alert reading those metrics is silently stale. Check the corresponding *-exporter oneshot/timer."

      # Hourly-cadence collectors.
      #
      # Added 2026-07-31 while retiring Nagios. secrets-perms is SECURITY-relevant and was
      # watched only by Nagios: secrets-perms.prom feeds exactly one rule,
      # SecretsWorldReadable (security.yaml, secrets_world_readable_count > 0). If the scanner
      # dies the gauge freezes at 0 and that alert becomes silently unfirable -- the failure
      # mode where monitoring reports "no problem" because it stopped looking.
      #
      # 3h, not the 30m Fast tier: secrets-perms-exporter.timer is hourly (verified live), so
      # a 30m threshold would false-positive between every run. 3h tolerates two missed runs.
      - alert: TextfileCollectorStaleHourly
        expr: |
          time() - node_textfile_mtime_seconds{file=~".*/(secrets-perms)\\.prom"} > 10800
        for: 30m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Hourly textfile collector {{ $labels.file }} is stale"
          description: "{{ $labels.file }} has not been rewritten in over 3 hours (its timer runs hourly). The metrics it produces are FROZEN at their last value. For secrets-perms this is security-relevant: SecretsWorldReadable reads secrets_world_readable_count, which freezes at its last value (normally 0) and stops being able to fire. Check secrets-perms-exporter.service/.timer."

      # Daily-cadence collectors (~24h timers).
      #
      # `aide` added 2026-07-31 while retiring Nagios. aide-metrics.nix and security/aide.nix
      # both state in their own comments that the NAGIOS check was the only watcher of this
      # collector's freshness. Without it, a dead aide-metrics.timer freezes
      # aide_database_age_seconds at a small value and AIDEDatabaseStale (security.yaml)
      # becomes structurally unfirable. Verified: aide-metrics.timer is OnCalendar daily at
      # 00:00, so the existing 26h threshold fits without adjustment.
      - alert: TextfileCollectorStaleDaily
        expr: |
          time() - node_textfile_mtime_seconds{file=~".*/(container_store_size|system_age|pg_dump|technitium_backup|nodered_backup|aide)\\.prom"} > 93600
        for: 30m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Daily textfile collector {{ $labels.file }} is stale"
          description: "{{ $labels.file }} has not been rewritten in over 26 hours (its timer runs ~daily). The metrics it produces are FROZEN at their last value, so freshness/size/last-success signals derived from it are no longer trustworthy. Check the corresponding daily job/timer."
