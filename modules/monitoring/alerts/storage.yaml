groups:
  - name: storage_alerts
    interval: 30s
    rules:
      # ZFS alerts
      - alert: ZFSPoolDataErrors
        expr: zfs_pool_data_errors > 0
        for: 5m
        labels:
          severity: critical
          category: storage
          service: zfs
        annotations:
          summary: "ZFS pool {{ $labels.pool }} has permanent data errors"
          description: "Pool {{ $labels.pool }} has {{ $value }} permanent data error(s). Data may be corrupted and unrecoverable on a single-device pool. Backup data immediately and investigate hardware."

      - alert: ZFSPoolDeviceErrors
        expr: zfs_pool_device_read_errors > 10 or zfs_pool_device_checksum_errors > 10
        for: 5m
        labels:
          severity: warning
          category: storage
          service: zfs
        annotations:
          summary: "ZFS pool {{ $labels.pool }} device has I/O errors"
          description: "Pool {{ $labels.pool }} has accumulated read or checksum errors on a device, indicating hardware degradation."

      # Sustained disk saturation across the four tank-backing UAS disks
      # (sda-sdd, the OWC enclosure bays). node_disk_io_time_seconds_total is
      # cumulative busy-seconds; rate over 10m gives the fraction of wall time the
      # device spent doing I/O (1.0 = pegged). Averaged across the four bays, >0.9
      # sustained for 20m means the pool is the bottleneck — slow services, growing
      # backup windows, and an early sign the enclosure bridge is struggling before
      # it aborts outright. Baseline-checked: current avg ~0.56, 7-day max ~0.73,
      # and ZERO 5-minute samples exceeded 0.9 in the last 7 days (nightly backups
      # and the monthly scrub — scrub is throttled to 1 active vdev — do NOT reach
      # it), so 0.9/20m will not chronically fire. Warning, not critical: this is a
      # performance/early-degradation signal, not data loss.
      - alert: ZFSPoolIOSaturated
        expr: avg(rate(node_disk_io_time_seconds_total{device=~"sd[a-d]"}[10m])) > 0.9
        for: 20m
        labels:
          severity: warning
          category: storage
          service: zfs
        annotations:
          summary: "tank disks saturated (sustained ~100% busy)"
          description: "The four tank-backing UAS disks (sda-sdd) have averaged over 90% busy for 20 minutes ({{ $value | humanizePercentage }} of wall time spent on I/O). The pool is the bottleneck; check for a runaway backup/sync, a scrub, or — given the OWC enclosure history — an early sign the UAS bridge is struggling (see project_tank_uas_enclosure_failure)."

      - alert: ZFSPoolDegraded
        expr: node_zfs_zpool_state{state!="online"} == 1
        for: 1m
        labels:
          severity: critical
          category: storage
          service: zfs
        annotations:
          summary: "ZFS pool degraded on {{ $labels.instance }}"
          description: "ZFS pool {{ $labels.zpool }} is in {{ $labels.state }} state"

      # Pool I/O frozen. ZFS suspends a pool when it can no longer reach its
      # vdevs (the UAS-enclosure cascade: bridge hangs -> all 4 disks drop ->
      # pool SUSPENDED -> Immich/Copyparty/aria2/backups all stall). node_exporter's
      # zpool_state can still report ONLINE in this case, so this fires off the
      # textfile collector that greps "zpool status" directly. for:0 — every
      # second the pool is frozen is data loss / cascade in progress.
      # Runbook: physically power-cycle the OWC enclosure, then `zpool import tank`
      # (see memory project_tank_uas_enclosure_failure).
      - alert: ZFSPoolSuspended
        expr: zfs_pool_suspended == 1 or zfs_pool_unavail == 1
        for: 0m
        labels:
          severity: critical
          category: storage
          service: zfs
        annotations:
          summary: "ZFS pool {{ $labels.pool }} I/O is SUSPENDED — cascade in progress"
          description: "Pool {{ $labels.pool }} is SUSPENDED/UNAVAIL: all I/O is frozen and every dependent service (Immich, Copyparty, aria2, backups) is stalling. Likely the UAS-enclosure abort-storm. RUNBOOK: physically power-cycle the OWC Mercury Elite Pro Quad enclosure, then `zpool import tank` (see project_tank_uas_enclosure_failure)."

      - alert: ZFSPoolCapacityHigh
        expr: (zfs_pool_allocated_bytes / zfs_pool_size_bytes) * 100 > 80
        for: 5m
        labels:
          severity: warning
          category: storage
          service: zfs
        annotations:
          summary: "ZFS pool capacity high"
          description: "ZFS pool {{ $labels.pool }} is at {{ $value }}% capacity"

      - alert: ZFSPoolCapacityCritical
        expr: (zfs_pool_allocated_bytes / zfs_pool_size_bytes) * 100 > 90
        for: 1m
        labels:
          severity: critical
          category: storage
          service: zfs
        annotations:
          summary: "ZFS pool capacity critical"
          description: "ZFS pool {{ $labels.pool }} is at {{ $value }}% capacity"

      - alert: ZFSPoolFreeSpaceLow
        expr: zfs_dataset_available_bytes{name=~"^tank$",type="filesystem"} < 500 * 1024 * 1024 * 1024
        for: 1h
        labels:
          severity: warning
          category: storage
          service: zfs
        annotations:
          summary: "ZFS pool {{ $labels.pool }} has less than 500GB free"
          description: "Pool {{ $labels.pool }} has {{ $value | humanize1024 }}B available"

      # Per-dataset space exhaustion. The pool-level ZFSPoolFreeSpaceLow /
      # ZFSPoolCapacity* rules above watch the whole pool; this watches an
      # INDIVIDUAL dataset filling up while the pool overall still has room — a
      # dataset with an effective limit (quota/refquota, or simply a heavy
      # consumer) can hit ENOSPC and break its service long before the pool does.
      # The zfs_exporter emits zfs_dataset_{used,available}_bytes per dataset
      # (58 filesystems live; cardinality already present, no new series). Guard
      # on BOTH a small absolute headroom (<5 GiB) AND a high fill ratio (>90%)
      # so large datasets with terabytes free don't trip on the ratio alone and a
      # tiny dataset that is 95% full but has gigabytes free isn't flagged. Both
      # conditions false across all 58 datasets at deploy (baseline-checked).
      - alert: ZFSDatasetSpaceLow
        expr: |
          zfs_dataset_available_bytes{type="filesystem"} < 5 * 1024 * 1024 * 1024
          and
          (
            zfs_dataset_used_bytes{type="filesystem"}
            / (zfs_dataset_used_bytes{type="filesystem"} + zfs_dataset_available_bytes{type="filesystem"})
          ) > 0.9
        for: 30m
        labels:
          severity: warning
          category: storage
          service: zfs
        annotations:
          summary: "ZFS dataset {{ $labels.name }} is nearly full"
          description: "Dataset {{ $labels.name }} has only {{ $value | humanize1024 }}B available and is over 90% full. A service writing to it may hit ENOSPC even though pool {{ $labels.pool }} as a whole still has space. Check `zfs list -o name,used,avail,quota {{ $labels.name }}`."

      # Direct /tank availability alert, independent of the zfs_exporter and the
      # textfile collector. node-exporter's systemd collector does NOT expose a
      # `tank.mount` unit series on this host (verified absent), so a mount-unit
      # state rule is impossible; instead detect the pool's filesystem vanishing
      # from node_exporter's filesystem collector. When the UAS enclosure drops
      # and `tank` is exported/unmounted, node_filesystem_size_bytes{mountpoint=
      # "/tank"} disappears entirely, so absent() flips to 1. This is the simplest,
      # most direct "is /tank actually mounted" signal and complements the
      # ZFSPoolSuspended / collector-stale rules (which read the textfile that the
      # collector cannot write once /tank is gone). 5m tolerates a brief
      # export/reimport during maintenance.
      - alert: TankMountGone
        expr: absent(node_filesystem_size_bytes{mountpoint="/tank"}) == 1
        for: 5m
        labels:
          severity: critical
          category: storage
          service: zfs
        annotations:
          summary: "/tank is not mounted"
          description: "node_exporter no longer reports a filesystem at /tank — the tank pool is unmounted or gone. Every dependent service (Immich, Copyparty, aria2, backups, bind mounts) is broken. Likely the UAS-enclosure drop: power-cycle the OWC Mercury Elite Pro Quad enclosure, then `zpool import tank` (see project_tank_uas_enclosure_failure)."

      # Scrub is the monthly bit-rot / integrity sweep (zfs-scrub.timer). The
      # textfile collector parses the completed-scrub "scan:" line of `zpool
      # status`. If the timestamp stops advancing the monthly sweep silently
      # stopped (timer disabled, scrub never finishing, or the collector itself
      # producing only the seed 0). 45d = monthly cadence + ~2-week grace.
      # Excludes the seed value 0 so a brand-new pool / never-scrubbed pool does
      # not alarm before its first scrub completes.
      - alert: ZFSScrubStale
        expr: zfs_pool_last_scrub_timestamp_seconds > 0 and (time() - zfs_pool_last_scrub_timestamp_seconds) > 45 * 86400
        for: 1h
        labels:
          severity: warning
          category: storage
          service: zfs
        annotations:
          summary: "ZFS pool {{ $labels.pool }} scrub is overdue"
          description: "Pool {{ $labels.pool }} has not completed a scrub in over 45 days (last finished {{ $value | humanizeDuration }} ago; scrubs run monthly via zfs-scrub.timer). The monthly bit-rot integrity sweep may have stopped."

      # A completed scrub that found errors means latent corruption was detected
      # (and possibly repaired on a redundant vdev; on the single-device OS pool
      # it is unrecoverable). for:0 — surface immediately once a scrub finishes.
      - alert: ZFSScrubErrors
        expr: zfs_pool_last_scrub_errors > 0
        for: 0m
        labels:
          severity: critical
          category: storage
          service: zfs
        annotations:
          summary: "ZFS pool {{ $labels.pool }} last scrub found errors"
          description: "Pool {{ $labels.pool }}'s most recent scrub reported {{ $value }} error(s). Latent corruption was detected. Investigate `zpool status -v {{ $labels.pool }}` and the underlying devices (see project_tank_uas_enclosure_failure)."

      # Sanoid (sanoid.timer, hourly) is the snapshot engine. If it stalls the
      # newest snapshot creation time stops advancing — point-in-time recovery
      # silently degrades while everything else looks healthy. >6h = several
      # missed hourly runs. Excludes 0 (a pool with no snapshots at all).
      - alert: ZFSSnapshotStale
        expr: zfs_newest_snapshot_timestamp_seconds > 0 and (time() - zfs_newest_snapshot_timestamp_seconds) > 6 * 3600
        for: 30m
        labels:
          severity: warning
          category: storage
          service: zfs
        annotations:
          summary: "ZFS pool {{ $labels.pool }} has no recent snapshots"
          description: "The newest snapshot under pool {{ $labels.pool }} is over 6 hours old (last: {{ $value | humanizeDuration }} ago). Sanoid (sanoid.timer, hourly) may have stopped taking snapshots — check systemctl status sanoid.timer and journalctl -u sanoid."

      # Collector liveness. The zfs-pool-health-metrics timer runs every 2min; if
      # the textfile stops being refreshed every other ZFS rule above goes quietly
      # stale (last value frozen, never "firing"). >15m = several missed runs.
      - alert: ZFSPoolHealthCollectorStale
        expr: (time() - zfs_pool_health_collector_run_timestamp_seconds) > 900
        for: 5m
        labels:
          severity: warning
          category: storage
          service: zfs
        annotations:
          summary: "ZFS pool-health textfile collector is stale"
          description: "zfs-pool-health-metrics has not produced a fresh textfile in over 15 minutes (last run {{ $value | humanizeDuration }} ago; expected every 2 min). All ZFS pool/scrub/snapshot/suspended alerts are reading frozen data. Check systemctl status zfs-pool-health-metrics.timer."

      # Backup alerts - Restic repository checks
      - alert: ResticCheckFailed
        expr: restic_check_success{repository!=""} == 0
        for: 5m
        labels:
          severity: critical
          category: storage
          service: restic
        annotations:
          summary: "Restic repository check failed"
          description: "Restic check for repository {{ $labels.repository }} has failed"

      # Alert threshold: 30 hours (108000s)
      # Rationale: Backups run daily at 02:00, metrics collection runs every 6 hours.
      # The 30h threshold prevents false alerts during the ~40min window each day
      # when metrics are stale (between 28h mark and next metrics collection at 06:39).
      # With 30h threshold, there's a 2h buffer before alerting on actual failures.
      - alert: ResticNoRecentSnapshot
        expr: (time() - restic_last_snapshot_timestamp_seconds{repository!=""}) > 108000
        for: 10m
        labels:
          severity: warning
          category: storage
          service: restic
        annotations:
          summary: "Restic repository has no recent snapshots"
          description: "Repository {{ $labels.repository }} hasn't had a snapshot in over 30 hours (last: {{ $value | humanizeDuration }} ago)"

      - alert: ResticNoSnapshots
        expr: restic_snapshots_total{repository!=""} == 0
        for: 5m
        labels:
          severity: critical
          category: storage
          service: restic
        annotations:
          summary: "Restic repository has no snapshots"
          description: "Repository {{ $labels.repository }} has no snapshots at all"

      # ===================================================================
      # ARCHETYPE (a): SNAPSHOT AMPLIFICATION ON A BACKUP MIRROR
      # ===================================================================
      # Added 2026-07-28. This is one of the three silent failures the operator named:
      # tank/Backups/PostgreSQL was holding ~1.7 TiB of snapshot residue for ~40 GiB of
      # live data and NOTHING alerted, because every existing storage rule watches POOL
      # capacity or absolute growth, never the relationship between a dataset's total
      # `used` and its live `usedbydataset`.
      #
      # Why the rule is shaped like this, having disproved two simpler forms live:
      #
      #  1. NOT `used_by_snapshot_bytes` -- that metric DOES NOT EXIST on this host. The
      #     zfs exporter emits only available/logical_used/quota/referenced/used/
      #     used_by_dataset/written. So amplification has to be inferred as
      #     used - usedbydataset, which is snapshots PLUS children.
      #  2. NOT a bare ratio, and NOT a ratio with a size floor. Because the proxy folds in
      #     CHILDREN, container datasets dominate it absurdly: measured live, tank/Models
      #     shows a ratio of 99,160,352 and tank/Backups/Contracts 5,916,881, simply because
      #     their own usedbydataset is near zero while `used` includes descendants. A
      #     `used > 100GiB` floor does NOT fix this (all those containers are huge), and a
      #     `usedbydataset > 1GiB` guard still lets tank/Backups through at 83.7.
      #     CORRECTION 2026-07-29: an earlier version of this comment claimed PromQL "cannot
      #     express is-a-leaf-dataset". That is FALSE -- the container set is derivable with
      #     label_replace(..., "name", "$1", "name", "(.+)/[^/]+") and removable with
      #     `unless on(name)`, using only metrics that exist. The narrow scoping below is kept
      #     for the OTHER reason given (a high ratio is legitimate on many datasets, so this
      #     invariant is only meaningful for mirrors), not because it was impossible.
      #
      # So the rule is scoped to the datasets where the invariant is actually MEANINGFUL:
      # the flat rsync MIRRORS created by the 2026-06-10 conversion. For a mirror, live data
      # and snapshot residue should stay within an order of magnitude, because rsync
      # --checksum is supposed to let unchanged blocks be shared. A high ratio there means
      # block sharing has stopped working. For an arbitrary dataset a high ratio can be
      # perfectly legitimate (long retention over churny data), which is why this is NOT a
      # fleet-wide rule.
      #
      # BOTH conditions are required, and each earns its place:
      #   ratio > 10          -- the invariant is violated
      #   wasted > 100 GiB    -- and it is worth acting on
      # Measured live at authoring time, all three mirrors violate the RATIO but only one is
      # actionable:
      #   tank/Backups/PostgreSQL     ratio  43.7   wasted 1719.6 GiB  -> FIRES
      #   tank/Backups/TechnitiumDNS  ratio 130.6   wasted   20.0 GiB  -> quiet (worst ratio
      #                                                                  among the three
      #                                                                  MIRRORS -- not on the
      #                                                                  host; container
      #                                                                  datasets reach
      #                                                                  99,160,352 -- but
      #                                                                  20 GiB is not worth
      #                                                                  a page)
      #   tank/Backups/NodeRED        ratio  15.9   wasted    0.0 GiB  -> quiet
      # Ratio alone would have paged for 20 GiB; absolute waste alone would have missed the
      # invariant entirely. Verified: the combined expression returns exactly 1 series.
      #
      # MAINTENANCE: adding a new flat-mirror dataset means adding it to the name regex.
      # This is deliberate over a fleet-wide rule, for the container-dataset reason above.
      # Known blind spot from that choice: tank/iCloud currently sits at ratio 14.0 with
      # 64.4 GiB of waste -- a leaf the regex will never see, and the next candidate to cross
      # the 100 GiB threshold.
      #
      # KNOWN LIMITATION of the two ANDed conditions: because both must hold, the rule goes
      # SILENT if the ratio falls below 10 while the waste stays high. Concretely, with
      # today's ~1.76 TiB used, once live data exceeds roughly 176 GiB the ratio drops under
      # 10 and this stops firing with ~1.58 TiB of residue still present. The absolute-waste
      # condition can never page on its own. Accepted for now because the ratio is what
      # distinguishes broken block-sharing from a legitimately large dataset, but if the
      # PostgreSQL dump grows substantially this needs revisiting -- a separate
      # absolute-waste-only rule at a much higher floor would cover the gap.
      - alert: BackupMirrorSnapshotAmplification
        expr: |
          (zfs_dataset_used_bytes{name=~"tank/Backups/(PostgreSQL|TechnitiumDNS|NodeRED)"}
            - on(name,pool,instance,job) zfs_dataset_used_by_dataset_bytes) > 100*1024*1024*1024
          and on(name,pool,instance,job)
          (zfs_dataset_used_bytes{name=~"tank/Backups/(PostgreSQL|TechnitiumDNS|NodeRED)"}
            / on(name,pool,instance,job) zfs_dataset_used_by_dataset_bytes) > 10
        for: 1h
        labels:
          severity: warning
          category: storage
          service: restic
        annotations:
          summary: "Backup mirror {{ $labels.name }} is wasting {{ $value | humanize1024 }}B in snapshot residue"
          description: "Dataset {{ $labels.name }} is a flat rsync mirror, so its snapshots should share blocks with live data. It is currently holding {{ $value | humanize1024 }}B more than its live size, at over 10x amplification -- meaning block sharing has stopped working. Usual cause: a large file rewritten in full on every run (an uncompressed pg_dump of a high-churn table defeats rsync --checksum), so each snapshot pins a near-complete copy. Check `zfs list -o name,used,usedbydataset,usedbysnapshots -r tank/Backups` and `zfs list -t snapshot -r <dataset>`."

      # UNIT ERROR FIXED 2026-07-28: this was off by 86,400x and could never fire.
      # `rate()` returns a PER-SECOND change, but the threshold 10737418240 is 10 GiB and
      # the annotation promises "per day" -- so the rule actually demanded 10 GiB/SECOND,
      # i.e. about 844 TiB/day. (An earlier version of this comment said "864 PB/day",
      # which is wrong by ~1000x: 10 GiB/s x 86,400 = 843.75 TiB/day. The 86,400x FACTOR
      # claim itself is correct and the fix is unaffected.)
      # delta() over an explicit 24h window gives the per-day change the
      # annotation describes. delta() is also the correct function here: restic_repo_size_bytes
      # is a GAUGE that can decrease (prune/forget), and rate() is only valid on counters.
      - alert: ResticRepositorySizeGrowing
        expr: delta(restic_repo_size_bytes{repository!=""}[24h]) > 10737418240
        for: 1h
        labels:
          severity: info
          category: storage
          service: restic
        annotations:
          summary: "Restic repository growing rapidly"
          description: "Repository {{ $labels.repository }} is growing by more than 10GB per day"

      # Size-regression / bit-rot-of-intent detector. Restic repos are
      # append-only-ish: with forget+prune they fluctuate but never collapse to a
      # fraction of their trailing-2-week average unless something is wrong (a
      # bucket emptied, a misdirected backup, an over-aggressive prune). The
      # restic-metrics collector writes restic_repo_size_bytes=0 for a repo whose
      # `restic snapshots` call FAILED, which would otherwise trip this rule — so
      # gate on the value being a real nonzero size (> 0). The ResticCheckFailed /
      # ResticNoSnapshots rules already cover the failure/zero case.
      - alert: ResticRepoSizeShrunk
        expr: restic_repo_size_bytes{repository!=""} > 0 and restic_repo_size_bytes{repository!=""} < 0.6 * avg_over_time(restic_repo_size_bytes{repository!=""}[14d])
        for: 6h
        labels:
          severity: warning
          category: storage
          service: restic
        annotations:
          summary: "Restic repository {{ $labels.repository }} shrank sharply"
          description: "Repository {{ $labels.repository }} is now {{ $value | humanize1024 }}B — under 60% of its 14-day average size. A bucket may have been emptied, a backup misdirected, or a prune ran away. Verify with `restic -r <repo> snapshots` and `stats` before trusting the offsite copy."

      # Collector-run freshness for the offsite B2 path. restic-metrics.timer runs
      # every 6h (OnUnitActiveSec=6h, OnBootSec=5min, Persistent=true). If the timer
      # dies or the collector stops rewriting restic.prom, EVERY restic_* metric
      # freezes at its last value (restic_check_success stays 1 forever) and all the
      # restic.* alerts above silently read stale data. SystemdServiceFailed does NOT
      # catch this: the collector swallows per-repo errors and always reaches its
      # final mv + exit 0, and a dead timer produces no failed unit at all.
      # node_textfile_mtime would also work, but restic.prom is intentionally
      # excluded from the generic TextfileCollectorStale tiers (meta-monitoring.yaml)
      # — this is its dedicated freshness guard. Threshold 8h = 6h cadence + ~2h
      # grace: one missed boot-window run is normal under Persistent catch-up and the
      # collector can take many minutes across 9 repos (TimeoutSec=30m, worst-case
      # file age ~6.5h); two missed runs (a real dead timer) is wrong. max() collapses
      # the 9 per-repo series to one timestamp (all written in one collector pass);
      # absent() deliberately NOT used so a fresh deploy with the collector never-run
      # does not alarm (same convention as ResticIntegrityCheckStale). Baseline
      # verified live 2026-06-10: file age ~3.9h, rule not firing.
      - alert: ResticMetricsStale
        expr: (time() - max(restic_last_check_timestamp_seconds)) > 28800
        for: 10m
        labels:
          severity: warning
          category: storage
          service: restic
        annotations:
          summary: "Restic B2 metrics collector is stale"
          description: "restic-metrics has not refreshed restic.prom in over 8 hours (last collector pass {{ $value | humanizeDuration }} ago; expected every 6h). All restic_check_success / snapshot-freshness / repo-size alerts are now reading FROZEN values — a B2 outage or credential failure would not be detected. Check `systemctl status restic-metrics.timer` and `journalctl -u restic-metrics`."