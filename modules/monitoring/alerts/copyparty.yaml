groups:
  - name: copyparty
    interval: 30s
    rules:
      # Service availability
      - alert: CopypartyDown
        expr: up{job="copyparty"} == 0
        for: 5m
        labels:
          severity: critical
          service: copyparty
        annotations:
          summary: "Copyparty file server is down"
          description: "Copyparty service on {{ $labels.instance }} has been down for more than 5 minutes."
          action: "Check service status with 'systemctl status copyparty' and review logs"

      # Connection limits
      - alert: CopypartyHighConnections
        expr: cpp_http_conns > 50
        for: 15m
        labels:
          severity: warning
          service: copyparty
        annotations:
          summary: "High number of Copyparty connections"
          description: "Copyparty has {{ $value }} active connections for more than 15 minutes."
          action: "Monitor for abuse or consider increasing resource limits"

      # Ban activity monitoring
      - alert: CopypartyFrequentBans
        expr: increase(cpp_total_bans[1h]) > 10
        for: 5m
        labels:
          severity: warning
          service: copyparty
        annotations:
          summary: "High rate of Copyparty bans"
          description: "Copyparty has banned {{ $value }} IPs in the last hour."
          action: "Review logs for potential abuse or attack patterns"

      # Uptime tracking
      - alert: CopypartyRecentRestart
        expr: cpp_uptime_seconds < 300
        for: 1m
        labels:
          severity: info
          service: copyparty
        annotations:
          summary: "Copyparty recently restarted"
          description: "Copyparty has been running for only {{ $value | humanizeDuration }}."
          action: "Review logs if restart was unexpected"

      # Volume availability
      - alert: CopypartyVolumeUnavailable
        expr: (cpp_idle_vols + cpp_busy_vols) == 0
        for: 5m
        labels:
          severity: critical
          service: copyparty
        annotations:
          summary: "No Copyparty volumes available"
          description: "Copyparty is not serving any volumes. Configuration or mount issue."
          action: "Check /tank/Public mount and copyparty configuration"

      # Authentication failures. copyparty exposes no direct auth-failure
      # metric (verified 2026-07-27: the live cpp_* set has no auth counter),
      # so this uses the ban counter as a proxy — same series as
      # CopypartyFrequentBans above, at a shorter window and lower threshold.
      - alert: CopypartyAuthFailures
        expr: increase(cpp_total_bans[15m]) > 0
        for: 5m
        labels:
          severity: warning
          service: copyparty
        annotations:
          summary: "High rate of Copyparty authentication failures"
          description: "{{ $value }} authentication failures in the last 15 minutes."
          action: "Review logs for potential brute force attacks"

      # Suspicious request probing (404/path-traversal/scanner-shaped requests).
      # copyparty exposes cpp_sus_reqs_total (a counter of requests it flags as
      # suspicious). Baseline-checked live 2026-06-10: the counter is 0 now and
      # the max increase over ANY 30-minute window in the last 7 days is also 0
      # (no scanner activity reached copyparty in that window). A threshold of
      # >20 in 30m therefore sits far above the observed peak (3x+ headroom over
      # any realistic LAN-scanner tick) and only fires on a genuine probing
      # burst, not on the occasional stray 404.
      - alert: CopypartySuspiciousRequests
        expr: increase(cpp_sus_reqs_total[30m]) > 20
        for: 0m
        labels:
          severity: warning
          service: copyparty
        annotations:
          summary: "Burst of suspicious requests to Copyparty"
          description: "Copyparty flagged {{ $value | printf \"%.0f\" }} suspicious requests in the last 30 minutes (path-traversal / scanner-shaped probes). Normal baseline is ~0."
          action: "Review copyparty logs for the source IP and request pattern; ban or firewall if it is an external scanner."
