groups:
  - name: database_alerts
    interval: 30s
    rules:
      # PostgreSQL alerts
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL exporter cannot connect to database"

      # Connection saturation. NOTE: the obvious form
      #   pg_stat_database_numbackends / pg_settings_max_connections
      # is a DEAD expr on this host — numbackends carries datname+server labels
      # while max_connections is a single cluster-wide series, so the vector
      # match yields no result (verified empty live 2026-06-10). Use the total
      # backend count over the scalar limit instead. max_connections=200,
      # baseline ~89 backends (~0.45).
      - alert: PostgreSQLTooManyConnections
        expr: sum(pg_stat_activity_count) / scalar(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL connection pool over 80%"
          description: "PostgreSQL is using {{ $value | humanizePercentage }} of max_connections (200). Approaching saturation — connection leak or runaway client?"

      - alert: PostgreSQLConnectionsCritical
        expr: sum(pg_stat_activity_count) / scalar(pg_settings_max_connections) > 0.95
        for: 2m
        labels:
          severity: critical
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL connection pool over 95%"
          description: "PostgreSQL is using {{ $value | humanizePercentage }} of max_connections (200). New connections (incl. superuser_reserved) will start failing imminently."

      - alert: PostgreSQLSlowQueries
        expr: rate(pg_stat_database_blks_read[5m]) > 1000
        for: 5m
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL experiencing slow queries"
          description: "High block read rate indicates potential slow queries"

      - alert: PostgreSQLDeadlocks
        expr: rate(pg_stat_database_deadlocks[5m]) > 0
        for: 5m
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL deadlocks detected"
          description: "Database {{ $labels.datname }} is experiencing deadlocks"

      # pg_dump backup integrity / freshness (textfile collector from
      # modules/services/postgresql-backup.nix). A green systemd exit is NOT
      # proof of a complete dump: on 2026-06-02 the run exited 0 but truncated
      # to 2.7 GB when /tank dropped mid-xz. These rules catch silent failures.
      - alert: PgDumpFailed
        expr: pg_dump_last_success == 0
        for: 5m
        labels:
          severity: critical
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL backup (pg_dumpall) failed"
          description: "The most recent postgresql-backup run did not exit successfully (pg_dump_last_success == 0). Inspect: journalctl -u postgresql-backup"

      - alert: PgDumpStale
        expr: time() - pg_dump_last_run_timestamp_seconds > 97200
        for: 5m
        labels:
          severity: critical
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL backup is stale"
          description: "No successful postgresql-backup run in over 27h (daily 02:00 job + 3h grace). Last run {{ $value | humanizeDuration }} ago."

      - alert: PgDumpSizeShrunk
        expr: pg_dump_size_bytes < 0.5 * avg_over_time(pg_dump_size_bytes[14d])
        for: 1h
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL backup is suspiciously small"
          description: "The newest pg_dumpall artifact ({{ $value | humanize1024 }}B) is under half its 14d average size — likely a truncated/corrupt dump (cf. the 2026-06-02 2.7 GB truncation)."

      # Long-running transactions. pg_stat_activity_max_tx_duration is the max
      # transaction age (seconds) per state (default exporter metric). A
      # transaction open >1h holds back vacuum (bloat/wraparound) and can pin
      # locks. We watch the states a stuck client produces — active and
      # idle-in-transaction — and EXCLUDE plain idle / fastpath / disabled.
      # Caveat: a legitimately long autovacuum or backup query runs as
      # state="active"; at >1h sustained 10m that is itself worth surfacing.
      - alert: PostgreSQLLongRunningTransaction
        expr: |
          max (pg_stat_activity_max_tx_duration{state=~"active|idle in transaction|idle in transaction \\(aborted\\)"}) > 3600
        for: 10m
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL transaction running over 1 hour"
          description: "A transaction has been open for {{ $value | humanizeDuration }}. Long transactions block vacuum (bloat + wraparound) and may hold locks. Inspect pg_stat_activity for stuck sessions."

      # Idle-in-transaction sessions. idle_in_transaction_session_timeout is
      # 10min cluster-wide, so a SUSTAINED count of idle-in-tx sessions means
      # the timeout is not reaping them (e.g. a pooler holding open txns) — they
      # pin xmin and starve vacuum. Baseline is 0; >5 for 10m is a real backlog.
      - alert: PostgreSQLIdleInTransaction
        expr: sum(pg_stat_activity_count{state="idle in transaction"}) > 5
        for: 10m
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL has many idle-in-transaction sessions"
          description: "{{ $value }} sessions are idle in transaction (sustained 10m, past the 10min idle_in_transaction_session_timeout). These pin xmin and block vacuum — look for a client leaking open transactions."

      # TXID / multixact wraparound (custom query in postgres-exporter.nix).
      # age(datfrozenxid) counts transactions since the database was last frozen;
      # at ~2.1e9 PostgreSQL forces a shutdown to avoid data loss. Baseline ~22M,
      # autovacuum_freeze_max_age=200M — so 1e9 (warning) / 1.5e9 (critical) fire
      # with large headroom but well before the cliff. mxid_age tracks the
      # parallel multixact-ID wraparound vector (baseline ~16k).
      - alert: PostgreSQLTxidWraparoundApproaching
        expr: max(pg_database_frozenxid_age) > 1e9 or max(pg_database_frozenxid_mxid_age) > 1e9
        for: 30m
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL transaction-ID age approaching wraparound"
          description: "A database's xid/multixact age has passed 1 billion (hard limit ~2.1 billion → forced shutdown). Aggressive autovacuum should be freezing — check for a long transaction / replication slot / prepared xact blocking it."

      - alert: PostgreSQLTxidWraparoundCritical
        expr: max(pg_database_frozenxid_age) > 1.5e9 or max(pg_database_frozenxid_mxid_age) > 1.5e9
        for: 5m
        labels:
          severity: critical
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL transaction-ID age critically near wraparound"
          description: "A database's xid/multixact age has passed 1.5 billion (hard limit ~2.1 billion → forced shutdown that requires single-user-mode VACUUM to recover). Act now: find and clear whatever is blocking freeze, then VACUUM FREEZE."

      # Home Assistant recorder DB growth. The hass DB is recorder-dominated; a
      # purge failure shows as unbounded growth (not an error). Baseline ~1.72
      # GiB; 5 GiB warning at 1h flags a recorder/purge regression early.
      - alert: HassRecorderDBLarge
        expr: pg_database_size_bytes{datname="hass"} > 5 * 1024 * 1024 * 1024
        for: 1h
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "Home Assistant recorder database is large"
          description: "The hass PostgreSQL database is {{ $value | humanize1024 }}B (warn at 5 GiB, baseline ~1.7 GiB). Likely a recorder purge failure or a runaway high-frequency entity — check recorder purge_keep_days and excluded entities."

      # WAL accumulation. pg_wal_size_bytes is the total bytes in pg_wal/ (single
      # cluster-wide series). It normally cycles between ~80 MiB and the
      # max_wal_size ceiling; the observed 7d range here is 80 MiB → ~1.09 GiB.
      # A sustained climb past 2 GiB means WAL is NOT being recycled — almost
      # always an inactive/lagging replication slot pinning the LSN, a stuck
      # archive_command (archiver backlog), or a long-open transaction. Threshold
      # 2 GiB gives ~1.8x headroom over the observed peak; 30m avoids flapping on
      # a transient checkpoint-driven spike.
      - alert: PostgreSQLWALGrowth
        expr: pg_wal_size_bytes > 2 * 1024 * 1024 * 1024
        for: 30m
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL WAL directory growing unbounded"
          description: "pg_wal/ holds {{ $value | humanize1024 }}B (sustained 30m, baseline 80 MiB–1.1 GiB). WAL is not being recycled — check for an inactive/lagging replication slot (pg_replication_slots), an archiver backlog (archive_command failing), or a long-running transaction pinning the LSN."

      # Buffer-cache hit ratio (rate-based). The lifetime blks_hit/blks_read
      # counters carry massive inertia, so we use rate() over a 5m window to see
      # the CURRENT working-set behaviour. Live steady state is ~99%; over 7d the
      # ratio dipped below 0.85 in only ~10 isolated 5m samples (cold-cache after
      # a restart / one-off big sequential scan) and was NEVER below 0.85 for a
      # continuous hour (max low-samples in any rolling 1h = 2 of 12). The
      # for: 1h clause therefore filters those transients and only fires on a
      # genuinely sustained working set that no longer fits shared_buffers —
      # the signal that the cache is undersized or a query is thrashing it.
      - alert: PostgreSQLCacheHitLow
        expr: |
          sum(rate(pg_stat_database_blks_hit[5m]))
            /
          (sum(rate(pg_stat_database_blks_hit[5m])) + sum(rate(pg_stat_database_blks_read[5m])))
            < 0.85
        for: 1h
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL buffer-cache hit ratio low"
          description: "Cluster-wide buffer-cache hit ratio is {{ $value | humanizePercentage }} (rate-based 5m, sustained 1h; steady state ~99%). The active working set no longer fits shared_buffers — expect elevated disk reads. Check for a new heavy scan/query or an undersized shared_buffers."

      # Surprise database growth. Largest non-excluded DB is mailarchiver at
      # ~7.3 GiB; 20 GiB leaves ample headroom so this fires on UNEXPECTED growth
      # rather than steady state. litellm is EXCLUDED: it is legitimately the
      # largest DB (~13.7 GiB) and grows steadily ~3 GiB/week (request-log
      # accumulation), so a flat 20 GiB cap would chronically alarm on it within
      # ~2 weeks — that is steady-state, not a surprise. hass has its own
      # dedicated HassRecorderDBLarge rule above (5 GiB) and is also caught here.
      - alert: PostgreSQLDatabaseLarge
        expr: pg_database_size_bytes{datname!~"litellm"} > 20 * 1024 * 1024 * 1024
        for: 6h
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL database unexpectedly large"
          description: "Database {{ $labels.datname }} is {{ $value | humanize1024 }}B (warn at 20 GiB, sustained 6h; largest monitored DB is normally ~7 GiB). litellm is excluded as known-large. Investigate unexpected growth — a runaway table, missing purge/retention, or bloat."

      # Exporter self-health. pg_exporter_last_scrape_error == 1 means the
      # postgres-exporter could not complete its scrape (baseline 0); the
      # PostgreSQLDown rule (up==0) only catches a total scrape failure, this
      # catches a partial/erroring scrape where the process is still up but the
      # data is stale or wrong. The companion pg_scrape_collector_success == 0
      # catches a single collector (e.g. the custom wraparound query) failing
      # while the overall scrape still succeeds — baseline is 1 for all 11
      # collectors over 7d, so this is clean.
      - alert: PostgreSQLExporterScrapeError
        expr: pg_exporter_last_scrape_error == 1 or pg_scrape_collector_success == 0
        for: 10m
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL exporter scrape erroring"
          description: "postgres-exporter reported a scrape error (pg_exporter_last_scrape_error==1) or a failing collector{{ if $labels.collector }} ({{ $labels.collector }}){{ end }} for 10m. The exporter is up but its data may be stale/incomplete — Postgres-derived alerts could be silently blind. Check: journalctl -u prometheus-postgres-exporter."

      # Per-statement latency regression (pg_stat_statements top-N custom query
      # in postgres-exporter.nix; metric is in MILLISECONDS). These metrics do
      # NOT exist until the planned PostgreSQL restart loads
      # shared_preload_libraries=pg_stat_statements — before that the rules are
      # simply inert (no series → no fire), which is correct.
      #
      # THRESHOLD DISCIPLINE: 1000ms is a CONSERVATIVE absolute starter that
      # mirrors the existing log_min_duration_statement=1000 slow-query log
      # cutoff, so it surfaces exactly the statements that already hit the text
      # log — but as a queryable, attributable metric. Baseline cannot be
      # checked pre-deploy (the metric is absent until the restart). After
      # 24-48h of post-restart observation this should be SHARPENED to a
      # regression-vs-history form, e.g.
      #   pg_stat_statements_top_mean_exec_time_ms
      #     > 3 * avg_over_time(pg_stat_statements_top_mean_exec_time_ms[7d])
      #   and pg_stat_statements_top_mean_exec_time_ms > 200
      # once the 7d window exists. Known-heavy queryids (immich CLIP vector
      # scans, mailarchiver bulk INSERTs, litellm SpendLogs aggregations) that
      # legitimately average >1s should get a per-queryid `unless` exclusion
      # rather than raising the global floor (queryids are stable across
      # restarts of the same PG major). for:30m filters cold-cache outliers.
      # calls>1 gate added 2026-07-03: one-shot maintenance statements (post-boot
      # backup churn: ANALYZE, restore-time DDL) land in the top-N with a single
      # slow call and pinned the alert firing all day after the reboot. A mean
      # over a single call is not a trend — require repetition before paging.
      - alert: PostgreSQLSlowStatements
        expr: >-
          pg_stat_statements_top_mean_exec_time_ms > 1000
          and on(queryid, datname, rolname) pg_stat_statements_top_calls > 1
        for: 30m
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "Slow PostgreSQL statement (queryid {{ $labels.queryid }} in {{ $labels.datname }})"
          description: "Statement queryid={{ $labels.queryid }} (db {{ $labels.datname }}, role {{ $labels.rolname }}) averages {{ $value | humanize }}ms/call, sustained 30m. Inspect the SQL as postgres: SELECT query FROM pg_stat_statements WHERE queryid = {{ $labels.queryid }};"

      # A single statement dominating cluster exec time. If one queryid's
      # cumulative total_exec_time is >50% of the top-N total, something is
      # pathological (missing index, runaway loop). The ratio is self-
      # normalising, so it is immune to pg_stat_statements_reset()/save=off
      # restart zeroing (both numerator and denominator reset together).
      # Share-of-top-N alone is the WRONG predicate on this box: with most of
      # the 26 DBs idle, one healthy poller (e.g. flume-data's once-a-minute
      # SUM(gpm) at ~6ms mean) "dominates" >50% forever and the alert becomes a
      # permanent false positive (fired 2026-06-10 within 3h of the extension
      # going live). Dominance only matters when the dominant statement is ALSO
      # slow — a missing index / runaway query has a high mean, a busy-but-
      # healthy poller does not. Per-series share (instead of max/sum) keeps
      # queryid/datname labels on the alert. for:30m still rides out warm-up.
      - alert: PostgreSQLStatementDominatesCPU
        expr: |
          (
            pg_stat_statements_top_total_exec_time_ms
              / on () group_left () sum(pg_stat_statements_top_total_exec_time_ms)
            > 0.5
          )
          and pg_stat_statements_top_mean_exec_time_ms > 100
        for: 30m
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL statement {{ $labels.queryid }} ({{ $labels.datname }}) dominates exec time and is slow"
          description: "queryid {{ $labels.queryid }} in {{ $labels.datname }} accounts for >50% of the top-N cumulative exec time AND averages >100ms/call, sustained 30m. Likely a missing index or runaway query — read its SQL: SELECT query FROM pg_stat_statements WHERE queryid = {{ $labels.queryid }}; (as postgres)."