# Staleness alerts for the pool/spa sensor series that Home Assistant pushes into
# VictoriaMetrics (InfluxDB line protocol). These series live ONLY in VM (port
# 8428) — Prometheus cannot see them — so until vmalert was deployed they had no
# alerting at all. Evaluated by services.vmalert.instances."" against
# http://127.0.0.1:8428.
#
# IMPORTANT naming note (verified live 2026-06-10): HA pushes by *unit* — the
# measurement name becomes the unit and the entity is a label. So the salt
# concentration sensor is `ppm_value{entity_id="intellichlor_1_salt"}`, NOT a
# metric literally named `ppm_raw_salt`; the water temperature is
# `°F_value{entity_id="water_sensor_1"}` (queried via the __name__ regex below to
# avoid the `°` in a bare identifier), NOT `ppm_water_temp`. The census' literal
# names (`ppm_raw_salt`, `ppm_water_temp`, `state_low_water` as a *pool* sensor)
# do not exist under those names — `state_low_water` is actually a vacuum-robot
# state, and `state_HEATER` is an event-driven (push-on-change) switch series, so
# none of those get a naive staleness alert here (a heater that hasn't toggled in
# hours is normal, not a failure).
#
# THRESHOLDS ARE SIZED OFF THE FULL SERIES HISTORY. Re-measured 2026-07-29 by
# exporting each raw series from VM (/api/v1/export, start=-1000d) and taking the
# largest delta between adjacent samples.
#
# READ THIS BEFORE CHANGING A THRESHOLD. This file has now been mis-sized TWICE by
# measuring too short a window, and each time the comment asserted the window was
# sufficient. First a 14-day window; then a 90-day window described as "these series'
# whole life", which was false -- water and salt both begin 2025-11-11, a 260-day
# record, so that pass measured only its last 35%. The "first sample" dates it quoted
# were export-window boundary artifacts (water's apparent first sample sat 26 minutes
# after the window edge). VictoriaMetrics retains 100y
# (modules/monitoring/services/victoriametrics.nix:34), so nothing had aged out --
# the data was there and simply not asked for. ALWAYS export with start=-1000d.
#
# RE-MEASURED AGAIN 2026-07-30 from the full 260-day export, and TWO CLAIMS ABOVE
# TURNED OUT TO BE FALSE. They are corrected below rather than quietly edited out,
# because both were load-bearing for the salt threshold.
#
#   FALSE CLAIM 1: "every gap over 12h falls in Nov-Mar". Salt has FIVE summer gaps
#   over 46h: 77.06h (2026-06-05), 67.07h (07-22), 57.88h (05-14), 48.71h (07-01),
#   46.62h (06-20). The seasonality is real but it is a difference of DEGREE.
#
#   FALSE CLAIM 2: "when the pump is off for the winter". The pump was NOT off. Using
#   the pool-circuit state series (state_value{entity_id="pool"}, an on-change series)
#   as a step function, the pool circuit was ON for 50.3-59.2% of EVERY ONE of the nine
#   winter salt gaps in the 94-165h range, with a 13.00-13.02h CONTIGUOUS on-stretch
#   inside each one. (The tenth gap over 90h, 91.47h from 2026-02-24, is the integration
#   outage described below — there the circuit series was itself frozen, which is why it
#   reads 87.9% on.) The cell is running and still not reporting a changed salinity; whatever
#   suppresses the reading in winter (cell output at 0 below ~52F is the likely
#   mechanism) is not "the pump is off", and any rule reasoning from pump state is
#   reasoning from a premise that does not hold.
#
#                             all-time max   all-time p95   record   alert >
#     water_sensor_1               77.87h          1.09h     261d      24h
#     intellichlor_1_salt         164.62h         48.71h     260d     336h
#     pool_salt_temp_compensated   19.75h          1.28h      63d      24h
#
# water's 77.87h max was a TRUE POSITIVE, not a benign gap, and this is worth knowing
# because it is the one demonstrated success of this whole file: on 2026-02-24 between
# 15:03Z and 15:20Z EVERY pool entity stopped at once — water_sensor_1 (77.87h),
# pool_last_temp (77.87h), the pool circuit (78.14h), ultratemp, and salt (91.47h) —
# and all resumed together ~78h later on 02-27. That is the ScreenLogic/IntelliCenter
# integration dead for three days, and PoolWaterTempStale at 24h catches it within a
# day. The largest BENIGN water gap is 19.54h (2026-03-09), with 15 gaps over 12h and
# all of them Nov-Mar, so 24h keeps ~23% headroom over benign behaviour.
#
# compensated's 63d IS its whole life (created 2026-05-28) — but that life is ENTIRELY
# SUMMER, so its 19.75h max is measured on an unrepresentative window and its 24h
# threshold is the one number in this file still sized off a window that omits a
# winter. It is left at 24h because widening it now would be sizing from a prediction
# instead of a measurement, but the risk is concrete and dated: this sensor recomputes
# off water temperature, water temperature's own benign gaps stretch to 19.54h in
# winter, and those stack on compensated's routine 13-19.75h overnight pause. REVIEW
# THIS THRESHOLD IN NOVEMBER 2026 against real winter data; if it false-pages, the
# remedy is to widen it (36h), never to delete it (see the note on the rule itself).
#
# Earlier passes raised water 6h -> 12h -> 24h and salt 72h -> 96h -> 180h -> 336h.
# Do NOT re-tighten either one from a short measurement window.
#
# DO NOT REWRITE THE STALENESS EXPRESSION AS `time() - timestamp(last_over_time(X[Nd]))`.
# That is what these three rules used until 2026-07-29, and in MetricsQL it silently
# measures NOTHING: VM's `timestamp()` reports the timestamp of the *evaluation step*
# for the synthetic sample that `last_over_time` emits, not the timestamp of the last
# raw sample. Measured 2026-07-29 against http://127.0.0.1:8428 — evaluated in the
# middle of the salt sensor's real 77h gap, where the true age was 42.5h, the old
# expression returned 0.00h; evaluated live it returns 0.00-0.07h regardless of age
# (the residue is step alignment vs `time()`'s ~30s latency offset). All three rules
# were therefore DEAD: they could never cross any threshold. The replacement,
#   time() - last_over_time(timestamp(X)[10d:5m])
# returns 42.49h for that same instant and matches an /api/v1/export ground truth on
# all three series. MetricsQL's `lag(X[10d])` and `time() - tlast_over_time(X[10d])`
# are equivalent and were verified to give the same 42.49h, but BOTH are rejected by
# `promtool check rules` (unknown functions — promtool speaks PromQL). vm-alerts/ is
# not promtool-gated at build time (`validate-alerts` in monitoring-utils.nix only
# walks the Prometheus alerts dir), so a MetricsQL-only form would build — but then
# nothing can lint these files at all, so prefer the subquery form, which promtool
# accepts (exit 0) and VM evaluates identically.
#
# THE REPLACEMENT IS STILL WINDOW-BOUNDED, and that has a consequence worth knowing
# for all three rules: once staleness exceeds the subquery window (10d) the inner
# selector matches nothing, the expression becomes NO_DATA, and vmalert RESOLVES the
# alert instead of continuing to fire (verified: same query at the same instant
# returns 42.49h at [10d:5m] and [2d:5m], EMPTY at [1d:5m]). So a permanently dead
# sensor pages for a while and then goes QUIET, and the alert's own resolution is NOT
# evidence of recovery — check the series. Each rule can only fire while the sample
# age lies inside (threshold, window]: water 24h-240h ([10d:5m]), salt 336h-672h
# ([28d:5m]), compensated 24h-240h ([10d:5m]).
# Widening the window widens that firing span and changes nothing else; it
# must stay well above the threshold anyway, since it is also what lets the query see
# a most-recent sample older than VM's ~5m default lookback (these series are sparse).
groups:
  - name: pool_sensors_staleness
    interval: 5m
    rules:
      # Pool/spa water temperature — the most reliable, highest-cadence pool
      # sensor (the one referenced as sensor.water_sensor_1; the matcher resolves to
      # the single series `°F_value`, median inter-sample gap 1 minute). If it goes
      # quiet for > 24h while everything else is fine, the sensor or its HA
      # integration is likely dead. 24h, sized off the full 261-day record: the
      # largest BENIGN gap is 19.54h (2026-03-09) and 15 gaps exceed 12h, all of them
      # Nov-Mar, so 24h keeps ~23% headroom. The one larger gap, 77.87h on 2026-02-24,
      # was a true positive — the whole ScreenLogic integration was down for three
      # days (header). Window is [10d:5m], not the original [1d] — a 1-day window
      # would leave only a 12h span between this threshold and the point where the
      # expression goes NO_DATA and RESOLVES itself.
      - alert: PoolWaterTempStale
        expr: |
          (time() - last_over_time(timestamp({entity_id="water_sensor_1", __name__=~".+_value"})[10d:5m])) > 86400
        for: 30m
        labels:
          severity: warning
          category: home-assistant
        annotations:
          summary: "Pool water temperature sensor stale (>24h)"
          description: "sensor.water_sensor_1 (water_sensor_1) has pushed no sample to VictoriaMetrics in over 24 hours. Largest benign gap in the full 261-day record is 19.5h (winter); the sensor or the whole ScreenLogic integration may be dead — check pool_last_temp and the pool circuit state, which died together with it on 2026-02-24. Pool-time TTS and the heater-flow logic depend on this reading. Note: this alert RESOLVES on its own once the sample is >10d old (window-bounded expr) — check the series, not the alert, to confirm recovery."

      # IntelliChlor salt reading — A DELIBERATELY SLOW BACKSTOP, AND THAT IS THE HONEST
      # CEILING FOR THIS SERIES. Read this before touching the number.
      #
      # Threshold raised 180h -> 336h (14 days) on 2026-07-30. 180h was the thinnest
      # margin in the whole ruleset: 1.09x over the all-time-max inter-sample gap of
      # 164.62h (2026-01-21), on a series whose 260-day record contains ONE winter. The
      # tail is dense and has no shoulder — 164.62, 135.73, 132.70, 123.29, 123.20,
      # 120.92, 108.78, 100.69, 94.67, 91.47h, i.e. nine benign gaps over 90h in a
      # single season — so "the max is 164.62h" is one sample of a seasonal maximum, not
      # a bound. A second winter with one longer cold stretch overruns 180h and pages
      # for nothing. 336h is 2.04x the observed max and requires the cell to be silent
      # through a fortnight, which has never happened in 260 days.
      #
      # IS A STATIC THRESHOLD VIABLE AT ALL HERE? Only for total, extended death — and
      # that is what this rule now is. The series is far sparser and far more
      # seasonally split than earlier comments in this file claimed: 425 samples in 260
      # days (~1.6/day), median gap 11.06h, p95 48.71h, and gaps run 91-165h in winter
      # AND 46-77h in summer (2026-06-05 77.06h, 07-22 67.07h, 05-14 57.88h). There is
      # no threshold that is both above the benign summer tail and fast enough to be
      # actionable in winter; the distributions overlap. Two things make that
      # acceptable rather than a hole:
      #   1. the fast case is already covered — when the CONTROLLER dies, water
      #      temperature dies with it, and PoolWaterTempStale catches that within 24h
      #      (demonstrated on 2026-02-24, see header);
      #   2. what is left for this rule is the cell dying ALONE while the rest of the
      #      integration is healthy, for which a fortnight of silence is a true and
      #      unambiguous signal even if it is not a fast one.
      # If a faster salt-specific signal is ever wanted it needs a different shape
      # entirely — a seasonal guard, or a rate-of-change/expected-cadence rule keyed to
      # water temperature — not a smaller number here.
      #
      # Window widened [21d:5m] -> [28d:5m] to stay comfortably above the threshold: the
      # rule can only fire while the sample age is inside (336h, 672h] (see header).
      - alert: PoolSaltSensorStale
        expr: |
          (time() - last_over_time(timestamp(ppm_value{entity_id="intellichlor_1_salt"})[28d:5m])) > 1209600
        for: 1h
        labels:
          severity: warning
          category: home-assistant
        annotations:
          summary: "Pool salt (IntelliChlor) sensor silent for over 14 days"
          description: "ppm_value{entity_id=\"intellichlor_1_salt\"} has pushed no sample to VictoriaMetrics in over 14 days. This is a deliberately slow backstop: benign gaps reach 164.6h (winter) and 77.1h (summer) on this series, so nothing shorter can be trusted, and 14 days of silence has never occurred in the 260-day record. Check the IntelliChlor cell first — if water temperature is also stale, the whole ScreenLogic integration is down and PoolWaterTempStale should already have paged a fortnight ago. Note: this alert RESOLVES on its own once the sample is >28d old (window-bounded expr) — check the series, not the alert, to confirm recovery."

      # The temperature-compensated virtual salt sensor (sensor.pool_salt_temp_
      # _compensated). It is derived/recomputed less often, and stops updating every
      # night, so a 13-16h gap is NORMAL: over its whole 63-day life it has 45 gaps
      # above 12h and a maximum of 19.75h (2026-07-02). The 24h threshold flags a
      # genuinely-stuck template/derivation with ~4h of headroom, and it is now the
      # thinnest margin in this file — and worse, that 19.75h maximum is measured on a
      # SUMMER-ONLY record, because the sensor was created 2026-05-28. Its driver
      # (water temperature) has benign winter gaps up to 19.54h which will stack on the
      # overnight pause. REVIEW IN NOVEMBER 2026: if it false-pages on winter data,
      # raise the threshold to 36h. Never delete it — see the next paragraph.
      # DO NOT delete PoolSaltSensorStale on the theory that this rule covers it. That was
      # proposed and DISPROVED by measurement 2026-07-29: pool_salt_temp_compensated
      # recomputes whenever the WATER TEMPERATURE changes, reusing the last known salt
      # value, so it keeps publishing happily while the salt sensor is dead. Across the 24
      # salt gaps over 24h since this sensor was created, it pushed 103-246 samples during
      # each one (e.g. salt silent 77.1h from 2026-06-04, compensated pushed 246 samples).
      # It therefore detects a stuck TEMPLATE, not a dead SOURCE.
      - alert: PoolSaltCompensatedStale
        expr: |
          (time() - last_over_time(timestamp(ppm_value{entity_id="pool_salt_temp_compensated"})[10d:5m])) > 86400
        for: 1h
        labels:
          severity: warning
          category: home-assistant
        annotations:
          summary: "Temp-compensated pool salt sensor stale (>24h)"
          description: "ppm_value{entity_id=\"pool_salt_temp_compensated\"} has not updated in VictoriaMetrics for over 24 hours (max gap over its whole 63-day life is 19.75h, driven by a routine 13-16h overnight pause). The virtual sensor's template/derivation may be stuck or its source (intellichlor salt + water temp) is missing. If this arrives between November and March, suspect the threshold before the sensor: the 19.75h maximum was measured on a summer-only record. Note: this alert RESOLVES on its own once the sample is >10d old (window-bounded expr) — check the series, not the alert, to confirm recovery."
