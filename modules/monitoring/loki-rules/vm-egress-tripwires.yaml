# Loki ruler alert rules — agent-VM egress tripwires (LogQL).
#
# These two rules were originally placed in modules/monitoring/alerts/
# vm-egress.yaml, where the Prometheus ruler evaluated them as PromQL: the
# syntax parsed (health=ok) but {job="vm-egress"} matches NO Prometheus series
# — the data is a promtail->Loki log stream (promtail.nix job_name="vm-egress")
# — so both security tripwires were structurally dead (caught by the 2026-06-10
# session review). They live here now, evaluated by the Loki ruler against the
# actual log stream. The Prometheus-side byte-rate backstop
# (VMAgentEgressVolumeHigh, node_network_transmit_bytes_total) stays in
# alerts/vm-egress.yaml.
#
# NOT auto-discovered: this file is wired via an L+ tmpfiles symlink in
# modules/services/loki.nix (like every other file in loki-rules/).
groups:
  - name: vm_egress_tripwires
    rules:
      # New-outbound-connection storm from the bypass-scraped egress log.
      # OpenClaw's firewall LOGs every NEW public connection at info priority;
      # the dedicated job="vm-egress" promtail scrape preserves those lines
      # (the main journal scrape drops priority 5-7). Baseline ~163 lines/24h
      # (verified 2026-06-10) = ~7/hr; >120 new conns in 10m (~12/min) is a
      # connection storm well above any normal agent activity.
      - alert: VMAgentEgressConnectionStorm
        expr: |
          sum by (egress_kind) (count_over_time({job="vm-egress", egress_kind="openclaw-egress"} [10m])) > 120
        for: 5m
        labels:
          severity: warning
          category: security
          service: agent-vm-egress
        annotations:
          summary: "OpenClaw VM opened >120 new outbound connections in 10m"
          description: |
            Burst of new outbound connections from the OpenClaw microVM, far
            above the ~7/hr baseline. Correlate with VMAgentDNSNewDestination
            and VMAgentEgressVolumeHigh. Inspect destinations in the egress log:
            {job="vm-egress", egress_kind="openclaw-egress"}. (Source/dest IPs
            live only in the log body, never in alert labels.)

      # Hermes should NEVER hit its reject log: it lives inside a 443/53
      # port-allowlist with a final DROP, and the reject-LOG counter has been 0
      # over 24h (verified 2026-06-10). Any rejected egress is either a new
      # legitimate endpoint that needs a non-443/53 port opened, OR a compromised
      # process probing other ports. Fire on the first occurrence.
      - alert: HermesEgressRejected
        expr: |
          sum(count_over_time({job="vm-egress", egress_kind="hermes-egress-rejected"} [10m])) > 0
        for: 0m
        labels:
          severity: warning
          category: security
          service: agent-vm-egress
        annotations:
          summary: "Hermes VM attempted egress outside its 443/53 allowlist"
          description: |
            The Hermes microVM tried to open an outbound connection that the
            egress allowlist DROPped (logged as hermes-egress-rejected). Either
            a new legitimate endpoint needs a port opened in hermes-microvm.nix,
            or the Hermes process is probing. Investigate the destination in the
            egress log: {job="vm-egress", egress_kind="hermes-egress-rejected"}.
