groups:
  - name: hermes_availability
    interval: 60s
    rules:
      # End-to-end probe through hermes-mcp → Hermes Agent. This is the
      # single load-bearing signal for "the OpenClaw ↔ Hermes bridge works
      # right now"; if this is red for >5min, callers cannot reach Hermes.
      - alert: HermesAskFailing
        expr: hermes_mcp_ask_hermes_ok == 0
        for: 5m
        labels:
          severity: critical
          category: availability
          service: hermes-mcp
          self_heal_eligible: "true"
        annotations:
          summary: "Hermes end-to-end ask_hermes probe failing for 5 minutes"
          description: |
            The 5-minute health check has failed to round-trip
            `ask_hermes(prompt="Reply with the single word ACK")` for
            5 consecutive minutes. The chain hermes-mcp ⇒ Hermes Agent
            api_server (10.99.1.2:8080) ⇒ Qwen on hera is broken
            somewhere. The downstream component metrics
            (hermes_api_server_ok, hermes_mcp_sse_open_ok) tell you
            which leg failed first.

      # The api_server platform inside Hermes Agent. If this is red,
      # Hermes itself is unreachable; restarting hermes-mcp will not
      # help. Self-heal at this layer means restarting microvm@hermes.
      - alert: HermesApiServerDown
        expr: hermes_api_server_ok == 0
        for: 5m
        labels:
          severity: critical
          category: availability
          service: hermes-agent
          self_heal_eligible: "true"
        annotations:
          summary: "Hermes api_server /v1/capabilities down for 5 minutes"
          description: |
            Hermes' OpenAI-compatible api_server platform is not
            answering on http://10.99.1.2:8080/v1/capabilities.
            Possible causes: microvm@hermes crashed; firewall rule
            regressed; API_SERVER_KEY missing or wrong;
            hermes-agent.service restarted but failed to bind the
            platform (see /var/lib/hermes/.hermes/logs/errors.log
            for "Refusing to start: binding to 0.0.0.0 requires
            API_SERVER_KEY").

      # The host-side bridge that OpenClaw talks to. If this fails
      # the openclaw-side mcporter cannot reach hermes regardless of
      # whether the upstream Hermes Agent is healthy.
      - alert: HermesMcpBridgeDown
        expr: hermes_mcp_sse_open_ok == 0
        for: 5m
        labels:
          severity: critical
          category: availability
          service: hermes-mcp
          self_heal_eligible: "true"
        annotations:
          summary: "hermes-mcp /sse not accepting connections for 5 minutes"
          description: |
            The host's hermes-mcp.service is not accepting new SSE
            connections on 127.0.0.1:9081. The systemd unit may be
            up but stuck; restarting hermes-mcp.service typically
            resolves this within a few seconds.

      # Discord WebSocket zombie detector. When the Discord library's
      # underlying WS goes stale after a reconnect, no inbound events
      # are processed even though the TCP socket and HTTP rest API
      # may still appear healthy. The bot looks online in Discord
      # but won't reply to DMs. The probe regex matches user activity +
      # reconnect/connect events.
      #
      # Threshold tuning (2026-05-22): lowered from 24h to 2h after a
      # zombie-immediately-after-restart incident went undetected for
      # 5h 51min before the user noticed manually. The original 24h was
      # set to avoid false-positives on legitimately idle bots, but for
      # a chat bot in active Discord servers (where presence/typing/
      # member events from other users fire regularly) 2h of total
      # silence is a strong zombie signal. Worst-case false positive is
      # one unnecessary restart every few days during deep quiet
      # periods — acceptable cost.
      - alert: HermesDiscordZombieSuspected
        expr: hermes_discord_last_event_age_seconds > 7200
        for: 10m
        labels:
          severity: warning
          category: availability
          service: hermes-agent
          self_heal_eligible: "true"
        annotations:
          summary: "Hermes Discord platform shows no activity for >2 hours"
          description: |
            /var/lib/hermes/.hermes/logs/gateway.log has not recorded
            a Discord-relevant event in the last 2+ hours. In an active
            server the bot should see presence/typing/member events from
            other users continuously; 2h+ silence indicates the gateway
            WebSocket has zombied (TCP socket appears alive, Discord
            sees the bot as online, but no inbound events propagate).
            Restarting microvm@hermes re-establishes a clean WS
            session.

      # Faster sibling of HermesDiscordZombieSuspected — fires after just
      # 15 min when the self-heal daemon just restarted the microvm but
      # no Discord events came in. A fresh Hermes connection ALWAYS fires
      # ready/guild_create within seconds, so disco_age > 10m within 1h
      # of a self-heal restart is definitively a zombie.
      # (Doesn't fire for manual user restarts — those are caught by
      # the 2h catchall above.)
      - alert: HermesDiscordPostSelfHealRestart
        expr: |
          hermes_discord_last_event_age_seconds > 600
          and
          changes(hermes_self_heal_attempts_total{action="restart_microvm"}[1h]) > 0
        for: 5m
        labels:
          severity: critical
          category: availability
          service: hermes-agent
          self_heal_eligible: "true"
        annotations:
          summary: "Hermes Discord silent after self-heal restart — zombie WS"
          description: |
            The self-heal daemon restarted microvm@hermes within the last
            hour, but the Discord gateway has not received any events in
            10+ minutes. A fresh WS connection fires ready / guild_create
            within seconds, so this is a zombie on top of the restart —
            another restart is needed.

      # The check itself stopped running.
      - alert: HermesHealthCheckStale
        expr: time() - hermes_health_check_last_run_timestamp_seconds > 900
        for: 5m
        labels:
          severity: warning
          category: monitoring
          service: hermes-mcp
        annotations:
          summary: "Hermes health check has not run in >15 minutes"
          description: |
            The hermes-health-check.timer has not produced fresh
            metrics in 15 minutes. Check `systemctl status
            hermes-health-check.timer` and the most recent
            invocation's journal.

      # API key plumbing regression.
      - alert: HermesApiKeyMissing
        expr: hermes_api_key_present == 0
        for: 5m
        labels:
          severity: critical
          category: configuration
          service: hermes-mcp
        annotations:
          summary: "API_SERVER_KEY not present in /run/secrets/hermes/env"
          description: |
            The SOPS-decrypted hermes env file is missing the
            API_SERVER_KEY field — every authenticated probe will
            fail. Check `sops-install-secrets.service` status and
            the `hermes:` block in secrets.yaml.

      # The self-heal daemon's own heartbeat. If the daemon dies, no
      # auto-remediation is happening — operator must intervene.
      # NOTE: service: hermes-self-heal (NOT hermes-*) so this alert
      # is not routed back to the daemon itself (which may be dead).
      - alert: HermesSelfHealDown
        expr: time() - hermes_self_heal_last_heartbeat_seconds > 600
        for: 5m
        labels:
          severity: warning
          category: monitoring
          service: hermes-self-heal
        annotations:
          summary: "hermes-self-heal daemon heartbeat stale (>10 min)"
          description: |
            The hermes-self-heal daemon stopped writing
            hermes_self_heal_last_heartbeat_seconds. Either the
            service crashed (check `systemctl status hermes-self-heal`)
            or the textfile collector cannot read its output.

      # An incident has been open for >30 minutes. The daemon has
      # exhausted its 3 attempts or the AI tier returned escalate.
      # Human action required.
      - alert: HermesSelfHealStuck
        expr: hermes_self_heal_active_incidents > 0
        for: 30m
        labels:
          severity: critical
          category: availability
          service: hermes-self-heal
        annotations:
          summary: "Hermes self-heal incident open for >30 minutes"
          description: |
            One or more Hermes incidents have not resolved despite
            the daemon's attempts. Inspect
            /var/lib/hermes-self-heal/incidents.json and recent
            journal output to decide on a manual action.

      # Track how often the AI tier was unreachable. >3/hour suggests
      # LiteLLM is down and the daemon is degraded to deterministic-only.
      - alert: HermesSelfHealLitellmUnreachable
        expr: increase(hermes_self_heal_litellm_unreachable_total[1h]) > 3
        for: 5m
        labels:
          severity: warning
          category: monitoring
          service: hermes-self-heal
        annotations:
          summary: ">3 LiteLLM unreachable events in last hour for hermes self-heal"
          description: |
            The daemon attempted to escalate to the AI tier multiple
            times and could not reach LiteLLM. Verify
            `systemctl status litellm` and that the
            litellm-vulcan-lan-hermes-self-heal SOPS secret matches
            LiteLLM's master key.
