groups:
  - name: system_alerts
    interval: 30s
    rules:
      # Disk space alerts
      # hera excluded: has its own local disk monitoring
      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs", instance!="hera"} / node_filesystem_size_bytes < 0.1
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "{{ $labels.device }} on {{ $labels.instance }} has less than 10% free space"

      - alert: DiskSpaceCritical
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs", instance!="hera"} / node_filesystem_size_bytes < 0.05
        for: 1m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "Critical disk space on {{ $labels.instance }}"
          description: "{{ $labels.device }} on {{ $labels.instance }} has less than 5% free space"

      # Memory alerts
      # Multi-tier memory monitoring to catch OOM conditions early
      - alert: MemoryPressureHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
        for: 10m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 85% for 10 minutes on {{ $labels.instance }}. Available: {{ $value | humanize1024 }}B"

      - alert: MemoryPressureCritical
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.92
        for: 5m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "Critical memory pressure on {{ $labels.instance }}"
          description: "Memory usage is above 92% for 5 minutes on {{ $labels.instance }}. OOM risk! Available: {{ $value | humanize1024 }}B"

      # Thrash detector tuned for zram swap (zstd, ~4.5:1 on vulcan). zram fill is
      # normal operation, NOT pressure, and pgmajfault counts cheap zram swap-ins
      # (and file-mmap reads) the same as disk paging. Thresholds raised 2026-05-30
      # so it fires only on genuine thrash: >150k faults/5m (baseline zram swap-in
      # alone is 30k-100k here) AND either >75% RAM or >90% swap (near zram
      # exhaustion / about to spill to the disk swapfile). The <=50% swap branch
      # produced a false critical on 2026-05-30 while RAM peaked at 74.9% and no
      # OOM occurred. Sibling Swap/Memory alerts cover the non-thrash dimensions.
      - alert: HighMajorPageFaultWithMemoryPressure
        expr: |
          (
            increase(node_vmstat_pgmajfault[5m]) > 150000
            and (
              (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.75
              or (1 - (node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes)) > 0.90
            )
          )
          unless on(instance) (max by (instance) (zfs_pool_scrub_active) > 0)
        for: 5m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "High major page faults with memory pressure on {{ $labels.instance }}"
          description: "Major page faults exceed 150000 per 5 minutes ({{ $value | humanize }}) combined with memory pressure (>75% RAM used or >90% swap used). System may be thrashing! Thresholds account for zram compressed swap, where moderate swap fill and zram swap-ins are normal. Suppressed while any ZFS scrub is active on the instance; MemoryPressureCritical (>92% RAM) remains as the OOM safety-net during scrubs."

      # Swap monitoring
      - alert: SwapUsageHigh
        expr: (1 - (node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes)) > 0.75
        for: 10m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "High swap usage on {{ $labels.instance }}"
          description: "Swap usage is above 75% for 10 minutes. Used: {{ $value | humanize1024 }}B. System under memory pressure."

      - alert: SwapUsageCritical
        expr: (1 - (node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes)) > 0.90
        for: 5m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "Critical swap usage on {{ $labels.instance }}"
          description: "Swap usage is above 90%. Used: {{ $value | humanize1024 }}B. Immediate OOM risk!"

      # RAM + Swap combined capacity alert
      - alert: TotalMemoryExhaustion
        expr: ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes + node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / (node_memory_MemTotal_bytes + node_memory_SwapTotal_bytes)) > 0.90
        for: 5m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "Total memory (RAM+Swap) exhaustion on {{ $labels.instance }}"
          description: "Combined RAM and swap usage is above 90%. System approaching OOM condition!"

      # CPU alerts
      - alert: HighCPUUsage
        expr: 100 - (avg(irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage has been above 80% for 10 minutes"

      # Thermal monitoring (Apple Silicon / Asahi).
      # Scoped to the macsmc_hwmon SoC sensor (chip 290400000_smc_macsmc_hwmon),
      # which is the real CPU/SoC die temperature. We deliberately exclude the
      # other hwmon sensors so they don't skew the signal:
      #   - end0 (chip 0000:00:02_0_0000:03:00_0): Ethernet PHY, runs ~63C
      #     normally — high for a PHY, not the CPU.
      #   - tas2764 (chip i2c_0_0_0038): audio amp, reports a bogus -93C.
      #   - nvme_nvme0: NVMe temp (~34C idle) — better covered by smartctl.
      # Observed SoC baseline: 31-46C over 24h. 85C is a conservative warning
      # well below the M-series throttle point.
      - alert: HostThermalHigh
        expr: node_hwmon_temp_celsius{chip="290400000_smc_macsmc_hwmon"} > 85
        for: 10m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "High SoC temperature on {{ $labels.instance }}"
          description: "SoC sensor {{ $labels.sensor }} ({{ $labels.chip }}) on {{ $labels.instance }} has been above 85C for 10 minutes (currently {{ $value | humanize }}C). Baseline is ~31-46C; sustained high temp suggests cooling failure or runaway load."

      # Fan-stopped detection. Both SMC fans (fan1/fan2) idle at ~1320rpm and
      # never dropped below ~1310rpm over 24h, so 0rpm sustained 10m is a clean
      # stopped/failed-fan signal (not a normal spin-down).
      - alert: HostFanStopped
        expr: node_hwmon_fan_rpm{chip="290400000_smc_macsmc_hwmon"} == 0
        for: 10m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "Cooling fan stopped on {{ $labels.instance }}"
          description: "Fan {{ $labels.sensor }} on {{ $labels.instance }} has read 0 RPM for 10 minutes. Baseline is ~1320 RPM; a stopped fan risks thermal runaway. Check the chassis fan and macsmc."

      # NTP clock sync health. node_timex_sync_status is 1 when the kernel clock
      # is disciplined by NTP, 0 when unsynced. Baseline on vulcan is 1.
      - alert: HostClockUnsynced
        expr: node_timex_sync_status == 0
        for: 15m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "System clock not NTP-synchronized on {{ $labels.instance }}"
          description: "node_timex_sync_status has been 0 for 15 minutes on {{ $labels.instance }} — the kernel clock is no longer disciplined by NTP. Certificate validation, TOTP, log correlation and scheduled jobs depend on accurate time."

      # NTP offset magnitude. Baseline abs(offset) is ~25us, peaking ~0.9ms over
      # 24h, so 0.25s is a wide margin that only fires on a genuinely drifting
      # clock (not normal jitter).
      - alert: HostClockOffsetHigh
        expr: abs(node_timex_offset_seconds) > 0.25
        for: 15m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "System clock offset high on {{ $labels.instance }}"
          description: "abs(NTP offset) has exceeded 0.25s for 15 minutes on {{ $labels.instance }} (currently {{ $value | humanize }}s). Baseline is ~25us; a large offset indicates the clock is drifting despite NTP."

      # Unexpected reboot breadcrumb. The user never reboots vulcan casually, so a
      # surprise fire here = a power event, kernel panic, or watchdog reset. Fires
      # for ~10m after any boot and auto-resolves; scoped to vulcan because hera
      # and the opnsense router reboot on their own cadence (they also export
      # node_boot_time_seconds). Info-severity visibility signal.
      - alert: HostUnexpectedReboot
        expr: time() - node_boot_time_seconds{alias="vulcan"} < 600
        for: 0m
        labels:
          severity: info
          category: system
        annotations:
          summary: "{{ $labels.instance }} rebooted recently"
          description: "{{ $labels.instance }} booted less than 10 minutes ago (uptime {{ $value | humanizeDuration }}). This auto-resolves once uptime passes 10m. If you did not intentionally reboot, investigate a power loss, kernel panic, or watchdog reset."

      # Kernel OOM-kill counter. Complements the Loki SystemdOOMKill log-pattern
      # rule with a metric-based detector straight from /proc/vmstat. Baseline is
      # 0; any increase over 15m means the kernel killed a process for memory.
      - alert: KernelOOMKill
        expr: increase(node_vmstat_oom_kill[15m]) > 0
        for: 0m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "Kernel OOM killer fired on {{ $labels.instance }}"
          description: "The kernel OOM killer terminated {{ $value | humanize }} process(es) in the last 15 minutes on {{ $labels.instance }}. A process was killed to reclaim memory — check which service and whether memory limits need tuning."

      # Run-queue saturation. HighCPUUsage measures % busy of the CPUs, which
      # misses load driven by D-state (uninterruptible) tasks blocked on IO —
      # exactly the signature of the UAS enclosure hang (tank stalls, processes
      # pile up in D-state, %CPU can even look LOW while the run queue explodes).
      # node_load15 / nCPU normalizes the 15-min load average by core count
      # (vulcan = 10 cores). Baseline ratio over 7d: avg 0.18, max 1.57, ZERO
      # samples above 2. >2 sustained 15m means the run queue is 2x the cores for
      # a quarter hour — genuine saturation, not a transient build/scrub spike.
      # The `without (cpu, mode)` on the count preserves alias/instance/job so the
      # division matches node_load15 one-to-one and annotations keep $labels.instance.
      - alert: HostLoadHigh
        expr: node_load15{alias="vulcan"} / count(node_cpu_seconds_total{mode="idle",alias="vulcan"}) without (cpu, mode) > 2
        for: 15m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "Run-queue saturation on {{ $labels.instance }}"
          description: "15-min load average per CPU has exceeded 2.0 for 15 minutes on {{ $labels.instance }} (currently {{ $value | humanize }}x cores). Baseline is ~0.18x (7d max 1.57x). Sustained run-queue saturation — often D-state IO stalls (e.g. the UAS enclosure hang) that HighCPUUsage misses, since blocked tasks raise load without raising %CPU."

      # File-descriptor exhaustion. node_filefd_allocated/node_filefd_maximum is
      # the system-wide open-FD utilization (fs.file-max). A descriptor leak in any
      # daemon eventually trips EMFILE/ENFILE across the whole host. Baseline here is
      # microscopic (~2.4e-15, i.e. a few thousand of a ~1e18 max), so >0.8 is an
      # enormous margin that only fires on a real runaway leak.
      - alert: HostFileDescriptorsHigh
        expr: node_filefd_allocated{alias="vulcan"} / node_filefd_maximum{alias="vulcan"} > 0.8
        for: 10m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "File-descriptor usage high on {{ $labels.instance }}"
          description: "System-wide allocated file descriptors have exceeded 80% of the maximum for 10 minutes on {{ $labels.instance }} (currently {{ $value | humanizePercentage }}). Baseline is near zero; this indicates an FD leak that will eventually hit EMFILE/ENFILE host-wide. Find the leaking process (ls /proc/*/fd | wc -l per pid)."

      # Inode exhaustion on the real (ext4/xfs) filesystems. A filesystem can have
      # plenty of free BYTES yet run out of inodes (e.g. a flood of tiny files),
      # which DiskSpaceLow would never catch. Scoped to ext4|xfs because those have
      # a fixed inode table; ZFS allocates inodes dynamically (no meaningful ratio).
      # vulcan's ext4 mounts (/ and /nix/store, both nvme0n1p5) sit at ~0.87 free
      # (7d min 0.87), so <0.1 free is a wide margin. Per-mountpoint, like DiskSpaceLow.
      - alert: HostInodesLow
        expr: node_filesystem_files_free{fstype=~"ext4|xfs",alias="vulcan"} / node_filesystem_files{fstype=~"ext4|xfs",alias="vulcan"} < 0.1
        for: 15m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "Low free inodes on {{ $labels.instance }} {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} ({{ $labels.device }}, {{ $labels.fstype }}) on {{ $labels.instance }} has less than 10% free inodes for 15 minutes (currently {{ $value | humanizePercentage }}). Inode exhaustion blocks file creation even with free space — usually a flood of tiny files. Baseline free is ~87%."

      # Hardware-asserted thermal alarm bit. node_hwmon_temp_alarm == 1 means the
      # sensor's OWN over-temperature alarm threshold tripped (set by firmware/the
      # chip), independent of our HostThermalHigh fixed-celsius rule. On vulcan only
      # the NVMe (nvme_nvme0) exposes this bit; verified == 0 for the full 7d window.
      # for:5m debounces a momentary blip without masking a real sustained alarm.
      - alert: HwmonAlarm
        expr: node_hwmon_temp_alarm{alias="vulcan"} == 1
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "Hardware thermal alarm on {{ $labels.instance }} ({{ $labels.chip }})"
          description: "Hardware-asserted temperature alarm bit is set on sensor {{ $labels.sensor }} ({{ $labels.chip }}) on {{ $labels.instance }} for 5 minutes. The device firmware tripped its own over-temp threshold — distinct from the fixed-celsius HostThermalHigh rule. Baseline is 0. Check cooling/airflow for that device (NVMe on this host)."