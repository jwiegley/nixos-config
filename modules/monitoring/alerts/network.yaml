groups:
  - name: network_connectivity
    rules:
      # Host unreachable - any probe that fails completely
      - alert: HostUnreachable
        # blackbox_hera_mlx is excluded: the gated MLXBackendDown alert in
        # hermes.yaml owns that target (fires only when hera itself is up), so
        # a hera reboot must not also trip this ungated critical.
        # host_group iot/iot-noping/iot-quiet are excluded: the sleepy IoT
        # devices (locks, nests, rings, sprinkler, vacuum, solar, flume, etc.)
        # drop off ICMP for long stretches by design and must not page this
        # always-on critical.
        # The "iot" devices are covered instead by BlackboxICMPIoTDeviceDown
        # (warning, for: 1h) below. The "iot-noping" devices never answer ICMP
        # at all (and aren't in Nagios either) and the "iot-quiet" devices are
        # powered off / deep-asleep for long routine stretches, so those two
        # groups get NO alert — they are probed for visibility only. Matched
        # with !~ so all three groups are excluded in one matcher.
        # host_group backbone/dns excluded 2026-07-07: those are external
        # internet-reference probes (Google, MIT, public resolvers, …) that
        # John cannot act on individually. A brief upstream ISP wobble used to
        # trip this per-target critical AND InternetConnectivityIssue AND
        # DNSServerDown at once — ~20 emails for one 30-min WAN blip with no
        # real outage. They are now covered by the aggregate WANDegraded /
        # DNSResolversDown rules below, which fire only on a genuine WAN outage.
        expr: probe_success{job=~"blackbox_.*",job!~"blackbox_hera_mlx|blackbox_https_public",host_group!~"iot|iot-noping|iot-quiet|backbone|dns"} == 0
        for: 2m
        labels:
          severity: critical
          category: network
          service: connectivity
        annotations:
          summary: "Host {{ $labels.instance }} is unreachable"
          description: "Host {{ $labels.instance }} has been unreachable for more than 2 minutes via {{ $labels.job }} probe."

      # IoT device ICMP coverage (warning, not critical). The host_group="iot"
      # targets in the blackbox_icmp job (modules/services/blackbox-monitoring.nix)
      # are intentionally "sleepy" devices that routinely stop answering ICMP
      # for long stretches, so they are excluded from the always-on
      # HostUnreachable critical and warned-only here with a 1-hour buffer to
      # ride out normal low-power sleep windows (battery locks were observed
      # sleeping up to ~86 min continuously; the prior 10m buffer fired on
      # routine sleep — see git history 2026-06-15).
      #
      # This intentionally MIRRORS the existing Nagios IoT ping coverage on this
      # host. The cross-stack duplication (Nagios + Prometheus both pinging the
      # IoT devices) is deliberate and is NOT a defect to consolidate — do not
      # remove the Nagios side.
      #
      # Scoped to host_group="iot" only — this deliberately ignores two sibling
      # groups defined in blackbox-monitoring.nix: host_group="iot-noping"
      # (devices that have NEVER answered ICMP, and aren't in Nagios either) and
      # host_group="iot-quiet" (devices like the grill/doorbell that DO answer
      # when awake but are off / deep-asleep for long stretches by design).
      # Both are probed for visibility only and must never alert; keeping this
      # selector pinned to "iot" excludes them automatically.
      - alert: BlackboxICMPIoTDeviceDown
        expr: probe_success{job="blackbox_icmp",host_group="iot"} == 0
        for: 1h
        labels:
          severity: warning
          category: network
          service: connectivity
        annotations:
          summary: "IoT device {{ $labels.instance }} is not answering ICMP"
          description: "IoT device {{ $labels.instance }} has not answered ICMP for more than 1 hour (host_group=iot). This mirrors the Nagios IoT ping coverage and is warning-only because these devices sleep by design."

      # High latency warning for ICMP probes
      # TL-WPA8630 is a powerline adapter with inherently higher latency - excluded
      # host_group iot/iot-noping/iot-quiet excluded: sleepy battery devices
      # answer slowly (or never), so they would drive chronic latency noise —
      # they alert only via BlackboxICMPIoTDeviceDown.
      #
      # READ THIS BEFORE TRUSTING THIS RULE AS A LATENCY SIGNAL (measured 2026-07-30, 201d of
      # TSDB). The `icmp_ping` prober TIMEOUT IS 5s (modules/services/blackbox-monitoring.nix:
      # 49-51), and probe_duration_seconds is capped by it: the 200d maximum over this exact
      # selector is 5.354s. So `> 5` is true only in the instant a probe TIMES OUT, which also
      # sets probe_success=0. This rule therefore does not report "reachable but slow" -- it
      # cannot -- it reports 5 minutes of sustained ICMP timeouts, i.e. it is a strictly LATER
      # duplicate of HostUnreachable (critical, for:2m), and for the backbone/dns host_groups
      # that HostUnreachable excludes it quietly re-introduces the per-host paging that
      # DNSResolversDown was rewritten (2026-07-07, below) to stop doing. It has fired 17,997
      # samples over 200d, top instances hera-wifi.lan / hera.lan / asus-bq16-pro-node.lan /
      # google-home-hub.lan / osuosl.org -- every one of which also appears in HostUnreachable's
      # firing history. Retuning it downward does not fix this: SUCCESSFUL icmp probes have
      # reached 4.983s (www.berkeley.edu) over the same 200d as of 2026-07-30, so any threshold under the 5s cap
      # is itself within 15% of the observed successful maximum. The only real fixes are an
      # operator decision -- raise the prober timeout so slowness is observable below the cap,
      # or delete this rule as a duplicate of the down rules. Left as-is deliberately: not
      # changed without that decision.
      - alert: HighLatency
        expr: probe_duration_seconds{job="blackbox_icmp",instance!="192.168.30.49",host_group!~"iot|iot-noping|iot-quiet"} > 5
        for: 5m
        labels:
          severity: warning
          category: network
          service: connectivity
        annotations:
          summary: "High latency to {{ $labels.instance }}"
          description: "ICMP probe to {{ $labels.instance }} has latency of {{ $value }}s (>5s) for more than 5 minutes."

      # Critical latency for ICMP probes
      # host_group iot/iot-noping/iot-quiet excluded: same rationale as HighLatency —
      # sleepy IoT devices must not trip an infrastructure-latency critical.
      #
      # THIS RULE CANNOT FIRE, measured 2026-07-30 and stated here rather than silently
      # deleted. The `icmp_ping` prober timeout is 5s, so probe_duration_seconds on this
      # selector is bounded: 200d max = 5.354s against a `> 10` threshold, and ALERTS shows 0
      # firing and 0 pending samples over the same 200 days. The iot fleet is the only thing on
      # this host probed with a 10s timeout (icmp_ping_iot) and it is excluded here by design.
      # Fixing it is an operator decision, because every candidate threshold below the 5s cap
      # collides with real successful probes (max successful 4.983s over 200d, 2026-07-30) and with
      # HighLatency above; the coverage it nominally provides (an unreachable host, critical) is
      # already delivered by HostUnreachable (for:2m).
      - alert: CriticalLatency
        expr: probe_duration_seconds{job="blackbox_icmp",instance!="192.168.30.49",host_group!~"iot|iot-noping|iot-quiet"} > 10
        for: 2m
        labels:
          severity: critical
          category: network
          service: connectivity
        annotations:
          summary: "Critical latency to {{ $labels.instance }}"
          description: "ICMP probe to {{ $labels.instance }} has latency of {{ $value }}s (>10s) for more than 2 minutes."

      # External public DNS resolvers (OpenDNS, Cloudflare) — AGGREGATE.
      # Rewritten 2026-07-07: the old per-resolver DNSServerDown (for:1m) paged
      # on ANY single public resolver flapping during a WAN blip, which is not
      # actionable — the other resolver still answers, and John doesn't operate
      # these. Now fires only when EVERY external resolver is unreachable at
      # once (== count), sustained 5m: the actionable "I have no upstream DNS"
      # signal. Internal/authoritative DNS is NOT covered here — it has its own
      # dns_internal blackbox probe (vulcan.lan → correct A). Kept in service=dns
      # so any downstream dashboards/routes on that label still match.
      - alert: DNSResolversDown
        expr: >-
          count(probe_success{job="blackbox_icmp",host_group="dns"} == 0)
          == count(probe_success{job="blackbox_icmp",host_group="dns"})
        for: 5m
        labels:
          severity: critical
          category: network
          service: dns
        annotations:
          summary: "All external DNS resolvers unreachable"
          description: "Every external public DNS resolver (OpenDNS, Cloudflare) has been unreachable for more than 5 minutes — likely an upstream WAN/ISP problem. Internal resolution (dns_internal probe) is tracked separately."

      # Local network connectivity issues
      # host_group iot/iot-noping/iot-quiet excluded: this rule's .lan instance regex
      # otherwise matched the sleepy/never-answering IoT devices and fired
      # chronically (5x LocalNetworkIssue observed). IoT devices alert only via
      # BlackboxICMPIoTDeviceDown; iot-noping never alerts.
      - alert: LocalNetworkIssue
        expr: probe_success{job="blackbox_icmp",instance=~".+\\.lan",host_group!~"iot|iot-noping|iot-quiet"} == 0
        for: 3m
        labels:
          severity: warning
          category: network
          service: local
        annotations:
          summary: "Local network host {{ $labels.instance }} unreachable"
          description: "Local network host {{ $labels.instance }} has been unreachable for more than 3 minutes."

      # Internet (WAN) backbone connectivity — AGGREGATE.
      # Replaces the per-target InternetConnectivityIssue (removed 2026-07-07),
      # which fired one critical per backbone target with a 30s hair-trigger, so
      # a single upstream ISP wobble fanned into 7 criticals + HostUnreachable
      # riders (~20 emails) for a blip with no real outage. This fires only when
      # a MAJORITY of the geographically-diverse external targets are down at
      # once — the real "my internet is degraded" signal. Ratio auto-scales if
      # the target set changes (>=0.5 of 7 = >=4 down). for:3m rides out normal
      # background jitter, which on this host peaks at 1-2 targets down for a
      # minute or two (7-day calibration 2026-07-07); a genuine WAN outage takes
      # all targets down and fires cleanly, once.
      - alert: WANDegraded
        expr: >-
          count(probe_success{job="blackbox_icmp",host_group="backbone"} == 0)
          / count(probe_success{job="blackbox_icmp",host_group="backbone"}) >= 0.5
        for: 3m
        labels:
          severity: critical
          category: network
          service: internet
        annotations:
          summary: "Internet (WAN) degraded — majority of external targets unreachable"
          description: "{{ $value | humanizePercentage }} of external backbone targets (Google, Cloudflare, MIT, Berkeley, UCSD, UMN, OSU) are simultaneously unreachable — an upstream ISP/WAN problem, not a single remote host. Individual target flaps no longer page."

      # HTTP/HTTPS service monitoring for LAN-internal vhosts only.
      #
      # blackbox_https_public is deliberately excluded: that job traverses the
      # FULL public path (Cloudflare edge -> cloudflared tunnel -> origin nginx),
      # so it is sensitive to third-party QUIC/UDP transients that no local
      # remediation can fix. It is already owned by PublicEdgeDown in the
      # public_edge group below, which has a dwell long enough to ride out an
      # edge reconnect cycle plus public-edge-specific annotations. Before this
      # exclusion (2026-07-28) both rules covered the job, and the 1m dwell here
      # meant a Cloudflare edge flap paged CRITICAL "IMMEDIATE ACTION REQUIRED"
      # repeatedly while PublicEdgeDown correctly stayed silent — see the
      # 2026-07-28 10:47-11:08 incident (ha_connections 4->1, self-healed, zero
      # cloudflared restarts). The 1m dwell is kept for the *_local/auth jobs,
      # where a failure is genuinely local and fast notice is actionable.
      - alert: WebServiceDown
        expr: probe_success{job=~"blackbox_http.*", job!="blackbox_https_public"} == 0
        for: 1m
        labels:
          severity: critical
          category: network
          service: web
        annotations:
          summary: "Web service {{ $labels.instance }} is down"
          description: "HTTP/HTTPS probe to {{ $labels.instance }} has been failing for more than 1 minute."

      # SSL certificate expiry warning (from HTTPS probes)
      #
      # Selector widened 2026-07-31 from job="blackbox_https" to include
      # blackbox_https_public, as part of retiring Nagios: "ATD SSL Certificate" and the other
      # native Nagios cert checks go away with it, and blackbox_https carries exactly ONE
      # series (https://google.com) while the public edge certs live in blackbox_https_public.
      #
      # WIDENED AGAIN 2026-07-31, same day, correcting the first attempt.
      #
      # The first pass used job=~"blackbox_https(_public)?" and deliberately EXCLUDED
      # blackbox_https_local, reasoning that its 39 vhosts already have their certs watched
      # on disk by the certificate exporter, so including them would just duplicate. That
      # reasoning was wrong, and the numbers show how wrong: 46 cert series are scraped and
      # that selector matched THREE. Forty-three on-the-wire cert-expiry series were read by
      # no rule at all.
      #
      # File and wire detect DIFFERENT failures. certificate_days_until_expiry inspects
      # /var/lib/nginx-certs/*.crt; probe_ssl_earliest_cert_expiry inspects what nginx is
      # actually SERVING. A cert renewed on disk without an nginx reload looks perfect to the
      # file exporter while the wire still presents the expiring one -- the file check is
      # structurally blind to it.
      #
      # And this is NOT duplicate alerting, because the thresholds interlock:
      #   file (certificates.yaml:53/:63)  warns at 30d, crits at  7d
      #   wire (here)                      warns at  7d, crits at 24h
      # A normal renewal trips the file rule 23 days first and clears. The wire rule can only
      # fire if the served cert is STILL old three weeks later -- i.e. precisely the
      # renewed-but-not-reloaded case, and nothing else.
      #
      # Selector is job=~"blackbox_.*" rather than an explicit job list so new probe jobs are
      # covered by default and retired ones (blackbox_openclaw) drop out on their own. Only
      # jobs that actually terminate TLS produce this metric, so non-TLS jobs cost nothing.
      - alert: SSLCertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job=~"blackbox_.*"} - time() < 7 * 24 * 3600
        for: 1h
        labels:
          severity: warning
          category: network
          service: ssl
        annotations:
          summary: "SSL certificate for {{ $labels.instance }} expires soon"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}."

      # SSL certificate expiry critical -- same selector widening as above, same reasoning.
      - alert: SSLCertificateExpiringCritical
        expr: probe_ssl_earliest_cert_expiry{job=~"blackbox_.*"} - time() < 24 * 3600
        for: 15m
        labels:
          severity: critical
          category: network
          service: ssl
        annotations:
          summary: "SSL certificate for {{ $labels.instance }} expires very soon"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}."

      # DNS query failures
      - alert: DNSQueryFailure
        expr: probe_success{job="blackbox_dns"} == 0
        for: 2m
        labels:
          severity: warning
          category: network
          service: dns
        annotations:
          summary: "DNS query failure for {{ $labels.instance }}"
          description: "DNS queries to {{ $labels.instance }} have been failing for more than 2 minutes."

  - name: network_performance
    rules:
      # High packet loss simulation (based on probe failures)
      # host_group iot/iot-noping/iot-quiet excluded: intermittent sleepy IoT devices have
      # a naturally < 0.95 success rate and would drive chronic packet-loss
      # noise; this rule tracks infrastructure health only.
      #
      # THE EXPRESSION IS WRONG AND THE RULE HAS NEVER FIRED (measured 2026-07-30, 201d of
      # TSDB). probe_success is a 0/1 GAUGE, so rate() over it is not a success ratio -- it is
      # a per-second derivative that treats every 1->0 transition as a counter reset. Measured
      # 200d maximum of rate(probe_success[5m]) across this selector is 0.0148, so the first
      # conjunct (`< 0.95`) is effectively always true and the whole expression reduces to
      # "there was a transition in the last 5 minutes". ALERTS over 200d: 0 firing samples,
      # 76,300 PENDING samples -- it goes pending constantly and never survives the 8h dwell.
      # The intended form is avg_over_time(probe_success[5m]), which really is the success
      # ratio; whether an 8h-sustained partial-loss page is wanted at all, and at what dwell, is
      # an operator decision, so this is documented rather than rewritten on my own authority.
      - alert: HighPacketLoss
        expr: |
          (
            (rate(probe_success{job="blackbox_icmp",host_group!~"iot|iot-noping|iot-quiet"}[5m]) < 0.95) and
            (rate(probe_success{job="blackbox_icmp",host_group!~"iot|iot-noping|iot-quiet"}[5m]) > 0)
          )
        for: 8h
        labels:
          severity: warning
          category: network
          service: connectivity
        annotations:
          summary: "High packet loss to {{ $labels.instance }}"
          description: "Packet loss to {{ $labels.instance }} has success rate of {{ $value | printf \"%.3f\" }} (< 0.95) over the last 5 minutes, persisting for 8 hours."

      # Network jitter detection (variation in latency)
      # host_group iot/iot-noping/iot-quiet excluded: sleepy IoT devices answer with
      # highly variable latency and would drive chronic jitter noise; this rule
      # tracks infrastructure health only.
      #
      # NEVER FIRED IN 200 DAYS EITHER (measured 2026-07-30): 0 firing samples, 166,595 pending.
      # The threshold is reachable on paper -- 200d max of stddev_over_time(...[10m]) is 2.498s
      # -- but that spread comes from MIXING 5s timeouts with millisecond replies, i.e. it is a
      # restatement of "the host is dropping probes", and the 8h continuous dwell is never met.
      # Same operator decision as HighPacketLoss: keep, retune the dwell, or drop.
      - alert: HighNetworkJitter
        expr: |
          (
            stddev_over_time(probe_duration_seconds{job="blackbox_icmp",host_group!~"iot|iot-noping|iot-quiet"}[10m]) > 0.5
          ) and (
            probe_success{job="blackbox_icmp",host_group!~"iot|iot-noping|iot-quiet"} == 1
          )
        for: 8h
        labels:
          severity: warning
          category: network
          service: performance
        annotations:
          summary: "High network jitter to {{ $labels.instance }}"
          description: "Network jitter to {{ $labels.instance }} is {{ $value }}s (>500ms standard deviation) over the last 10 minutes, persisting for 8 hours."

  - name: blackbox_exporter_health
    rules:
      # Blackbox exporter itself is down
      - alert: BlackboxExporterDown
        expr: node_systemd_unit_state{name="prometheus-blackbox-exporter.service",state="active"} == 0
        for: 1m
        labels:
          severity: critical
          category: monitoring
          service: blackbox_exporter
        annotations:
          summary: "Blackbox exporter is down"
          description: "The blackbox exporter has been down for more than 1 minute."

      # Too many probe targets failing
      # host_group iot/iot-noping/iot-quiet excluded from both counts: the chronically
      # down IoT/noping devices would otherwise inflate the down-ratio and could
      # spuriously trip this fleet-outage detector. It measures only always-on
      # infrastructure (host/peers, gateway, DNS, backbone).
      - alert: MassiveNetworkOutage
        expr: |
          (
            count(probe_success{job="blackbox_icmp",host_group!~"iot|iot-noping|iot-quiet"} == 0) /
            count(probe_success{job="blackbox_icmp",host_group!~"iot|iot-noping|iot-quiet"})
          ) > 0.5
        for: 1m
        labels:
          severity: critical
          category: network
          service: connectivity
        annotations:
          summary: "Massive network outage detected"
          description: "More than 50% of monitored hosts are unreachable. This may indicate a local network or internet connectivity issue."

      # Probe duration taking too long (potential blackbox exporter overload).
      # host_group iot/iot-noping/iot-quiet excluded: these sleepy / ICMP-silent devices
      # are routed to the 10s-timeout icmp_ping_iot module
      # (blackbox-monitoring.nix), so a non-responding device's
      # probe_duration_seconds sits at ~10.0001s every scrape and chronically
      # trips this >10 meta-rule — that is the configured module timeout doing
      # its job, not exporter overload. The always-on ICMP hosts plus all
      # HTTP/HTTPS/DNS jobs (which carry no host_group) stay in scope, so a
      # genuine exporter overload is still caught. Mirrors the exclusion on the
      # sibling blackbox rules (HostUnreachable, HighLatency, CriticalLatency).
      #
      # SCOPE IS NARROWER THAN THE COMMENT ABOVE IMPLIES (measured 2026-07-30). Every prober
      # module on this host except `https_public` AND `icmp_ping_iot` (both 10s, verified at
      # modules/services/blackbox-monitoring.nix:69-71) has a 5s timeout, so a `> 10` threshold is
      # reachable ONLY by the two public-tunnel targets (200d max 10.006s for
      # calendar.newartisans.com, 10.002s for data.newartisans.com) -- for which it is a
      # duplicate of PublicEdgeDown (critical, for:3m). It cannot detect exporter overload on
      # the local HTTPS/DNS/TCP/ICMP jobs at all, because those probes are capped at ~5s. Its
      # 200d firing history is dominated by iot/iot-noping instances that were scraped before
      # the host_group label existed (nest-upstairs.lan, 1,910 samples) and would be excluded
      # today. Same operator decision as HighLatency/ProbeSlowResponse: either the timeouts move
      # or these pseudo-latency rules go.
      - alert: BlackboxProbeTimeout
        expr: probe_duration_seconds{job=~"blackbox_.*",host_group!~"iot|iot-noping|iot-quiet"} > 10
        for: 2m
        labels:
          severity: warning
          category: monitoring
          service: blackbox_exporter
        annotations:
          summary: "Blackbox probe timeout for {{ $labels.instance }}"
          description: "Blackbox probe to {{ $labels.instance }} is taking {{ $value }}s (>10s), indicating potential exporter overload."

  - name: nginx_web
    rules:
      # Nginx worker-connection saturation. nginx runs with the compiled-in
      # default worker_connections=512 (the events{} block in the generated
      # nginx.conf is empty, so no override is set). 0.8 * 512 = ~410; we use
      # 400 as the warning floor. Live baseline (7d): nginx_connections_active
      # max=23, p99=9 — so 400 is ~17x the observed peak and will not fire
      # spuriously. nginx_connections_active counts active client connections
      # (reading + writing + waiting); sustained proximity to the worker-
      # connection limit means new connections will start being dropped.
      - alert: NginxConnectionsHigh
        expr: nginx_connections_active{job="nginx"} > 400
        for: 10m
        labels:
          severity: warning
          category: web
          service: nginx
        annotations:
          summary: "Nginx active connections high"
          description: "nginx_connections_active is {{ $value | printf \"%.0f\" }} (>400, i.e. >0.8 of the 512 worker_connections limit) for more than 10 minutes — connection saturation; new connections may be dropped."

      # Nginx prometheus exporter unable to scrape stub_status. nginx_up is 1
      # when the last scrape of /nginx_status succeeded, 0 otherwise. Live
      # baseline: nginx_up == 1. A 0 means the exporter is up but stub_status
      # is unreachable (nginx down/misconfigured) — connection metrics go blind.
      - alert: NginxExporterDown
        expr: nginx_up == 0
        for: 3m
        labels:
          severity: warning
          category: monitoring
          service: nginx_exporter
        annotations:
          summary: "Nginx exporter cannot scrape stub_status"
          description: "nginx_up == 0 for more than 3 minutes — the nginx prometheus exporter (localhost:9113) cannot read /nginx_status, so nginx connection/request metrics are stale."

  - name: tls_security
    rules:
      # TLS protocol floor. probe_tls_version_info{version=...} == 1 marks the
      # negotiated TLS version for each blackbox HTTPS probe target. Live
      # baseline (re-verified 2026-07-27): all 48 TLS-probed blackbox targets
      # negotiate TLS 1.3 (zero on 1.0/1.1/1.2) — 46 of them across the four
      # blackbox_https* jobs, plus blackbox_openclaw and blackbox_memory_vault,
      # so this rule stays silent today and only fires if a vhost ever
      # downgrades to a deprecated TLS 1.0/1.1 protocol.
      - alert: TLSVersionWeak
        expr: probe_tls_version_info{version=~"TLS 1.0|TLS 1.1"} == 1
        for: 1h
        labels:
          severity: warning
          category: security
          service: tls
        annotations:
          summary: "Weak TLS version negotiated for {{ $labels.instance }}"
          description: "{{ $labels.instance }} negotiated {{ $labels.version }} (a deprecated TLS protocol) for more than 1 hour — raise the minimum TLS version on this vhost."

  - name: public_edge
    rules:
      # Public-edge reachability for the cloudflared-tunnelled vhosts. The
      # blackbox_https_public job probes the FULL public path (Cloudflare edge
      # -> tunnel -> origin nginx), so probe_success==0 means the public surface
      # is genuinely down, not a LAN-internal hiccup. The generic HostUnreachable
      # rule (job=~"blackbox_.*") also backstops this; this dedicated rule gives
      # public-edge-specific context. Live baseline: probe_success==1 for both
      # data.newartisans.com (200) and calendar.newartisans.com (404 accepted by
      # the https_public module).
      #
      # SOLE OWNER of the blackbox_https_public job as of 2026-07-28: both
      # WebServiceDown (network_connectivity group) and HostUnreachable (above) now
      # exclude it, so this rule is the only public-edge coverage and its dwell has to
      # be capable of firing.
      #
      # DWELL CORRECTED 10m -> 3m, and this is a REGRESSION FIX for my own earlier change.
      # Measuring contiguous probe_success==0 runs at 30s resolution over 3 days:
      #   calendar.newartisans.com  5 runs, longest 4.00 min
      #   data.newartisans.com      5 runs, longest 3.00 min
      #   for=2m  would fire on 3 / 2 runs
      #   for=3m  would fire on 2 / 2 runs
      #   for=5m  would fire on 0 / 0 runs   <-- the originally proposed value
      #   for=10m would fire on 0 / 0 runs   <-- what I had shipped
      # CORRECTION: "10m was incapable of firing on ANY observed outage" -- which an earlier
      # version of this comment asserted -- is FALSE. Widening from 3 days to 30 days finds a
      # 14.00-minute outage on 2026-07-03 that BOTH 10m and 5m would have caught. My 3-day
      # window missed the only large outage of the month, which is exactly the error my own
      # sibling commit warns about (short windows understate extremes). 3m is still the right
      # value -- it additionally catches the 3-4 minute bursts that 10m misses -- but the
      # justification is "too slow for the observed burst class", not "incapable of firing".
      # 3m fires on the genuine multi-minute outages while still ignoring the 1-2 minute
      # blips that made the old 1m WebServiceDown page repeatedly -- which was the whole
      # point of moving ownership here. DISCLOSED COST, quantified over 30 days: of 29
      # contiguous zero-runs for calendar and 24 for data, only 3 each reach the 3m dwell, so
      # roughly 26 and 21 sub-3-minute events now page nothing. Residual coverage for those
      # is only cloudflared_tunnel_ha_connections, which was <2 for just 35 minutes across the
      # month and never 0 -- it covers tunnel-connection causes but NOT origin, cert or
      # Cloudflare-edge failures. That is a real gap, accepted deliberately. It also sits above HostUnreachable's 2m, so this is
      # a deliberate step down in sensitivity rather than an accidental duplicate.
      - alert: PublicEdgeDown
        expr: probe_success{job="blackbox_https_public"} == 0
        for: 3m
        labels:
          severity: critical
          category: network
          service: public_edge
        annotations:
          summary: "Public edge {{ $labels.instance }} is unreachable"
          description: "Public-tunnel probe to {{ $labels.instance }} (via cloudflared) has been failing for more than 3 minutes — the public path (Cloudflare edge / tunnel / origin nginx / cert) is broken."

  # ===================================================================
  # ARCHETYPE (5): CHRONIC AVAILABILITY
  # ===================================================================
  # Added 2026-07-28. Before this, NOT ONE of the ~500 rules on this host used
  # avg_over_time() on `up` or `probe_success` -- verified by scanning every rule
  # expression. Every availability rule was instantaneous with a short dwell, which means a
  # service that is down 13% of the time but never for more than a few minutes at a stretch
  # was completely invisible. That is how copyparty sat at 86.5% weekly availability
  # unnoticed, and it is why its 22.6-hour outage on 2026-07-23 (CopypartyDown, critical)
  # left exactly one line in its journal and was never triaged.
  #
  # PREMISE CORRECTED 2026-07-29. An earlier version of this comment claimed these rules
  # catch failures "too short to trip the acute rules", and cited copyparty and openclaw as
  # examples. That was FALSE, and measuring it properly is instructive:
  #   copyparty's 13.49% unavailability is ONE contiguous 22.65-hour outage (07-23 07:02Z ->
  #     07-24 05:41Z), not many short ones. CopypartyDown (critical, for:5m) DID fire --
  #     2,709 firing samples in the window.
  #   openclaw /health's 5.84% is ONE contiguous 9.73-hour outage plus ~4 minutes of blips.
  #     OpenClawHttpHealthDown (critical, for:1m) DID fire -- 88 firing samples.
  # So the acute coverage worked. The actual defect was that a CRITICAL alert fired for 22.65
  # hours and nobody triaged it -- a delivery/attention problem, not a detection gap, and it
  # is addressed by the alert-history section of the daily report (scripts/log-summarizer.py),
  # not here.
  #
  # These rules are therefore kept on a NARROWER and honest justification: they are a
  # weekly-scale BACKSTOP. They answer "what has been unreliable over a week", which no
  # instantaneous rule answers, and they will catch a genuinely flapping service whose
  # individual failures are too short to trip an acute dwell -- a real class, just not the one
  # the current two matches demonstrate.
  #
  # THE "LAGGING DUPLICATE" COST WAS NOT ACCEPTABLE, AND IS NOW FIXED (2026-07-30). The
  # paragraph that used to sit here said both rules "will fire as LAGGING duplicates ... until
  # the 07-23/07-24 samples age out of the 7d window. That is the honest cost of a 7-day
  # lookback." It was honest but wrong to accept: measured on 2026-07-30, ServiceChronically-
  # Unavailable was STILL PAGING for copyparty (7d avg 92.66%) about an incident that ended
  # 2026-07-24 05:38Z. copyparty had been up for every single scrape since --
  # avg_over_time(up[6d]) == 1 exactly, changes(up[7d]) == 1 -- so the page was six and a half
  # days stale and there was nothing left to act on. An alert that pages for a week about a
  # resolved incident is how an operator learns to ignore the alert.
  #
  # THE FIX IS A RECENCY CONJUNCT, NOT A SHORTER WINDOW. Both rules now also require
  # min_over_time(<metric>[1d]) == 0, i.e. at least one FAILED sample in the last 24 hours. The
  # 7d lookback is what accumulates a deficit that no single day exceeds, so it is kept; the
  # guard simply insists the degradation is still CURRENT. Shortening the window instead would
  # have destroyed the accumulation the rules exist for (a target losing 30 min every other
  # day is 97.9% weekly but 100% on half its days).
  #
  # VERIFIED BY EVALUATING BOTH FORMS AT PAST TIMESTAMPS (Prometheus /api/v1/query&time=,
  # 201 days of TSDB on hand), old vs new:
  #   copyparty  07-23 09:00Z .. 07-25 04:00Z  old fires, new fires  (IDENTICAL detection --
  #              the guard is trivially satisfied while the service is actually down)
  #   copyparty  07-25 12:00Z .. 07-30 17:00Z  old fires, new SILENT (the stale tail, gone)
  #   openclaw   07-23 .. 07-25 old fires, new fires; 07-26/07-27 both silent; 07-28 AND
  #              07-29 old fires, new FIRES AGAIN -- openclaw had fresh failures on those days,
  #              so the flapping/chronic case the rules were built for is preserved, and each
  #              notification now points at an episode from the last 24h.
  # Net effect on 2026-07-23: unchanged. It still crosses 0.98 after ~3.4h of downtime and
  # pages ~1h later, mid-incident. Net effect afterwards: the stale tail shrinks from ~6.5 days
  # to at most 24h. A rule that re-fires on each fresh failure day is the intended behaviour,
  # not flapping to be suppressed.
  #
  # Threshold 98% over 7 days, chosen from the measured distribution rather than picked:
  #   scraped jobs   copyparty 86.51%  |  next worst darwin-hera 99.95%  -> 1 match
  #   blackbox       openclaw /health 94.16%  |  next worst 99.86%       -> 1 match
  # So 98% sits in a wide empty band -- everything healthy is above 99.85% and the two real
  # offenders are below 95%. Verified live: rule A returns exactly copyparty, rule B exactly
  # openclaw. Rule B is threshold-insensitive between 95% and 99%, confirming openclaw is a
  # genuine outlier and not a boundary artefact.
  - name: chronic_availability
    interval: 15m
    rules:
      # COVERAGE GUARD, and note it is a RATIO not an absolute count -- that detail is the
      # whole point. avg_over_time normalises over PRESENT samples only, which gives two
      # failure modes: a newly-added target with a short, partly-down life reports a low
      # average and pages spuriously, and a DECOMMISSIONED target keeps matching for up to
      # 7 days after its last sample.
      #
      # My first attempt at the guard used `count_over_time(up[7d]) > 0.8 * 40320`, taking
      # 40320 = 7d/15s from the global scrape_interval. That was WRONG and silenced the rule
      # for most targets, because scrape intervals vary per job -- measured: copyparty 20,149
      # samples/7d (30s), all blackbox jobs 10,072 (60s), node-red 40,302 (15s),
      # critical-services-health 60,449 (faster than 15s). A fixed count excluded copyparty,
      # the rule's only real finding.
      #
      # The 7d:1d ratio is self-calibrating to whatever interval a job actually uses: a target
      # present all week has ~7x its 1-day sample count regardless of interval. 5.6 = 0.8*7,
      # tolerating restarts. Verified per case: copyparty passes, node-red passes, the `nut`
      # job added 30 minutes earlier correctly FAILS, and a decommissioned target drops out
      # because its 1d count is absent so the join finds no match.
      #
      # RECENCY GUARD (third conjunct, added 2026-07-30): at least one failed scrape in the
      # last 24h. Without it this rule pages for a full 7 days about an incident that ended on
      # day one -- see the section header for the measured before/after. min_over_time on a 0/1
      # gauge == 0 iff some scrape failed in the window; if the target has been absent for the
      # whole day the conjunct is NO_DATA and the join drops it, which is correct (a wholly
      # absent target is TargetDown's job, not this rule's).
      - alert: ServiceChronicallyUnavailable
        expr: |
          avg_over_time(up[7d]) < 0.98
          and on(job,instance)
          (count_over_time(up[7d]) / on(job,instance) count_over_time(up[1d])) > 5.6
          and on(job,instance)
          (min_over_time(up[1d]) == 0)
        for: 1h
        labels:
          severity: warning
          category: monitoring
          service: availability
        annotations:
          summary: "{{ $labels.job }} has only {{ $value | humanizePercentage }} availability over 7 days"
          description: "Scrape target {{ $labels.job }} ({{ $labels.instance }}) has been up only {{ $value | humanizePercentage }} of the last 7 days AND failed at least one scrape in the last 24 hours, so the degradation is still current. Healthy targets here sit above 99.9%. NOTE this is a weekly BACKSTOP, not proof that acute alerting missed anything -- check whether a *Down alert already fired and went untriaged before assuming this is a new discovery. Intermittent-by-design targets (laptops, sleepy devices) should be excluded rather than tolerated."

      # host_group iot/iot-noping/iot-quiet excluded for the same reason they are excluded
      # from HostUnreachable: those devices sleep by design and would sit permanently below
      # any availability floor.
      #
      # A TL-WPA8630 carve-out was REMOVED 2026-07-29: it rested on a false premise. I had
      # read 0.28% availability as "the device is effectively dead". It is not -- the powerline
      # adapter is probed by IP LITERAL (its DHCP name does not resolve; see
      # blackbox-monitoring.nix) and that target reads 99.978% over both 7d and 30d. The 0.28%
      # belongs to a RETIRED hostname-labelled series that stopped being scraped on 07-22, and
      # which the coverage guard below now excludes automatically. The carve-out would also
      # have become dead config on its own once those stale samples aged out.
      #
      # Coverage guard, same self-calibrating 7d:1d ratio as rule A -- and it is what makes
      # the removed TL-WPA8630 carve-out unnecessary: that retired hostname series has stale
      # 7d samples but none in the last day, so the join drops it automatically. Verified.
      #
      # Recency guard, same as rule A and for the same measured reason: require a failed probe
      # in the last 24h so a resolved outage stops paging for the rest of the week. Verified on
      # openclaw /health: it keeps firing 07-23..07-25, goes quiet 07-26/07-27, and fires again
      # on 07-28 and 07-29 when fresh failures appeared.
      - alert: ProbeTargetChronicallyFailing
        expr: |
          avg_over_time(probe_success{host_group!~"iot|iot-noping|iot-quiet"}[7d]) < 0.98
          and on(job,instance)
          (count_over_time(probe_success[7d]) / on(job,instance) count_over_time(probe_success[1d])) > 5.6
          and on(job,instance)
          (min_over_time(probe_success[1d]) == 0)
        for: 1h
        labels:
          severity: warning
          category: monitoring
          service: availability
        annotations:
          summary: "Probe {{ $labels.instance }} succeeded only {{ $value | humanizePercentage }} of the last 7 days"
          description: "Blackbox probe {{ $labels.instance }} (job {{ $labels.job }}) has succeeded only {{ $value | humanizePercentage }} of the last 7 days AND failed at least once in the last 24 hours, so the degradation is still current. Healthy probe targets here sit above 99.85%. NOTE this is a weekly BACKSTOP: check whether an acute probe alert already fired and went untriaged before treating this as a new finding."

  - name: probe_latency
    rules:
      # Generic internal-vhost latency. probe_duration_seconds for the local
      # HTTPS job catches any internal vhost grinding (slow backend, swap
      # pressure, GC pause).
      #
      # CLAIM CORRECTED AND THIS RULE IS DEAD (measured 2026-07-30, 201d of TSDB). The comment
      # here used to say "every instance is well under 1.5s even at 7d-max (slowest is litellm
      # at 1.478s) ... so the >10s floor is ~7x above the observed worst case". Both halves are
      # wrong. The `https_local` prober TIMEOUT IS 5s (modules/services/blackbox-monitoring.nix:
      # 110-112), so probe_duration_seconds on this job can never reach 10 -- 200d max is
      # 5.009s, and ALERTS confirms 0 firing and 0 pending samples in 200 days. And the observed
      # worst case is not 1.478s. MEASURED MAXIMA ARE WINDOW-DEPENDENT, so they are dated here
      # rather than stated as timeless facts -- this file has already carried three different
      # "observed max" figures, each correct only for the window it was taken over:
      #   successful local probes, max over 200d as of 2026-07-30 : 4.699s (hass.vulcan.lan)
      #   the same series, max over 30d  as of 2026-07-30         : 1.825s (promtail.vulcan.lan)
      # Size thresholds off the LONGER window; quote the window whenever you cite a number.
      # Query form that matters: filter on success, or you measure the timeout instead of the
      # probe -- an unfiltered max over 30d returns ~5.0s for every instance, which is just the
      # 5s cap being hit. Per-instance 99.9th
      # percentiles up to 0.616s. That leaves no room for an absolute threshold: anything under
      # the 5s cap sits within ~15-35% of a real successful probe, and anything at or above the
      # cap is unreachable. A working "vhost grinding" signal needs either a longer prober
      # timeout (blackbox-monitoring.nix) or a per-target relative rule (current 15m median vs
      # that target's own 30d median). Both are operator decisions; the rule is left in place,
      # inert, rather than deleted or retuned on a guess.
      - alert: ProbeSlowResponse
        expr: probe_duration_seconds{job="blackbox_https_local"} > 10
        for: 15m
        labels:
          severity: warning
          category: network
          service: web_latency
        annotations:
          summary: "Slow HTTPS response from {{ $labels.instance }}"
          description: "Blackbox probe to {{ $labels.instance }} is taking {{ $value | printf \"%.1f\" }}s (>10s) for more than 15 minutes — the vhost or its backend is grinding."

  - name: asymmetric_routing
    rules:
      # Continuous post-boot drift detector for the source-policy ip rules.
      # The pri 50/51 rules (cross-subnet routing from 192.168.1.2) have silently
      # vanished from the kernel after boot despite the fail-loud oneshot's success;
      # the asymmetric-routing-exporter re-checks them every minute and emits this
      # gauge. == 0 means at least one rule is missing and cross-subnet replies will
      # leave with the wrong source IP.
      - alert: AsymmetricRoutingRulesMissing
        expr: asymmetric_routing_rules_present == 0
        for: 2m
        labels:
          severity: critical
          category: network
          service: routing
        annotations:
          summary: "Asymmetric-routing ip rules missing from kernel"
          description: "One or both source-policy ip rules (pri 50/51 from 192.168.1.2 to 192.168.0.0/16 and 10.0.0.0/8 lookup end0_return) have been absent for more than 2 minutes. Cross-subnet replies will use the wrong source IP. Fix: `systemctl restart asymmetric-routing`."

  - name: opnsense_exporter_health
    rules:
      # OpnSense Telegraf exporter (job=opnsense) is down
      - alert: OpnsenseExporterDown
        expr: up{job="opnsense"} == 0
        for: 3m
        labels:
          severity: critical
          category: monitoring
          service: opnsense_exporter
        annotations:
          summary: "OpnSense exporter is down"
          description: "The OpnSense exporter (job=opnsense, {{ $labels.instance }}) has been unreachable for more than 3 minutes — firewall/router metrics are stale."

      # OpnSense node exporter (job=node_opnsense) is down
      - alert: OpnsenseNodeExporterDown
        expr: up{job="node_opnsense"} == 0
        for: 3m
        labels:
          severity: warning
          category: monitoring
          service: opnsense_node_exporter
        annotations:
          summary: "OpnSense node exporter is down"
          description: "The OpnSense node exporter (job=node_opnsense, {{ $labels.instance }}) has been unreachable for more than 3 minutes — host-level router metrics are stale."

  - name: opnsense_wireguard
    rules:
      # WireGuard tunnel interface down. opnsense_wireguard_interfaces_status is a
      # gauge (1 = up, 0 = down). Both WG1 (wg0) and WG2 (wg1) are always-on
      # site tunnels and sit at a steady 1 (verified min_over_time[24h] == 1 for
      # both), so == 0 will not fire spuriously. Per-peer status is intentionally
      # NOT alerted here: opnsense_wireguard_peer_status (1=up,0=down,2=unknown,
      # 3=stale) tracks road-warrior client devices that are dormant (down/stale,
      # handshake ts 0) most of the time by design — a peer==0 rule would be
      # chronic noise. The interface gauge is the always-on signal.
      - alert: WireGuardInterfaceDown
        expr: opnsense_wireguard_interfaces_status == 0
        for: 5m
        labels:
          severity: warning
          category: network
          service: wireguard
        annotations:
          summary: "WireGuard interface {{ $labels.device_name }} is down"
          description: "OPNsense WireGuard interface {{ $labels.device_name }} ({{ $labels.device }}) has reported down (status 0) for more than 5 minutes — the VPN tunnel is offline."

  - name: host_network_interfaces
    rules:
      # Physical-NIC receive errors. node_network_receive_errs_total accumulates
      # RX errors; scoped to the two real interfaces (end0 wired, wlp1s0f0 wifi)
      # to avoid veth/bridge noise. The "increase[1h] == 0 on both" baseline that used
      # to be claimed here was an instantaneous reading, not the record: over the full
      # 201 days of TSDB the maximum 1h increase is 4.01 on end0 (RX) and 2.01 on
      # wlp1s0f0 (TX), so > 10 errors/hour keeps ~2.5x headroom over real background
      # error bursts and is still a genuine "cable/duplex/NIC half-dead" signal.
      # Neither rule has fired in 200d (0 firing, 0 pending samples).
      - alert: HostNICReceiveErrors
        expr: increase(node_network_receive_errs_total{device=~"end0|wlp1s0f0"}[1h]) > 10
        for: 5m
        labels:
          severity: warning
          category: network
          service: host_nic
        annotations:
          summary: "RX errors on host NIC {{ $labels.device }}"
          description: "Interface {{ $labels.device }} accumulated {{ $value | printf \"%.0f\" }} receive errors in the last hour (>10) — possible cable, duplex, or NIC fault."

      # Physical-NIC transmit errors, same rationale/baseline as RX.
      - alert: HostNICTransmitErrors
        expr: increase(node_network_transmit_errs_total{device=~"end0|wlp1s0f0"}[1h]) > 10
        for: 5m
        labels:
          severity: warning
          category: network
          service: host_nic
        annotations:
          summary: "TX errors on host NIC {{ $labels.device }}"
          description: "Interface {{ $labels.device }} accumulated {{ $value | printf \"%.0f\" }} transmit errors in the last hour (>10) — possible cable, duplex, or NIC fault."

      # Carrier flapping on the wired uplink. node_network_carrier_changes_total
      # accumulates from boot, so we use increase() over a 1h window (NOT the
      # absolute value, which is just 1-2 from the boot transition). The "increase[1h]
      # == 0" baseline claimed here was likewise an instantaneous reading: the 201-day
      # maximum is 3.007 on end0, so > 4 sits only ~33% above observed benign
      # behaviour — the thinnest real margin left in this file, and the one to revisit
      # first if this ever pages during a reboot rather than a genuine flap. It has not
      # fired in 200d (0 firing, 0 pending). > 4 transitions/hour still catches the
      # boot-fragility / flapping-link class directly via the real signal.
      - alert: HostNICCarrierFlap
        expr: increase(node_network_carrier_changes_total{device="end0"}[1h]) > 4
        for: 5m
        labels:
          severity: warning
          category: network
          service: host_nic
        annotations:
          summary: "Carrier flapping on host NIC {{ $labels.device }}"
          description: "Interface {{ $labels.device }} changed carrier state {{ $value | printf \"%.0f\" }} times in the last hour (>4) — the physical link is flapping."

  - name: host_node_exporter_health
    rules:
      # The host node_exporter (job=node, localhost:9100) is the SOLE source of
      # every node_network_*, node_systemd_unit_state, node_nf_conntrack_*, and
      # textfile-collector series. If it dies, all of the above (and the existing
      # systemd-state alerts) go silently blind. The host-wide TargetDown catch-all
      # in meta-monitoring.yaml covers this at warning/5m; this gives a faster,
      # critical-severity page specifically for the host's primary metrics source.
      # Live baseline: up{job="node"} == 1.
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
          category: monitoring
          service: node_exporter
        annotations:
          summary: "Host node_exporter is down"
          description: "The host node_exporter (job=node, {{ $labels.instance }}) has been unreachable for more than 2 minutes — all host-level metrics (network, systemd unit state, textfile collectors) are blind."
