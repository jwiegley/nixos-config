groups:
  - name: nginx_web_errors
    interval: 1m
    rules:
      # nginx access logs reach Loki as {job="nginx-access"} from
      # /var/log/nginx/access.log, with promtail extracting the HTTP status
      # code into a parsed `status` stream label (verified live: values seen
      # include 200/301/302/401/404/499/500/502). NOTE: there is NO separate
      # nginx *error*-log stream in Loki on this host (no job="nginx-error",
      # no nginx error.log filename), so these rules key off the access log's
      # status label rather than error-log severity text — the only nginx web
      # signal Loki actually carries. (coverage plan P1, web-blackbox)
      #
      # 5xx burst. Steady-state is ~0. We want a SUSTAINED failure, not the
      # ~1-2 minute spike a Home Assistant restart produces: when HA goes down
      # to restart, its websocket clients reconnect-storm /api/websocket through
      # the proxy at ~60-80 req/s for the ~minute HA is unavailable, logging
      # ~4000 502s per restart. The old raw `count_over_time[10m] > 30, for:0m`
      # turned every routine HA restart / nixos switch into a 10-minute page
      # (diagnosed 2026-06-27). So we count 5xx in a trailing 2m window (>30 =
      # >15/min) and require it to hold for a full 10m: a brief restart blip
      # decays out of the 2m window long before 10m elapses, while a real,
      # lasting outage keeps 5xx flowing and still fires (~10m after onset).
      - alert: Nginx5xxBurst
        expr: |
          sum(count_over_time({job="nginx-access", status=~"5.."}[2m])) > 30
        for: 10m
        labels:
          severity: warning
          category: logs
          service: nginx
        annotations:
          summary: "nginx is serving a sustained burst of 5xx responses"
          description: |
            nginx has logged more than 30 HTTP 5xx responses per 2-minute
            window continuously for 10 minutes — a sustained upstream or
            application failure (not a brief backend restart). Check which
            vhost/upstream is erroring (Grafana Loki, status=~"5.." on
            job="nginx-access") and the backing service's logs.

      # Gateway / upstream-connect failures specifically (502/503/504) — the
      # access-log proxy for "upstream unreachable / refused / timed out" (the
      # nginx error-log lines that carry "connect() failed" / "upstream timed
      # out" are not shipped to Loki on this host). Same sustained shape as the
      # 5xx burst above (>10 in a trailing 2m window held for 10m, for:10m), so
      # a backend that stays down fires while the brief 502 reconnect-storm of a
      # routine HA restart does not (see the Nginx5xxBurst note, 2026-06-27).
      - alert: NginxUpstreamFailureBurst
        expr: |
          sum(count_over_time({job="nginx-access", status=~"50[234]"}[2m])) > 10
        for: 10m
        labels:
          severity: warning
          category: logs
          service: nginx
        annotations:
          summary: "nginx upstream/gateway failures (502/503/504)"
          description: |
            More than 10 HTTP 502/503/504 responses per 2-minute window for 10
            minutes straight — an upstream service is persistently unreachable,
            refusing connections, or timing out behind the proxy (a one-off
            restart blip is excluded). Identify the vhost (status=~"50[234]" on
            job="nginx-access") and restart/inspect the backing service.

      # Low-volume application 500s. The Nginx5xxBurst rule above is a
      # SUSTAINED-outage detector (>30 5xx/2m held 10m), deliberately tuned high
      # to ignore the ~4000-502 reconnect storm of a routine HA/nixos restart.
      # But that floor also hides a persistent-but-low-volume app failure — e.g.
      # a broken login that only 500s when a user actually tries — which never
      # accumulates burst volume (diagnosed 2026-07-22: a single teable
      # `POST /api/auth/signin` 500 was invisible to every probe and to the
      # burst rule, because the anonymous blackbox probes only GET the root and
      # the burst rule needs >30/2m). Restart storms are 502s; a pure
      # 500 is an application error, steady-state ~0 here — so a sensitive
      # 500-ONLY tier catches real app breakage within ~15m of a few
      # occurrences without re-introducing the 502 restart noise.
      - alert: NginxApplicationError500
        expr: |
          sum(count_over_time({job="nginx-access", status="500"}[15m])) > 2
        for: 0m
        labels:
          severity: warning
          category: logs
          service: nginx
        annotations:
          summary: "An nginx-proxied app is returning HTTP 500 (application errors)"
          description: |
            More than 2 HTTP 500 responses in the last 15 minutes across nginx
            vhosts (steady-state is ~0). A 500 is an application-level failure,
            distinct from the 502/503/504 upstream-restart storms the burst
            rules cover, so this catches a persistent-but-low-volume breakage
            (e.g. a broken login that only errors on a real attempt) that the
            high-threshold 5xx burst rule never accumulates enough volume to
            fire on. Identify the vhost/path in Grafana Loki (status="500" on
            job="nginx-access") and inspect that app's logs.

      # Auth-failure burst (401/403). Baseline is tiny (24h peak per-10m
      # window = 2), but LAN/internet scanners probing the reverse proxy can
      # produce short 401 bursts; the threshold is set well above the observed
      # peak (>60 in 10m, ~30x baseline) so only a sustained credential-stuffing
      # / scanner storm against a basic-auth-protected vhost fires it.
      - alert: NginxAuthFailureBurst
        expr: |
          sum(count_over_time({job="nginx-access", status=~"40[13]"}[10m])) > 60
        for: 0m
        labels:
          severity: warning
          category: security
          service: nginx
        annotations:
          summary: "nginx auth-failure burst (401/403)"
          description: |
            More than 60 HTTP 401/403 responses were logged by nginx in the
            last 10 minutes — far above the normal background of a couple per
            window. This is likely credential stuffing or a scanner hammering
            an auth-gated vhost. Identify the source (status=~"40[13]" on
            job="nginx-access", group by client_ip) and consider blocking it.
