groups:
  - name: auth_security
    interval: 1m
    rules:
      # Sudo authentication failures. The promtail "sudo" job tails
      # /var/log/sudo.log (see modules/services/promtail.nix), which captures
      # sudo invocations including failures, independent of the journal
      # priority-5..7 drop. On this host every automated sudo runs NOPASSWD and
      # SUCCEEDS, so the failure baseline is ~0 (verified 2026-06-09: zero
      # matches of this pattern over 7 days; the job="sudo" stream is otherwise
      # near-empty). More than 3 failures in 15 minutes therefore means a real
      # bad-password / not-in-sudoers / privilege-probe burst worth surfacing.
      - alert: SudoAuthFailures
        expr: |
          count_over_time({job="sudo"} |~ "authentication failure|NOT in sudoers|incorrect password" [15m]) > 3
        for: 0m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Repeated sudo authentication failures"
          description: "More than 3 sudo failures (authentication failure / NOT in sudoers / incorrect password) in the last 15 minutes. On this host sudo normally runs NOPASSWD and never fails, so this is a privilege-escalation probe or a misconfigured automation. Inspect job=\"sudo\" in Loki for the user and command."

      # PostgreSQL authentication failures.
      #
      # postgresql.service logs to the journal but its lines carry no sd-daemon
      # priority prefix, so even FATAL auth failures land at priority 6 (info)
      # and were silently dropped by the consolidated systemd-journal promtail
      # scrape (priority 5..7 drop). A dedicated job="postgresql" journal scrape
      # WITHOUT the priority drop was added in modules/services/promtail.nix
      # (mirrors the job="sshd" scrape), so these lines now reach Loki.
      #
      # Baseline (verified 2026-06-10): 0 lines matching this pattern in the
      # postgresql journal over 7 days — normal apps connect over a trusted
      # local socket / pg_hba, so a real failure burst (a bad client, a
      # password-guessing attempt, or a pg_hba misconfiguration after a change)
      # is the only thing that reaches >5 in 15 minutes.
      - alert: PostgresAuthFailures
        expr: |
          count_over_time({job="postgresql"} |~ "password authentication failed|no pg_hba.conf entry" [15m]) > 5
        for: 0m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Repeated PostgreSQL authentication failures"
          description: "More than 5 PostgreSQL auth failures (password authentication failed / no pg_hba.conf entry) in the last 15 minutes. This is a credential-probing attempt or a pg_hba/role misconfiguration after a recent change. Inspect job=\"postgresql\" in Loki for the failing role and source."
