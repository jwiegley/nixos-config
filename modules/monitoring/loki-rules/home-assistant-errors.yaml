groups:
  # =====================================================================
  # HOME ASSISTANT / NODE-RED APPLICATION ERRORS
  # =====================================================================
  # These rules only became possible on 2026-07-29, when a dedicated promtail scrape
  # (job="ha-nodered" in modules/services/promtail.nix) started ingesting these units.
  # Both log EVERYTHING at journal priority 6 because they write plain text to stdout with
  # no "<N>" syslog prefix, and the consolidated systemd-journal scrape drops priority 5-7 --
  # so 100% of their output, including every traceback, was invisible to Loki. Measured over
  # 3 days beforehand: home-assistant 12,276 of 12,279 lines at priority 6 containing 1,046
  # error-shaped lines; node-red 144 of 145.
  #
  # That is precisely why the two defects below went unnoticed for weeks despite every
  # service-level signal being green.
  - name: home_assistant_errors
    interval: 1m
    rules:
      # A-91 DETECTION HALF. Every climate.set_temperature call against climate.upstairs
      # raises an unhandled TypeError at homeassistant/components/nest/climate.py:317
      # ("unsupported operand type(s) for -: 'float' and 'NoneType'"), because
      # target_temperature_high is None when the Nest is not in a heat_cool mode. Measured
      # 28 failures over 3.2 days (~8.75/day), and EVERY ONE silently discards the setpoint --
      # the thermostat simply never receives it. The caller is versatile_thermostat.
      #
      # Detection-only on purpose: the fix is upstream in the Nest component or a VTherm
      # reconfiguration, so this makes the failure VISIBLE rather than pretending to fix it.
      #
      # PATTERN CORRECTED before shipping. My first attempt matched
      # `climate.py.*unsupported operand type`, which can NEVER match: in a Python traceback
      # the file path and the exception message are SEPARATE journal lines, and LogQL |~
      # matches within one line. Verified against the journal -- `climate\.py` appears 28
      # times and `unsupported operand type` 28 times, on different lines. Matching the
      # TypeError message alone gives exactly those 28 and is specific enough (bare
      # "TypeError" appears 128 times from unrelated faults).
      #
      # THRESHOLD from measured clustering over the retained 3.2-day journal (NOT 5 days, as
      # an earlier version said): per-day counts were
      # 3 / 12 / 10 / 3 and the busiest single HOUR held only 4. So the ">3 in 1h" I first
      # wrote would have fired on exactly ONE hour in that window. A 24h window catches the
      # sustained condition (the 10-12/day stretches) while ignoring an isolated one-off.
      # Note ANY occurrence means a setpoint was silently discarded, so the threshold is
      # about actionability, not about which failures matter.
      - alert: HomeAssistantClimateSetpointFailing
        expr: |
          sum(count_over_time(
            {job="ha-nodered", unit="home-assistant.service"}
            |~ "unsupported operand type\\(s\\) for -: 'float' and 'NoneType'"
            [24h]
          )) > 5
        for: 30m
        labels:
          severity: warning
          category: logs
          service: home-assistant
        annotations:
          summary: "Home Assistant climate setpoints are failing silently ({{ $value }} in the last 24 hours)"
          description: "climate.set_temperature is raising TypeError in the Nest component, so the requested temperature is NEVER APPLIED and nothing else reports a failure. Root cause (corrected 2026-08-04, recorder-verified: all 15 historical failures fell inside eco windows, zero outside): the Nest is in its ECO PRESET while in cool mode. nest/climate.py enters its range branch on `preset==eco OR heat_cool` and then subtracts target_temperature_high, which is None outside heat_cool. The fix is to never set the Nest's own eco preset — send eco to climate.upstairs_vtherm instead and leave the Nest at cool+none, where set_cool(temp) works. If this fires, find which path set the Nest to eco: the two HA automations or the Node-RED Away-tab 'Set HVAC to Eco' node. Check `journalctl -u home-assistant | grep climate.py` for the traceback."

      # Generic unhandled-exception detector. The specific rule above exists because that
      # bug is known and quantified; this one catches the NEXT one. Deliberately broad --
      # any Traceback in HA means an integration or automation aborted mid-flight.
      # THRESHOLD AND WINDOW CORRECTED. My first version used >10 per [1h] with for:15m,
      # derived from "~1,046 error-shaped lines in 3 days is ~15/hour". That average was
      # taken over a violently bursty distribution and the traceback count itself was never
      # measured. Measuring it: of 17 hours containing tracebacks, 15 held <=4 -- and the
      # only two that crossed 10 held 129 and 89, and were EXACTLY the two hours with
      # systemd restart activity for the unit. So the rule was a guaranteed false positive on
      # the next `nixos-rebuild switch` that restarts Home Assistant.
      #
      # The fix exploits the burst SHAPE rather than raising the threshold (raising it is
      # impossible -- restart bursts are far larger than any real signal). Those 129
      # tracebacks span just 3 distinct minutes (56 at 20:36, 72 at 20:56), i.e. two
      # ~1-minute bursts. With a [15m] window a single burst holds the count above threshold
      # for only ~15 minutes and then rolls off, so a for:30m dwell cannot be satisfied by a
      # restart. A genuinely sustained fault keeps it above threshold continuously and does
      # fire. Non-restart hours peak at 4, so >10 in 15m retains wide margin.
      - alert: HomeAssistantUnhandledExceptions
        expr: |
          sum(count_over_time(
            {job="ha-nodered", unit="home-assistant.service"}
            |~ "Traceback \\(most recent call last\\)"
            [15m]
          )) > 10
        for: 30m
        labels:
          severity: warning
          category: logs
          service: home-assistant
        annotations:
          summary: "Home Assistant logged {{ $value }} tracebacks in 15 minutes, sustained"
          description: "Unhandled exceptions in Home Assistant. Each one means an integration or automation aborted part-way, usually silently -- service calls that raise do not surface anywhere else. Check `journalctl -u home-assistant -n 200`."

      # Integration setup failures. This is the class that hid the 17-day-dead
      # mail_and_packages integration, whose config entry kept reporting "loaded" while all
      # 26 of its entities sat unavailable.
      # HONEST STATUS of the original three strings: PLAUSIBLE BUT UNVERIFIED. All three are
      # real -- confirmed present in the deployed homeassistant package source -- but NONE of
      # them appears anywhere in the retained journal, at any priority. The mail_and_packages
      # failure predates journal retention, so I cannot confirm which string that specific
      # failure mode emits. An earlier version of this comment asserted "setup retries DO log
      # at priority 6" as established fact; that was unsupported and is withdrawn.
      #
      # "could not authenticate" ADDED 2026-07-29 pm, and this is the verified half. The rule
      # as originally written was BLIND to a live failure: across home-assistant's whole
      # retained journal -- 15,371 lines from its last restart at 2026-07-26 10:39:55, so
      # ~3.1 days, NOT the 8 days an earlier version of this comment claimed -- the three
      # strings above match exactly 0 lines, while 2-3 google config entries were verifiably
      # in setup_error the whole time. The real signature, measured 6 times in that window
      # (3 at 2026-07-28 20:37:46 and 3 at 20:56:47), is emitted at WARNING:
      #   [homeassistant.config_entries] Config entry '<title>' for google integration
      #   could not authenticate: 400, ...
      # That is the ConfigEntryAuthFailed class, which is how an expired OAuth refresh token
      # actually surfaces. KNOWN LIMITATION: config_entries logs it only on a (re)setup
      # attempt, so both clusters above land at HA restart moments and this rule gives roughly
      # one hour of visibility per restart -- it is not a continuous state check. The
      # continuous signal is the Node-RED HA-integration health flow, whose own [info] debug
      # payload is what accidentally tripped NodeRedFlowErrors below before its matcher was
      # anchored. Expect this to fire on the next HA restart while any google entry is
      # unauthenticated; that is the coverage gap closing, not a false positive.
      - alert: HomeAssistantIntegrationSetupFailing
        expr: |
          sum by (unit) (count_over_time(
            {job="ha-nodered", unit="home-assistant.service"}
            |~ "(Setup failed for|Error setting up entry|Unable to prepare setup for|could not authenticate)"
            [1h]
          )) > 0
        for: 30m
        labels:
          severity: warning
          category: logs
          service: home-assistant
        annotations:
          summary: "A Home Assistant integration is failing to set up"
          description: "Setup failure or retry logged in the last hour. A config entry can report 'loaded' while its entities are all unavailable, so this log signal is the reliable indicator. Check `journalctl -u home-assistant | grep -E 'Setup failed|Error setting up'`."

      # Node-RED flow errors.
      #
      # THRESHOLD CORRECTED first. Measured over 8 days of journal: node-red is near-silent
      # (a few hundred lines total, busiest error hour 4), so the original ">5 per 1h" sat
      # ABOVE the observed maximum and would never have fired. >0 is the correct choice for
      # a service this quiet: a single [error]-tagged line means a flow aborted.
      #
      # The Pool tab's "OpenUV forecast missing or too short" lines DO exist at 05:00 (2 on
      # 07-26, 2 on 07-27, 1 on 07-28) but node-red tags them [warn], not [error], so the
      # alternation includes that message explicitly.
      #
      # PATTERN CORRECTED 2026-07-29 pm; the earlier claim here that "the pattern is fine"
      # was FALSE. (?i)(error|exception|failed|...) is a bare, unanchored substring, and it
      # matched "error" INSIDE "setup_error" in an [info]-severity debug-node payload dump
      # (the HA-integration health flow, working exactly as designed). That produced the
      # 10:19 PDT NodeRedFlowErrors email with value=2 -- the two
      # "- <account> (google): setup_error" payload fragments.
      #
      # MEASUREMENT WINDOW, stated honestly: node-red's journal begins at its last restart,
      # 2026-07-26 22:13:42, so every count below covers ~2.7 days (334 lines), NOT the
      # 8 days an earlier version of this comment claimed. System journal retention is much
      # longer (oldest entry 2026-07-02) -- the bound is the service's current run, and it
      # resets on every node-red restart. Re-measured over that window: the old pattern
      # matched 19 lines, of which 12 were NOT node-red errors -- 11 setup_error payload
      # fragments plus 1 untagged direct-stdout line ("Failed to resolve IPv4
      # addresses..."). node-red's own logger prefixes every line it emits with
      # "D Mon HH:MM:SS - [level]", so the matcher now keys on that severity tag instead:
      # " - [error] " plus the [warn]-tagged OpenUV message matches exactly 7 lines over the
      # same window (2 genuine [error] api-call-service NoConnectionError + the 5 OpenUV
      # [warn] lines). NOTE this scrape stores each entry as journal-JSON (promtail
      # journal.json=true), so ^-anchoring on the message is impossible; the bracketed
      # severity tag as a substring is the anchor. A debug payload would now have to contain
      # the literal " - [error] " to false-positive: 0 occurrences in those ~2.7 days, which
      # is real but weaker headroom evidence than "8 days" implied.
      - alert: NodeRedFlowErrors
        expr: |
          sum(count_over_time(
            {job="ha-nodered", unit="node-red.service"}
            |~ " - \\[error\\] |missing or too short"
            [1h]
          )) > 0
        for: 15m
        labels:
          severity: warning
          category: logs
          service: node-red
        annotations:
          summary: "Node-RED logged {{ $value }} errors in the last hour"
          description: "Flow errors in Node-RED, matched on node-red's own ' - [error] ' severity tag (plus the Pool tab's [warn] 'OpenUV forecast missing or too short'). A failing flow usually produces no other signal -- the service stays active and its HTTP endpoint stays healthy -- so this log path is the only indicator. Check `journalctl -u node-red -n 100`."
