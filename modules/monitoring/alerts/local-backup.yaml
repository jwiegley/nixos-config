groups:
  - name: local_backup_alerts
    interval: 60s
    rules:
      # Alert when local backup hasn't run in 8 hours (28800 seconds)
      # Backup runs 4x daily (every 6h) with up to 15min randomized delay
      - alert: LocalBackupStale
        expr: (time() - local_backup_last_success_timestamp) > 28800
        for: 5m
        labels:
          severity: critical
          category: storage
          service: local-backup
        annotations:
          summary: "Local backup is stale on {{ $labels.host }}"
          description: |
            Local backup {{ $labels.backup }} ({{ $labels.source }} -> {{ $labels.destination }})
            hasn't run successfully in over 8 hours.
            Last successful backup: {{ $value | humanizeDuration }} ago.
            This may indicate:
            - The backup timer is not running
            - The /tank filesystem is not mounted
            - The rsync process is failing
            Action: Check systemctl status local-backup.timer and journalctl -u local-backup

      # Alert when local backup timestamp file is missing
      - alert: LocalBackupMissing
        expr: absent(local_backup_last_success_timestamp{backup="etc"}) or absent(local_backup_last_success_timestamp{backup="home"}) or absent(local_backup_last_success_timestamp{backup="var"})
        for: 10m
        labels:
          severity: critical
          category: storage
          service: local-backup
        annotations:
          summary: "Local backup metrics missing"
          description: |
            One or more local backup metrics are not being reported.
            This indicates that backups may not be running at all.
            Expected backups: etc, home, var
            Action: Check if local-backup.service has ever run successfully

      # Warning when backup is getting old (7 hours)
      # Backup runs 4x daily (every 6h) with up to 15min randomized delay
      - alert: LocalBackupAging
        expr: (time() - local_backup_last_success_timestamp) > 25200
        for: 5m
        labels:
          severity: warning
          category: storage
          service: local-backup
        annotations:
          summary: "Local backup aging on {{ $labels.host }}"
          description: |
            Local backup {{ $labels.backup }} ({{ $labels.source }}) hasn't run in over 7 hours.
            Last backup: {{ $value | humanizeDuration }} ago.
            Normal interval is 4x daily (every 6 hours). Check if the backup timer is functioning correctly.

      # The weekly `restic check` is the only repo-integrity / bit-rot detector.
      # It used to fail silently (empty OnFailure, exit status never exported).
      # restic_integrity_check_success/_timestamp_seconds are emitted by the
      # restic-check service ExecStopPost (modules/storage/backups.nix) and only
      # appear after the first weekly run following deploy.
      - alert: ResticIntegrityCheckFailed
        expr: restic_integrity_check_success == 0
        for: 5m
        labels:
          severity: critical
          category: storage
          service: restic-check
        annotations:
          summary: "restic repository integrity check FAILED on {{ $labels.instance }}"
          description: |
            The weekly `restic check` (repo integrity / bit-rot detector) exited non-zero.
            This may indicate repository corruption, a lost repo lock, or a tank/B2 I/O fault.
            Action: review journalctl -u restic-check and run `sudo restic-doc check` manually.

      # Staleness: the check runs weekly (Persistent=true catches up a missed run).
      # 8d = weekly cadence + 1d grace. Coverage only begins at the first weekly
      # run after deploy; that has since happened (as of 2026-07-27
      # restic_integrity_check_timestamp_seconds is populated), so this rule is
      # live. absent() is intentionally NOT used so a fresh deploy doesn't alarm
      # before the first run has had a chance to populate it.
      - alert: ResticIntegrityCheckStale
        expr: (time() - restic_integrity_check_timestamp_seconds) > 8 * 86400
        for: 5m
        labels:
          severity: warning
          category: storage
          service: restic-check
        annotations:
          summary: "restic integrity check is stale on {{ $labels.instance }}"
          description: |
            The weekly `restic check` has not run in over 8 days
            (last run {{ $value | humanizeDuration }} ago; expected weekly).
            Action: check systemctl status restic-check.timer and journalctl -u restic-check.

      # ---- Rotating data verification (bit-rot) ----------------------------------------
      # Added 2026-07-29 alongside `check --read-data-subset=P/52`. A plain structure check
      # never reads pack payloads, so bit-rot in the backup DATA was undetectable; the new
      # pass reads 1/52 of every repo each week, cycling to full coverage over a year (audit
      # measured 1.56-1.95% per bucket rather than exactly 1.92%, i.e. finite-pack rounding).
      #
      # These rules exist because restic_integrity_check_success cannot express coverage.
      # It is a single unlabelled gauge for the run's exit status, and a run that exhausts
      # its 3h data budget exits 0 having verified almost nothing -- reporting success while
      # silently doing far less work. A genuine data error DOES fail the run and is already
      # covered by ResticIntegrityCheckFailed above; these catch the quiet degradation.
      #
      # The first two rules below carry no absent() guard, matching ResticIntegrityCheckStale's
      # reasoning: the series only appear after the first run following deploy, and a fresh
      # deploy must not alarm before that. That left a real gap an audit reproduced -- if the
      # FIRST write never succeeds, both sit over an absent series and neither can ever fire.
      # ResticReadDataMetricsAbsent (added after the first run made the series live) closes it.
      # Note the stale rule does NOT cover that case, contrary to what this comment said
      # before: over an absent series its expression is an empty vector, not a large number.
      - alert: ResticReadDataCoverageDegraded
        expr: restic_read_data_repos_skipped > 0
        for: 15m
        labels:
          severity: warning
          category: storage
          service: restic-check
        annotations:
          summary: "{{ $value }} restic repo(s) went data-unverified in the last check"
          description: |
            The weekly data-verification pass left {{ $value }} repository(ies) without
            reading their pack payloads — either a per-repo 1h cap or the 3h global budget
            was hit. The run still exited 0 because a slow week is a budget outcome, not a
            data error, so nothing else would have reported this. Left unaddressed the
            52-week full-coverage cycle silently stops completing.
            Action: journalctl -u restic-check | grep READ-DATA names the repos. If this
            recurs, either raise READ_DATA_BUDGET_SEC in modules/lib/resticOperations.nix
            or check B2 throughput.

      - alert: ResticReadDataStale
        expr: (time() - restic_read_data_timestamp_seconds) > 9 * 86400
        for: 5m
        labels:
          severity: warning
          category: storage
          service: restic-check
        annotations:
          summary: "restic data verification is stale on {{ $labels.instance }}"
          description: |
            No data-verification pass has completed in over 9 days (last
            {{ $value | humanizeDuration }} ago; expected weekly at Mon 06:30). This also
            fires if the textfile write itself keeps failing AFTER at least one successful
            run, because the writer is `> tmp && mv tmp file` -- a failing write leaves the
            previous file in place, so its timestamp genuinely does go stale. It canNOT catch
            a metric that never arrived at all: over an absent series this expression is an
            empty vector. ResticReadDataMetricsAbsent below covers that case.
            Action: systemctl status restic-check.timer, and confirm
            /var/lib/prometheus-node-exporter-textfiles/restic_read_data.prom is fresh.

      # Closes the one gap an independent audit found in the two rules above: BOTH are
      # comparisons against a series, so if the very first textfile write never succeeds
      # (ENOSPC, a renamed textfile directory) they sit over an ABSENT series and neither can
      # ever fire -- read-data coverage would then be unmeasured AND unalerted indefinitely.
      # Verified: substituting a nonexistent metric name into the stale expression returns an
      # empty result, while absent() returns 1. Nothing else covers these six series -- they
      # are deliberately excluded from TextfileCollectorStaleFast/Daily in meta-monitoring.yaml
      # -- and nothing seeds them at activation.
      #
      # Safe to assert absence now, which it would NOT have been at authoring time: all six
      # series are live following the first completed run (confirmed via
      # count(last_over_time(X[30d]))). The 24h dwell is long enough that a Prometheus restart
      # or a single missed weekly run cannot trip it.
      - alert: ResticReadDataMetricsAbsent
        expr: absent(restic_read_data_timestamp_seconds)
        for: 24h
        labels:
          severity: warning
          category: storage
          service: restic-check
        annotations:
          summary: "restic data-verification metrics have disappeared entirely"
          description: |
            restic_read_data_timestamp_seconds has no series at all, so both
            ResticReadDataCoverageDegraded and ResticReadDataStale are silently inert and
            bit-rot coverage is unreported. Most likely the textfile write is failing, which
            is deliberately non-fatal to the check itself.
            Action: check /var/lib/prometheus-node-exporter-textfiles/restic_read_data.prom
            exists and is fresh, and journalctl -u restic-check for a "could not write" warning.

      # Technitium DNS backup last-success triad (technitium-dns-backup.timer,
      # daily 03:00). A green Type=oneshot exit is NOT proof of a complete backup
      # — the metrics are emitted by ExecStopPost so this catches a non-zero exit
      # directly. Seeded at activation so the series exists immediately.
      - alert: TechnitiumBackupFailed
        expr: technitium_backup_last_success == 0
        for: 5m
        labels:
          severity: critical
          category: storage
          service: technitium-dns-backup
        annotations:
          summary: "Technitium DNS backup failed on {{ $labels.instance }}"
          description: |
            The most recent technitium-dns-backup run exited non-zero
            (technitium_backup_last_success == 0). The DNS server config backup
            under /tank/Backups/TechnitiumDNS may be missing or incomplete.
            Action: journalctl -u technitium-dns-backup.

      # 30h = daily cadence + grace (the textfile is refreshed only on a run, so
      # a missed daily run goes stale at ~24h; 30h leaves a 6h buffer).
      - alert: TechnitiumBackupStale
        expr: (time() - technitium_backup_last_run_timestamp_seconds) > 108000
        for: 10m
        labels:
          severity: warning
          category: storage
          service: technitium-dns-backup
        annotations:
          summary: "Technitium DNS backup is stale on {{ $labels.instance }}"
          description: |
            technitium-dns-backup has not run successfully in over 30 hours
            (last run {{ $value | humanizeDuration }} ago; expected daily at 03:00).
            Action: check systemctl status technitium-dns-backup.timer and journalctl -u technitium-dns-backup.

      # Output-sanity: a green Type=oneshot exit is NOT proof of a complete backup
      # — the source could be empty or the copy left half-written when /tank drops
      # mid-write. Mirrors PgDumpSizeShrunk (database.yaml). The >0 guard avoids a
      # divide-by-baseline false-fire while the 14d window is still filling in.
      # Since fa3026e (2026-06-10) this backup is an rsync MIRROR, not a dated
      # tar.xz, so the gauge is `du -sb` of the whole mirror (~731 MB as of
      # 2026-07-27) rather than a per-run artifact; a sudden <50% drop is still a
      # real red flag. for:6h because the size is only refreshed on the daily
      # 03:00 run.
      - alert: TechnitiumBackupSizeShrunk
        expr: technitium_backup_size_bytes > 0 and technitium_backup_size_bytes < 0.5 * avg_over_time(technitium_backup_size_bytes[14d])
        for: 6h
        labels:
          severity: warning
          category: storage
          service: technitium-dns-backup
        annotations:
          summary: "Technitium DNS backup is suspiciously small on {{ $labels.instance }}"
          description: |
            The newest Technitium DNS backup artifact ({{ $value | humanize1024 }}B) is
            under half its 14d average size — likely a truncated/empty config backup
            (e.g. the tar captured an empty source, or /tank dropped mid-write).
            Action: inspect /tank/Backups/TechnitiumDNS and journalctl -u technitium-dns-backup.

      # Node-RED backup last-success triad (node-red-backup.timer, daily 02:30).
      # Node-RED holds the entire home-automation/safety flow set; a silently
      # failed backup means no restore point. Metrics via ExecStopPost; seeded at
      # activation.
      - alert: NodeRedBackupFailed
        expr: nodered_backup_last_success == 0
        for: 5m
        labels:
          severity: critical
          category: storage
          service: node-red-backup
        annotations:
          summary: "Node-RED backup failed on {{ $labels.instance }}"
          description: |
            The most recent node-red-backup run exited non-zero
            (nodered_backup_last_success == 0). The flows/credentials backup under
            /tank/Backups/NodeRED may be missing or incomplete (note: the script
            refuses to run if the bind mount is absent, which would surface here).
            Action: journalctl -u node-red-backup.

      - alert: NodeRedBackupStale
        expr: (time() - nodered_backup_last_run_timestamp_seconds) > 108000
        for: 10m
        labels:
          severity: warning
          category: storage
          service: node-red-backup
        annotations:
          summary: "Node-RED backup is stale on {{ $labels.instance }}"
          description: |
            node-red-backup has not run successfully in over 30 hours
            (last run {{ $value | humanizeDuration }} ago; expected daily at 02:30).
            Action: check systemctl status node-red-backup.timer and journalctl -u node-red-backup.

      # Output-sanity: catches a run that exited clean but captured no flows (e.g. a
      # shadow /var/lib/node-red with only skeleton files, the documented failure
      # mode). Mirrors PgDumpSizeShrunk / TechnitiumBackupSizeShrunk. Since fa3026e
      # (2026-06-10) this is an rsync MIRROR rather than a dated zstd tarball, so
      # the gauge is `du -sb` of the whole mirror (~6 MB as of 2026-07-27, not the
      # old ~290 KB per-day artifact); flows shrinking below half the 14d average
      # is a strong signal of an incomplete capture. >0 guard prevents a
      # baseline-fill false-fire; for:6h because the size only refreshes on the
      # daily 02:30 run. NOTE: compression now happens at the ZFS-dataset level,
      # so normal flow edits move the uncompressed mirror size only modestly — a
      # sub-50% drop is well outside ordinary variation.
      - alert: NodeRedBackupSizeShrunk
        expr: nodered_backup_size_bytes > 0 and nodered_backup_size_bytes < 0.5 * avg_over_time(nodered_backup_size_bytes[14d])
        for: 6h
        labels:
          severity: warning
          category: storage
          service: node-red-backup
        annotations:
          summary: "Node-RED backup is suspiciously small on {{ $labels.instance }}"
          description: |
            The newest Node-RED backup artifact ({{ $value | humanize1024 }}B) is under
            half its 14d average size — the flows/credentials capture may be incomplete
            (e.g. a tar against a shadow /var/lib/node-red, or a truncated write).
            Action: inspect /tank/Backups/NodeRED and journalctl -u node-red-backup.
