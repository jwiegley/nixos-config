groups:
  - name: systemd_service_health
    interval: 30s
    rules:
      # Critical service failure - any service in failed state.
      # This is the host-wide catch-all: no exclusion list, for=1m, 30s group
      # interval. Eleven per-service `<X>ServiceFailed` clones were deleted on
      # 2026-07-29 because each was a strict subset of this rule (see the
      # one-line notes left at each former site). Do NOT re-add a per-service
      # failed-state rule unless it needs a DIFFERENT dwell or a label this
      # rule cannot carry -- otherwise it only produces a second alertname that
      # the critical->warning inhibit (equal=[alertname,instance]) cannot
      # suppress, i.e. two notifications per failure.
      - alert: SystemdServiceFailed
        expr: node_systemd_unit_state{state="failed",name=~".*\\.service"} == 1
        for: 1m
        labels:
          severity: critical
          category: systemd
        annotations:
          summary: "Systemd service {{ $labels.name }} has failed"
          description: "Service {{ $labels.name }} is in failed state on {{ $labels.instance }}. Check logs: journalctl -u {{ $labels.name }} -n 50"

      # CriticalServiceInactive REMOVED 2026-08-05. It was one of three
      # overlapping mechanisms watching the same units; the survivor is
      # CriticalServiceDown in health-checks.yaml, which covers a superset of the
      # names, uses state="active" == 0 (so it also catches FAILED, which the old
      # inactive == 1 form missed) and carries an absence guard.

      # Service restart detection - high restart count
      - alert: ServiceRestartingFrequently
        expr: rate(node_systemd_unit_state{state="activating",name=~".*\\.service"}[15m]) > 0.1
        for: 5m
        labels:
          severity: warning
          category: systemd
        annotations:
          summary: "Service {{ $labels.name }} is restarting frequently"
          description: "Service {{ $labels.name }} has restarted multiple times in the last 15 minutes"

      # Restart-loop detection via the systemd restart counter.
      # node_systemd_service_restart_total counts auto-restarts (systemd NRestarts,
      # driven by Restart=), exported via --collector.systemd.enable-restarts-metrics.
      # This catches Restart=-policy flapping that ServiceRestartingFrequently (which
      # samples the transient "activating" state) can miss between scrapes. The two
      # rules are complementary — keep both. Excludes the per-fire transient podman
      # healthcheck units (<64-hex-id>-<hex>.service) which are one-shots, never
      # auto-restart, and would only add label churn.
      - alert: ServiceRestartLooping
        expr: |
          increase(
            node_systemd_service_restart_total{
              name=~".*\\.service",
              name!~"[0-9a-f]{64}-.*\\.service"
            }[30m]
          ) > 3
        for: 5m
        labels:
          severity: warning
          category: systemd
        annotations:
          summary: "Service {{ $labels.name }} is restart-looping"
          description: "Service {{ $labels.name }} has auto-restarted more than 3 times in the last 30 minutes on {{ $labels.instance }} (Restart= flapping)"

      # Services in activating state for too long
      # Excludes: restic-metrics, restic-backups-* (can take hours), mbsync-* (can take up to 30 minutes), update-containers (can take up to 10 minutes), local-backup (can take up to 10 minutes), git-workspace-archive (nightly 00:00 sweep of ~600 repos, runs >15m by design), postgresql-backup (per-table pg_dump -Fd mirror + rsync --checksum ran 17m44s on 2026-06-11 and grows with DB size; a genuinely hung run is caught by PgDumpStale/PgDumpFailed in database.yaml)
      - alert: ServiceStuckActivating
        expr: node_systemd_unit_state{state="activating",name=~".*\\.service",name!="restic-metrics.service",name!~"restic-backups-.*\\.service",name!~"mbsync-.*\\.service",name!="update-containers.service",name!="local-backup.service",name!="git-workspace-archive.service",name!="postgresql-backup.service"} == 1
        for: 15m
        labels:
          severity: warning
          category: systemd
        annotations:
          summary: "Service {{ $labels.name }} stuck in activating state"
          description: "Service {{ $labels.name }} has been in activating state for more than 15 minutes on {{ $labels.instance }}"

      # Services in deactivating state for too long
      - alert: ServiceStuckDeactivating
        expr: node_systemd_unit_state{state="deactivating",name=~".*\\.service"} == 1
        for: 5m
        labels:
          severity: warning
          category: systemd
        annotations:
          summary: "Service {{ $labels.name }} stuck in deactivating state"
          description: "Service {{ $labels.name }} has been in deactivating state for more than 5 minutes on {{ $labels.instance }}"

      # Monitoring services specifically
      - alert: MonitoringServiceDown
        expr: |
          node_systemd_unit_state{
            name=~"prometheus.*\\.service",
            state="active",
            type!="oneshot"
          } == 0
        for: 1m
        labels:
          severity: critical
          category: systemd
        annotations:
          summary: "Monitoring service {{ $labels.name }} is down"
          description: "Monitoring service {{ $labels.name }} is not active on {{ $labels.instance }}"

      # Backup services.
      # RENAMED from BackupServiceFailed on 2026-07-29: health-checks.yaml
      # (group health_check_alerts) has a DIFFERENT rule that also carried that
      # name -- `backup_service_failed == 1`, for=5m, with a `backup` label. Two
      # rules sharing one alertname meant one email could not say which fired
      # and one silence killed both. This one is the systemd-unit view
      # (node_systemd_unit_state over restic-backups-*.service, for=1m, label
      # `name`, no `backup` label); it is deliberately NOT the source of the
      # BackupServiceFailed -> BackupNotRunRecently inhibit in alertmanager.nix,
      # which joins on `backup` and so can only ever be served by the
      # health-checks.yaml rule. Renaming this one therefore changes no
      # inhibition. NOTE for a future cleanup pass: this rule is itself a strict
      # subset of SystemdServiceFailed above (same group, same for=1m, narrower
      # selector), differing only in severity warning-vs-critical -- kept for
      # now because the restic-specific summary is what the backup routes read.
      - alert: ResticBackupUnitFailed
        expr: |
          node_systemd_unit_state{
            name=~"restic-backups-.*\\.service",
            state="failed"
          } == 1
        for: 1m
        labels:
          severity: warning
          category: systemd
        annotations:
          summary: "Backup service {{ $labels.name }} has failed"
          description: "Backup service {{ $labels.name }} failed on {{ $labels.instance }}"

      # Timer units not active.
      #
      # WIDENED 2026-07-31 from restic-backups-*.timer to ALL timers, as part of retiring
      # Nagios. Nagios checked 34 individual timers by name; this covers all 113 the host
      # actually has, so it is strictly better coverage than the thing it replaces AND it
      # cannot drift the way a hand-maintained name list does -- a new timer is covered the
      # moment it exists, with no registry to remember to update.
      #
      # Verified non-noisy before widening: 113 timers are scraped and
      # count(node_systemd_unit_state{name=~".*\\.timer",state="active"} == 0) is 0, i.e.
      # every timer on the host is currently active, so this does not light up on deploy.
      #
      # If a timer is ever DELIBERATELY disabled, add it to an exclusion here rather than
      # narrowing the pattern back to a name list -- the point of the wildcard is that
      # forgetting to add a timer is impossible.
      - alert: ImportantTimerInactive
        expr: |
          node_systemd_unit_state{
            name=~".*\\.timer",
            state="active"
          } == 0
        for: 5m
        labels:
          severity: warning
          category: systemd
        annotations:
          summary: "Timer {{ $labels.name }} is not active"
          description: "Timer {{ $labels.name }} is not in the active state on {{ $labels.instance }}. Its scheduled job is therefore not running. Check: systemctl status {{ $labels.name }}"

      # Socket units not listening
      - alert: ImportantSocketNotListening
        expr: |
          node_systemd_unit_state{name=~"podman\\.socket",state="active"} == 0
        for: 5m
        labels:
          severity: warning
          category: systemd
        annotations:
          summary: "Important socket {{ $labels.name }} is not listening"
          description: "Socket {{ $labels.name }} should be listening but is not on {{ $labels.instance }}"

      # Network services
      - alert: NetworkServiceDown
        expr: node_systemd_unit_state{name="NetworkManager.service",state="active"} == 0
        for: 2m
        labels:
          severity: critical
          category: systemd
        annotations:
          summary: "Network service {{ $labels.name }} is down"
          description: "Network service {{ $labels.name }} is not active on {{ $labels.instance }}"

      # Database services
      - alert: DatabaseServiceDown
        expr: node_systemd_unit_state{name="postgresql.service",state="active"} == 0
        for: 1m
        labels:
          severity: critical
          category: systemd
        annotations:
          summary: "Database service {{ $labels.name }} is down"
          description: "Database service {{ $labels.name }} is not active on {{ $labels.instance }}"

      # Certificate authority service
      - alert: CertificateAuthorityDown
        expr: node_systemd_unit_state{name="step-ca.service",state="active"} == 0
        for: 2m
        labels:
          severity: critical
          category: systemd
        annotations:
          summary: "Certificate authority service is down"
          description: "step-ca service is not active on {{ $labels.instance }}, TLS certificates cannot be issued or renewed"
