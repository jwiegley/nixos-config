groups:
  - name: certificates
    interval: 60s
    rules:
      # Alert for certificate expiration
      - alert: CertificateExpiringSoon
        expr: certificate_days_until_expiry < 30
        for: 1h
        labels:
          severity: warning
          component: certificates
        annotations:
          summary: "Certificate expiring soon for {{ $labels.name }}"
          description: "Certificate {{ $labels.name }} will expire in {{ $value }} days"

      # Alert for certificate already expired
      - alert: CertificateExpired
        expr: certificate_days_until_expiry <= 0
        for: 1m
        labels:
          severity: critical
          component: certificates
        annotations:
          summary: "Certificate expired for {{ $labels.name }}"
          description: "Certificate {{ $labels.name }} has expired"

      # Alert for Step-CA service down
      - alert: StepCADown
        expr: node_systemd_unit_state{name="step-ca.service",state="active"} != 1
        for: 5m
        labels:
          severity: critical
          component: certificates
        annotations:
          summary: "Step-CA service is down"
          description: "Step-CA certificate authority service has been down for more than 5 minutes"