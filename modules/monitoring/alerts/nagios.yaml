groups:
  - name: nagios_monitoring
    interval: 30s
    rules:
      # Nagios service down
      - alert: NagiosServiceDown
        expr: node_systemd_unit_state{name="nagios.service",state="active"} == 0
        for: 2m
        labels:
          severity: critical
          category: monitoring
        annotations:
          summary: "Nagios monitoring service is down"
          description: "Nagios service is not running on {{ $labels.instance }}, monitoring capabilities are degraded"

      # Nagios web interface unreachable
      - alert: NagiosWebInterfaceUnreachable
        expr: node_systemd_unit_state{name="nagios.service",state="active"} == 0
        for: 3m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Nagios web interface/exporter is unreachable"
          description: "Cannot scrape metrics from Nagios exporter on {{ $labels.instance }}"

      # ---------------------------------------------------------------------
      # Nagios result-aggregate bridge (P2, restores the deleted Nagios-aggregate
      # intent). Fed by the textfile collector nagios-status-exporter.nix, which
      # parses /var/lib/nagios/status.dat every 2 minutes and emits COUNTS ONLY.
      # All counts are HARD states (matching Nagios's own notification logic, so
      # these page on the same things Nagios would). The `for:` durations filter
      # transient soft->hard flapping. Live baseline 2026-06-10 (manual parse):
      # critical=1, warning=1 (both unacknowledged, in-state ~0.1-0.3h, i.e.
      # transient), hosts_down=0 hard (one soft host-down was mid-retry), stale=0.
      # See wouldFire note: NagiosServicesCritical/Warning may fire on deploy IF
      # those transient states are still HARD and persist past the `for:` window;
      # that is a real Nagios condition (a genuinely failing check), not noise.
      # ---------------------------------------------------------------------

      # One or more Nagios services in a HARD CRITICAL state.
      - alert: NagiosServicesCritical
        expr: nagios_services_critical_total > 0
        for: 15m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Nagios reports {{ $value | printf \"%.0f\" }} service(s) in HARD CRITICAL"
          description: "Nagios has {{ $value | printf \"%.0f\" }} service check(s) in a hard CRITICAL state for over 15 minutes (parsed from status.dat). Open the Nagios web UI for the specific hosts/services — this bridge intentionally emits counts only."

      # Companion to NagiosServicesCritical, added 2026-07-29 after a review found the
      # masking hole this closes.
      #
      # nagios_services_critical_total is a LABEL-LESS SCALAR, so `> 0` conveys "at least one"
      # and nothing more. Once it is firing it stays firing, and a second service going
      # critical moves the count 1 -> 2 with NO new Alertmanager transition and no new
      # notification. That is not hypothetical: a stale tier-1 freshness check for a deleted
      # textfile (schwab_token.prom) sat as the host's only critical and pinned this rule on,
      # so for that period a genuine second critical would have been silent on this path.
      # Nagios's own per-service email path still worked, but the Prometheus path did not.
      #
      # Firing on the 1 -> 2 EDGE restores a signal per new critical without giving the
      # counts-only bridge per-service cardinality. Deliberately NOT `changes()`: that also
      # fires on recovery, which is not news.
      #
      # A PLAIN SUBTRACTION, NOT increase() (corrected 2026-07-30). This metric is declared
      # `# TYPE nagios_services_critical_total gauge` -- the `_total` suffix is a misnomer, it
      # is a live count of services in HARD CRITICAL, not a monotonic counter. increase() is
      # a counter function and was wrong here twice over:
      #   - it EXTRAPOLATES to the window edges, so a genuine 0 -> 1 step reported 3.0055
      #     (measured), and the summary below prints $value, so a single new critical was
      #     announced as "INCREASED by 3";
      #   - it treats any DECREASE as a counter reset, so a recovery (2 -> 1) can synthesise a
      #     phantom increase -- a false page on an improving system.
      # `x - (x offset 30m) > 0` is exact, extrapolation-free, and makes $value the true
      # delta. Trade-off accepted: if the series is ABSENT 30m ago (exporter restart) the
      # subtraction yields no sample and this cannot fire, so a restart can mask one
      # increase. That fails closed rather than crying wolf, and NagiosServicesCritical
      # still covers the standing condition.
      - alert: NagiosServicesCriticalIncreased
        expr: nagios_services_critical_total - (nagios_services_critical_total offset 30m) > 0
        for: 5m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Nagios critical count INCREASED by {{ $value | printf \"%.0f\" }} — a new service failed"
          description: "The number of Nagios services in HARD CRITICAL rose in the last 30 minutes, which means a NEW service failed. This exists because NagiosServicesCritical is a scalar `> 0` rule that cannot signal an increase once it is already firing. Open the Nagios web UI for the specific hosts/services — this bridge intentionally emits counts only."

      # One or more Nagios hosts in a HARD DOWN/UNREACHABLE state.
      - alert: NagiosHostsDown
        expr: nagios_hosts_down_total > 0
        for: 10m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Nagios reports {{ $value | printf \"%.0f\" }} host(s) DOWN/UNREACHABLE"
          description: "Nagios has {{ $value | printf \"%.0f\" }} host(s) in a hard DOWN or UNREACHABLE state for over 10 minutes (parsed from status.dat). Open the Nagios web UI for the specific hosts."

      # Nagios active checks not running (stale results) — Nagios itself may be
      # wedged or a check plugin is hanging.
      - alert: NagiosResultsStale
        expr: nagios_stale_results_total > 5
        for: 30m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Nagios has {{ $value | printf \"%.0f\" }} stale check results"
          description: "{{ $value | printf \"%.0f\" }} active Nagios checks have a last_check older than 2x their interval for over 30 minutes (parsed from status.dat). Nagios scheduling may be wedged or check plugins are hanging, so its results are no longer trustworthy."

      # Meta: the status.dat parser itself failed (file missing / unreadable /
      # malformed). If this fires, all the counts above are silently frozen.
      - alert: NagiosStatusExporterFailed
        expr: nagios_status_parse_success == 0
        for: 10m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Nagios status.dat exporter failed to parse"
          description: "nagios-status-exporter could not parse /var/lib/nagios/status.dat for over 10 minutes. The Nagios aggregate-count metrics (critical/warning/down/stale) are frozen and no longer reflect Nagios state."
