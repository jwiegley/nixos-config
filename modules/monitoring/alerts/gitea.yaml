groups:
  - name: gitea
    interval: 30s
    rules:
      # Gitea service availability
      - alert: GiteaDown
        expr: up{job="gitea"} == 0
        for: 2m
        labels:
          severity: critical
          service: gitea
        annotations:
          summary: "Gitea service is down"
          description: "Gitea has been unavailable for more than 2 minutes on {{ $labels.instance }}"

      # High memory usage
      - alert: GiteaHighMemoryUsage
        expr: |
          process_resident_memory_bytes{job="gitea"} > 2147483648
        for: 10m
        labels:
          severity: warning
          service: gitea
        annotations:
          summary: "Gitea memory usage is high"
          description: "Gitea is using {{ $value | humanize1024 }}B of memory on {{ $labels.instance }}"

      # Excessive goroutines (potential resource leak)
      - alert: GiteaHighGoroutineCount
        expr: |
          go_goroutines{job="gitea"} > 10000
        for: 15m
        labels:
          severity: warning
          service: gitea
        annotations:
          summary: "Gitea has excessive goroutines"
          description: "Gitea has {{ $value }} goroutines running on {{ $labels.instance }}, possible resource leak"

      # End-to-end web latency via the blackbox HTTPS probe. Gitea exposes no
      # request-latency histogram (only gitea_* gauges + go/process), so the
      # blackbox probe_duration_seconds is the only available p-latency signal
      # — this restores the deleted GiteaSlowResponse intent on a real metric.
      # The gitea vhost was added to the blackbox_https_local target list in
      # blackbox-monitoring.nix (web-blackbox workstream); the instance label
      # is the probed URL.
      - alert: GiteaSlowResponse
        expr: |
          probe_duration_seconds{job="blackbox_https_local",instance="https://gitea.vulcan.lan"} > 5
        for: 10m
        labels:
          severity: warning
          service: gitea
        annotations:
          summary: "Gitea is responding slowly"
          description: "The blackbox HTTPS probe to {{ $labels.instance }} has taken more than 5s for over 10 minutes (currently {{ $value }}s) — Gitea web responses are degraded."

      # GitHub→Gitea mirror discovery health. The host runs `github-mirror.service`
      # (oneshot, daily 03:00 timer) which discovers GitHub repos and creates the
      # pull-mirror entries in Gitea; Gitea then performs the actual per-repo pull
      # internally on its own mirror_interval (8h) — that internal cron is NOT a
      # host systemd unit and exposes no per-mirror freshness metric (gitea only
      # exports the gitea_mirrors COUNT gauge), so the monitorable surface is the
      # host-side discovery unit. node-exporter sees the unit, so no collector is
      # needed: state="failed"==1 means the last discovery run errored
      # (failed_count>0 → exit 1). for:0 because a oneshot stays failed until the
      # next run a day later, so we want it surfaced promptly.
      - alert: GiteaMirrorSyncFailed
        expr: |
          node_systemd_unit_state{name="github-mirror.service",state="failed"} == 1
        for: 0m
        labels:
          severity: warning
          service: gitea
        annotations:
          summary: "GitHub→Gitea mirror discovery failed"
          description: "github-mirror.service last run failed (one or more repos could not be mirrored). Check: journalctl -u github-mirror.service --since '-1 day'"

      # Mirror discovery cadence. The timer is daily; if it has not triggered in
      # over 30h the schedule has stalled (timer masked, system clock issue, etc.)
      # and mirrors stop tracking new GitHub repos. 30h > daily + 30min jitter, so
      # it will not fire under normal cadence (observed last-trigger age ~21h).
      - alert: GiteaMirrorSyncStale
        expr: |
          time() - node_systemd_timer_last_trigger_seconds{name="github-mirror.timer"} > 30 * 3600
        for: 1h
        labels:
          severity: warning
          service: gitea
        annotations:
          summary: "GitHub→Gitea mirror discovery has not run"
          description: "github-mirror.timer last triggered {{ $value | humanizeDuration }} ago (daily schedule); the mirror-discovery job appears to have stopped running. Check: systemctl list-timers github-mirror.timer"

  # Gitea -> GitHub PUSH MIRROR outcome.
  #
  # The group above watches the GitHub->Gitea discovery direction. Nothing watched
  # the push direction until 2026-07-28, when the nixos-config mirror was found to
  # have been rejected by GitHub push protection every day since 2026-05-05 -- 678
  # commits behind -- while github-mirror.service, update-github-mirror-tokens.service
  # and the sync wrapper all reported success. The wrapper only *triggers* a push and
  # its shell loop cannot distinguish "POST failed" from "repo has no mirrors", so it
  # exits 0 either way. These rules read the recorded per-mirror OUTCOME from
  # gitea-push-mirror-exporter instead of the trigger.
  - name: gitea_push_mirror
    rules:
      # THE rule that would have caught the 2026-05-05 regression on day one.
      # last_error is set by Gitea when the actual push to the remote is rejected and
      # stays set until a later push succeeds, so this is level-triggered, not edge.
      # for: 2h spans two hourly scrapes, riding out a single transient network blip
      # without waiting out the 8h mirror interval.
      - alert: GiteaPushMirrorFailing
        expr: gitea_push_mirror_failed == 1
        for: 2h
        labels:
          severity: warning
          service: gitea
          category: backup
        annotations:
          summary: "Gitea push mirror for {{ $labels.repo }} is failing"
          description: "The last push of {{ $labels.repo }} to its '{{ $labels.remote_name }}' remote was rejected and has not recovered for over 2 hours, so the off-site copy of that repository is going stale while the sync job keeps reporting success. The error text is deliberately NOT included here (it quotes the remote URL, which embeds an auth token) -- read it in the Gitea UI under Settings -> Repository -> Mirror Settings."

      # The exporter must not become the next silent failure: alert if it stops
      # producing metrics at all. Hourly timer + 5m jitter, so 3h is ~3 missed runs.
      - alert: GiteaPushMirrorExporterStale
        expr: |
          time() - gitea_push_mirror_scrape_timestamp_seconds > 3 * 3600
        for: 15m
        labels:
          severity: warning
          service: gitea
          category: monitoring
        annotations:
          summary: "Gitea push-mirror exporter has stopped reporting"
          description: "gitea_push_mirror_scrape_timestamp_seconds is {{ $value | humanizeDuration }} old (hourly timer). Push-mirror failures are currently undetected. Check: systemctl status gitea-push-mirror-exporter.service"

      # A partial pass (API errors mid-sweep) exits non-zero AND sets this to 0, so a
      # half-scraped result cannot masquerade as "no mirrors are failing".
      - alert: GiteaPushMirrorExporterFailing
        expr: gitea_push_mirror_scrape_success == 0
        for: 1h
        labels:
          severity: warning
          service: gitea
          category: monitoring
        annotations:
          summary: "Gitea push-mirror exporter completed only a partial pass"
          description: "The exporter could not enumerate every repository, so gitea_push_mirror_failed may be incomplete and an absent series does not mean healthy. Check: journalctl -u gitea-push-mirror-exporter.service"

      # Absent-metric guard: if the exporter has never run since a rebuild, the two
      # rules above have nothing to evaluate and the mirror is unmonitored.
      - alert: GiteaPushMirrorMetricsAbsent
        expr: absent(gitea_push_mirror_count)
        for: 6h
        labels:
          severity: warning
          service: gitea
          category: monitoring
        annotations:
          summary: "Gitea push-mirror metrics are absent entirely"
          description: "gitea_push_mirror_count has no series, so no push-mirror monitoring is in effect. Expected from gitea-push-mirror-exporter.timer (hourly)."
