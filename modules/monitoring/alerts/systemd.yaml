groups:
  - name: systemd_service_health
    interval: 30s
    rules:
      # Critical service failure - any service in failed state.
      # This is the host-wide catch-all: no exclusion list, for=1m, 30s group
      # interval. Eleven per-service `<X>ServiceFailed` clones were deleted on
      # 2026-07-29 because each was a strict subset of this rule (see the
      # one-line notes left at each former site). Do NOT re-add a per-service
      # failed-state rule unless it needs a DIFFERENT dwell or a label this
      # rule cannot carry -- otherwise it only produces a second alertname that
      # the critical->warning inhibit (equal=[alertname,instance]) cannot
      # suppress, i.e. two notifications per failure.
      - alert: SystemdServiceFailed
        expr: node_systemd_unit_state{state="failed",name=~".*\\.service"} == 1
        for: 1m
        labels:
          severity: critical
          category: systemd
        annotations:
          summary: "Systemd service {{ $labels.name }} has failed"
          description: "Service {{ $labels.name }} is in failed state on {{ $labels.instance }}. Check logs: journalctl -u {{ $labels.name }} -n 50"

      # CriticalServiceInactive REMOVED 2026-08-05. It was one of three
      # overlapping mechanisms watching the same units; the survivor is
      # CriticalServiceDown in health-checks.yaml, which covers a superset of the
      # names, uses state="active" == 0 (so it also catches FAILED, which the old
      # inactive == 1 form missed) and carries an absence guard.

      # CHRONIC restart churn -- the slow-burn counterpart to
      # ServiceRestartLooping's burst detection below.
      #
      # THIS RULE USED TO BE UNFIREABLE (fixed 2026-08-18, nixos-w3w). It read:
      #
      #     rate(node_systemd_unit_state{state="activating",...}[15m]) > 0.1
      #
      # node_systemd_unit_state is a 0/1 GAUGE, not a counter. rate() treats
      # every 1->0 fall as a counter reset, so the output is an artifact with no
      # units, not "restarts per second". Measured max across ALL services over
      # 7 days: 0.00897 against a 0.1 threshold -- 11x below, i.e. it could
      # never fire, and had never fired. The threshold had been written as if
      # the value meant restarts/second.
      #
      # WHY 6h/>8 AND NOT A FASTER BURST TEST. Rewriting it as another burst
      # detector would duplicate ServiceRestartLooping (30m/>3) rather than
      # complement it, which is what the "keep both" note below asks for. A long
      # window catches a shape the burst rule STRUCTURALLY CANNOT: a service
      # restarting steadily without ever reaching 3-in-30m. fetchmail-good is
      # exactly that -- it peaks at 2.01 per 30m (never trips the burst rule)
      # but reaches 7 per 24h from transient IMAP errors.
      #
      # Calibrated against 30 days of history:
      #     >8 in 6h  matches 1 service, and NOT the one the burst rule catches
      #     >5 in 6h  matches 2, but sits one restart above fetchmail-good's own
      #               benign peak of 4.00/6h, so it would fire on known-good
      #               behaviour -- which is how the dead rule got written.
      #
      # Same exclusion as ServiceRestartLooping: transient podman healthcheck
      # units are one-shots that never auto-restart and only add label churn.
      - alert: ServiceRestartingFrequently
        expr: |
          increase(
            node_systemd_service_restart_total{
              name=~".*\\.service",
              name!~"[0-9a-f]{64}-.*\\.service"
            }[6h]
          ) > 8
        for: 15m
        labels:
          severity: warning
          category: systemd
        annotations:
          summary: "Service {{ $labels.name }} is churning: {{ $value | printf \"%.0f\" }} restarts in 6h"
          description: |
            {{ $labels.name }} has auto-restarted more than 8 times in the last 6
            hours WITHOUT ever bursting hard enough to trip ServiceRestartLooping
            (more than 3 in any 30 minutes). That pattern means a service that
            keeps falling over and being revived by its Restart= policy, rather
            than one stuck in a tight crash loop -- typically a flaky external
            dependency, not a broken unit. Check what the service is retrying
            against before restarting anything.

      # Restart-loop detection via the systemd restart counter.
      # node_systemd_service_restart_total counts auto-restarts (systemd NRestarts,
      # driven by Restart=), exported via --collector.systemd.enable-restarts-metrics.
      # This catches Restart=-policy flapping that ServiceRestartingFrequently (which
      # samples the transient "activating" state) can miss between scrapes. The two
      # rules are complementary — keep both. Excludes the per-fire transient podman
      # healthcheck units (<64-hex-id>-<hex>.service) which are one-shots, never
      # auto-restart, and would only add label churn.
      - alert: ServiceRestartLooping
        expr: |
          increase(
            node_systemd_service_restart_total{
              name=~".*\\.service",
              name!~"[0-9a-f]{64}-.*\\.service"
            }[30m]
          ) > 3
        for: 5m
        labels:
          severity: warning
          category: systemd
        annotations:
          summary: "Service {{ $labels.name }} is restart-looping"
          description: "Service {{ $labels.name }} has auto-restarted more than 3 times in the last 30 minutes on {{ $labels.instance }} (Restart= flapping)"

      # Services in activating state for too long
      # Excludes: session-gather (nightly multi-host session-log pull; can run for hours on the first reconciliation, and a wedged run is caught by its own 12h TimeoutStartSec failing the unit), restic-metrics, restic-backups-* (can take hours), mbsync-* (can take up to 30 minutes), update-containers (can take up to 10 minutes), local-backup (can take up to 10 minutes), git-workspace-archive (nightly 00:00 sweep of ~600 repos, runs >15m by design), postgresql-backup (per-table pg_dump -Fd mirror + rsync --checksum ran 17m44s on 2026-06-11 and grows with DB size; a genuinely hung run is caught by PgDumpStale/PgDumpFailed in database.yaml), pushme-positron (hourly rsync of a remote home directory over an SSH jump; TimeoutStartSec was raised to 4h on 2026-08-12 because the initial convergence genuinely needs hours — a wedged run is still caught, by that timeout failing the unit and raising SystemdServiceFailed)
      # zimit-job-runner added 2026-08-20, and this one is a WEAKER exclusion than
      # the others above — read before assuming it is covered.
      #
      # It is a Type=oneshot that runs an entire web crawl synchronously, so it sits
      # in `activating` for the whole job and trips a 15m threshold on every normal
      # run. Measured across 22 completed jobs, legitimate durations span 26 MINUTES
      # to 43 DAYS (ocean-of-lights at 1039h); TimeoutStartSec is already 4w2d, so
      # month-long crawls are tolerated by design. An alert that fires for the entire
      # duration of every crawl is noise, and noise is what trains people to ignore a
      # rule — the same failure this repo keeps remediating from the other direction.
      #
      # THE HONEST COST: this was the only detector for a crawl that hangs while
      # RUNNING. ZimitJobsStuck (alerts/zimit.yaml) does NOT cover it — it fires on
      # zimit_jobs_pending > 0, i.e. a queue that will not drain, and a hung running
      # job has pending=0. Duration cannot substitute, because the legitimate range
      # above admits no threshold. The right signal is PROGRESS (the runner logs
      # continuously while crawling), which needs a new collector rather than a
      # tweak here. Tracked separately; do not read this exclusion as "covered".
      - alert: ServiceStuckActivating
        expr: node_systemd_unit_state{state="activating",name=~".*\\.service",name!="restic-metrics.service",name!~"restic-backups-.*\\.service",name!~"mbsync-.*\\.service",name!="update-containers.service",name!="local-backup.service",name!="git-workspace-archive.service",name!="postgresql-backup.service",name!="pushme-positron.service",name!="session-gather.service",name!="zimit-job-runner.service"} == 1
        for: 15m
        labels:
          severity: warning
          category: systemd
        annotations:
          summary: "Service {{ $labels.name }} stuck in activating state"
          description: "Service {{ $labels.name }} has been in activating state for more than 15 minutes on {{ $labels.instance }}"

      # Services in deactivating state for too long
      - alert: ServiceStuckDeactivating
        expr: node_systemd_unit_state{state="deactivating",name=~".*\\.service"} == 1
        for: 5m
        labels:
          severity: warning
          category: systemd
        annotations:
          summary: "Service {{ $labels.name }} stuck in deactivating state"
          description: "Service {{ $labels.name }} has been in deactivating state for more than 5 minutes on {{ $labels.instance }}"

      # Monitoring services specifically
      - alert: MonitoringServiceDown
        expr: |
          node_systemd_unit_state{
            name=~"prometheus.*\\.service",
            state="active",
            type!="oneshot"
          } == 0
        for: 1m
        labels:
          severity: critical
          category: systemd
        annotations:
          summary: "Monitoring service {{ $labels.name }} is down"
          description: "Monitoring service {{ $labels.name }} is not active on {{ $labels.instance }}"

      # Backup services.
      # RENAMED from BackupServiceFailed on 2026-07-29: health-checks.yaml
      # (group health_check_alerts) has a DIFFERENT rule that also carried that
      # name -- `backup_service_failed == 1`, for=5m, with a `backup` label. Two
      # rules sharing one alertname meant one email could not say which fired
      # and one silence killed both. This one is the systemd-unit view
      # (node_systemd_unit_state over restic-backups-*.service, for=1m, label
      # `name`, no `backup` label); it is deliberately NOT the source of the
      # BackupServiceFailed -> BackupNotRunRecently inhibit in alertmanager.nix,
      # which joins on `backup` and so can only ever be served by the
      # health-checks.yaml rule. Renaming this one therefore changes no
      # inhibition. NOTE for a future cleanup pass: this rule is itself a strict
      # subset of SystemdServiceFailed above (same group, same for=1m, narrower
      # selector), differing only in severity warning-vs-critical -- kept for
      # now because the restic-specific summary is what the backup routes read.
      - alert: ResticBackupUnitFailed
        expr: |
          node_systemd_unit_state{
            name=~"restic-backups-.*\\.service",
            state="failed"
          } == 1
        for: 1m
        labels:
          severity: warning
          category: systemd
        annotations:
          summary: "Backup service {{ $labels.name }} has failed"
          description: "Backup service {{ $labels.name }} failed on {{ $labels.instance }}"

      # Timer units not active.
      #
      # WIDENED 2026-07-31 from restic-backups-*.timer to ALL timers, as part of
      # consolidating monitoring onto Prometheus. The retired check system watched 34
      # individual timers by name; this covers all 113 the host actually has, so it is
      # strictly better coverage than the thing it replaces AND it cannot drift the way a
      # hand-maintained name list does -- a new timer is covered the moment it exists, with
      # no registry to remember to update.
      #
      # Verified non-noisy before widening: 113 timers are scraped and
      # count(node_systemd_unit_state{name=~".*\\.timer",state="active"} == 0) is 0, i.e.
      # every timer on the host is currently active, so this does not light up on deploy.
      #
      # If a timer is ever DELIBERATELY disabled, add it to an exclusion here rather than
      # narrowing the pattern back to a name list -- the point of the wildcard is that
      # forgetting to add a timer is impossible.
      - alert: ImportantTimerInactive
        expr: |
          node_systemd_unit_state{
            name=~".*\\.timer",
            state="active"
          } == 0
        for: 5m
        labels:
          severity: warning
          category: systemd
        annotations:
          summary: "Timer {{ $labels.name }} is not active"
          description: "Timer {{ $labels.name }} is not in the active state on {{ $labels.instance }}. Its scheduled job is therefore not running. Check: systemctl status {{ $labels.name }}"

      # Socket units not listening
      - alert: ImportantSocketNotListening
        expr: |
          node_systemd_unit_state{name=~"podman\\.socket",state="active"} == 0
        for: 5m
        labels:
          severity: warning
          category: systemd
        annotations:
          summary: "Important socket {{ $labels.name }} is not listening"
          description: "Socket {{ $labels.name }} should be listening but is not on {{ $labels.instance }}"

      # Network services
      - alert: NetworkServiceDown
        expr: node_systemd_unit_state{name="NetworkManager.service",state="active"} == 0
        for: 2m
        labels:
          severity: critical
          category: systemd
        annotations:
          summary: "Network service {{ $labels.name }} is down"
          description: "Network service {{ $labels.name }} is not active on {{ $labels.instance }}"

      # Database services
      - alert: DatabaseServiceDown
        expr: node_systemd_unit_state{name="postgresql.service",state="active"} == 0
        for: 1m
        labels:
          severity: critical
          category: systemd
        annotations:
          summary: "Database service {{ $labels.name }} is down"
          description: "Database service {{ $labels.name }} is not active on {{ $labels.instance }}"

      # Certificate authority service
      - alert: CertificateAuthorityDown
        expr: node_systemd_unit_state{name="step-ca.service",state="active"} == 0
        for: 2m
        labels:
          severity: critical
          category: systemd
        annotations:
          summary: "Certificate authority service is down"
          description: "step-ca service is not active on {{ $labels.instance }}, TLS certificates cannot be issued or renewed"
