groups:
  - name: syncthing
    interval: 30s
    rules:
      # Scrape liveness. The job targets syncthing's native /metrics on the
      # loopback GUI listener, authenticated with the sops API key
      # (syncthing-metrics.nix). 10m tolerance: the unit is mount-gated on
      # /tank/Public and restarts during rebuilds.
      - alert: SyncthingDown
        expr: up{job="syncthing"} == 0
        for: 10m
        labels:
          severity: warning
          service: syncthing
        annotations:
          summary: "Syncthing metrics endpoint is down"
          description: "The syncthing scrape on {{ $labels.instance }} has failed for more than 10 minutes — the service is down, the API key rotated, or /tank/Public is unavailable."

      # systemd failure state, via the node exporter systemd collector.
      - alert: SyncthingServiceFailed
        expr: node_systemd_unit_state{name="syncthing.service",state="failed"} == 1
        for: 5m
        labels:
          severity: warning
          service: syncthing
        annotations:
          summary: "syncthing.service is in failed state"
          description: "syncthing.service on {{ $labels.instance }} has been failed for more than 5 minutes."

      # Peer connectivity. hera is the only configured peer, so zero active
      # connections for 2h means the mirror is stale (hera down, asleep, or
      # the device ID pin drifted after a hera reinstall). The `or on()
      # vector(0)` guard keeps the rule armed even if the gauge disappears.
      - alert: SyncthingNoPeerConnected
        expr: (sum(syncthing_connections_active{job="syncthing"}) or on() vector(0)) == 0
        for: 2h
        labels:
          severity: warning
          service: syncthing
        annotations:
          summary: "Syncthing has no connected peers"
          description: "No syncthing peer (expected: hera) has been connected for 2 hours — /tank/Public and ~/Public on hera are diverging."

      # End-to-end web latency via the blackbox HTTPS probe; the vhost is in
      # the blackbox_https_local target list (blackbox-monitoring.nix).
      # Mirrors GiteaSlowResponse.
      - alert: SyncthingSlowResponse
        expr: |
          probe_duration_seconds{job="blackbox_https_local",instance="https://syncthing.vulcan.lan"} > 5
        for: 10m
        labels:
          severity: warning
          service: syncthing
        annotations:
          summary: "Syncthing web UI is responding slowly"
          description: "The blackbox HTTPS probe to {{ $labels.instance }} has taken more than 5s for over 10 minutes (currently {{ $value }}s)."
