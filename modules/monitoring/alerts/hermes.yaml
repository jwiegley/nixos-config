groups:
  - name: hermes_availability
    interval: 60s
    rules:
      # End-to-end probe through hermes-mcp → Hermes Agent. This is the
      # single load-bearing signal for "the OpenClaw ↔ Hermes bridge works
      # right now"; if this is red for >5min, callers cannot reach Hermes.
      - alert: HermesAskFailing
        expr: hermes_mcp_ask_hermes_ok == 0
        for: 5m
        labels:
          severity: critical
          category: availability
          service: hermes-mcp
          self_heal_eligible: "true"
        annotations:
          summary: "Hermes end-to-end ask_hermes probe failing for 5 minutes"
          description: |
            The 5-minute health check has failed to round-trip
            `ask_hermes(prompt="Reply with the single word ACK")` for
            5 consecutive minutes. The chain hermes-mcp ⇒ Hermes Agent
            api_server (10.99.1.2:8080) ⇒ Qwen on hera is broken
            somewhere. The downstream component metrics
            (hermes_api_server_ok, hermes_mcp_sse_open_ok) tell you
            which leg failed first.

      # The api_server platform inside Hermes Agent. If this is red,
      # Hermes itself is unreachable; restarting hermes-mcp will not
      # help. Self-heal at this layer means restarting microvm@hermes.
      #
      # The `hermes_vm_uptime_seconds > 600` gate excludes the ~8-min
      # post-restart warmup. hermes_api_server_ok probes /v1/capabilities
      # authenticated with a TIGHT 5s budget; that endpoint enumerates models
      # against the LiteLLM/MLX backend, so it stays non-200 for ~8 min after
      # every microvm restart while the backend warms up (the api_server itself
      # BINDS in ~8s — binding was never the problem, and the 2026-05-31 4-vCPU
      # bump didn't change the warmup; reverted). Sampled every 5 min that
      # warmup was a ~10-min 0-plateau that a bare `for: 5m` read as down and
      # self-healed by restarting the VM — restarting the warmup: a self-
      # perpetuating loop (2026-05-24 cluster; reproduced on the 4-vCPU deploy).
      # Gating on VM uptime > 10 min ignores the warmup while a genuine outage
      # on an already-up VM still pages fast at `for: 5m`. `ignoring(__name__)`
      # is required: the two series differ only by __name__ (identical node
      # textfile labels otherwise). hermes_vm_uptime_seconds fails OPEN (large
      # value on probe error) so a uptime-probe failure never masks an outage.
      # The e2e probes (HermesAskFailing / HermesE2eChatFailing, 60s budgets)
      # tolerate warmup and stay green — independent fast real-breakage detectors.
      - alert: HermesApiServerDown
        expr: hermes_api_server_ok == 0 and ignoring(__name__) hermes_vm_uptime_seconds > 600
        for: 5m
        labels:
          severity: critical
          category: availability
          service: hermes-agent
          self_heal_eligible: "true"
        annotations:
          summary: "Hermes api_server /v1/capabilities down for 5 minutes"
          description: |
            Hermes' OpenAI-compatible api_server platform is not
            answering on http://10.99.1.2:8080/v1/capabilities.
            Possible causes: microvm@hermes crashed; firewall rule
            regressed; API_SERVER_KEY missing or wrong;
            hermes-agent.service restarted but failed to bind the
            platform (see /var/lib/hermes/.hermes/logs/errors.log
            for "Refusing to start: binding to 0.0.0.0 requires
            API_SERVER_KEY").

      # The host-side bridge that OpenClaw talks to. If this fails
      # the openclaw-side mcporter cannot reach hermes regardless of
      # whether the upstream Hermes Agent is healthy.
      - alert: HermesMcpBridgeDown
        expr: hermes_mcp_sse_open_ok == 0
        for: 5m
        labels:
          severity: critical
          category: availability
          service: hermes-mcp
          self_heal_eligible: "true"
        annotations:
          summary: "hermes-mcp /sse not accepting connections for 5 minutes"
          description: |
            The host's hermes-mcp.service is not accepting new SSE
            connections on 127.0.0.1:9081. The systemd unit may be
            up but stuck; restarting hermes-mcp.service typically
            resolves this within a few seconds.

      # Discord WebSocket zombie detector — heartbeat-ACK based.
      # hermes_discord_last_event_age_seconds is the age of the most
      # recent proof of gateway liveness: primarily the discord.py
      # HEARTBEAT_ACK stamp (the in-VM sitecustomize shim writes it on
      # every ack, ~every 41s while the WS is healthy), falling back to
      # the gateway.log connect/message scrape. Heartbeats flow even
      # with zero message traffic, so this is independent of how idle
      # the server is — a stale value means acks have genuinely stopped
      # = the WS has zombied (TCP/REST may still look alive and Discord
      # still shows the bot online, but nothing propagates).
      #
      # Threshold history: started at 2h (gateway.log idleness), which
      # restarted the VM every ~2h16m on a quiet bot; raised to 24h
      # (2026-05-24), which merely paced the same idleness false-positive
      # to ~daily. Switched to the heartbeat-ACK signal (2026-05-28) and
      # dropped to 600s: a healthy WS keeps the metric < ~60s regardless
      # of traffic, and discord.py self-reconnects a missed-ack zombie
      # within its own ~60s heartbeat_timeout, so 600s sustained for 10m
      # means discord.py could NOT self-heal and a microvm restart is
      # warranted.
      - alert: HermesDiscordZombieSuspected
        expr: hermes_discord_last_event_age_seconds > 600
        for: 10m
        labels:
          severity: warning
          category: availability
          service: hermes-agent
          self_heal_eligible: "true"
        annotations:
          summary: "Hermes Discord gateway: no heartbeat-ACK for >10 min"
          description: |
            No Discord gateway HEARTBEAT_ACK (nor any gateway.log
            connect/message event) has been observed for 10+ minutes,
            sustained over the 10m window. A healthy WS acks ~every 41s
            and discord.py reconnects a missed-ack zombie within ~60s,
            so a sustained 10m+ gap means the gateway has zombied and
            discord.py did not self-recover. Restarting microvm@hermes
            re-establishes a clean WS session. (Heartbeat-based since
            2026-05-28 — no longer fires on an idle-but-healthy bot.)

      # Faster sibling of HermesDiscordZombieSuspected — fires after just
      # 5 min (vs 10m) when the self-heal daemon just restarted the microvm
      # but the fresh connection produced no heartbeat-ACK. A healthy WS
      # acks within ~41s of connecting, so a 600s+ liveness gap within 1h
      # of a self-heal restart is definitively a zombie that survived the
      # restart — escalate as critical. (Doesn't fire for manual user
      # restarts — those have no recent restart_microvm attempt.)
      - alert: HermesDiscordPostSelfHealRestart
        expr: |
          hermes_discord_last_event_age_seconds > 600
          and
          changes(hermes_self_heal_attempts_total{action="restart_microvm"}[1h]) > 0
        for: 5m
        labels:
          severity: critical
          category: availability
          service: hermes-agent
          self_heal_eligible: "true"
        annotations:
          summary: "Hermes Discord silent after self-heal restart — zombie WS"
          description: |
            The self-heal daemon restarted microvm@hermes within the last
            hour, but the Discord gateway has produced no HEARTBEAT-ACK
            (nor connect/message event) in 10+ minutes. A fresh WS
            connection acks within ~41s, so this is a zombie on top of
            the restart — another restart is needed.

      # NOTE: a block of commentary here described HermesDiscordCanaryDown -- its
      # warmup gate, its decorative self_heal_eligible label, the proven-green gate and
      # the time-since-last-success rewrite. That rule and its five siblings were REMOVED
      # 2026-07-31 with OpenClaw: the canary was inherently cross-agent (the two agents
      # probed each other) and cannot outlive the removal of one of them. The commentary
      # is dropped with it rather than left describing rules that no longer exist.
      #
      # Hermes' inbound Discord path is still watched, by HermesDiscordZombieSuspected
      # and HermesDiscordPostSelfHealRestart above, which key on heartbeat-ACK age rather
      # than on a round-trip. What is genuinely lost is proof that inbound
      # MESSAGE_CREATE -> reply DELIVERS end to end; the heartbeat proves only that the
      # gateway socket is alive. Accepted deliberately -- the canary never reached a clean
      # steady state, since @Claw's bot holds neither MANAGE_MESSAGES nor MANAGE_THREADS
      # in #interconnect and every successful round-trip left an undeletable reply behind.

      - alert: HermesHealthCheckStale
        expr: time() - hermes_health_check_last_run_timestamp_seconds > 900
        for: 5m
        labels:
          severity: warning
          category: monitoring
          service: hermes-mcp
        annotations:
          summary: "Hermes health check has not run in >15 minutes"
          description: |
            The hermes-health-check.timer has not produced fresh
            metrics in 15 minutes. Check `systemctl status
            hermes-health-check.timer` and the most recent
            invocation's journal.

      # API key plumbing regression.
      - alert: HermesApiKeyMissing
        expr: hermes_api_key_present == 0
        for: 5m
        labels:
          severity: critical
          category: configuration
          service: hermes-mcp
        annotations:
          summary: "API_SERVER_KEY not present in /run/secrets/hermes/env"
          description: |
            The SOPS-decrypted hermes env file is missing the
            API_SERVER_KEY field — every authenticated probe will
            fail. Check `sops-install-secrets.service` status and
            the `hermes:` block in secrets.yaml.

      # End-to-end chat probe — the real test. Sends a chat completion
      # through the Hermes Agent api_server (the path Discord uses) and
      # validates the response contains an expected token. Catches any
      # regression in routing, auth, model availability, or the MLX
      # backend that the static smoke probe (openclaw_hermes_smoke)
      # would silently miss.
      #
      # History: 2026-05-24 incident — Discord chat returned HTTP 401
      # from openrouter.ai for 24+ hours while openclaw_hermes_smoke_ok
      # stayed at 1 (probe used a short-circuited fixed 185-byte path).
      # This alert would have fired within 5 min.
      - alert: HermesE2eChatFailing
        expr: hermes_e2e_chat_ok == 0
        for: 5m
        labels:
          severity: critical
          category: availability
          service: hermes-agent
        annotations:
          summary: "Hermes end-to-end chat probe failing for >5 min"
          description: |
            The hermes-e2e-chat-probe (every 5 min) is returning a
            non-200 or missing-token response from
            http://10.99.1.2:8080/v1/chat/completions. The chat path
            Discord uses is broken — users will see "Non-retryable
            error" or no response. Check `/var/lib/hermes/.hermes/logs/
            errors.log` for the upstream HTTP status and the failing
            base_url; the most common causes are model.base_url
            misrouting (config.yaml regression) and LiteLLM master_key
            mismatch.

      # Direct liveness of the hera-side llama-swap/MLX model router — the
      # terminal upstream every `hera/*` LiteLLM model routes to, and thus the
      # terminal dependency of all Hermes chat. blackbox_hera_mlx GETs
      # hera.lan:8080/v1/models (HTTP 200 unauth, no secrets). When this is 0
      # the model backend itself is down — this is the CAUSE rule that isolates
      # an MLX outage from the generic downstream HermesAskFailing /
      # HermesE2eChatFailing symptoms (which surface 2-3 hops later and cannot
      # name the layer). It is a LIVENESS signal only: /v1/models answers 200 as
      # long as the router is alive; "router up but a model won't load" is caught
      # by HermesE2eChatFailing's content check, not here — a green
      # MLXBackendDown does NOT prove chat works.
      #
      # `and on() up{job="darwin-hera"} == 1` gates on hera being reachable at
      # all (probe_success and up share no labels, so on() does the intended
      # scalar conjunction — both are single series):
      #   - probe down + hera up   -> THIS fires: hera alive but llama-swap dead
      #                               (actionable — restart llama-swap on hera).
      #   - probe down + hera down -> THIS stays silent; DNSServerDown /
      #                               LocalNetworkIssue / the darwin-hera host
      #                               rules own "hera unreachable".
      # hera is effectively 24/7 (avg_up_7d=0.9989), so NO sleep-window
      # suppression is needed. for: 8m: the longest contiguous darwin-hera gap in
      # 7d was a single ~11-min hera-DOWN block (2026-06-08 boot-work) — but the
      # gate suppresses MLXBackendDown for the entire hera-down window, so 8m only
      # has to outlast the brief recovery edge where node-exporter (:9100) returns
      # before llama-swap (:8080) finishes warming. 8m clears that comfortably
      # while still surfacing a genuine MLX outage well before Discord users do.
      # severity: warning (not critical) — the e2e/ask probes already page
      # critical for the user-visible symptom and self-heal cannot restart hera;
      # this rule is cause-isolation, not a new page path.
      # SELECTOR WIDENED 2026-08-01 to job=~"blackbox_hera_(mlx|qwen)" after this rule sat
      # green through a total outage of the chat backend. hera runs three model services and
      # this rule only watched one of them -- :8080, which serves GLM-5.2/Meta-Llama/bge-m3.
      # The model Hermes actually uses, Qwen3.6-27B-oQ4e-mtp, is behind :8443. During the
      # 2026-08-01 00:49 outage :8443 returned 502 and hermes_e2e_chat_ok was 0, while
      # probe_success{job="blackbox_hera_mlx"} stayed 1 the entire time. A rule described in
      # its own annotation as the "terminal dependency of all Hermes chat" could not see the
      # chat dependency fail.
      - alert: MLXBackendDown
        expr: probe_success{job=~"blackbox_hera_(mlx|qwen)"} == 0 and on() up{job="darwin-hera"} == 1
        for: 8m
        labels:
          severity: warning
          category: availability
          service: mlx-backend
        annotations:
          summary: "hera MLX/llama-swap model router down (Hermes chat terminal dependency)"
          description: |
            The llama-swap model router on hera
            (http://hera.lan:8080/v1/models) has not answered HTTP 200 for
            8 minutes WHILE hera itself is reachable (up{job="darwin-hera"}==1).
            This is the terminal upstream of every `hera/*` LiteLLM model, so
            Hermes Discord chat (and OpenClaw's hera-routed models) will fail
            until it recovers — expect HermesE2eChatFailing / HermesAskFailing /
            HermesFallbackChainTriggered to be firing alongside this as
            DOWNSTREAM symptoms; THIS rule names the root cause.

            This is a LIVENESS probe of the router only — a clear MLXBackendDown
            does not guarantee a specific model can load (that is
            HermesE2eChatFailing's job).

            Runbook (hera-side, manual — vulcan cannot ssh hera):
              1. On hera: confirm the llama-swap process / launchd job is alive
                 and re-listening on :8080 (`curl -s localhost:8080/v1/models`).
              2. Restart llama-swap on hera; once /v1/models returns 200 this
                 clears within one scrape interval (~30s + the 8m for-window
                 only delays the initial fire, not the resolve).
              3. If hera itself is wedged (also see DNSServerDown /
                 LocalNetworkIssue for hera.lan), recover hera first — this rule
                 self-suppresses while hera is unreachable.

      # E2E probe hasn't run recently. Catches the case where the
      # probe service is failing to start (e.g., EnvironmentFile
      # missing) — distinct from "probe ran but got non-200".
      - alert: HermesE2eChatProbeStale
        expr: time() - hermes_e2e_chat_last_run_timestamp_seconds > 900
        for: 5m
        labels:
          severity: warning
          category: monitoring
          service: hermes
        annotations:
          summary: "hermes-e2e-chat-probe has not run in >15 min"
          description: |
            The hermes-e2e-chat-probe.timer should fire every 5 min.
            Stale >15 min means the timer or service is broken. Check
            `systemctl status hermes-e2e-chat-probe.timer` and the
            most recent service journal.

      # Fallback chain triggered — Hermes' agent loop hit a non-retryable
      # error (typically 401/403/404 from upstream) and tried a fallback
      # model. Counts unique occurrences in the errors.log; any positive
      # increase over 10 min means a user-visible chat error happened.
      - alert: HermesFallbackChainTriggered
        expr: increase(hermes_fallback_chain_triggered_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
          category: availability
          service: hermes-agent
        annotations:
          summary: "Hermes fallback chain triggered — primary chat path errored"
          description: |
            Hermes' conversation loop logged "Non-retryable client
            error" at least once in the last 10 min. The user saw
            the "⚠️ Non-retryable error (HTTP N) — trying fallback…"
            banner. Check `/var/lib/hermes/.hermes/logs/errors.log`
            for the failing base_url and HTTP code.

      # Freshness guard for the collector the rule above depends on.
      #
      # Added 2026-07-31 while retiring Nagios, which was the only watcher of this
      # collector's liveness. HermesFallbackChainTriggered uses increase(...[10m]) > 0, so a
      # DEAD collector reads exactly like a healthy system: the counter stops advancing,
      # increase() returns 0, and the alert can never fire again. That is silent blindness
      # rather than a visible failure, which is the whole reason this guard exists.
      #
      # service: hermes-collector (NOT hermes-*) so a dead collector is not routed to the
      # self-heal daemon, which cannot fix a stopped timer by restarting the agent.
      - alert: HermesFallbackCollectorStale
        expr: time() - hermes_fallback_counter_last_run_timestamp_seconds > 600
        for: 10m
        labels:
          severity: warning
          category: monitoring
          service: hermes-collector
        annotations:
          summary: "Hermes fallback counter collector is stale — HermesFallbackChainTriggered is blind"
          description: |
            hermes_fallback_counter_last_run_timestamp_seconds has not
            advanced in over 10 minutes. While this is firing,
            HermesFallbackChainTriggered CANNOT fire regardless of how
            many fallbacks occur, because increase() over a frozen
            counter is 0. Treat fallback-chain silence as unverified
            until this clears. Check the hermes fallback-counter
            oneshot/timer.

      # The self-heal daemon's own heartbeat. If the daemon dies, no
      # auto-remediation is happening — operator must intervene.
      # NOTE: service: hermes-self-heal (NOT hermes-*) so this alert
      # is not routed back to the daemon itself (which may be dead).
      - alert: HermesSelfHealDown
        expr: time() - hermes_self_heal_last_heartbeat_seconds > 600
        for: 5m
        labels:
          severity: warning
          category: monitoring
          service: hermes-self-heal
        annotations:
          summary: "hermes-self-heal daemon heartbeat stale (>10 min)"
          description: |
            The hermes-self-heal daemon stopped writing
            hermes_self_heal_last_heartbeat_seconds. Either the
            service crashed (check `systemctl status hermes-self-heal`)
            or the textfile collector cannot read its output.

      # An incident has been open for >30 minutes. The daemon has
      # exhausted its 3 attempts or the AI tier returned escalate.
      # Human action required.
      - alert: HermesSelfHealStuck
        expr: hermes_self_heal_active_incidents > 0
        for: 30m
        labels:
          severity: critical
          category: availability
          service: hermes-self-heal
        annotations:
          summary: "Hermes self-heal incident open for >30 minutes"
          description: |
            One or more Hermes incidents have not resolved despite
            the daemon's attempts. Inspect
            /var/lib/hermes-self-heal/incidents.json and recent
            journal output to decide on a manual action.

      # Track how often the AI tier was unreachable. >3/hour suggests
      # LiteLLM is down and the daemon is degraded to deterministic-only.
      - alert: HermesSelfHealLitellmUnreachable
        expr: increase(hermes_self_heal_litellm_unreachable_total[1h]) > 3
        for: 5m
        labels:
          severity: warning
          category: monitoring
          service: hermes-self-heal
        annotations:
          summary: ">3 LiteLLM unreachable events in last hour for hermes self-heal"
          description: |
            The daemon attempted to escalate to the AI tier multiple
            times and could not reach LiteLLM. Verify
            `systemctl status litellm` and that the
            litellm-vulcan-lan-hermes-self-heal SOPS secret matches
            LiteLLM's master key.
